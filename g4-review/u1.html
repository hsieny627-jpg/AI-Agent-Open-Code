/* 一定不溢出：先把過寬的句子那一排縮起來，再看整張卡夠不夠高（iPad 直式最容易擠爆） */
function fit(){
  var inn=$('#cardIn');if(!inn)return;
  inn.style.transform='';
  $$('.wrap',inn).forEach(function(w){
    w.style.transform='';w.style.height='';
    var ln=$('.line',w);if(!ln)return;
    /* 一個字一張（#card.one）：唸的時候字會放大 1.14 倍，先留好空間，才不會壓到翻頁箭頭（2026-10-07：years old 那一張量到） */
    var avail=w.clientWidth, need=ln.scrollWidth*(card.classList.contains('one')?1.15:1);
    if(need>avail&&avail>0){var k=Math.max(.34,avail/need-0.015);
      w.style.transform='scale('+k+')';w.style.height=(ln.offsetHeight*k)+'px'}
  });
  /* 三句靠左的等式（I 要上下對齊）：三句用同一個縮放、從左邊縮，不然最長那一句自己縮小，I 就對不齊了 */
  var el=$('.eq.eqg,.eq.left,.pair,.cmp',inn);   /* 2026-10-07：比較卡一樣 */   /* 2026-10-04：等句、一問一答也一樣，第一個字母才對得齊 */
  if(el){var ws=$$('.wrap',el),km=1;
    ws.forEach(function(w){var ln=$('.line',w);w.style.transform='';w.style.height='';
      var a=w.clientWidth,nd=ln?ln.scrollWidth:0;if(nd>a&&a>0)km=Math.min(km,Math.max(.34,a/nd-0.015))});
    ws.forEach(function(w){var ln=$('.line',w);w.style.transformOrigin='left center';
      if(km<1){w.style.transform='scale('+km+')';w.style.height=(ln.offsetHeight*km)+'px'}})}
  var cs=getComputedStyle(card);
  var availH=card.clientHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
  var needH=inn.scrollHeight, availW=card.clientWidth, needW=inn.scrollWidth;
  /* 置中的 grid（語序卡、秒懂重點、三句等式）太寬時是往「兩邊」溢出，scrollWidth 只算得到右邊，
     所以直接量裡面每一個東西最左、最右的位置（2026-09-25 直式 iPad 量到壓到翻頁箭頭） */
  var cr=card.getBoundingClientRect(), lo=cr.left+parseFloat(cs.paddingLeft||0), hi=cr.right-parseFloat(cs.paddingRight||0), mn=lo, mx=hi;
  $$('.ordgrid>*,.fgrid>*,.eqrow .line,.eqmark,.crow .line,.moreq.rows>*',inn).forEach(function(x){var r=x.getBoundingClientRect();if(!r.width)return;
    if(r.left<mn)mn=r.left;if(r.right>mx)mx=r.right});
  var ext=Math.max(hi-lo,2*Math.max(hi-(lo+hi)/2,mx-(lo+hi)/2,(lo+hi)/2-mn));
  if(ext>hi-lo+1){needW=Math.max(needW,ext);availW=hi-lo}
  var k=Math.min(availH>0&&needH>availH?availH/needH:1, availW>0&&needW>availW?availW/needW:1);
  var kk=k<1?Math.max(.3,k-0.01):1;
  if(k<1)inn.style.transform='scale('+kk+')';
  card.setAttribute('data-k',kk.toFixed(3));
}

function go(d){

function cardTap(){
  var c=CARDS[i];
  if(reveal==='word'&&(c.type==='sent'||c.type==='swap')&&step<$$('.tk',card).length){
    revealNext(false);return;
  }

card.addEventListener('click',function(e){
  var t=e.target;
  var sub=t.closest?t.closest('.sub'):null;
  if(sub){setSlot(sub.getAttribute('data-w'),sub.getAttribute('data-z'),sub.getAttribute('data-ic'),sub.getAttribute('data-k'));return}
  if(t.closest&&t.closest('#swapGo')){doSwap();return}
  if(t.closest&&t.closest('#puncGo')){puncToggle();return}
  if(t.closest&&t.closest('#ordGo')){playOrder();return}
  if(t.closest&&t.closest('#morGo')){playMorph();return}
  if(t.closest&&t.closest('#cmpGo')){playCmp();return}
  if(t.closest&&t.closest('#eqGo')){playEq();return}
  if(t.closest&&t.closest('#useGo')){useToggle();return}
  /* 逐字模式還沒出完：點卡片上任何地方都是「出下一個字」，不要讓學生點到空的地方沒反應 */
  var cc=CARDS[i];
  if(reveal==='word'&&(cc.type==='sent'||cc.type==='swap')&&step<$$('.tk',card).length){
    revealNext(false);return}
  var chip=t.closest?t.closest('.chip'):null;
  if(chip){var w=chip.getAttribute('data-say');
    if(/[A-Za-z]/.test(w))sayOne(chip,w);
    else if(chip.getAttribute('data-en'))sayPair(chip);
    else sayZh(w);
    lnk(chip.getAttribute('data-c'),1500);return}
  var zh=t.closest?t.closest('[data-zh]'):null;
  if(zh){sayPair(zh);return}
  var tk=t.closest?t.closest('.tk'):null;
  if(tk&&!tk.classList.contains('hide')){
    var w2=tk.getAttribute('data-say');
    if(!show.en){
      if(zhSay==='en'&&/[A-Za-z]/.test(w2))sayOne(tk,w2);
      else sayZh($('.zh',tk)?$('.zh',tk).textContent:w2)}
    else if(/[A-Za-z]/.test(w2))sayOne(tk,w2);
    return}
  var sy=t.closest?t.closest('[data-say]'):null;
  if(sy){sayOne(sy,sy.getAttribute('data-say'),{v:sy.getAttribute('data-v')||''});return}
  cardTap();
});

/* ══════════ 複習題（使用者 2026-09-21 指定新增）══════════
   每 4 張卡一組，每組至少 3 題；20 秒限時，愈快答對分數愈高。
   題序、選項每一次都重洗——不能用位置背答案。 */
var RVT=20, rvQ=[], rvN=0, rvLeft=RVT, rvTick=null, rvScore=0, rvOK=0, rvBusy=false, rvGi=-1, rvMiss=[];
var RVR=2*Math.PI*46;
var RVWOW=['🎉 太快了！','⭐ 完美！','🔥 手速驚人！','💎 秒殺！','🚀 起飛！','👏 漂亮！',
 '🏆 冠軍級！','⚡ 閃電答題！','🌟 全對中！','🎯 正中紅心！','🍀 好運爆表！','🦸 英雄出現！'];
var SHP=['▲','◆','●','■'];

function rvHome(){
  rvStop();
  $('#rv').classList.add('on');
  var best=function(n){return store('rv_'+UNIT+'_'+n)||0};
  $('#rvbox').innerHTML='<h2>📝 '+(typeof UNIT==='number'?'Unit '+UNIT:UNIT)+' 複習　挑一組開始</h2>'+
   '<p class="lead">20 秒一題，愈快答對分數愈高。題目和選項每一次都重洗。</p>'+
   '<div class="rvpick">'+RVG.map(function(g,n){
     return '<button class="rvg" data-g="'+n+'">'+g.t+
       '<em>'+g.q.length+' 題'+(best(n)?'　最佳 <b>'+best(n)+'</b>':'')+'</em></button>'}).join('')+'</div>'+
   '<div class="rvbtns"><button id="rvClose">⬅ 回卡片</button></div>';
}
function rvStop(){if(rvTick){clearInterval(rvTick);rvTick=null}}
function rvStart(gi){
  rvGi=gi;rvScore=0;rvOK=0;rvN=0;rvMiss=[];MISSLOG=[];
  rvQ=shuf(RVG[gi].q.slice());
  rvAsk();
}
function rvAsk(){
  rvBusy=false;
  if(rvN>=rvQ.length){rvEnd();return}
  var q=rvQ[rvN];
  var o=shuf(q.o.map(function(x,n){return{x:x,n:n}}));
  $('#rvbox').innerHTML=
   '<div class="rvhud"><span><span class="k">第 '+(rvN+1)+' ／ '+rvQ.length+' 題</span><br>'+
     '<span class="v">'+RVG[rvGi].t+'</span></span>'+
    '<span id="rvring"><svg viewBox="0 0 100 100"><circle id="rvbg" cx="50" cy="50" r="46"></circle>'+
     '<circle id="rvfg" cx="50" cy="50" r="46"></circle></svg><span id="rvnum">'+RVT+'</span></span>'+
    '<span class="rvsb"><b id="rvsc">'+rvScore+'</b><em>🏆 總分</em></span></div>'+
   (q.sim?'<div class="rvsim">🔁 類似題　剛剛錯的，再練一次</div>':'')+
   '<div class="rvq">'+ap(q.q)+'</div>'+
   '<div class="rvo">'+o.map(function(t,n){
     return '<button data-ok="'+(t.n===0)+'" data-t="'+esc(t.x)+'"><span class="sh">'+SHP[n]+'</span><span>'+ap(t.x)+'</span></button>'
   }).join('')+'</div>'+
   '<div class="rvfb" id="rvfb"></div>';
  $('#rvfg').setAttribute('stroke-dasharray',RVR);
  rvLeft=RVT;rvPaint();
  rvStop();
  rvTick=setInterval(function(){
    rvLeft-=0.1;
    if(rvLeft<=0){rvLeft=0;rvPaint();rvStop();rvDone(null,false,true);return}
    rvPaint();
    if(rvLeft<=5&&Math.abs(rvLeft-Math.round(rvLeft))<0.05)sTick();
  },100);
  $('.rvo').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('button'):null;
    if(!b||rvBusy)return;
    rvDone(b,b.getAttribute('data-ok')==='true',false);
  });
}
function rvPaint(){
  var n=$('#rvnum');if(!n)return;
  n.textContent=Math.ceil(rvLeft);
  $('#rvfg').setAttribute('stroke-dashoffset',RVR*(1-rvLeft/RVT));
  $('#rvring').className=rvLeft<=5?'dang':(rvLeft<=10?'warn':'');
}
function rvDone(btn,ok,timeout){
  if(rvBusy)return;rvBusy=true;rvStop();
  var q=rvQ[rvN];
  $$('.rvo button').forEach(function(x){
    if(x.getAttribute('data-ok')==='true')x.classList.add('ok');
    else if(x===btn)x.classList.add('bad');else x.classList.add('dim')});
  if(ok){
    /* 愈快答對分數愈高：滿分 1000，20 秒用完只剩 100 */
    var p=100+Math.round(900*(rvLeft/RVT));
    rvScore+=p;rvOK++;sOk();
    var wow=(rvLeft>RVT*0.6)?('<span class="surp">'+pick(RVWOW)+'</span> '):'';
    $('#rvfb').innerHTML='<div class="gain">'+wow+'＋'+p+' 分</div>';
    $('#rvsc').textContent=rvScore;
  }else{
    sNo();
    if(rvMiss.indexOf(q.h)<0)rvMiss.push(q.h);
    $('#rvfb').innerHTML='<div>'+(timeout?'⏰ 時間到！':'❌ 再想一下')+'</div><div>'+ap(q.h)+'</div>';
    /* 答錯：蓋一整頁錯題分析（倒數 8 秒、自動唸 3 次、⭐ 加分 ➜ 類似題 ✕2），按「▶ 繼續」才出下一題
       （使用者 2026-09-24 指定、2026-09-25 改版）；過兩三題再出一題「類似題」，選項重洗 */
    var myG=rvGi, sims=rvSims(q);
    if(sims[1]&&!q.sim){var sq={q:sims[1].q,o:sims[1].o,h:sims[1].h,sim:1};
      rvQ.splice(Math.min(rvQ.length,rvN+3+Math.floor(Math.random()*2)),0,sq)}
    missShow({q:q.q,pick:btn?btn.getAttribute('data-t'):null,ans:q.o[0],why:q.h,
      sims:sims.slice(0,3),self:{q:q.q,o:q.o,h:q.h},pts:500,gain:function(n){rvScore+=n;var e=$('#rvsc');if(e)e.textContent=rvScore}},
      function(){if(rvGi===myG&&$('#rv').classList.contains('on')){rvN++;rvAsk()}});
    return;
  }
  setTimeout(function(){rvN++;rvAsk()},1100);
}
/* 類似題：同一個 Unit 的複習題裡，英文字重疊最多的（不含自己） */
function rvSims(q){
  var all=[];RVG.forEach(function(g){all=all.concat(g.q)});
  return simRank(q,all,function(x){return x.q+' '+x.o[0]},function(x){return x.h});
}
function rvEnd(){
  rvStop();
  var b=store('rv_'+UNIT+'_'+rvGi)||0, rec='';
  if(rvScore>b){store('rv_'+UNIT+'_'+rvGi,rvScore);b=rvScore;rec='　🎉 破紀錄！'}
  sWow();
  $('#rvbox').innerHTML='<h2>'+RVG[rvGi].t+' 完成！'+rec+'</h2>'+
   '<div class="rvsc">'+rvScore+'</div>'+
   '<p class="lead">答對 '+rvOK+' ／ '+rvQ.length+' 題　最佳紀錄 '+b+'</p>'+
   (MISSLOG.length?'':'<div class="rvfb">全對！一題都沒錯 🎉</div>')+
   '<div class="rvbtns">'+(MISSLOG.length?'<button id="rvMissBtn">📌 答錯整理</button>':'')+
   '<button class="go" id="rvAgain">🔁 再玩一次</button>'+
   '<button id="rvBack">📚 換一組</button><button id="rvClose">⬅ 回卡片</button></div>';
  /* 結束：答錯整理用獨立的一整頁先蓋上來（使用者 2026-09-24 指定） */
  missAll(RVG[rvGi].t+'　答錯整理');
}

  if(SCON&&!SCID&&!SCGUEST){scLogin(tqOpen);return}
  var Q=tqSet();if(!Q)return;
  /* 2026-10-09 E：老師派了任務，這一組沒被指定（或還沒開放、已經截止）➜ 說為什麼鎖住 */
  if(!scTkOk(SCH.key())){scLockShow(scLockOf(SCH.key()));return}
  tqKey='tq_'+TQPAGE+'_'+TCUR+'_'+LCUR;tqHist=store(tqKey)||[];
  $('#rv').classList.add('on');document.body.classList.add('tqon');
  /* 開場：秒懂說明（會動的時間條 ＋ 會往下掉的分數） */
  $('#rvbox').innerHTML='<div class="tqintro"><h2>📝 複習題 5 題</h2><div class="tqsub">'+esc(tqNm())+'</div>'+
   '<div class="tqrow"><span>⏱ 每題 <b style="color:var(--gold)">15</b> 秒</span><span style="color:#9E9E9E">（👀 認讀 20 秒）</span></div>'+
   '<div class="tqrow"><span>✅ 答對</span><span>＋</span><span>⚡ 愈快</span><span>＝</span><span>🏆 分數愈高</span></div>'+
   '<div class="tqdemo"><i></i></div><div class="tqdn" id="tqdn">1000</div>'+
   '<div class="tqrow" style="font-size:clamp(17px,2.8vh,26px);color:#CFCFCF">右上角 ＝ 🏆 總分和'+(scLive()?'本班':'')+'名次</div>'+scMeHTML()+
   '<div class="rvbtns"><button class="go" id="tqStart" style="font-size:clamp(22px,4vh,36px);padding:12px 40px">▶ 開始</button></div>'+
   '<button id="tqBack">🃏 回到字卡</button></div>';
  var t0=Date.now();tqStop();
  tqTick=setInterval(function(){var e=$('#tqdn');if(!e){tqStop();return}
    var f=((Date.now()-t0)%4000)/4000;e.textContent=100+Math.round(900*(1-f))},80);
}
function tqStart(){
  tqStop();sayStop();missHide(false);
  tqQ=tqSet();tqN=0;tqScore=0;tqOK=0;MISSLOG=[];clearTimeout(SCAUTO);SCEND=null;scStart();
  tqAsk();
}
function tqTop(){return '<span class="tqtop"><b id="tqsc">'+tqScore+'</b><span class="rk" id="tqrk">'+tqRkHTML(tqScore)+'</span></span>'}
function tqAsk(){
  tqBusy=false;tqStop();
  if(tqN>=tqQ.length){tqEnd();return}
  var q=tqQ[tqN];tqT=q.k==='read'?20:15;scAsk(q,tqN);
  var o=shuf(q.o.map(function(x,n){return{x:x,n:n}})), body='';
  if(q.k==='read'){
    body='<div class="tqshow">'+ap(q.show)+'</div><div class="tqsub">'+q.q+'</div>'+
     '<div class="tqo rd">'+o.map(function(t,n){return '<div class="tqr" data-i="'+n+'">'+
       '<button class="pl" data-say="'+esc(t.x)+'">🔊 '+(n+1)+'</button>'+
       '<button class="ch" data-ok="'+(t.n===0)+'" data-n="'+t.n+'" data-t="'+esc(t.x)+'">👆 選 '+(n+1)+'</button></div>'}).join('')+'</div>';
  }else{
    body=(q.k==='listen'?'<button class="tqear" id="tqear">🔊 再聽一次</button>':'')+
     '<div class="tqq">'+ap(q.q)+'</div>'+
     '<div class="tqo">'+o.map(function(t,n){
       return '<button data-ok="'+(t.n===0)+'" data-n="'+t.n+'" data-t="'+esc(t.x)+'"><span class="sh">'+SHP[n]+'</span><span>'+ap(t.x)+'</span></button>'}).join('')+'</div>';
  }
  $('#rvbox').innerHTML='<div class="tqhud"><span class="lt"><span class="k">📝 第 '+(tqN+1)+' ／ '+tqQ.length+' 題</span>'+
    '<span class="tqkind">'+TQK[q.k]+'</span></span>'+
   '<span class="tqmid"><span id="rvring"><svg viewBox="0 0 100 100"><circle id="rvbg" cx="50" cy="50" r="46"></circle>'+
    '<circle id="rvfg" cx="50" cy="50" r="46"></circle></svg><span id="rvnum">'+tqT+'</span></span>'+
    '<span class="tqlive" id="tqlive">⚡ ＋1000</span></span>'+tqTop()+'</div>'+body+
   '<button id="tqBack">🃏 回到字卡</button>';
  $('#rvfg').setAttribute('stroke-dasharray',RVR);
  tqLeft=tqT;tqPaint();
  tqTick=setInterval(function(){
    tqLeft-=0.1;
    if(tqLeft<=0){tqLeft=0;tqPaint();tqDone(null,false);return}
    tqPaint();
  },100);
  /* 認讀：四句自動輪流唸一次（唸到哪一個，那一格亮）；聽力：自動唸一次 */
  var my=tqN;
  if(q.k==='read'){var k=0,rs=$$('.tqr'),nx=function(){
      rs.forEach(function(r){r.classList.remove('spk')});
      if(tqN!==my||tqBusy||k>=rs.length||!$('#rv').classList.contains('on'))return;
      var r=rs[k++],t=$('.pl',r).getAttribute('data-say');r.classList.add('spk');
      say(t,null,{v:boyV(t),done:function(){scHeard();setTimeout(nx,350)}})};
    setTimeout(nx,500)}
  if(q.k==='listen'){var ear=$('#tqear');ear.classList.add('spk');
    setTimeout(function(){if(tqN===my)say(q.say,null,{v:boyV(q.say),done:function(){ear.classList.remove('spk')}})},450)}
}
function tqPts(){return 100+Math.round(900*(tqLeft/tqT))}
function tqPaint(){
  var n=$('#rvnum');if(!n)return;
  n.textContent=Math.ceil(tqLeft);
  $('#rvfg').setAttribute('stroke-dashoffset',RVR*(1-tqLeft/tqT));
  $('#rvring').className=tqLeft<=5?'dang':(tqLeft<=tqT/2?'warn':'');
  var l=$('#tqlive');if(l)l.textContent='⚡ ＋'+tqPts();
}
function tqDone(btn,ok){
  if(tqBusy)return;tqBusy=true;tqStop();sayStop();scDone(btn?+(btn.getAttribute('data-n')||0):-1,ok,tqLeft/tqT);
  var q=tqQ[tqN], rd=q.k==='read';
  $$(rd?'.tqr':'.tqo button').forEach(function(x){
    var c=rd?$('.ch',x):x;
    if(c.getAttribute('data-ok')==='true')x.classList.add('ok');
    else if(c===btn)x.classList.add('bad');else x.classList.add('dim')});
  if(ok){
    var p=tqPts();tqScore+=p;tqOK++;sOk();
    var sc=$('#tqsc');sc.textContent=tqScore;sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump');
    $('#tqrk').innerHTML=tqRkHTML(tqScore);
    var g=document.createElement('div');g.className='tqgain';
    g.innerHTML='<b>＋'+p+'</b><div class="eq">✅ 100<i>＋</i>⚡ '+(p-100)+'</div>';
    document.body.appendChild(g);
    setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);tqN++;if($('#rv').classList.contains('on'))tqAsk()},1300);
    return;
  }
  sNo();
  /* 答錯：遊戲的答錯頁（不傳 gain ➜ 沒有 ⭐ 加分）；認讀、聽力的題目寫出那一句英文 */
  var qq=rd?'👀 '+q.show+'　🔊 聽 1～4：哪一個號碼 唸的是 '+(/s/.test(q.show)?'「'+q.show+'」':q.show)+'？':(q.k==='listen'?'🔊 '+q.say+'　'+q.q:q.q);
  var mo={q:qq,pick:btn?btn.getAttribute('data-t'):null,ans:q.o[0],why:q.h};
  if(q.sp!=null)mo.sp=q.sp;
  var my=tqN;
  setTimeout(function(){
    missShow(mo,function(){if(tqN===my&&$('#rv').classList.contains('on')){tqN++;tqAsk()}});
  },700);
}
function tqEnd(){
  tqStop();sayStop();
  if(scLive()){scEnd({m:'q',raw:tqScore});sWow();return}
  var r=tqRank(tqScore),tot=tqHist.length+1;
  tqHist.push(tqScore);tqHist.sort(function(a,b){return b-a});store(tqKey,tqHist.slice(0,50));
  var nxt=TCUR<TABM.length-1;
  $('#rvbox').innerHTML='<div class="tqintro tqend"><h2>📝 '+esc(tqNm())+'　完成！</h2>'+
   '<div class="sc">'+tqScore+'</div><div class="rk">🏆 第 '+r+' 名'+(tot>1?'<span style="font-size:.55em;color:#BFA75A">　這台平板做了 '+tot+' 次</span>':'')+'</div>'+
   '<div class="tqsub">✅ 答對 '+tqOK+' ／ '+tqQ.length+' 題'+(tqOK===tqQ.length?'　🎉 全對！':'')+'</div>'+
   '<div class="rvbtns">'+(MISSLOG.length?'<button id="tqMiss">📌 答錯整理</button>':'')+
   '<button class="go" id="tqAgain">🔁 再做一次</button>'+(nxt?'<button class="go" id="tqNext">➡ 下一個分頁</button>':'')+'</div>'+
   '<button id="tqBack">🃏 回到字卡</button></div>';
  sWow();
  missAll(tqNm()+'　答錯整理');
}
function tqClose(){tqStop();sayStop();clearTimeout(SCAUTO);SCEND=null;missHide(false);var m=$('#missAll');if(m)m.classList.remove('on');
  $('#rv').classList.remove('on');document.body.classList.remove('tqon');var g=$('.tqgain');if(g&&g.parentNode)g.parentNode.removeChild(g)}
$('#rv').addEventListener('click',function(e){
  if(!document.body.classList.contains('tqon'))return;
  var t=e.target,c=function(s){return t.closest?t.closest(s):null},b;
  if(c('#tqStart')||c('#tqAgain')){tqStart();return}
  if(c('#tqDo')){clearTimeout(tqFin.t);tqClose();tqOpen();return}
  if(c('#tqEn')){tqSayDone();return}
  if(c('#tqBack')){tqClose();return}
  if(c('#tqMiss')){missAll(tqNm()+'　答錯整理');return}
  if(c('#tqNext')){tqClose();setDeck(TCUR+1,TABM[TCUR+1].sub?LMEM:0);return}
  if((b=c('#tqear'))){var q=tqQ[tqN];if(!tqBusy){sayStop();say(q.say,null,{v:boyV(q.say)})}return}
  if((b=c('.tqr .pl'))){if(tqBusy)return;sayStop();var r=b.parentNode;$$('.tqr').forEach(function(x){x.classList.toggle('spk',x===r)});
    var s=b.getAttribute('data-say');say(s,null,{v:boyV(s),done:function(){r.classList.remove('spk')}});return}
  if((b=c('.tqr .ch'))||(b=c('.tqo button'))){if(!tqBusy)tqDone(b,b.getAttribute('data-ok')==='true');return}
});
$('#tqGo').addEventListener('click',tqOpen);
$('#tqNx').addEventListener('click',function(){if(TCUR<TABM.length-1)setDeck(TCUR+1,TABM[TCUR+1].sub?LMEM:0)});
/* 換卡、換分頁：這一組有沒有題目（目前每一個分頁都有）；最後一張卡 ＝ 講完了（2026-10-09 E16～E20）；按鈕不閃（2026-10-07） */
function tqMark(){var bar=$('#tqBar'),g=$('#tqGo');if(!bar||!TQSEEN||typeof TCUR!=='number')return;   /* 換卡引擎比這一段先跑：還沒準備好就先不畫 */var has=tqHas(),last=typeof i==='number'&&i===CARDS.length-1;
  if(has&&last&&!tqSeen()){TQSEEN[tqSk()]=1;store('tqseen_'+TQPAGE,TQSEEN)}
  bar.hidden=!has;bar.classList.toggle('wait',!tqSeen());
  g.textContent=(window.SCH&&SCH.key&&!scTkOk(SCH.key())?'🔒 ':'📝 ')+(last?'做 5 題複習':'複習題 5 題');   /* 🔒 ＝ 老師現在沒有指定這一組（2026-10-09 E） */
  $('#tqNx').hidden=!(has&&last&&TCUR<TABM.length-1);
  document.documentElement.style.setProperty('--tqH',(bar.hidden?0:g.offsetHeight)+'px')}
document.body.classList.add('hastq');tqMark();window.addEventListener('resize',tqMark);

/* ══════════ 闖關路線（在家複習，2026-10-16 C 組）══════════ */
function routeMark(){var S=window.TQSEEN||{},cur=-1,ss=$$('#tabs .st');
  ss.forEach(function(b,k){var t=+b.getAttribute('data-t'),l=+b.getAttribute('data-l'),now=t===TCUR&&l===LCUR;if(now)cur=k;
    b.classList.toggle('now',now);b.classList.toggle('done',!!S[t+'_'+l]);b.classList.remove('next')});
  if(cur>=0&&ss[cur+1])ss[cur+1].classList.add('next');var h0=$('#tabs').offsetHeight;tabH();if(routeMark.h!==undefined&&routeMark.h!==h0&&typeof fit==='function')fit();routeMark.h=h0}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest?e.target.closest('.st'):null;if(b)setDeck(+b.getAttribute('data-t'),+b.getAttribute('data-l'))});
(function(){var sd=setDeck;setDeck=function(){var r=sd.apply(this,arguments);routeMark();return r};
  if(typeof tqMark==='function'){var tm=tqMark;tqMark=function(){var r=tm.apply(this,arguments);routeMark();return r}}})();
routeMark();

</script>
