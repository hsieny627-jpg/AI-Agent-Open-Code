<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>四年級複習｜Unit 1 Who’s he?</title>
<script src="../sentences/audio/aud.js" onerror="window.AUD=null"></script><script>window.AUDDIR="../sentences/audio/";</script>

<!-- 本檔由 sentences/_build.js 產生，不要手改。改內容請改 sentences/_data.js ／ _quiz_data.js ／ _game_data.js -->
<style>
@font-face{font-family:Andika;font-style:normal;font-weight:400;font-display:swap;
 src:url(../words/fonts/andika-400.woff2) format("woff2")}
@font-face{font-family:Andika;font-style:normal;font-weight:700;font-display:swap;
 src:url(../words/fonts/andika-700.woff2) format("woff2")}

:root{
 --bg:#000; --fg:#F2F2F2; --body:#D8D3C5; --dim:#9E9E9E; --acc:#9FB4C8;
 --btn:#1E1E1E; --line:#4A4A4A;
 --he:#2563EB; --she:#E8467C; --be:#F5B301; --ap:#FF4A4A;
 --ok:#39D98A; --no:#FF5E5E; --gold:#FFD24A;
 --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
 --safeL:env(safe-area-inset-left,0px); --safeR:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);
 font-family:Andika,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
 font-weight:400;overflow:hidden;user-select:none;-webkit-user-select:none;
 touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;
 cursor:pointer;touch-action:manipulation}

/* 底部按鈕列：每一頁都一樣 */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;
 display:flex;flex-wrap:wrap;gap:clamp(5px,.9vh,9px);justify-content:center;align-items:center;
 padding:clamp(6px,1vh,10px) calc(var(--safeR) + 10px) calc(clamp(6px,1vh,10px) + var(--safeB)) calc(var(--safeL) + 10px);
 background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 46%)}
#bar button,#bar a{display:inline-flex;align-items:center;gap:5px;
 background:var(--btn);border:1px solid #333;border-radius:999px;color:var(--body);
 text-decoration:none;font-size:clamp(12.5px,1.85vh,16px);line-height:1;
 padding:clamp(7px,1.15vh,11px) clamp(10px,1.5vw,16px);white-space:nowrap;
 transition:border-color .15s,color .15s,background .15s}
#bar button.on{background:#2C3A48;border-color:var(--acc);color:#fff}
#bar button:active,#bar a:active{transform:scale(.96)}
#bar .grp{display:inline-flex;gap:3px;background:#101010;border:1px solid #2A2A2A;
 border-radius:999px;padding:3px}
#bar .grp button{border:0;background:none;padding:clamp(6px,1vh,9px) clamp(8px,1.2vw,13px);
 font-size:clamp(12px,1.75vh,15px)}
#bar .grp button.on{background:var(--acc);color:#000;font-weight:700}
#bar .grp .glbl{display:inline-flex;align-items:center;padding:0 4px 0 9px;
 font-size:clamp(11px,1.6vh,14px);color:#6E6E6E;letter-spacing:.06em;white-space:nowrap}

/* 左右翻頁：整條邊都可以按，最小 68px（使用者指定） */
.nav{position:fixed;top:0;bottom:0;width:clamp(68px,9vw,104px);z-index:30;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(30px,5vh,46px);color:#3A3A3A;background:transparent;
 transition:color .15s,background .15s}
.nav.l{left:0;padding-left:var(--safeL)}
.nav.r{right:0;padding-right:var(--safeR)}
.nav:active{color:var(--acc);background:rgba(159,180,200,.08)}
.nav[disabled]{color:#1A1A1A;background:none}
.nav b{display:block;font-size:clamp(9.5px,1.35vh,12px);font-weight:400;
 letter-spacing:.1em;color:inherit;margin-top:4px;opacity:.75}
.nav i{font-style:normal;display:block;line-height:1}

/* 進度點 */
#dots{position:fixed;left:50%;transform:translateX(-50%);z-index:35;
 top:calc(var(--safeT) + clamp(8px,1.4vh,14px));
 display:flex;gap:clamp(4px,.7vw,8px);max-width:78vw;flex-wrap:wrap;justify-content:center}
#dots i{width:clamp(6px,.9vh,9px);height:clamp(6px,.9vh,9px);border-radius:50%;
 background:#2C2C2C;display:block}
#dots i.on{background:var(--acc);transform:scale(1.35)}

.ap{color:var(--ap);font-weight:700}

#miss,#missAll,#look{position:fixed;inset:0;z-index:95;background:#000;display:none;flex-direction:column;
 align-items:center;padding:calc(var(--safeT) + clamp(8px,1.6vh,20px)) clamp(14px,3vw,40px)
 calc(var(--safeB) + clamp(8px,1.6vh,20px));overflow-y:auto}
#miss.on,#missAll.on,#look.on{display:flex}
#look{z-index:96}
#miss .mbox,#missAll .mbox,#look .mbox{width:100%;max-width:1060px;margin:auto 0;display:flex;flex-direction:column;
 align-items:center;gap:clamp(6px,1.4vh,16px)}
.mhd{font-size:clamp(30px,6vh,60px);font-weight:700;color:var(--no);text-align:center;line-height:1.1;
 animation:mShake .5s cubic-bezier(.3,.8,.3,1)}
.mhd.ok{color:var(--ok);animation:mPop .6s cubic-bezier(.2,1.5,.4,1)}
.mhd.bn{color:var(--gold);animation:mPop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes mShake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}
 60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes mPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes mIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.mq{font-size:clamp(17px,3vh,30px);color:var(--dim);text-align:center;line-height:1.35;max-width:36ch}
.mq b{color:var(--fg)}
.mcmp{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.6vh,8px);width:100%}
.mcmp .mp,.mcmp .ma{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,18px);
 border-radius:20px;padding:clamp(6px,1.2vh,14px) clamp(14px,2.2vw,30px);max-width:100%;
 opacity:0;animation:mIn .45s cubic-bezier(.2,.9,.3,1.2) forwards;overflow-wrap:anywhere;text-align:center}
.mcmp .mp{background:#1A0808;border:2px solid #5A1F1F;font-size:clamp(22px,4.4vh,44px);color:#FF9C9C;animation-delay:.15s}
.mcmp .ma{background:#06190E;border:3px solid var(--ok);font-size:clamp(32px,7.6vh,76px);font-weight:700;
 color:var(--ok);animation-delay:.55s;box-shadow:0 0 40px rgba(57,217,138,.22)}
.mcmp .mi{flex:0 0 auto;font-size:.8em}
.mcmp .mar{font-size:clamp(20px,3.4vh,34px);color:#4A4A4A;line-height:1;opacity:0;animation:mIn .4s ease .4s forwards}
.mcmp .x{border-radius:8px;padding:0 .12em;background:rgba(255,94,94,.28);color:#fff;
 text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:.1em}
.mcmp .f{border-radius:8px;padding:0 .12em;background:var(--gold);color:#000;
 display:inline-block;animation:mFix 1.1s ease-in-out 1s 2}
@keyframes mFix{0%,100%{transform:none}50%{transform:scale(1.18)}}
.mw{font-size:clamp(19px,3.4vh,34px);color:var(--fg);text-align:center;line-height:1.4;max-width:32ch;
 opacity:0;animation:mIn .45s ease 1s forwards}
.mw b{color:var(--gold)}
/* 加分的秒懂說明：一格一格亮起來 */
.mbn{display:flex;align-items:center;justify-content:center;gap:clamp(4px,.9vw,12px);flex-wrap:wrap;
 background:#141005;border:1px dashed #6B5714;border-radius:999px;padding:clamp(4px,.8vh,9px) clamp(10px,1.6vw,20px);
 opacity:0;animation:mIn .45s ease 1.4s forwards}
.mbn span{font-size:clamp(15px,2.6vh,26px);font-weight:700;color:#BFA75A;white-space:nowrap;
 animation:mStep 4s ease-in-out infinite}
.mbn span:nth-of-type(2){animation-delay:1s}.mbn span:nth-of-type(3){animation-delay:2s}.mbn span:nth-of-type(4){animation-delay:3s}
.mbn i{font-style:normal;color:#5E5230;font-size:clamp(13px,2vh,20px)}
.mbn.cur span{animation:none}
.mbn span.now{color:var(--gold);text-shadow:0 0 14px rgba(255,210,74,.8)}
@keyframes mStep{0%,20%{color:var(--gold);text-shadow:0 0 14px rgba(255,210,74,.8);transform:scale(1.12)}30%,100%{color:#BFA75A;text-shadow:none;transform:none}}
/* 最下面一排：倒數 ➜ 倒數完才出現「⭐ 加分」「▶ 繼續」 */
.mft{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,18px);flex-wrap:wrap;
 min-height:clamp(60px,9vh,86px)}
.mcd{display:inline-flex;align-items:center;justify-content:center;width:clamp(52px,8.4vh,84px);
 height:clamp(52px,8.4vh,84px);border-radius:50%;border:5px solid var(--gold);color:var(--gold);
 font-size:clamp(26px,4.8vh,46px);font-weight:700}
.mcd.tick{animation:mTick .9s ease}
@keyframes mTick{0%{transform:scale(1.35)}100%{transform:none}}
.mft button,.mbtns button{border-radius:999px;color:#fff;font-weight:700;border:2px solid var(--line);background:var(--btn);
 font-size:clamp(18px,3.2vh,30px);padding:clamp(9px,1.6vh,16px) clamp(18px,2.8vw,34px)}
.mft .say{background:#10301F;border-color:var(--ok)}
.mft .bon{background:#2A2208;border-color:var(--gold);color:var(--gold);animation:mGlow 1.3s ease-in-out infinite}
@keyframes mGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,0)}50%{box-shadow:0 0 0 7px rgba(255,210,74,.25)}}
.mft .nxt{background:#0F3323;border-color:var(--ok)}
.mft button:active,.mbtns button:active{transform:scale(.96)}
/* 加分題：字放大 */
.mbq{font-size:clamp(26px,5.6vh,56px);font-weight:700;text-align:center;line-height:1.3;max-width:26ch;
 animation:mPop .5s cubic-bezier(.2,1.5,.4,1)}
.mbo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vh,16px);width:100%}
.mbo.one{grid-template-columns:1fr}
.mbo button{background:#0C0C0C;border:2px solid #2E2E2E;border-radius:18px;color:var(--fg);
 font-size:clamp(22px,4.4vh,44px);font-weight:700;line-height:1.25;min-height:clamp(64px,11vh,110px);
 padding:clamp(8px,1.4vh,16px) clamp(10px,1.6vw,20px);opacity:0;animation:mIn .4s ease forwards}
.mbo button:active{transform:scale(.97)}
.mbo button.ok{background:#0F3323;border-color:var(--ok)}
.mbo button.bad{background:#3A1111;border-color:var(--no)}
.mgain{font-size:clamp(60px,15vh,150px);font-weight:700;color:var(--gold);line-height:1;
 text-shadow:0 0 40px rgba(255,210,74,.6);animation:mPop .7s cubic-bezier(.2,1.6,.4,1)}
.mx2{display:flex;align-items:center;gap:.4em;font-size:clamp(24px,4.6vh,46px);font-weight:700;color:var(--fg)}
.mx2 b{color:var(--gold)}
#missAll h2{margin:0;text-align:center;font-size:clamp(28px,5.4vh,52px)}
#missAll .lead{margin:0;text-align:center;font-size:clamp(17px,2.8vh,26px);color:var(--dim)}
.mcard{display:flex;flex-direction:column;gap:clamp(4px,.8vh,10px);border:1px solid #262626;border-radius:20px;width:100%;
 padding:clamp(10px,1.8vh,18px) clamp(12px,2vw,24px);background:#050505;opacity:0;animation:mIn .45s cubic-bezier(.2,.9,.3,1.2) forwards}
.mcard .mn{font-size:clamp(15px,2.3vh,21px);color:var(--acc);font-weight:700;letter-spacing:.1em}
.mcard .cq{font-size:clamp(18px,3vh,30px);color:var(--body);line-height:1.35}
.mcard .cp{font-size:clamp(18px,3vh,30px);color:#FF9C9C;line-height:1.35}
.mcard .ca{font-size:clamp(26px,5vh,50px);font-weight:700;color:var(--ok);line-height:1.25}
.mcard .ca b{color:var(--ok)}
.mcard .cw{font-size:clamp(17px,2.8vh,28px);color:var(--fg);line-height:1.4}
.mcard .cw b{color:var(--gold)}
.mcard .x{border-radius:8px;padding:0 .12em;background:rgba(255,94,94,.28);color:#fff;text-decoration:line-through}
.mcard .f{border-radius:8px;padding:0 .12em;background:var(--gold);color:#000}
.mcard .say{align-self:flex-start;background:#10301F;border:1px solid var(--ok);border-radius:999px;color:#fff;
 font-size:clamp(15px,2.4vh,22px);padding:6px 16px}
.mbtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:clamp(4px,1vh,10px)}
/* 2026-09-26 使用者指定：正確答案每一個英文字正下方 ＝ 它的中文；下面一行整句翻譯 */
.mv.glw,.ma.gl .mv{display:inline-flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:0 .32em}
.gw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.gw b{font-weight:700}
.gw i{font-style:normal;font-size:.46em;color:#FFE9A8;font-weight:700;margin-top:.12em;white-space:nowrap;letter-spacing:.02em}
.gw b,.gw i{transition:transform .16s ease,filter .16s ease,text-shadow .16s ease}
.gw.spk b{transform:scale(1.14);filter:brightness(1.4);text-shadow:0 0 .35em rgba(255,236,160,.75)}
.gw.spk i{transform:scale(1.1);filter:brightness(1.3)}
.gw.gc{margin-left:-.3em}.gw.gp{margin-left:-.3em}.gw.gp i{visibility:hidden}
.mtr{font-size:clamp(22px,4.2vh,42px);color:var(--fg);text-align:center;line-height:1.3;opacity:0;animation:mIn .45s ease .8s forwards}
.mtr b{color:#FFE9A8}
#look .lk{font-size:clamp(15px,2.4vh,22px);color:var(--dim)}
.mvar{font-size:clamp(15px,2.4vh,22px);color:var(--acc);letter-spacing:.06em}
.mbtns button{background:#0F3323;border-color:var(--ok)}

.reduce *{animation:none!important;transition:none!important}

/* ⚡ 全部出來（2026-10-10 第 10 點）：放在按鈕列第一排最右邊（字卡下方；不佔字卡的高度，字不會變小） */
#bar #allGo{border-color:#5EE6F0;color:#D8FBFF}
/* 一個字一張（2026-10-03）：字放大 */
#card.one .tk .en{font-size:clamp(64px,17vh,170px)}
#card.one .tk .zh{font-size:clamp(30px,6vh,60px)}
#card.one .tk .ic{font-size:clamp(40px,9vh,90px)}
/* 上方分頁（2026-10-03 使用者指定：句型一-1、一-2、二、三、四 原本句型；有的分頁再分 基礎／進階） */
#tabs{position:fixed;left:0;right:0;top:calc(var(--safeT) + 6px);z-index:36;display:flex;flex-wrap:wrap;gap:6px;
 justify-content:center;align-items:center;padding:0 clamp(70px,9vw,110px)}
#tabs .tb{background:#141414;border:1px solid #333;color:#D8D8D8;border-radius:12px;font-family:inherit;
 font-size:clamp(13px,1.9vh,17px);padding:clamp(6px,.9vh,9px) clamp(9px,1.1vw,14px);white-space:nowrap;cursor:pointer;line-height:1.15}
#tabs .tb b{color:#FFD66B;margin-right:5px}
#tabs a.tb{text-decoration:none;display:inline-flex;align-items:center;border-color:#5A4A1A;color:#FFE9A8}
#tabs .tb.on{background:#22303A;border-color:var(--acc);color:#fff;font-weight:700}
#tabs .lv{display:inline-flex;gap:3px;background:#101010;border:1px solid #2A2A2A;border-radius:999px;padding:3px;margin-left:6px}
#tabs .lv[hidden]{display:none}
#tabs .lv button{border:0;background:none;color:#BBB;font-family:inherit;border-radius:999px;cursor:pointer;
 font-size:clamp(13px,1.9vh,17px);padding:clamp(5px,.8vh,8px) clamp(10px,1.2vw,15px)}
#tabs .lv button.on{background:var(--acc);color:#000;font-weight:700}
body.hastabs #dots{top:calc(var(--safeT) + var(--tabH,48px) + 10px)}
body.hastabs #stage{padding-top:calc(var(--safeT) + var(--tabH,48px) + clamp(26px,4vh,40px))}
/* 按鈕列（2026-10-03 使用者指定）：第一排 左 ＝ 中文／英文／圖示 Y/N，正中央 ＝ 🔊 唸 1 次，右 ＝ 🔊 唸 3 次、▶ 自動播放；
   其他按鈕在第二排 */
/* 左右箭頭放進字卡裡面的最左、最右（2026-10-04 使用者指定，取代 2026-10-03「箭頭不伸進字卡」）：
   字卡左右留出箭頭的寬度（--navW），句子不會被壓到；箭頭的上下範圍跟著字卡（placeNav），不蓋到左上角的標籤和下面的替換字。
   螢幕最左、最右各留白 --edge，觸控螢幕邊框旁邊不用伸手去按 */
:root{--navW:clamp(56px,6.6vw,84px);--edge:clamp(12px,2vw,28px)}
.nav.l,.nav.r{width:var(--navW);padding:0;justify-content:center;border-radius:18px}
.nav.l{left:calc(var(--edge) + var(--safeL) + 1px)}
.nav.r{right:calc(var(--edge) + var(--safeR) + 1px)}
.nav span{display:flex;flex-direction:column;align-items:center}
#bar.cbar{flex-direction:column;flex-wrap:nowrap;gap:clamp(4px,.7vh,7px)}
#bar.cbar .r1{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
 align-items:center;gap:clamp(6px,1vw,12px)}
#bar.cbar .r1 .L{justify-self:end}
#bar.cbar .r1 .R{justify-self:start;display:inline-flex;gap:clamp(5px,.8vw,9px);flex-wrap:wrap;max-width:100%}   /* 2026-10-10：直式 iPad 放不下〔⚡ 全部出來〕就排到下一行 */
#bar.cbar .r2{display:flex;flex-wrap:wrap;gap:clamp(4px,.7vh,7px);justify-content:center;align-items:center}
#bar.cbar .r2 button,#bar.cbar .r2 a{font-size:clamp(11.5px,1.65vh,14.5px);padding:clamp(6px,.95vh,9px) clamp(6px,.8vw,12px)}
#bar.cbar .r2 .grp button{font-size:clamp(11px,1.6vh,14px);padding:clamp(5px,.85vh,8px) clamp(5px,.7vw,10px)}
#bar.cbar .r2{gap:clamp(3px,.5vw,7px)}
#bar.cbar .r1 button{font-size:clamp(14px,2.1vh,18px)}
#bar.cbar #sayBtn{font-size:clamp(16px,2.5vh,22px);font-weight:700;border-color:var(--acc);
 padding:clamp(9px,1.4vh,13px) clamp(16px,2.2vw,26px)}
#bar.cbar #play.on,#bar.cbar #say3.on{background:var(--acc);color:#000;font-weight:700}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 padding:calc(var(--safeT) + clamp(34px,5.4vh,52px)) calc(var(--edge) + var(--safeR))
         calc(var(--barH,72px) + clamp(6px,1vh,12px)) calc(var(--edge) + var(--safeL));
 perspective:1400px}

/* 字卡本體：純黑底（使用者指定） */
#card{width:100%;max-width:1180px;height:100%;background:#000;
 border:1px solid #262626;border-radius:22px;box-shadow:0 0 0 1px rgba(159,180,200,.05),0 18px 60px rgba(0,0,0,.9);
 display:flex;align-items:center;justify-content:center;
 padding:clamp(12px,2.2vh,26px) calc(var(--navW) + 8px);overflow:hidden;position:relative}
/* 內層負責內容，量到太大就整塊等比縮小 —— 這是「永遠不溢出」的關鍵 */
#cardIn{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 transform-origin:center center}
/* flex 預設的 min-width:auto 會被 white-space:nowrap 的長句子撐大，整塊就跑出卡片外面
   （字一放大就會壓到左右翻頁箭頭）。這三行讓它縮得回來，fit() 才量得到「需要縮小」。 */
#cardIn,.wrap,.eq,.swapbox,.ord,.focus,.pair,.mor,.echo{min-width:0;max-width:100%}
.eq{width:100%}
#card.turnR{animation:turnR .42s cubic-bezier(.22,.7,.3,1)}
#card.turnL{animation:turnL .42s cubic-bezier(.22,.7,.3,1)}
@keyframes turnR{from{opacity:0;transform:translateX(9%) rotateY(-12deg)}to{opacity:1;transform:none}}
@keyframes turnL{from{opacity:0;transform:translateX(-9%) rotateY(12deg)}to{opacity:1;transform:none}}

/* 卡片類型標籤 */
.kind{position:absolute;top:clamp(9px,1.5vh,16px);left:clamp(12px,1.8vw,22px);
 font-size:clamp(15px,2.3vh,21px);color:#FFD66B;font-weight:700;letter-spacing:.1em}  /* 2026-09-26 使用者：左上方寫這張卡的主題，要看得見 */

/* ── 句子（一個字一欄：英文／中文／圖示）── */
.wrap{width:100%;display:flex;align-items:center;justify-content:center;
 transform-origin:center center}
.line{display:flex;align-items:flex-start;justify-content:center;
 gap:clamp(6px,1.1vw,18px);white-space:nowrap}
.tk{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.5vh,7px);
 padding:2px 2px 4px;border-radius:12px;transition:background .18s}
.tk.tight{margin-left:calc(-1 * clamp(6px,1.1vw,18px))}
/* ’s／’m／’re 底下的「是」要在 s 的正下方（使用者 2026-09-25 指定）：
   ’ 在左邊佔了一點寬度，整格置中會讓「是」看起來偏到 ’ 下面，往右推回 s 的正下方 */
.tk.ctr .zh,.tk.ctr .ic{position:relative;left:.16em}
.tk.ctr .zh{left:.3em}
.tk:active{background:#161616}
/* 字體放大（使用者指定） */
.tk .en{font-size:clamp(30px,8.6vh,82px);font-weight:700;line-height:1.08;
 letter-spacing:.005em;color:var(--fg)}
.tk .zh{font-size:clamp(19px,3.6vh,36px);color:var(--acc);line-height:1.15;font-weight:400}
.tk .ic{font-size:clamp(22px,4.2vh,44px);line-height:1.1}
.tk .ic:empty{display:none}
/* 主詞／be 動詞底色：用顏色就秒懂位置交換（使用者指定） */
.tk.b .en{background:var(--he);color:#fff;border-radius:10px;padding:0 .18em}
.tk.p .en{background:var(--she);color:#fff;border-radius:10px;padding:0 .18em}
.tk.y .en{background:var(--be);color:#000;border-radius:10px;padding:0 .18em}

/* 整句中文 */
.full{margin-top:clamp(10px,2.1vh,22px);font-size:clamp(23px,4.3vh,44px);
 color:var(--body);letter-spacing:.03em;text-align:center;line-height:1.35}
.full:active{color:#fff}

/* ── 四個 Y/N 開關：英文／中文／圖示／整句中文（使用者指定）── */
#card.no-en .en{display:none}
#card.no-zh .zh{display:none}
#card.no-ic .ic{display:none}
#card.no-full .full{display:none}
/* 關掉上面幾層，剩下的那一層就放大，整張卡永遠有主角 */
#card.no-en .tk .zh{font-size:clamp(24px,5vh,48px);color:var(--fg)}
#card.no-en.no-zh .tk .ic{font-size:clamp(34px,7.6vh,78px)}
#card.no-en.no-zh.no-ic .full{font-size:clamp(30px,6.2vh,64px);color:var(--fg);margin:0}
#card.no-en.no-zh .scene .suse,#card.no-en.no-zh .scene .sat{display:none}

/* 逐字動畫：一次只出現一個重點 */
.tk.hide{opacity:0;transform:translateY(14px) scale(.86);pointer-events:none}
.tk{opacity:1;transform:none;transition:opacity .34s ease,transform .34s cubic-bezier(.2,.9,.3,1.2)}
.tk.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:translateY(16px) scale(.8);opacity:0}
 55%{transform:translateY(-4px) scale(1.09);opacity:1}100%{transform:none;opacity:1}}
.full.hide{opacity:0;pointer-events:none}
#tapHint{position:absolute;bottom:clamp(8px,1.4vh,14px);left:var(--navW,0px);right:var(--navW,0px);text-align:center;
 font-size:clamp(11.5px,1.7vh,15px);color:#4D4D4D;letter-spacing:.08em}
#tapHint.off{display:none}

/* ── 真實情境：會動的小劇場（老師按「🎞 情境」才出現；使用者 2026-09-24 指定改版）──
   背景亮 ➜ 兩個人走進來 ➜ 左邊的人說話 ➜ 右邊的人回答 ➜ 💡 什麼時候這樣說。
   全部只動 transform／opacity，2.8 秒演完。 */
.scene{display:none;flex-direction:column;align-items:stretch;gap:clamp(3px,.6vh,7px);
 width:100%;max-width:960px;margin-bottom:clamp(8px,1.5vh,16px);
 background:linear-gradient(180deg,#0B121A,#05080B);border:1px solid #1E2831;border-radius:16px;
 padding:clamp(6px,1.1vh,12px) clamp(10px,1.6vw,20px);overflow:hidden}
#card.sc .scene{display:flex}
.sth{position:relative;display:flex;align-items:center;gap:clamp(6px,1vw,12px);
 min-height:clamp(70px,11.5vh,118px);padding:clamp(14px,2.2vh,22px) clamp(30px,3.6vw,44px) 0}
.sbg{position:absolute;left:50%;top:55%;font-size:clamp(66px,12vh,124px);line-height:1;
 opacity:.14;pointer-events:none;transform:translate(-50%,-50%);animation:sbgIn .7s ease both}
@keyframes sbgIn{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:.14;transform:translate(-50%,-50%)}}
.sat{position:absolute;left:0;top:0;font-size:clamp(11px,1.7vh,16px);color:#7E93A5;letter-spacing:.08em;
 white-space:nowrap}
.sact{position:relative;display:flex;flex-direction:column;align-items:center;flex:0 0 auto;z-index:1}
.sfig{font-size:clamp(36px,6.6vh,66px);line-height:1;display:inline-block}
.snm{font-size:clamp(10px,1.5vh,14px);color:var(--dim);margin-top:2px;white-space:nowrap}
.stag{position:absolute;top:-.3em;right:-.35em;font-size:clamp(18px,3.2vh,32px);
 animation:tagIn .5s cubic-bezier(.2,1.5,.4,1) 1.3s both,bob 1.3s ease-in-out 1.8s infinite}
@keyframes tagIn{from{opacity:0;transform:scale(.2) translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-6px)}}
/* 走進來：一跳一跳的 */
.sact.L{animation:walkL .9s linear .15s both}
.sact.R{animation:walkR .9s linear .5s both}
@keyframes walkL{0%{opacity:0;transform:translateX(-26px)}15%{opacity:1}
 25%{transform:translateX(-19px) translateY(-9px)}50%{transform:translateX(-12px)}
 75%{transform:translateX(-5px) translateY(-9px)}100%{opacity:1;transform:none}}
@keyframes walkR{0%{opacity:0;transform:translateX(26px)}15%{opacity:1}
 25%{transform:translateX(19px) translateY(-9px)}50%{transform:translateX(12px)}
 75%{transform:translateX(5px) translateY(-9px)}100%{opacity:1;transform:none}}
/* 說話的那一個會點頭 */
.sact.L .sfig{animation:talk .3s ease-in-out 1.15s 4 alternate}
.sact.R.ans .sfig{animation:talk .3s ease-in-out 2.25s 4 alternate}
@keyframes talk{from{transform:none}to{transform:translateY(-5px) rotate(-6deg)}}
/* 對話框 */
.sbub{position:relative;z-index:1;background:#F2F2F2;color:#111;font-weight:700;border-radius:16px;
 padding:clamp(5px,1vh,10px) clamp(9px,1.3vw,16px);font-size:clamp(16px,2.8vh,28px);line-height:1.25;
 max-width:42%;min-width:0;text-align:center;
 animation:bubIn .5s cubic-bezier(.2,1.5,.4,1) 1.05s both;transition:transform .16s,box-shadow .16s}
.sbub.R{background:#FFE7A0;animation-delay:2.15s}
.sbub.L::before,.sbub.R::after{content:'';position:absolute;top:50%;margin-top:-8px;
 border:8px solid transparent}
.sbub.L::before{left:-14px;border-right:8px solid #F2F2F2}
.sbub.R::after{right:-14px;border-left:8px solid #FFE7A0}
@keyframes bubIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.ssp{flex:1 1 auto}
.scene .suse{font-size:clamp(15px,2.5vh,24px);color:var(--fg);line-height:1.4;text-align:center;
 animation:suseIn .5s ease 2.55s both}
@keyframes suseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reduce .sact,.reduce .sbub,.reduce .suse,.reduce .stag{opacity:1;animation:none}
.reduce .sbg{opacity:.14;animation:none}

/* ── 替換字：放在卡片最下面，不跟中間的英文句子搶位置（使用者指定）── */
.subs{position:absolute;left:clamp(8px,1.6vw,20px);right:clamp(8px,1.6vw,20px);
 bottom:clamp(6px,1.1vh,12px);display:flex;flex-direction:column;
 gap:clamp(3px,.6vh,7px);align-items:center;z-index:2}
.subrow{display:flex;flex-wrap:wrap;gap:clamp(4px,.8vw,9px);justify-content:center;align-items:center}
.subrow .lbl{font-size:clamp(10.5px,1.5vh,13px);color:#5C5C5C;letter-spacing:.1em;margin-right:4px}
.sub{display:inline-flex;align-items:center;gap:5px;background:#0E0E0E;border:1px solid #2E2E2E;
 border-radius:999px;padding:clamp(4px,.75vh,8px) clamp(8px,1.1vw,14px);
 font-size:clamp(12.5px,1.9vh,18px);color:var(--body);font-weight:700}
.sub em{font-style:normal;font-size:.72em;color:var(--dim);font-weight:400}
.sub.on{background:#2C3A48;border-color:var(--acc);color:#fff}
.sub:active{transform:scale(.95)}
.sub.adv{border-style:dashed;border-color:#3A4650}
/* 替換字下面的小字（2026-10-04：課本 build LEGO ➜ 最常說：play with LEGO） */
.sub .snote{display:block;font-size:.62em;font-weight:400;color:#FFD66B;margin-left:4px;white-space:nowrap}
.subs.many{gap:clamp(2px,.4vh,5px)}
.subs.many .subrow{gap:clamp(3px,.5vw,6px)}
.subs.many .sub{font-size:clamp(11.5px,1.65vh,15px);padding:clamp(3px,.5vh,5px) clamp(6px,.8vw,10px);gap:3px}

/* ── 等式卡：兩句「一句一句亮起來、一句一句唸出來」，最後兩句一起亮＋等號放大
   （使用者 2026-09-21 指定：兩句都要完整聽到，而且要秒懂它們是同一句）── */
.eq{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.3vh,16px)}
.eqrow{width:100%;border-radius:16px;transition:background .35s,box-shadow .35s;
 padding:clamp(3px,.7vh,8px) clamp(4px,.8vw,10px)}
.eqrow.lit{background:#0F1720;box-shadow:0 0 0 2px rgba(159,180,200,.5)}
.eq.left{width:auto;align-items:stretch}
.eq.left .eqrow .wrap{justify-content:flex-start}
.eq.left .eqmark,.eq.left .swapbtn{align-self:center}
.eqmark{font-size:clamp(28px,5.4vh,54px);color:var(--be);font-weight:700;line-height:1;
 display:inline-block}
.eqmark.pulse{animation:eqp 1s cubic-bezier(.2,.9,.3,1.4)}
/* 等句／縮寫（2026-10-04）：兩欄 ＝ ［＝］［句子］，句子靠左 ➜ 第一個字母上下對齊 */
.eq.eqg{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;
 column-gap:clamp(6px,1vw,14px);row-gap:clamp(6px,1.3vh,16px);width:auto;max-width:100%}
.eqg .eqrow{width:auto}
.eqg .eqrow .wrap{justify-content:flex-start;transform-origin:left center}
.eqg .eqmark.nil{visibility:hidden}
.eqg .swapbtn{grid-column:1/-1;justify-self:center}
@keyframes eqp{0%{transform:scale(1)}38%{transform:scale(2.1);color:var(--ok)}
 70%{transform:scale(2.1);color:var(--ok)}100%{transform:scale(1)}}
.note{margin-top:clamp(9px,1.8vh,20px);font-size:clamp(15px,2.4vh,24px);color:var(--dim);
 text-align:center;max-width:40ch;line-height:1.4}

/* ── 語序卡：中文的字會飛到英文的位置（秒懂動畫）──
   中文和英文放在「同一個 grid」裡：同一欄的寬度由兩排一起決定，
   所以上下永遠對得齊，而且每一格都放得下整個字——
   Who 的 ho 不會再被折到下一行（使用者 2026-09-21 回報）。 */
.ord{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px);width:100%}
.ordgrid{display:grid;align-items:center;justify-items:stretch;justify-content:center;
 column-gap:clamp(5px,.9vw,12px);row-gap:clamp(8px,1.6vh,18px);max-width:100%}
.ordgrid .cap{font-size:clamp(12px,1.8vh,16px);color:#5C5C5C;letter-spacing:.12em;
 justify-self:end;text-align:right;padding-right:clamp(2px,.5vw,6px)}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;
 padding:clamp(6px,1.2vh,13px) clamp(10px,1.4vw,18px);font-weight:700;white-space:nowrap;
 font-size:clamp(28px,6.4vh,64px);line-height:1.1;background:#141414;color:var(--fg);
 transition:transform .22s cubic-bezier(.2,.9,.3,1.4),filter .22s,box-shadow .22s}
.chip .cen{display:block;white-space:nowrap}
.chip .ci{font-size:clamp(18px,3.4vh,34px);font-weight:400}
/* 中英連動（使用者 2026-09-25 指定）：點中文或英文，上下兩個同色的字一起放大變亮 */
.chip.lnk{transform:scale(1.2);filter:brightness(1.3);position:relative;z-index:3;
 box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 34px rgba(255,255,255,.55)}
.chip.zin{opacity:0;transform:translateY(22px) scale(.6)}
.chip .ci:empty{display:none}
.chip.r{background:var(--ap);color:#fff}
.chip.y{background:var(--be);color:#000}
.chip.b{background:var(--he);color:#fff}
.chip.p{background:var(--she);color:#fff}
.chip.g{background:#262626;color:var(--dim)}
.chip.fly{animation:fly .95s cubic-bezier(.3,.7,.3,1)}
@keyframes fly{0%{transform:translateX(var(--dx)) scale(.9);opacity:.35}
 60%{transform:translateX(0) scale(1.14)}100%{transform:none}}

/* ── 秒懂重點卡：一行一件事，一行一行跳出來 ── */
.focus{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.4vh,15px)}
.focus h2{margin:0 0 clamp(4px,1vh,10px);font-size:clamp(24px,4.4vh,46px);font-weight:700;
 color:var(--fg);text-align:center;letter-spacing:.02em}
.frow{display:flex;align-items:center;gap:clamp(10px,1.8vw,24px);width:100%;max-width:840px;
 background:#0C0C0C;border:1px solid #232323;border-radius:14px;
 padding:clamp(8px,1.5vh,16px) clamp(12px,1.8vw,24px);
 opacity:0;animation:rowIn .48s cubic-bezier(.2,.9,.3,1.25) forwards}
@keyframes rowIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.reduce .frow{opacity:1;animation:none}
/* 唸到哪一句那一句才放大變亮（rd:1，2026-10-10 第 6 點）：動畫已經演完，關掉進場動畫才改得動亮度和大小 */
.focus.rding .frow{animation:none;opacity:1;filter:brightness(.45);transition:filter .25s,transform .25s,border-color .25s}
.focus.rding .frow.rd{filter:brightness(1.3);transform:scale(1.05);border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,74,.45)}
.frow .fi{font-size:clamp(26px,4.2vh,44px);flex:0 0 auto;width:1.5em;text-align:center}
.frow .fa{font-size:clamp(23px,4.3vh,44px);font-weight:700;flex:0 0 auto}
.frow .fb{font-size:clamp(19px,3.4vh,34px);color:var(--acc);flex:1 1 auto;text-align:right}
/* Who ＝ 誰：中文就貼在英文旁邊，不要甩到最右邊（使用者 2026-09-21 指定） */
.frow.eqr{justify-content:center;gap:clamp(8px,1.6vw,20px)}
.frow.eqr .fi{width:auto}
.frow.eqr .fa,.frow.eqr .fb{flex:0 0 auto;text-align:left}
.frow.eqr .fe{font-size:clamp(20px,3.6vh,36px);color:var(--be);font-weight:700;flex:0 0 auto}
/* ── 秒懂重點（Who／What／How）：三欄上下對齊、一次出現一個字（使用者 2026-09-25 指定）──
   英文、＝、中文放在同一個 grid，欄寬由每一列一起決定，所以永遠上下對齊。
   一列一列演：先跳出英文（同時唸出來），英文出來以後才跳出 ＝ 和中文。 */
.fq{gap:clamp(8px,1.6vh,18px)}
.fq h2{font-size:clamp(28px,5.2vh,54px);margin:0}
.fgrid{display:grid;grid-template-columns:repeat(4,auto);justify-content:center;align-items:center;
 column-gap:clamp(12px,2.2vw,30px);row-gap:clamp(8px,1.9vh,22px);background:#080808;border:1px solid #1E1E1E;
 border-radius:22px;padding:clamp(10px,2.2vh,24px) clamp(16px,2.8vw,40px);max-width:100%}
.fgrid>span{transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1.35)}
.fgrid .gi{font-size:clamp(32px,6vh,60px);text-align:center;line-height:1}
.fgrid .fa{font-size:clamp(40px,9.4vh,96px);font-weight:700;text-align:center;line-height:1.04;white-space:nowrap}
.fgrid .fe{font-size:clamp(30px,6.2vh,62px);color:var(--be);font-weight:700;text-align:center;line-height:1}
.fgrid .fb{font-size:clamp(32px,6.8vh,68px);color:var(--acc);font-weight:700;text-align:left;white-space:nowrap;line-height:1.1}
.fgrid .fh{opacity:0;transform:translateY(18px) scale(.7)}
/* left:1 ＝ 英文靠左，每一行的第一個字母上下對齊（使用者 2026-09-26：You／Your 的 Y、What／How／How old） */
.fgrid.left .fa{text-align:left}
.fgrid.uses{row-gap:clamp(4px,.9vh,10px)}
.fgrid.uses .fa{font-size:clamp(32px,6.6vh,68px)}
.fgrid.uses .fb{font-size:clamp(26px,5vh,50px)}
.fgrid.uses .gi{font-size:clamp(26px,4.6vh,46px)}
/* 用法放在那一列的正下方（跨四欄），版面不會變寬 */
.fu{display:none;grid-column:1/-1;justify-self:center;align-items:center;gap:clamp(6px,1vw,14px);white-space:nowrap;
 margin-bottom:clamp(4px,1vh,12px);
 background:#161206;border:2px solid #5E4B12;border-radius:16px;padding:clamp(4px,.8vh,10px) clamp(8px,1.2vw,16px)}
.fgrid.uses .fu{display:flex;opacity:0;animation:useIn .6s cubic-bezier(.2,1.2,.3,1.2) forwards}
.fu b{font-size:clamp(22px,4.4vh,44px);color:var(--gold);font-weight:700}
.fv{display:inline-flex;align-items:flex-end;gap:.1em;font-size:clamp(24px,4.8vh,48px);line-height:1}
.fv i{font-style:normal;display:inline-block;opacity:0;animation:uPop .5s cubic-bezier(.2,1.6,.4,1) forwards,uHop 1.6s ease-in-out infinite}
.fv i:nth-child(1){animation-delay:.35s,1s}.fv i:nth-child(2){animation-delay:.55s,1.2s}
.fv i:nth-child(3){animation-delay:.75s,1.4s}.fv i:nth-child(4){animation-delay:.95s,1.6s}
.fv i.spin{animation:uPop .5s cubic-bezier(.2,1.6,.4,1) forwards,uSpin 2.4s linear infinite}
/* 程度：一格一格長高的量表 */
.fv .bars{display:inline-flex;align-items:flex-end;gap:3px;height:1em;margin:0 .15em}
.fv .bars u{display:block;width:.2em;background:var(--ok);border-radius:3px;transform-origin:bottom;
 transform:scaleY(0);animation:uBar 2.2s ease-in-out infinite}
.fv .bars u:nth-child(1){height:30%}.fv .bars u:nth-child(2){height:55%;animation-delay:.2s}
.fv .bars u:nth-child(3){height:80%;animation-delay:.4s}.fv .bars u:nth-child(4){height:100%;animation-delay:.6s}
@keyframes useIn{from{opacity:0;transform:translateX(-24px) scale(.8)}to{opacity:1;transform:none}}
@keyframes uPop{from{opacity:0;transform:scale(.2) translateY(20px)}to{opacity:1;transform:none}}
@keyframes uHop{0%,100%{transform:none}50%{transform:translateY(-.22em)}}
@keyframes uSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes uBar{0%{transform:scaleY(0)}45%,80%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.reduce .fgrid .fh{opacity:1;transform:none}
.reduce .fgrid.uses .fu,.reduce .fv i{opacity:1;animation:none}
.reduce .fv .bars u{transform:none;animation:none}
.swapbtn.on{background:#2A2208;border-color:var(--gold);color:var(--gold)}

/* ── 對話卡：中文放大、照英文的意思斷字（使用者指定）── */
.pair{width:100%;display:flex;flex-direction:column;gap:clamp(8px,1.8vh,20px);
 align-items:stretch;max-width:1040px}
.bub{display:flex;align-items:center;gap:clamp(9px,1.5vw,18px);border-radius:18px;
 padding:clamp(10px,1.9vh,20px) clamp(12px,1.8vw,24px);border:1px solid #242424;background:#0B0B0B;
 opacity:0;animation:rowIn .48s cubic-bezier(.2,.9,.3,1.25) forwards}
.reduce .bub{opacity:1;animation:none}
.bub.q{border-color:#2E3A46}
.bub.a{border-color:#2E4636}
/* 2026-10-04 使用者指定：問句和答句的第一個字母上下對齊 ➜ 圖示欄同寬、句子靠左 */
.bub .bi{font-size:clamp(28px,4.8vh,50px);flex:0 0 auto;width:1.6em;text-align:center}
.pair .bt .wrap{justify-content:flex-start;transform-origin:left center}
.pair .full{text-align:left}
.bub .bt{flex:1 1 auto;min-width:0}
/* 每一個英文字的正下方，就是那一個字的中文（使用者 2026-09-21 指定）
   2026-09-24 使用者指定：一問一答的英文和中文都太小 ➜ 英文 46 → 70、中文 28 → 40、整句中文 30 → 40 */
.pair .tk .en{font-size:clamp(30px,7.2vh,70px)}
.pair .tk .zh{font-size:clamp(20px,4vh,40px)}
.pair .tk .ic{font-size:clamp(18px,3.2vh,32px)}
.pair .full{margin-top:clamp(4px,.9vh,10px);font-size:clamp(21px,4vh,40px);
 letter-spacing:.04em}

/* ── 變身卡（Unit 2 的核心秒懂動畫）── */
.swapbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px)}
.swapbtn{background:var(--btn);border:1px solid var(--line);border-radius:999px;
 color:var(--fg);font-size:clamp(15px,2.4vh,23px);font-weight:700;
 padding:clamp(8px,1.4vh,14px) clamp(16px,2.4vw,30px)}
.swapbtn:active{transform:scale(.96);border-color:var(--acc)}
.swaprow{display:flex;gap:clamp(8px,1.4vw,16px);flex-wrap:wrap;justify-content:center}
#puncGo{font-size:clamp(13px,2vh,19px);font-weight:400;color:var(--body)}
.swaphint{font-size:clamp(13px,2.1vh,20px);color:var(--dim);text-align:center}
.tk.moving{z-index:3}
.tk.flash .en{box-shadow:0 0 0 3px rgba(255,255,255,.55)}

/* ── 顏色三條（使用者 2026-09-21 指定）────────────────────────────
   ① Who 的 w 不發音 → 淺灰色
   ② is 的 i ／ not 的 o → 紅色（等一下會被 ’ 藏起來）
   ③ Unit 1 的 she 用淺粉底，跟 Who 的紅色分得開 */
.sil{color:#8C8C8C}
/* 2026-10-04 使用者指定（清單 Q8）：句型裡母音一律白色（is 的 i、not 的 o 也白色）；不發音淡灰、’ 紅色照舊。
   縮寫變身卡（.mor）演的就是「這個字母被 ’ 換掉」，那一個字母留紅色 */
.ri{color:inherit}
.mor .ri{color:var(--ap)}
/* 2026-10-07 使用者第 2 點：只要是縮寫等句（What is ＝ What’s、I am ＝ I’m、Who is ＝ Who’s、He is ＝ He’s…），
   被縮掉的母音字母（is 的 i、am 的 a、are 的 a、not 的 o）一律紅色，’ 照舊紅色 */
.eq .ri{color:var(--ap)}
/* 一個字一張（What、is、your…）是單字：母音紅色，跟單字卡一樣（清單 Q8）*/
#card.one .vw{color:#FF5A5A}
.fgrid .fa .vw{color:#FF5A5A}
.tk.lp .en{background:#F7A8C4;color:#3A0A1C;border-radius:10px;padding:0 .18em}
/* 2026-09-25 使用者指定：「她」的底色跟「誰」太接近 ➜ 改成很淡的粉紅色 */
.chip.lp{background:#FFDCE8;color:#4A0E26}
.chip.gr{background:#1E9E62;color:#fff}
.chip.v{background:#7A4DFF;color:#fff}
.chip.g2{background:#4A4F5C;color:#fff}   /* 2026-10-10：a ＝ 一位（中英語序新卡，跟別的顏色分得開） */
/* 2026-10-10 第 3 點 C・D：第一個字母、句點／問號放大變亮再變回來 */
.cap1{display:inline-block;transform-origin:50% 80%}
.capgo{animation:capPop 1.2s ease}
@keyframes capPop{0%{transform:none}30%,55%{transform:scale(1.75);text-shadow:0 0 6px #fff,0 0 18px rgba(255,210,74,.95)}100%{transform:none}}   /* 不換顏色：黃底的 Is 換成金色會看不見 */
.ppgo{display:inline-block;animation:ppPop 1.3s ease}
@keyframes ppPop{0%{transform:none}30%,55%{transform:scale(2.4);filter:brightness(1.7);color:#FFD24A;text-shadow:0 0 18px rgba(255,210,74,.85)}100%{transform:none}}
/* 底色上的不發音字母：淺灰會糊掉（are 的 e 在黃底上看不清楚），改成跟底色對比夠的半透明 */
.chip.y .sil,.chip.lp .sil,.tk.y .en .sil,.tk.lp .en .sil,.key.lp .sil{color:rgba(0,0,0,.42)}
.chip.b .sil,.chip.p .sil,.chip.r .sil,.chip.gr .sil,.chip.v .sil,.tk.b .en .sil,.tk.p .en .sil,.key.b .sil,.key.p .sil{color:rgba(255,255,255,.55)}
.tk.blank .en{letter-spacing:.06em;color:var(--be)}

/* ── 縮寫變身卡：i 躲起來、’ 站上去、兩個字黏在一起（使用者 2026-09-21 指定）── */
.mor{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,20px)}
.mor .line{transition:none}
.mor .tk{transition:transform .55s cubic-bezier(.3,.75,.25,1)}
.lt{position:relative;display:inline-block}
.lt .lo{display:inline-block;color:var(--ap);transition:transform .5s cubic-bezier(.3,.7,.3,1.2),opacity .45s}
.lt.go .lo{transform:translateY(-1.15em) scale(1.7) rotate(-16deg);opacity:0}
.lt .la{position:absolute;left:0;right:0;top:0;text-align:center;opacity:0;
 transform:translateY(-.75em) scale(.3)}
.lt.go .la{opacity:1;transform:none;
 transition:transform .5s cubic-bezier(.2,.9,.3,1.5) .12s,opacity .3s .12s}
.reduce .lt .lo{opacity:0}
.reduce .lt .la{opacity:1;transform:none}
/* 演完以後亮出來的等號：兩個字 ＝ 一個字，而且兩句都會完整唸一次
   （使用者 2026-09-21 指定：要完整聽到 Who is 和 Who’s） */
.moreq{display:flex;align-items:center;justify-content:center;
 gap:clamp(8px,1.6vw,20px);opacity:0;transform:translateY(10px);
 transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.3,1.3)}
.moreq.on{opacity:1;transform:none}
.moreq .ms{font-size:clamp(20px,4vh,40px);font-weight:700;color:var(--fg);
 background:#101010;border:1px solid #2A2A2A;border-radius:14px;
 padding:clamp(5px,1vh,11px) clamp(9px,1.4vw,18px);white-space:nowrap}
.moreq .ms:active{border-color:var(--acc)}
.moreq .mq{font-size:clamp(24px,4.6vh,46px);font-weight:700;color:var(--be)}
.moreq .mq{display:inline-block}
.moreq .mq.go{animation:eqp 1s cubic-bezier(.2,.9,.3,1.4);text-shadow:0 0 24px rgba(57,217,138,.9)}
.moreq.rows{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;
 column-gap:clamp(8px,1.4vw,18px);row-gap:clamp(6px,1.2vh,14px)}
.moreq.rows .ms{justify-self:start;text-align:left;font-size:clamp(24px,5.4vh,54px);transform-origin:left center}
.moreq.rows .mqn{visibility:hidden;font-size:clamp(24px,4.6vh,46px);font-weight:700}
/* 比較卡（2026-10-07）：一欄、靠左，每一行第一個字母上下對齊；只有重點字（.kw）唸到的時候稍微放大、稍微變亮 */
.cmp{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,16px);width:100%}
.cmp h2{margin:0;font-size:clamp(22px,4.4vh,44px);color:#FFE9A8;text-align:center}
.cmp .cg{display:grid;grid-template-columns:auto;justify-content:center;row-gap:clamp(4px,1vh,12px)}
.cmp .crow .wrap{justify-content:flex-start;transform-origin:left center}
.cmp .crow .line{justify-content:flex-start}
.cmp .crow,.cmp .cexl{opacity:0;transform:translateY(12px);transition:opacity .4s,transform .45s cubic-bezier(.2,.9,.3,1.3)}
.cmp .crow.on,.cmp .cexl.on{opacity:1;transform:none}
.cmp .cexl{justify-self:start;font-size:clamp(15px,2.4vh,22px);font-weight:700;color:#0A0A0A;background:#9FB4C8;border-radius:999px;
 padding:2px 14px;margin-top:clamp(4px,1vh,12px)}
.cmp .tk.spk:not(.kw) .en{transform:none;filter:none}
.cmp .tk.spk:not(.kw) .zh{color:var(--acc)}
.cmp .tk.kw .zh,.cmp .tk.kw .ic{transition:transform .16s ease,filter .16s ease}
.cmp .tk.kw.spk .zh,.cmp .tk.kw.spk .ic{transform:scale(1.12);filter:brightness(1.35)}
.moreq .ms.big.spk,.moreq .ms.big{transform:scale(1.28);filter:brightness(1.4);border-color:var(--gold);
 box-shadow:0 0 0 3px rgba(255,210,74,.6),0 0 34px rgba(255,210,74,.45)}

/* ── he 問 ➜ He 答（藍底會自己飛下去）── */
.echo{width:100%;max-width:880px;display:flex;flex-direction:column;gap:clamp(8px,1.7vh,18px)}
.erow{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,16px);
 background:#0B0B0B;border:1px solid #242424;border-radius:16px;
 padding:clamp(8px,1.5vh,16px) clamp(10px,1.5vw,20px);
 opacity:0;animation:rowIn .48s cubic-bezier(.2,.9,.3,1.25) forwards}
.reduce .erow{opacity:1;animation:none}
.erow .earr{font-size:clamp(17px,2.8vh,30px);color:#44586A;flex:0 0 auto}
.ebub{flex:1 1 0;min-width:0;text-align:center}
/* 答句靠左：He’s／She’s、I’m 的開頭上下對齊（使用者 2026-09-25 指定） */
.ebub.a{text-align:left}
.ebub .et{display:block;font-size:clamp(20px,4vh,40px);font-weight:700;line-height:1.2;white-space:nowrap}
.ebub .ez{display:block;font-size:clamp(14px,2.4vh,24px);color:var(--acc);margin-top:4px}
.key{display:inline-block;border-radius:9px;padding:0 .16em}
.key.b{background:var(--he);color:#fff}
.key.p{background:var(--she);color:#fff}
.key.lp{background:#F7A8C4;color:#3A0A1C}
.key.flash{box-shadow:0 0 0 4px rgba(255,255,255,.6)}
.key.fly{position:fixed;z-index:60;pointer-events:none;font-weight:700;
 font-size:clamp(20px,4vh,40px);line-height:1.2}

/* ── 變身卡：。變成 ？ 要看得見（使用者 2026-09-21 指定）──
   2026-09-24 使用者指定：問號要更大、放大的時間更長，讓學生永遠記住「問句最後要加問號」
   ➜ 往上飄 ＋ 放大 4.6 倍 ＋ 金色發光 ＋ 左右搖一搖，停在最大 1.8 秒，整段 2.8 秒 */
.tk.d2q{position:relative;z-index:6}
.tk.d2q .en{display:inline-block;color:var(--gold);
 text-shadow:0 0 18px rgba(255,210,74,.95),0 0 44px rgba(255,210,74,.6);
 animation:d2q 2.8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes d2q{0%{transform:scale(.4) rotate(-25deg)}
 14%{transform:translateY(-1.1em) scale(4.6) rotate(10deg)}
 22%{transform:translateY(-1.1em) scale(4.6) rotate(-8deg)}
 30%{transform:translateY(-1.1em) scale(4.6) rotate(5deg)}
 38%{transform:translateY(-1.1em) scale(4.6) rotate(0)}
 78%{transform:translateY(-1.1em) scale(4.6)}
 100%{transform:none}}
/* 句點往上飄、放大——「一定要加上句點」（使用者 2026-09-21 指定） */
.tk.dotup .en{display:inline-block;color:var(--gold);
 text-shadow:0 0 22px rgba(255,210,74,.75);animation:dotup 1.5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes dotup{0%{transform:none}
 20%{transform:translateY(-1.25em) scale(3.4)}
 62%{transform:translateY(-1.25em) scale(3.4)}
 100%{transform:none}}

/* ── 念到哪亮到哪（使用者 2026-09-24 指定）：正在唸的字稍微放大、稍微變亮 ── */
.tk .en,.chip .cen,.frow .fa,.ms,.w{transition:transform .16s ease,filter .16s ease,text-shadow .16s ease}
.w{display:inline-block}
.tk.spk .en,.chip.spk .cen,.fa.spk,.w.spk,.ms.spk{transform:scale(1.14);filter:brightness(1.35);
 text-shadow:0 0 14px rgba(255,255,255,.75),0 0 30px rgba(159,180,200,.55)}
.ms.spk{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,74,.55),0 0 26px rgba(255,210,74,.35)}
.tk.spk .zh{color:#DCEAF7}
.sbub.spk{transform:scale(1.08);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,210,74,.4)}

/* ── 📑 目次（使用者 2026-09-24 指定）：按了才蓋上來，平常完全不佔版面、不擋句子 ── */
#toc{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.94);display:none;
 flex-direction:column;align-items:center;
 padding:calc(var(--safeT) + clamp(10px,2vh,20px)) clamp(12px,2.4vw,30px)
         calc(var(--safeB) + clamp(10px,2vh,20px));overflow-y:auto}
#toc.on{display:flex}
/* 2026-10-07 使用者第 8 點：左上角 ＝ 主題名稱（例如 1-2 中英語序），名稱下面 ＝〔✕ 關閉〕 */
#toc .th{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(6px,1.2vh,12px);width:100%;max-width:1100px;
 margin-bottom:clamp(8px,1.6vh,16px)}
#toc h2{margin:0;font-size:clamp(20px,3.6vh,34px)}
#toc .tx{background:var(--btn);border:1px solid var(--line);border-radius:999px;
 font-size:clamp(15px,2.4vh,22px);font-weight:700;padding:clamp(7px,1.2vh,12px) clamp(14px,2vw,24px)}
#toc .tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(220px,28vw,300px),1fr));
 gap:clamp(6px,1.1vh,12px);width:100%;max-width:1100px}
#toc .ti{display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);text-align:left;
 background:#0C0C0C;border:1px solid #262626;border-radius:14px;
 padding:clamp(8px,1.4vh,14px) clamp(10px,1.4vw,16px);min-height:clamp(52px,8vh,78px)}
#toc .ti:active{transform:scale(.97)}
#toc .ti.cur{border-color:var(--gold);background:#1D1908;box-shadow:0 0 0 2px rgba(255,210,74,.35)}
#toc .tn{flex:0 0 auto;width:clamp(30px,4.6vh,44px);height:clamp(30px,4.6vh,44px);border-radius:50%;
 background:#1E2A36;color:#fff;font-weight:700;font-size:clamp(14px,2.3vh,21px);
 display:flex;align-items:center;justify-content:center}
#toc .ti.cur .tn{background:var(--gold);color:#000}
#toc .tb{display:flex;flex-direction:column;gap:3px;min-width:0}
#toc .tk2{font-size:clamp(11px,1.6vh,14px);color:var(--acc);letter-spacing:.08em}
#toc .tt{font-size:clamp(15px,2.5vh,23px);font-weight:700;color:var(--fg);line-height:1.25;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 複習題（使用者 2026-09-21 指定新增）：20 秒限時，愈快答對分數愈高 ── */
#rv{position:fixed;inset:0;z-index:70;background:#000;display:none;
 flex-direction:column;align-items:center;justify-content:flex-start;
 padding:calc(var(--safeT) + clamp(12px,2.4vh,24px)) clamp(14px,3vw,34px)
         calc(var(--safeB) + clamp(12px,2vh,20px));overflow-y:auto}
#rv.on{display:flex}
#rv .rvbox{width:100%;max-width:860px;margin:auto 0;display:flex;flex-direction:column;
 align-items:center;gap:clamp(8px,1.6vh,18px)}
#rv h2{margin:0;font-size:clamp(20px,3.8vh,36px);text-align:center}
#rv .lead{margin:0;font-size:clamp(13px,2vh,18px);color:var(--dim);text-align:center}
.rvpick{display:flex;flex-wrap:wrap;gap:clamp(7px,1.3vh,13px);justify-content:center;width:100%}
.rvg{background:linear-gradient(180deg,#101010,#060606);border:1px solid #2A2A2A;border-radius:16px;
 color:var(--fg);padding:clamp(10px,1.8vh,18px) clamp(14px,2vw,24px);
 font-size:clamp(15px,2.4vh,22px);font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.rvg em{font-style:normal;font-size:.68em;font-weight:400;color:var(--dim)}
.rvg b{color:var(--gold)}
.rvg:active{transform:scale(.97);border-color:var(--acc)}
#rvring{position:relative;width:clamp(54px,8.4vh,80px);height:clamp(54px,8.4vh,80px)}
#rvring svg{width:100%;height:100%;transform:rotate(-90deg)}
#rvring circle{fill:none;stroke-width:8;stroke-linecap:round}
#rvbg{stroke:#1C1C1C}#rvfg{stroke:var(--ok);transition:stroke-dashoffset .12s linear,stroke .3s}
#rvnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:clamp(17px,2.8vh,26px);font-weight:700}
#rvring.warn #rvfg{stroke:var(--be)}#rvring.warn #rvnum{color:var(--be)}
#rvring.dang #rvfg{stroke:var(--no)}#rvring.dang #rvnum{color:var(--no);animation:thump .5s infinite}
@keyframes thump{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.rvhud{display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,1.6vw,20px);width:100%}
.rvhud .k{font-size:clamp(10.5px,1.5vh,13px);color:#5C5C5C;letter-spacing:.12em}
.rvhud .v{font-size:clamp(16px,2.7vh,26px);font-weight:700}
/* 2026-09-26 使用者：右上角分數和文字放大 */
.rvsb{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.rvsb b{font-size:clamp(34px,6.4vh,64px);font-weight:700;color:var(--gold);text-shadow:0 0 18px rgba(255,210,74,.45)}
.rvsb em{font-style:normal;font-size:clamp(13px,2vh,19px);color:#BFA75A;font-weight:700;letter-spacing:.06em}
.rvq{font-size:clamp(24px,4.6vh,46px);font-weight:700;text-align:center;line-height:1.3}
.rvsim{font-size:clamp(14px,2.2vh,20px);color:var(--gold);border:1px solid #5A4A18;background:#1A1508;
 border-radius:999px;padding:3px 14px;font-weight:700}
.rvo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,1.2vh,13px);width:100%}
.rvo button{display:flex;align-items:center;gap:clamp(6px,1.1vw,13px);text-align:left;
 background:#0C0C0C;border:1px solid #262626;border-radius:15px;color:var(--fg);
 font-size:clamp(20px,3.6vh,36px);font-weight:700;line-height:1.25;
 padding:clamp(9px,1.6vh,17px) clamp(11px,1.6vw,21px);min-height:clamp(56px,9vh,92px)}
.rvo button .sh{flex:0 0 auto;width:1.2em;text-align:center;font-size:.82em}
.rvo button.ok{background:#0F3323;border-color:var(--ok)}
.rvo button.bad{background:#3A1111;border-color:var(--no)}
.rvo button.dim{opacity:.32}
.rvfb{min-height:clamp(42px,7vh,70px);text-align:center;font-size:clamp(14px,2.3vh,22px);
 color:var(--body);line-height:1.45}
.rvfb .gain{font-size:clamp(28px,5.4vh,54px);font-weight:700;color:var(--ok)}
.rvfb .surp{color:var(--gold);font-weight:700}
.rvbtns{display:flex;gap:clamp(7px,1.3vw,14px);flex-wrap:wrap;justify-content:center}
.rvbtns button{background:var(--btn);border:1px solid var(--line);border-radius:999px;
 color:var(--fg);font-size:clamp(14px,2.2vh,20px);font-weight:700;
 padding:clamp(8px,1.4vh,14px) clamp(14px,2.2vw,28px)}
.rvbtns button.go{background:#0F3323;border-color:var(--ok)}
.rvbtns button:active{transform:scale(.96)}
.rvsc{font-size:clamp(34px,7vh,70px);font-weight:700;color:var(--gold);line-height:1}

/* ── 📝 複習題 5 題（2026-10-04）：字卡下方的切換按鈕 ── */
body.hastq #stage{padding-bottom:calc(var(--barH,72px) + var(--tqH,52px) + clamp(8px,1.4vh,14px))}
/* 2026-10-07 使用者第 3 點：〔📝 複習題 5 題〕這一顆按鈕不發亮、不放大（沒有光暈、沒有閃三下、按下去也不縮放），以免學習失焦 */
/* 2026-10-09（E16～E20）：#tqBar 一排，最後一張卡多一顆〔➡ 下一個主題〕；還沒講完 ＝ 看不見但位置留著（字卡不會跳） */
#tqBar{position:fixed;left:0;right:0;z-index:30;bottom:calc(var(--barH,72px) + clamp(4px,.8vh,8px));display:flex;justify-content:center;
 gap:clamp(10px,1.6vw,18px);pointer-events:none}
#tqBar button{pointer-events:auto}
#tqBar.wait #tqGo{visibility:hidden;pointer-events:none}
#tqNx{border-color:var(--acc)!important;color:#DDEEFF!important;background:linear-gradient(180deg,#0F2236,#0A1520)!important}
#tqGo,#tqNx,#tqBack{position:static;z-index:30;
 background:linear-gradient(180deg,#2A2208,#171204);border:2px solid var(--gold);color:#FFE9A8;font-family:inherit;font-weight:700;
 font-size:clamp(17px,2.6vh,24px);border-radius:999px;padding:clamp(7px,1.1vh,11px) clamp(20px,2.6vw,32px);min-height:48px;
 white-space:nowrap;box-shadow:none;cursor:pointer}
#tqGo:active{background:#3A2F0B}
#tqBar[hidden]{display:none}
/* 完成 All done!（2026-10-09 使用者：中文「完成」＋英文＋超酷秒懂圖示：綠色大圓圈裡 ✔ 一筆畫出來，彩帶從四周噴出來）＋兩顆大按鈕 */
.tqfin{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,16px);text-align:center}
.tqdone{position:relative;width:clamp(110px,22vh,200px);height:clamp(110px,22vh,200px)}
.tqdone svg{width:100%;height:100%;overflow:visible;animation:tqPop .5s .95s ease-out both}
.tqdone .c{fill:#0F3323;stroke:var(--ok);stroke-width:7;stroke-dasharray:330;stroke-dashoffset:330;animation:tqDraw .6s .05s ease-out forwards}
.tqdone .k{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:tqDraw .4s .6s ease-out forwards}
@keyframes tqDraw{to{stroke-dashoffset:0}}
@keyframes tqPop{50%{transform:scale(1.16)}}
.tqdone i{position:absolute;left:50%;top:50%;width:12px;height:20px;border-radius:3px;opacity:0;background:var(--cc);
 animation:tqConf 1.5s cubic-bezier(.15,.7,.3,1) var(--d) forwards}
@keyframes tqConf{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
body.reduce .tqdone *{animation-duration:0s!important;animation-delay:0s!important}
body.reduce .tqdone i{display:none}
.tqfin h2{font-size:clamp(44px,8.6vh,84px)!important;color:#fff;margin:0;line-height:1.05;letter-spacing:.1em}
.tqen{font-family:Andika,inherit;font-size:clamp(34px,6.6vh,64px);font-weight:700;color:var(--gold);background:none;border:0;cursor:pointer;line-height:1.1;padding:0 8px}
.tqen.spk{animation:tqBump .6s ease-out}
.tqfin .tqsub{font-size:clamp(18px,3vh,28px)}
.tqfin .rvbtns button{font-size:clamp(24px,4.4vh,40px);padding:clamp(12px,2vh,20px) clamp(24px,3.2vw,40px);min-height:72px}
#tqBack{margin-top:clamp(4px,1vh,10px);border-color:#5A6A78;color:#DDE6EE;background:#141A20;box-shadow:none}
#tqBack:active{transform:scale(.96)}
/* 右上角：大數字的累計分數＋名次 */
.tqhud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,1.6vw,20px);width:100%}
.tqhud .lt{display:flex;flex-direction:column;gap:4px;min-width:0}
.tqhud .lt .k{font-size:clamp(14px,2.1vh,19px);color:#9E9E9E;font-weight:700}
.tqkind{align-self:flex-start;font-size:clamp(15px,2.3vh,21px);font-weight:700;border-radius:999px;padding:3px 12px;
 background:#1A2530;border:1px solid #3A5266;color:#CFE3F5;white-space:nowrap}
.tqtop{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.tqtop b{font-size:clamp(46px,9vh,92px);font-weight:700;color:var(--gold);text-shadow:0 0 22px rgba(255,210,74,.5)}
.tqtop b.bump{animation:tqBump .5s ease-out}
@keyframes tqBump{40%{transform:scale(1.25);color:#fff}}
.tqtop .rk{margin-top:4px;font-size:clamp(20px,3.6vh,36px);font-weight:700;color:#FFE9A8;white-space:nowrap}
.tqtop .rk em{font-style:normal;font-size:.6em;color:#BFA75A;margin-left:4px}
.tqmid{display:flex;flex-direction:column;align-items:center;gap:4px}
.tqlive{font-size:clamp(16px,2.6vh,24px);font-weight:700;color:var(--ok);white-space:nowrap}
.tqshow{font-size:clamp(34px,7vh,72px);font-weight:700;text-align:center;line-height:1.2;color:#fff}
.tqq{font-size:clamp(23px,4.4vh,44px);font-weight:700;text-align:center;line-height:1.3}
.tqq .em,.tqshow .em{color:var(--gold)}
.tqsub{font-size:clamp(18px,3vh,28px);color:#CFCFCF;text-align:center;font-weight:700}
.tqear{background:#0F2236;border:2px solid var(--acc);color:#fff;border-radius:999px;font-family:inherit;font-weight:700;
 font-size:clamp(22px,4vh,38px);padding:clamp(8px,1.4vh,14px) clamp(24px,3vw,40px);cursor:pointer;min-height:56px}
.tqear.spk{animation:tqBump .6s ease-out infinite}
.tqo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vh,14px);width:100%}
.tqo button{display:flex;align-items:center;gap:clamp(6px,1.1vw,13px);text-align:left;background:#121212;border:2px solid #333;
 border-radius:18px;color:#fff;font-family:inherit;font-weight:700;font-size:clamp(21px,3.8vh,38px);
 padding:clamp(10px,1.8vh,18px) clamp(12px,1.6vw,20px);min-height:clamp(64px,10vh,100px);line-height:1.2;cursor:pointer}
.tqo button .sh{flex:0 0 auto;width:1.2em;text-align:center;font-size:.8em;color:#9E9E9E}
.tqo button:active{transform:scale(.97)}
.tqo button.ok{background:#0F3323;border-color:var(--ok)}
.tqo button.bad{background:#3A1111;border-color:var(--no)}
.tqo button.dim{opacity:.32}
/* 認讀：四個選項只有聲音，畫面上不寫字（🔊 聽 ＋ 👆 選） */
.tqr{display:flex;flex-direction:column;gap:6px;background:#121212;border:2px solid #333;border-radius:18px;padding:clamp(8px,1.3vh,12px)}
.tqr.spk{border-color:var(--acc);box-shadow:0 0 18px rgba(127,191,255,.35)}
.tqr .pl{background:#0F2236;border:1px solid #3A5266;border-radius:14px;color:#fff;font-family:inherit;font-weight:700;
 font-size:clamp(22px,4vh,38px);min-height:clamp(52px,8vh,80px);cursor:pointer;justify-content:center}
.tqr .ch{background:#1D1D1D;border:1px solid #444;border-radius:14px;color:#FFE9A8;font-family:inherit;font-weight:700;
 font-size:clamp(17px,2.7vh,26px);min-height:48px;cursor:pointer;justify-content:center}
.tqr.ok{border-color:var(--ok);background:#0F3323}.tqr.bad{border-color:var(--no);background:#3A1111}.tqr.dim{opacity:.32}
.tqo.rd{gap:clamp(8px,1.4vh,14px)}
.tqo.rd .tqr button{min-height:unset;padding:6px 10px;text-align:center}
/* 答對：大大的 ＋880 和算式 */
.tqgain{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
 background:rgba(0,0,0,.72);pointer-events:none;animation:tqIn .25s ease-out}
.tqgain b{font-size:clamp(70px,16vh,160px);color:var(--ok);line-height:1;text-shadow:0 0 30px rgba(80,220,140,.5)}
.tqgain .eq{font-size:clamp(22px,4vh,40px);font-weight:700;color:#fff}
.tqgain .eq i{font-style:normal;color:#9E9E9E;margin:0 .3em}
@keyframes tqIn{from{opacity:0;transform:scale(.8)}}
/* 開場：15 秒、愈快分數愈高（會動的秒懂說明） */
.tqintro{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);text-align:center}
.tqintro h2{font-size:clamp(28px,5.4vh,52px)!important}
.tqrow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,24px);flex-wrap:wrap;font-size:clamp(20px,3.6vh,34px);font-weight:700}
.tqdemo{width:min(560px,86vw);height:clamp(26px,4.4vh,40px);border-radius:999px;background:#1A1A1A;border:1px solid #333;overflow:hidden;position:relative}
.tqdemo i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1E7A4C,#5BE39A);border-radius:999px;animation:tqDrain 4s linear infinite}
@keyframes tqDrain{from{width:100%}to{width:10%}}
.tqdn{font-size:clamp(34px,6.4vh,64px);font-weight:700;color:var(--ok);min-width:4em}
.tqintro .rvbtns button{font-size:clamp(18px,3vh,26px);padding:clamp(9px,1.4vh,13px) clamp(18px,2.4vw,28px);min-height:52px}
.tqhud #rvring{width:clamp(72px,11vh,112px);height:clamp(72px,11vh,112px)}
.tqhud #rvnum{font-size:clamp(26px,4.6vh,44px)}
.tqend .sc{font-size:clamp(70px,15vh,150px);font-weight:700;color:var(--gold);line-height:1}
.tqend .rk{font-size:clamp(28px,5.4vh,54px);font-weight:700;color:#FFE9A8}


/* ── 👑 冠軍寶箱 登入 動畫（2026-10-26 第二十九次 第 11 點）── */
#scch{position:fixed;inset:0;z-index:120;display:none;background:radial-gradient(circle at 50% 38%,#3A2A08 0,#120C02 45%,#000 80%);overflow:hidden;color:#fff;font-family:inherit}
#scch.on{display:block}.chw{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,18px);padding:16px;text-align:center}
.chray{position:absolute;left:50%;top:44%;width:0;height:0;animation:chSpin 18s linear infinite}.chray i{position:absolute;left:-30px;top:-80vh;width:60px;height:80vh;background:linear-gradient(rgba(255,213,74,0),rgba(255,213,74,.16));transform-origin:30px 80vh}
.chcr{line-height:1;font-size:clamp(70px,11vh,120px);transition:font-size .6s;animation:chDrop 1s cubic-bezier(.3,1.5,.5,1) both;filter:drop-shadow(0 0 18px rgba(255,213,74,.7))}
.cht{font-size:clamp(46px,8vh,92px);font-weight:700;letter-spacing:.12em;background:linear-gradient(#FFF6C8,#FFD54A 45%,#C98A00);-webkit-background-clip:text;background-clip:text;color:transparent;animation:chIn .8s .7s both;text-shadow:0 0 30px rgba(255,213,74,.35)}
.chwhy{font-size:clamp(24px,3.8vh,40px);font-weight:700;line-height:1.45;animation:chIn .7s 1.5s both}.chwhy b{color:#FFE07A}.chrk{display:inline-block;font-size:1.5em;color:#FFD54A;animation:chPop .6s 2.1s both}.chs{font-size:.9em}.chsm{font-size:max(18px,.55em);color:#D8C9A0;font-weight:400}
.chbox{position:relative;flex-shrink:0;width:clamp(150px,22vh,260px);height:clamp(110px,17vh,210px);border:0;background:none;cursor:pointer;animation:chIn .6s 2.6s both,chBob 1.8s 3.2s ease-in-out infinite;touch-action:manipulation}
.chbd{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:12px;background:linear-gradient(#B0641A,#6E3A0C);box-shadow:inset 0 0 0 6px #FFD54A,0 10px 30px rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center}
.chlk{font-style:normal;font-size:clamp(28px,4vh,40px);margin-top:-6%}
.chlid{position:absolute;left:-3%;right:-3%;top:4%;height:38%;border-radius:40% 40% 10px 10px;background:linear-gradient(#D8892A,#8A4A10);box-shadow:inset 0 0 0 6px #FFD54A;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.chgl{position:absolute;left:10%;right:10%;bottom:40%;height:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,240,170,.95),rgba(255,213,74,0) 70%);transition:height .7s}
.chbox.shake{animation:chShake .35s infinite}.chbox.open{animation:none}.chbox.open .chlid{transform:translateY(-40%) rotateX(70deg) rotate(-14deg)}.chbox.open .chgl{height:160%}.chbox.open .chlk{opacity:0}
.chtap{font-size:clamp(26px,4vh,40px);font-weight:700;color:#FFE07A;animation:chIn .5s 3s both}.chtap b{font-size:1.15em}
.chbag{display:flex;align-items:center;gap:clamp(10px,2vw,22px);background:rgba(255,255,255,.08);border:3px solid rgba(255,213,74,.6);border-radius:22px;padding:10px 22px;font-size:clamp(22px,3.2vh,32px);font-weight:700;animation:chIn .5s 3.2s both}
.chbag .chbi{font-size:1.5em}.chbag.pulse{animation:chBag .5s 3}.chn b{color:#FFE07A}
.chfly{position:fixed;z-index:121;font-size:clamp(34px,5vh,52px);pointer-events:none;animation:chFly 1.5s cubic-bezier(.4,0,.6,1) forwards;filter:drop-shadow(0 0 10px rgba(255,213,74,.8))}
.chend{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:clamp(24px,3.6vh,36px);font-weight:700;animation:chIn .6s both}.chend[hidden]{display:none}
.chend button{font-family:inherit;font-weight:700;font-size:clamp(24px,3.8vh,36px);min-height:64px;padding:0 40px;border-radius:999px;border:3px solid #39D98A;background:#0F3323;color:#fff;cursor:pointer}
.chmsg{position:absolute;left:0;right:0;bottom:10px;font-size:22px;color:#FFB4B4}.chw.done .chcr{font-size:clamp(44px,6vh,70px)}.chw.done .cht{font-size:clamp(36px,5.5vh,60px);transition:font-size .6s}.chw.done .chsm{display:none}
@keyframes chSpin{to{transform:rotate(360deg)}}@keyframes chDrop{from{transform:translateY(-60vh) scale(1.6);opacity:0}to{transform:none;opacity:1}}
@keyframes chIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}@keyframes chPop{0%{transform:scale(0)}70%{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes chBob{50%{transform:translateY(-10px) rotate(-2deg)}}@keyframes chShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes chBag{50%{transform:scale(1.08);box-shadow:0 0 24px rgba(255,213,74,.7)}}
@keyframes chFly{0%{transform:translate(0,0) scale(.4);opacity:0}25%{transform:translate(var(--ux),-140px) scale(1.25);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:.9}}
@media (max-height:820px){.chcr{font-size:64px}.cht{font-size:50px}.chw{gap:8px}}
@media (prefers-reduced-motion:reduce){.chray{animation:none}.chcr,.cht,.chwhy,.chbox,.chtap,.chbag{animation:none}}
/* ── 老師派任務（2026-10-09 E）：大廳上面的任務條、遊戲卡的 🔒／⏰、鎖住時的一整頁 ── */
.sctask{display:flex;flex-direction:column;gap:6px;margin:0 auto clamp(6px,1.2vh,12px);max-width:1100px;width:100%}
.sctkl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#2A2208;border:3px solid var(--gold);border-radius:18px;
 padding:clamp(6px,1vh,10px) clamp(10px,1.6vw,18px);font-size:clamp(19px,3vh,28px);font-weight:700;color:#FFE9A8;line-height:1.3}
.sctkl b{color:#fff}.sctkl span{white-space:nowrap}.sctkl span.ok{color:var(--ok)}.sctkl em{font-style:normal;color:#FFD24A;white-space:nowrap;margin-left:auto}
.gcard.tklock{filter:grayscale(1);opacity:.45}
.gcard.tkon{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(255,210,74,.55),0 0 26px rgba(255,210,74,.45)!important}
.sctkc{display:block;margin-top:4px;font-size:clamp(16px,2.5vh,22px);font-weight:700;color:#FFE9A8;white-space:nowrap}
.sctkc.open{color:#FFD24A}
#sctk{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);padding:16px}
#sctk.on{display:flex}
.sctkb{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);max-width:1000px;width:100%;text-align:center}
.sctki{font-size:clamp(70px,14vh,140px);line-height:1}
.sctkw{font-size:clamp(28px,5vh,50px);font-weight:700;color:#fff}.sctkw b{color:var(--gold)}
.sctks{font-size:clamp(22px,3.6vh,34px);font-weight:700;color:#CFCFCF}
#sctkOk{font-family:inherit;font-weight:700;font-size:clamp(24px,4.2vh,40px);border-radius:999px;border:3px solid var(--ok);background:#0F3323;color:#fff;
 padding:clamp(10px,1.8vh,18px) clamp(30px,4vw,56px);min-height:64px;cursor:pointer}
/* ── 成績紀錄（2026-10-07 對話 C） ── */
.sclog{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.3vh,14px);width:100%}
.sclog h2{font-size:clamp(28px,5vh,50px)!important;margin:0}
.sclv{font-size:clamp(22px,3.6vh,36px);font-weight:700;color:#FFE082;text-align:center}
/* 2026-10-09：① 打班級 ➜ ② 打座號 ➜ ③ 按 ✅，正在做的那一步會亮 */
.scsteps{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1vw,10px);flex-wrap:wrap}
.scsteps span{display:flex;align-items:center;padding:clamp(4px,.8vh,8px) clamp(10px,1.6vw,20px);border-radius:999px;border:3px solid #333;color:#8A8A8A;
 font-size:clamp(20px,3.4vh,32px);font-weight:700;white-space:nowrap;transition:transform .3s}
.scsteps b{color:#555;font-size:clamp(20px,3.2vh,30px)}
.scsteps span.now{border-color:var(--gold);color:#fff;background:#2A2208;transform:scale(1.08);animation:scStep 1.4s ease-in-out infinite}
.scsteps span.done{border-color:var(--ok);color:var(--ok);background:#0F3323}
@keyframes scStep{50%{box-shadow:0 0 0 8px rgba(255,200,60,.22)}}
.scbox{display:flex;gap:clamp(14px,3vw,40px);align-items:flex-end}
.scg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(4px,.8vh,10px);border-radius:20px;border:3px solid transparent;cursor:pointer}
.scg .lb{font-size:clamp(22px,3.8vh,36px);font-weight:700}.scg.c .lb{color:var(--acc)}.scg.s .lb{color:var(--ok)}
.scg.now{border-color:#4A4A2A;background:#16140A}
.scg .cells{display:flex;gap:clamp(6px,1.2vw,12px)}
.scbox i{font-style:normal;display:flex;align-items:center;justify-content:center;width:clamp(56px,9vh,86px);height:clamp(68px,11vh,104px);position:relative;
 border-radius:16px;background:#111;border:4px solid #333;font-size:clamp(40px,7.4vh,70px);font-weight:700;color:#fff;transition:transform .2s,border-color .2s}
.scbox i.c{border-color:#3A6FA8}.scbox i.s{border-color:#3A8F5E}
.scbox i.c.f{background:#0F2236;border-color:var(--acc)}.scbox i.s.f{background:#0F3323;border-color:var(--ok)}
/* 要打的那一格會閃 */
.scbox i.cur{border-color:var(--gold);box-shadow:0 0 0 5px rgba(255,200,60,.3)}
.scbox i.cur::after{content:'';position:absolute;bottom:14%;width:42%;height:6px;border-radius:3px;background:var(--gold);animation:scBlink 1s steps(1) infinite}
@keyframes scBlink{50%{opacity:0}}
.scbox i.pop{animation:scPop .3s ease-out}
@keyframes scPop{50%{transform:scale(1.18)}}
.scbox.shake .scg.c{animation:scShake .45s}
@keyframes scShake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.scmsg{min-height:2.6em;font-size:clamp(21px,3.6vh,34px);font-weight:700;color:#fff;text-align:center;line-height:1.3}
.scmsg b.kc{color:var(--acc)}.scmsg b.ks{color:var(--ok)}
.scmsg small{display:block;font-size:.74em;color:#BDBDBD}

/* 替換字用的 {w}（英文）／{z}（中文） */
function fill(s,w,z){return String(s).split('{w}').join(w).split('{z}').join(z)}
/* 把句子裡的那一個關鍵字包成有底色的 key（he 問、He 答，兩個都藍底） */
function keyed(txt,k,cls){
  txt=String(txt);
  if(!k)return enHTML(txt);
  var re=new RegExp('(^|[^A-Za-z])('+k+')(?![A-Za-z])');
  var m=re.exec(txt);
  if(!m)return enHTML(txt);
  var st=m.index+m[1].length, ed=st+k.length;
  return enHTML(txt.slice(0,st))+'<span class="key '+(cls||'')+'">'+enHTML(k)+'</span>'+
    enHTML(txt.slice(ed));
}
/* 一個字一個 .w：念到哪一個字，那一個字就亮（使用者 2026-09-24 指定） */
function wordsHTML(txt,k,cls){
  return String(txt).split(' ').map(function(w){
    return '<span class="w" data-w="'+esc(w)+'">'+keyed(w,k,cls)+'</span>'}).join(' ');
}

function lineHTML(tk,id){
  return '<div class="wrap"><div class="line"'+(id?' id="'+id+'"':'')+'>'+
    tk.map(tkHTML).join('')+'</div></div>';
}
/* 「慢慢說 ➜ 說快一點」：慢慢說那一句裡，等一下會被 ’ 藏起來的字母上紅色
   （使用者 2026-09-27 指定：I am ＝ I’m 的 a 和 ’ 一律紅色；What is 的 i、You are 的 a 同一個規則） */
function hidRed(h,mate){
  var m=String(mate).replace(/’/g,"'");
  return h.replace(/\b(I) (a)(m)\b/,function(x,p,c,r){return /\bI'm\b/.test(m)?p+' <b class="ri">'+c+'</b>'+r:x})
   .replace(/\b(You|you|We|we|They|they) (a)(re)\b/,function(x,p,c,r){return new RegExp('\\b'+p+"'re\\b").test(m)?p+' <b class="ri">'+c+'</b>'+r:x})
   .replace(/\b(What|Who|He|She|It|That|Where|How) (i)(s)\b/,function(x,p,c,r){return new RegExp('\\b'+p+"'s\\b").test(m)?p+' <b class="ri">'+c+'</b>'+r:x});
}
/* 情境：兩個人演一次（使用者 2026-09-24 指定改版）。對話框點了就唸 */
function sceneHTML(c){
  var s=c.scene;if(!s)return '';
  /* 問句、答句兩種聲音（2026-10-03）：有答句（b2）才分 */
  var SV=s.b2?qaV(s.b2):['',''];
  var bub=function(txt,side,zh,mate){
    if(!txt)return '';
    var vv=SV[side==='L'?0:1];
    var at=zh?' data-zh="'+esc(txt)+'" data-en="'+esc(mate||'')+'"':' data-say="'+esc(txt)+'"'+(vv?' data-v="'+vv+'"':'');
    return '<div class="sbub '+side+'"'+at+'>'+(!zh&&mate?hidRed(ap(txt),mate):ap(txt))+'</div>';
  };
  var act=function(f,nm,tag,side){
    return '<div class="sact '+side+'"><span class="sfig">'+f+'</span>'+
      (tag?'<span class="stag">'+tag+'</span>':'')+(nm?'<span class="snm">'+nm+'</span>':'')+'</div>';
  };
  return '<div class="scene"><div class="sth">'+
    '<span class="sbg">'+(s.bg||'')+'</span><span class="sat">'+s.at+'</span>'+
    act(s.l,s.ln,'','L')+bub(s.b,'L',s.bzh,s.b2)+'<span class="ssp"></span>'+
    bub(s.b2,'R')+act(s.r,s.rn,s.rt,'R'+(s.b2?' ans':''))+
    '</div><div class="suse">\uD83D\uDCA1 '+ap(s.use)+'</div></div>';
}
function subsHTML(kind,inner){
  /* 一張卡兩排替換字（2026-09-26 Review 1：He’s／She’s ＋ 職業）：c.slots ＝ ['pr','job']；
     替換字很多（20 個以上）就排小一點（.many），句子才有位置 */
  var ks=Object.prototype.toString.call(kind)==='[object Array]'?kind:[kind];
  if(!inner){var n=0;ks.forEach(function(k){var x=SUB[k];if(x)n+=x.basic.length+x.adv.length});
    var body=ks.map(function(k){return subsHTML(k,1)}).join('');
    return body?'<div class="subs'+(n>12?' many':'')+'">'+body+'</div>':''}
  var s=SUB[kind];if(!s)return '';
  var row=function(list,lbl,cls){
    if(!list.length)return '';
    return '<div class="subrow"><span class="lbl">'+lbl+'</span>'+list.map(function(w){
      return '<button class="sub '+cls+'" data-k="'+kind+'" data-w="'+w[0]+'" data-z="'+w[1]+'" data-ic="'+String(w[2]).replace(/"/g,'&quot;')+'">'+
       w[2]+' '+w[0]+(w[1]!==w[0]?' <em>'+w[1]+'</em>':'')+(w[3]?'<small class="snote">'+w[3]+'</small>':'')+'</button>'}).join('')+'</div>';
  };
  return row(s.basic,s.lb||'基礎','')+row(s.adv,s.la||'進階','adv');
}
function noteHTML(n){return n?'<div class="note">'+mk(n)+'</div>':''}
/* 說明文字裡的 [i]／[o] ＝ 那個被藏起來的字母，一樣上紅色 */
function mk(s){return ap(String(s)).replace(/\[([A-Za-z])\]/g,'<b class="ri">$1</b>')}
function fullHTML(zh,en){
  return zh?'<div class="full" data-zh="'+esc(zh)+'" data-en="'+esc(en)+'">'+zh+'</div>':'';
}

/* ---------- 畫一張卡 ---------- */
function draw(dir){

    h=lineHTML(c.tk)+fullHTML(c.zh,plain(c.tk));

    /* rows:1（2026-10-07 使用者第 9、13 點）：演完亮出兩行，上面 Who is ______?、下面 ＝ Who’s ______?，
       ＝ 在第二行第一個字母的左邊、兩行第一個字母上下對齊（空格 ______ 不唸） */

      c.a.map(tkHTML).join('')+'</div></div>'+
      /* 演完亮出來：兩個字 ＝ 一個字，點哪一邊就唸哪一邊 */
      '<div class="moreq'+(c.rows?' rows':'')+'" id="morEq">'+(c.rows?'<span class="mqn" aria-hidden="true">＝</span>':'')+
        '<button class="ms" data-say="'+esc(two)+'">'+enHTML(plain(c.a),mri)+'</button>'+
        '<span class="mq">＝</span>'+
        '<button class="ms" data-say="'+esc(one)+'">'+enHTML(plain(c.b))+'</button>'+
      '</div>'+
      '<button class="swapbtn" id="morGo">🔁 再演一次</button></div>';
    MOR=0;
  } else if(c.type==='order'){
    kind='中英語序';
    /* 同一個顏色上下對齊：兩排用同一組等寬欄位（使用者 2026-09-21 指定） */
    var sayOf=function(row,n){
      var w=row[n][0];
      if(/^[\u2019']s$/.test(w)&&n>0)return row[n-1][0]+"'s";
      return w;
    };
    var mate=function(col){for(var k=0;k<c.enRow.length;k++)if(c.enRow[k][2]===col)return sayOf(c.enRow,k);return ''};
    var chip=function(x,n,row,zh,rc){
      return '<button class="chip '+x[2]+' '+rc+'" data-c="'+x[2]+'" data-n="'+n+'" data-w="'+esc(x[0])+'" data-say="'+esc(sayOf(row,n))+'"'+
      (zh?' data-zh="'+esc(x[0])+'" data-en="'+esc(mate(x[2]))+'"':'')+'>'+
      /* 英文一定要包在自己的一個 <span> 裡：.chip 是直向 flex，
         淺灰的 <b>W</b> 如果直接當 flex item，Who 的 ho 就會被推到下一行
         （使用者 2026-09-21 回報的那個 bug） */
      '<span class="cen">'+enHTML(x[0])+'</span><span class="ci ic">'+x[1]+'</span></button>'};
    /* 兩排放在同一個 grid：欄寬由上下兩排一起決定，字不會被折行（使用者 2026-09-21 回報） */
    var cols='auto repeat('+c.enRow.length+',max-content)';
    h='<div class="ord"><div class="ordgrid" style="grid-template-columns:'+cols+'">'+
        /* enTop（2026-10-04 使用者指定：原本上中文、下英文留著，下一頁新增「上英文、下中文」） */
        (function(){var zr='<span class="cap">中文</span>'+c.zhRow.map(function(x,n){return chip(x,n,c.zhRow,1,'cz')}).join(''),
          er='<span class="cap">英文</span>'+c.enRow.map(function(x,n){return chip(x,n,c.enRow,0,'ce')}).join('');
          return c.enTop?er+zr:zr+er})()+
      '</div><button class="swapbtn" id="ordGo">🔁 再演一次</button>'+
      '</div>'+noteHTML(c.note);
    subs=c.enRow.some(function(x){return x[3]})?subsHTML(c.enRow.filter(function(x){return x[3]})[0][3]):'';   /* 2026-10-10：可以換字的中英語序卡 */
  } else if(c.type==='focus'&&c.eqRow){
    kind='秒懂重點';
    /* 2026-09-25 使用者指定：①一次出現一個英文字，英文出來以後才出現它的中文
       ② 英文、＝、中文三欄上下對齊（同一個 grid）③「💡 問什麼？」按了才用動畫演出用法 ④ 字放大 */
    var hasU=c.rows.some(function(r){return r[3]});
    h='<div class="focus fq"><h2>'+ap(c.title)+'</h2><div class="fgrid'+(hasU?' hasu':'')+(c.left?' left':'')+'">'+c.rows.map(function(r,n){
      return '<span class="gi ic fh" data-r="'+n+'" data-p="0">'+r[2]+'</span>'+
        '<span class="fa en fh" data-r="'+n+'" data-p="0" data-w="'+esc(spk(r[0]))+'" data-say="'+esc(spk(r[0]))+'">'+(c.vr&&c.vr[r[0]]?enV(r[0],c.vr[r[0]]):enHTML(r[0]))+'</span>'+
        '<span class="fe fh" data-r="'+n+'" data-p="1">＝</span>'+
        '<span class="fb zh fh" data-r="'+n+'" data-p="1" data-zh="'+esc(r[1])+'" data-en="'+esc(spk(r[0]))+'">'+ap(r[1])+'</span>'+
        (hasU?'<span class="fu" data-r="'+n+'">'+(r[3]?'<b data-zh="'+esc(r[3].u.replace(/[「」]/g,''))+'" data-en="'+esc(spk(r[0]))+'">'+r[3].u+'</b><span class="fv">'+(r[3].v||'')+'</span>':'')+'</span>':'');
    }).join('')+'</div>'+
    (hasU?'<button class="swapbtn" id="useGo">💡 '+(c.useBtn||'問什麼？')+'</button>':'')+
    '</div>'+noteHTML(c.note);
  } else if(c.type==='focus'){
    kind='秒懂重點';
    h='<div class="focus"><h2>'+ap(c.title)+'</h2>'+c.rows.map(function(r,n){
      return '<div class="frow'+(c.eqRow?' eqr':'')+'" style="animation-delay:'+(0.12+n*0.22).toFixed(2)+'s">'+
        '<span class="fi ic">'+r[2]+'</span>'+
        '<span class="fa en" data-w="'+esc(spk(r[0]))+'" data-say="'+esc(spk(r[0]))+'">'+enHTML(r[0])+'</span>'+
        (c.eqRow?'<span class="fe">＝</span>':'')+
        '<span class="fb zh" data-zh="'+esc(r[1])+'" data-en="'+esc(spk(r[0]))+'">'+ap(r[1])+'</span>'+
        '</div>'}).join('')+'</div>'+noteHTML(c.note);
  } else if(c.type==='echo'){
    kind='秒懂重點';
    h='<div class="echo">'+c.rows.map(function(r,n){
      return '<div class="erow" style="animation-delay:'+(0.12+n*0.24).toFixed(2)+'s">'+
       '<span class="ebub q"><span class="et en" data-say="'+esc(r.q)+'"'+(qaV(r.a)[0]?' data-v="m"':'')+'>'+wordsHTML(r.q,r.qk,r.cls)+'</span>'+
         '<span class="ez zh" data-zh="'+esc(r.qzh)+'" data-en="'+esc(r.q)+'">'+r.qzh+'</span></span>'+
       '<span class="earr">\u279C</span>'+
       '<span class="ebub a"><span class="et en" data-say="'+esc(r.a)+'"'+(qaV(r.a)[1]?' data-v="m"':'')+'>'+wordsHTML(r.a,r.ak,r.cls)+'</span>'+
         '<span class="ez zh" data-zh="'+esc(r.azh)+'" data-en="'+esc(r.a)+'">'+r.azh+'</span></span>'+
       '</div>'}).join('')+'</div>';
  } else if(c.type==='pair'){
    kind='一問一答';
    /* 問句和答句都改成逐字：每一個英文字的正下方就是那一個字的中文
       （使用者 2026-09-21 指定，Unit 1 ／ Unit 2 都一樣） */
    h='<div class="pair">'+
      '<div class="bub q" style="animation-delay:.10s"><span class="bi ic">'+c.qic+'</span>'+
        '<span class="bt">'+lineHTML(c.qtk)+fullHTML(c.qzh,plain(c.qtk))+'</span></div>'+
      '<div class="bub a" style="animation-delay:.55s"><span class="bi ic">'+c.aic+'</span>'+
        '<span class="bt">'+lineHTML(c.atk)+fullHTML(c.azh,plain(c.atk))+'</span></div>'+
      '</div>';
    subs=c.slots?subsHTML(c.slots):(c.slot?subsHTML(c.slot):'');
  } else if(c.type==='cmp'){
    /* 比較卡（2026-10-07 使用者第 14 點）：上面句型、下面例句，每一行第一個字母上下對齊（同一欄、靠左）；
       一行一行出現、一行一行唸；唸到重點字（kw:1，例：I am、are you）那幾個字和它的中文才稍微放大、稍微變亮，其他字不亮 */
    kind='比較';
    var crow=function(tk,n,ex){return '<div class="crow'+(ex?' ex':'')+'" data-n="'+n+'">'+lineHTML(tk.map(function(t){

  } else if(c.type==='swap'||c.type==='swapdemo'){
    kind=c.type==='swap'?'變身術':'秒懂重點';

    h='<div class="swapbox">'+lineHTML(c[c._cur])+
      fullHTML(c._cur==='st'?c.stzh:c.quzh,plain(c[c._cur]))+
      '<span class="swaprow"><button class="swapbtn" id="swapGo">🔄 '+(c._cur==='st'?'變成問句':'變成直述句')+'</button>'+
      '<button class="swapbtn" id="puncGo">'+puncLbl()+'</button></span>'+
      (c.note?'<div class="swaphint">'+mk(c.note)+'</div>':'')+'</div>';

  card.className='';
  if(c.kind)kind=c.kind;
  card.innerHTML='<span class="kind">'+kind+'</span><div id="cardIn">'+sceneHTML(c)+h+
    '<div id="tapHint" class="off">點卡片：一次出現一個字</div></div>'+subs;
  applyMode();
  padBottom();
  fit();
  markSubs();
  if(c.type==='order')playOrder();

  if(c.type==='swapdemo'){demoN=0;demoT=setTimeout(function(){doSwap(1)},1600)}
  if(reveal==='word'&&(c.type==='sent'||c.type==='swap')&&!c.one){startWord()}

  if(c.one){vowelRed();card.classList.add('one');fit();var kd=$('.kind',card);if(kd)kd.textContent='單字';var oc=c;morT.push(setTimeout(function(){if(CARDS[i]===oc&&!AUTO)sayCard()},450))}
  $$('#dots i').forEach(function(d,n){d.className=n===i?'on':''});

  /* 有分頁：第一張往左 ＝ 上一個分頁最後一張、最後一張往右 ＝ 下一個分頁第一張（2026-10-04 使用者指定）；最後一個分頁的最後一張停住 */
  var hasT=window.TABM&&window.crossTab&&typeof TCUR==='number';
  $('#prev').disabled=i===0&&!(hasT&&TCUR>0);
  $('#next').disabled=i===CARDS.length-1&&!(hasT&&TCUR<TABM.length-1)&&!(window.tqHas&&tqHas());

    card.classList.add(dir>0?'turnR':'turnL');
    setTimeout(function(){card.classList.remove('turnR','turnL')},430);

/* 換卡以前把上一張的動畫收乾淨，不然飛到一半的字會留在畫面上 */
function clearAnim(){
  morT.forEach(function(t){clearTimeout(t)});morT=[];
  if(demoT){clearTimeout(demoT);demoT=null}
  $$('.key.fly').forEach(function(x){if(x.parentNode)x.parentNode.removeChild(x)});
}

/* 替換字擺在卡片最下面：先把它的高度讓出來，中間才留給英文句子 */
/* 一個字一張的卡：英文的母音字母上紅色（淡灰的不發音字母、紅色的 ’ 不動；y 只有在字裡沒有別的母音時算母音：my） */
function vowelRed(){
  $$('#cardIn .tk .en',card).forEach(function(en){
    var w=en.textContent,yv=!/[aeiou]/i.test(w);
    var walk=document.createTreeWalker(en,NodeFilter.SHOW_TEXT,null,false),n,L=[];
    while((n=walk.nextNode()))if(!(n.parentNode.closest&&n.parentNode.closest('.sil,.ap')))L.push(n);
    L.forEach(function(t){var re=yv?/[aeiouyAEIOUY]/g:/[aeiouAEIOU]/g;if(!re.test(t.nodeValue))return;
      var sp=document.createElement('span');sp.innerHTML=t.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(re,function(x){return '<b class="vw">'+x+'</b>'});
      var f=document.createDocumentFragment();while(sp.firstChild)f.appendChild(sp.firstChild);t.parentNode.replaceChild(f,t)})})
}
function padBottom(){
  var sb=$('.subs',card);
  card.style.paddingBottom = sb ? (sb.offsetHeight + 14) + 'px' : '';
  placeNav();
}
/* 箭頭的上下範圍 ＝ 字卡左上角標籤下面 ～ 替換字上面（2026-10-04）。用 offset（不吃翻卡動畫的位移） */
function placeNav(){
