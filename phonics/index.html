<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonics Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<!-- phonics/index.html 是 node phonics/_build.js 從 _card.html 做 出來 的；要 改 改 _card.html／_ph.js -->
<style>
  :root{
    --vowel:#F4A69E;--cons:#90C2E7;--yellow:#FACC15;--yellow-d:#EAB308;--amber:#F59E0B;--red:#EF4444;
    --silent:#6E6E6E;--dim:#565656;--line:#1a1a1a;
    --andika:'Andika','Century Gothic','Trebuchet MS',sans-serif;
    --han:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#000;color:#fff;font-family:var(--han);display:flex;flex-direction:column;overflow:hidden}
  .rail{display:flex;align-items:center;gap:12px;padding:7px 16px;flex:0 0 auto;min-height:0}
  .rail.top{border-bottom:1px solid var(--line)}
  .rail.bot{border-top:1px solid var(--line)}
  .tag{font-size:12px;letter-spacing:2px;color:var(--dim);font-weight:700;white-space:nowrap}
  .btn{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:#8f8f8f;font-family:var(--han);font-size:13.5px;font-weight:700;letter-spacing:.4px;padding:6px 11px;border-radius:7px;cursor:pointer;transition:.14s;white-space:nowrap}
  .btn.en{font-family:var(--andika);font-size:17px;padding:4px 12px}
  .btn:hover{border-color:#3a3a3a;color:#e0e0e0}
  .btn.on{background:#fff;color:#000;border-color:#fff}
  .grp{display:flex;gap:3px;flex:0 0 auto}
  .scroll{display:flex;gap:4px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:thin}
  .scroll::-webkit-scrollbar{height:4px}.scroll::-webkit-scrollbar-thumb{background:#242424;border-radius:3px}.scroll::-webkit-scrollbar-track{background:transparent}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,20px);min-height:0;padding:8px 10px;overflow:hidden}
  .deck{display:flex;align-items:center;gap:clamp(10px,2.2vw,26px);max-width:100%}
  .arrow{width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:transparent;border:1px solid #202020;color:#5e5e5e;font-size:18px;line-height:1;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center}
  .arrow:hover{border-color:#3f3f3f;color:#fff}.arrow:disabled{opacity:.2;cursor:default}
  .card{position:relative;cursor:pointer;min-width:0;background:#0b0b0b;border:1px solid #1b1b1b;border-radius:22px;padding:clamp(20px,3.4vh,40px) clamp(18px,3.6vw,52px);box-shadow:0 20px 50px rgba(0,0,0,.85);transition:.16s}
  .card:hover{border-color:#2b2b2b}
  .grid{display:grid;grid-auto-flow:column;justify-content:center;align-items:center;column-gap:clamp(5px,1vw,12px);row-gap:clamp(12px,2.2vh,22px);grid-template-rows:auto auto}
  .cell{display:flex;align-items:center;justify-content:center;gap:4px}
  .letter{font-family:var(--andika);font-weight:700;white-space:nowrap;font-size:clamp(52px,min(11vw,17vh),124px);line-height:.9;letter-spacing:-.015em}
  .letter .nm{display:inline-block;line-height:.78;padding:.10em .09em .16em;border-radius:.13em;color:#000}
  .tile{position:relative;border-radius:.28em;min-width:1.9em;height:1.78em;padding:0 .30em;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;white-space:nowrap;-webkit-text-stroke:.034em currentColor;font-size:clamp(25px,min(4.7vw,7.4vh),46px)}
  .tile.zh{font-family:var(--han)}.tile.ph{font-family:var(--andika)}.tile.dark{color:#111}
  .tile .sup{position:absolute;top:.3em;right:.3em;font-size:.44em;line-height:1;font-weight:800;-webkit-text-stroke:0}
  .tile.stack{flex-direction:column;line-height:.92}.tile.stack span{font-size:.62em}
  .vowelrow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;max-width:min(1100px,94vw)}
  .vowelrow .inner{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .deckbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  .counter{font-family:var(--andika);font-size:14px;letter-spacing:2px;color:#464646;font-weight:700;min-width:88px;text-align:center}
  /* 第四十七次：🏠 總首頁、🎮 遊戲（加進 網站 才 有 的 兩顆）*/
  .nav{flex:0 0 auto;display:flex;gap:6px}
  .nav a{font-family:var(--han);font-size:16px;font-weight:900;color:#FFE07A;border:1px solid #6b5a1a;border-radius:8px;padding:6px 12px;text-decoration:none;white-space:nowrap}
  .nav a.gm{color:#7FE3FF;border-color:#1f5a6b}
  .nav a.dk{color:#B9F6CA;border-color:#2E6B3A}.nav a.ex{color:#FFB4A8;border-color:#7a3328}.nav a.cur{background:#1d1d1d;outline:2px solid currentColor}
  /* 第四十八次：部位 ＝ 小 圖 一看 就 懂（藍 ＝ 字首、粉 ＝ 母音、藍 ＝ 字尾；實心 ＝ 看得到、虛線 ＝ 藏起來、沒有 ＝ 拿掉）*/
  .pt{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px}
  .pt .ico{display:flex;gap:2px;height:12px}.pt .ico i{display:block;width:12px;height:12px;border-radius:3px}
  .pt .ico i.c{background:var(--cons)}.pt .ico i.v{background:var(--vowel)}.pt .ico i.h{border:2px dashed #777}.pt .ico i.x{width:6px;background:none}
  .pt.on .ico i.h{border-color:#555}
  .rail.part{justify-content:center;flex-wrap:wrap;row-gap:4px}
  .card .xb{position:absolute;left:14px;top:10px;font-size:15px;font-weight:900;color:#FFB4A8;border:1px solid #7a3328;border-radius:8px;padding:2px 8px;background:#1a0b08}
  .card .real{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:clamp(12px,2.2vh,22px)}
  .card .real .rl{font-size:14px;color:#FFB4A8;font-weight:900;margin-right:8px}
  .card .hear{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,5vh,46px);color:#5a5a5a;font-weight:900;pointer-events:none}

</style></head><body>

<div class="rail top">
  <span class="tag">字首</span>
  <div class="grp" id="segInit">
    <button class="btn" data-v="basic">基礎</button>
    <button class="btn" data-v="adv">進階</button>
  </div>
  <div class="scroll" id="initChips"></div>
  <div class="nav"><a class="gm" href="games.html">🎮 遊戲</a><a href="../index.html">🏠 總首頁</a></div>
</div>

<main>
  <div class="deck">
    <button class="arrow" id="prev" title="上一頁 ←">&#10094;</button>

      <button class="btn" data-v="2600">慢</button>
      <button class="btn" data-v="1900">中</button>
    </div>
    <div class="nav" id="nav"><a class="dk" data-dk="" href="index.html">原本</a><a class="dk" data-dk="basic" href="basic.html">🟢 基礎版</a><a class="dk" data-dk="advanced" href="advanced.html">🔵 進階版</a><a class="ex" href="exceptions.html">⚠ 例外 字</a></div>
  </div>
  <div class="vowelrow">
    <span class="tag">母音</span>
    <div class="inner" id="vowels"></div>
  </div>
</main>

<div class="rail bot">
  <span class="tag">字尾</span>
  <div class="grp" id="segEnd">
    <button class="btn" data-v="g1">1</button>
    <button class="btn" data-v="g2">2</button>
    <button class="btn" data-v="g3">3</button>
  </div>
  <div class="scroll" id="endChips"></div>
</div>

<div class="rail bot part">
  <span class="tag">部位</span>
  <div class="grp" id="segPart">
    <button class="btn pt" data-v="all"><span class="ico"><i class="c"></i><i class="v"></i><i class="c"></i></span>全部</button>
    <button class="btn pt" data-v="none"><span class="ico"><i class="h"></i><i class="h"></i><i class="h"></i></span>全無（只 聽）</button>
    <button class="btn pt" data-v="initial"><span class="ico"><i class="c"></i><i class="h"></i><i class="h"></i></span>字首</button>
    <button class="btn pt" data-v="vowel"><span class="ico"><i class="h"></i><i class="v"></i><i class="h"></i></span>母音</button>
    <button class="btn pt" data-v="ending"><span class="ico"><i class="h"></i><i class="h"></i><i class="c"></i></span>字尾</button>
    <button class="btn pt" data-v="noI"><span class="ico"><i class="h"></i><i class="v"></i><i class="c"></i></span>字首：無</button>
    <button class="btn pt" data-v="noV"><span class="ico"><i class="c"></i><i class="h"></i><i class="c"></i></span>母音：無</button>
    <button class="btn pt" data-v="noE"><span class="ico"><i class="c"></i><i class="v"></i><i class="h"></i></span>字尾：無</button>
    <button class="btn pt" data-v="iv"><span class="ico"><i class="c"></i><i class="v"></i><i class="x"></i></span>字首＋母音</button>
    <button class="btn pt" data-v="ve"><span class="ico"><i class="x"></i><i class="v"></i><i class="c"></i></span>母音＋字尾</button>
  </div>
</div>

<div class="rail bot">
  <span class="tag">音標</span>
  <div class="grp" id="segMode">
    <button class="btn" data-v="zh">專利注音</button>
    <button class="btn" data-v="kk">KK</button>
    <button class="btn" data-v="ipa">IPA</button>
    <button class="btn" data-v="none">無音標</button>
  </div>
  <div style="flex:1"></div>
  <span class="tag">語速</span>
  <div class="grp" id="segRate">
    <button class="btn" data-v="0.8">0.8×</button>
    <button class="btn" data-v="0.95">0.95×</button>
    <button class="btn" data-v="1">1×</button>
  </div>
</div>

<script>/* phonics/_ph.js — 🔤 Phonics Master 共用 資料＋發音 碼（字卡 頁、遊戲 頁、node build 都 用 這一份）
 * 2026-11-12 第四十七次 第 2 點（老師 的 Phonics Master，原本 在 claude.ai 字卡 頁）：
 *   ① 發音 ＝ 照 字卡 下面 的 雙語 注音 唸：每一張 卡 ＝ 字首 碼＋母音 碼＋字尾 碼（例 k-ae-d），音檔 ＝ phonics/au/<碼>.mp3

 *      唸起來 像 不雅 字 的 組合（BAD）＝ 永遠 不放
 */
(function (root) {
  'use strict';
  var VC = 'var(--vowel)', CC = 'var(--cons)';

    'm': { zh: 'ㄇ', kk: 'm', ipa: 'm' }, 'f': { zh: 'ㄈ', kk: 'f', ipa: 'f' },
    'd': { zh: 'ㄉ', kk: 'd', ipa: 'd' }, 't': { zh: 'ㄊ', kk: 't', ipa: 't' },
    'n': { zh: 'ㄋ', kk: 'n', ipa: 'n' }, 'l': { zh: 'ㄌ', kk: 'l', ipa: 'l' },
    'k': { zh: 'ㄎ', kk: 'k', ipa: 'k' }, 'h': { zh: 'ㄏ', kk: 'h', ipa: 'h' },
    's': { zh: 'ㄙ', kk: 's', ipa: 's' },
    'g_hard': { zh: 'ㄍ', kk: 'g', ipa: 'ɡ' }, 'g_soft': { zh: 'ㄓ', kk: 'dʒ', ipa: 'dʒ' },
    'c_hard': { zh: 'ㄎ', kk: 'k', ipa: 'k' }, 'c_soft': { zh: 'ㄙ', kk: 's', ipa: 's' },
    'j': { zh: 'ㄓ', kk: 'dʒ', ipa: 'dʒ' },
    'w': { zh: 'ㄨ', kk: 'w', ipa: 'w' },
    'z': { zh: 'z', kk: 'z', ipa: 'z' },
    'ch': { zh: 'ㄔ', kk: 'tʃ', ipa: 'tʃ' }, 'sh': { zh: 'ㄕ', kk: 'ʃ', ipa: 'ʃ' },
    'th(無聲)': { zh: 'θ', kk: 'θ', ipa: 'θ' },
    'th(有聲)': { zh: 'ð', kk: 'ð', ipa: 'ð' },
    'ph': { zh: 'ㄈ', kk: 'f', ipa: 'f' },
    'wh': { zh: 'ㄨ', kk: 'hw', ipa: 'w' },
    'qu': { zh: ['ㄎ', 'ㄨ'], kk: ['k', 'w'], ipa: ['k', 'w'] },
    'r': { zh: ['ㄖ', 'ㄨ'], kk: 'r', ipa: 'ɹ', stack: true },
    'r_end': { zh: 'ㄦ', kk: 'r', ipa: 'ɹ' },
    'ck': { zh: 'ㄎ', sup: '〃', kk: 'k', ipa: 'k' },
    'x': { zh: ['ㄎ', 'ㄙ'], kk: ['k', 's'], ipa: ['k', 's'] },
    'm_end': { zh: 'ㄇ', sup: '~', kk: 'm', ipa: 'm' },
    'mb': { zh: 'ㄇ', sup: '~', kk: 'm', ipa: 'm' },
    'mp': { zh: ['ㄇ', 'ㄆ'], sup: ['~', '〃'], kk: ['m', 'p'], ipa: ['m', 'p'] },
    'n_end': { zh: 'ㄋ', sup: '~', kk: 'n', ipa: 'n' },
    'nd': { zh: ['ㄋ', 'ㄉ'], sup: ['~', '〃'], kk: ['n', 'd'], ipa: ['n', 'd'] },
    'nt': { zh: ['ㄋ', 'ㄊ'], sup: ['~', '〃'], kk: ['n', 't'], ipa: ['n', 't'] },
    'tch': { zh: 'ㄔ', kk: 'tʃ', ipa: 'tʃ' },
    'ss': { zh: 'ㄙ', kk: 's', ipa: 's' }, 'zz': { zh: 'z', kk: 'z', ipa: 'z' },
    'l_end': { zh: 'ㄛ', kk: 'l', ipa: 'l' },
    'd_end': { zh: 'ㄉ', sup: '〃', kk: 'd', ipa: 'd' },
    'p_end': { zh: 'ㄆ', sup: '〃', kk: 'p', ipa: 'p' },
    'f_end': { zh: 'ㄈ', sup: '〃', kk: 'f', ipa: 'f' },
    't_end': { zh: 'ㄊ', sup: '〃', kk: 't', ipa: 't' },
    'g_end': { zh: 'ㄍ', sup: '〃', kk: 'g', ipa: 'ɡ' },
    'sion': { zh: 'ʒən', kk: 'ʒən', ipa: 'ʒən' }
  };
  /* 第四十七次：o、ar 右上角 的 愛心 拿掉（老師：暫時 刪除）*/
  var VOW = {
    'a': { zh: 'ㄚ', sup: 'ㄝ', kk: 'æ', ipa: 'æ', bg: VC },
    'e': { zh: 'ㄝ', kk: 'ɛ', ipa: 'ɛ', bg: VC },
    'i': { zh: 'ㄜ', sup: '一', kk: 'ɪ', ipa: 'ɪ', bg: VC },
    'o': { zh: 'ㄚ', kk: 'ɑ', ipa: 'ɑ', bg: VC },
    'u': { zh: 'ㄜ', kk: 'ʌ', ipa: 'ʌ', bg: VC },
    'ai': { zh: '一', sup: 'ㄝ', kk: 'e', ipa: 'eɪ', bg: VC },
    'ee': { zh: '一', kk: 'i', ipa: 'i', bg: VC },
    'oa': { zh: 'ㄨ', sup: 'ㄜ', kk: 'o', ipa: 'oʊ', bg: VC },
    'oo_long': { zh: 'ㄨ', kk: 'u', ipa: 'u', bg: 'var(--red)' },
    'oo_short': { zh: 'ㄛ', sup: 'ㄨ', kk: 'ʊ', ipa: 'ʊ', bg: 'var(--amber)' },
    'ou': { zh: 'ㄠ', sup: 'ㄝ', kk: 'aʊ', ipa: 'aʊ', bg: VC }
  };
  var RVOW = {
    'ar': { zh: 'ㄚ', bg: VC, vkk: 'ɑ', vipa: 'ɑ', rkk: 'r', ripa: 'ɹ' },
    'er': { zh: 'ㄜ', bg: 'var(--yellow)', vkk: 'ɚ', vipa: 'ɚ', rkk: '', ripa: '', dark: true },
    'ir': { zh: 'ㄜ', bg: 'var(--yellow-d)', vkk: 'ɚ', vipa: 'ɚ', rkk: '', ripa: '', dark: true },
    'ur': { zh: 'ㄜ', bg: 'var(--yellow-d)', vkk: 'ɝ', vipa: 'ɝ', rkk: '', ripa: '', dark: true },
    'or': { zh: 'ㄛ', bg: VC, vkk: 'ɔ', vipa: 'ɔ', rkk: 'r', ripa: 'ɹ' }
  };
  var TRIPLE = {
    zh: [{ t: 'ㄕ' }, { t: 'ㄜ', v: true }, { t: 'ㄋ', sup: '~' }],
    kk: [{ t: 'ʃ' }, { t: 'ə', v: true }, { t: 'n' }],
    ipa: [{ t: 'ʃ' }, { t: 'ə', v: true }, { t: 'n' }]
  };
  var INITIALS = {
    basic: ['b', 'p', 'm', 'f', 'd', 't', 'n', 'l', 'g', 'c', 'k', 'h', 'j', 'qu', 'w', 'r', 's', 'z'],
    adv: ['j', 'ch', 'sh', 'th(無聲)', 'th(有聲)', 'ph', 'wh', 'qu']
  };
  var ENDINGS = {
    g1: ['無', 'b', 'p', 'm', 'f', 'd', 't', 'n', 'l', 'g', 'ck', 'r', 's', 'z', 'x'],
    g2: ['b', 'p', 'm', 'f', 'ph', 'd', 't', 'n', 'l', 'g', 'ck', 'mb', 'mp', 'nd', 'nt', 'ch', 'tch', 'sh', 'th', 's', 'ss', 'zz', 'tion', 'sion', 'ssion'],
    g3: ['s', 'ss', 'b', 'p', 'd', 't', 'g', 'ck', 'm', 'mb', 'mp', 'n', 'nd', 'nt', 'ph', 'ch', 'sh', 'th']
  };
  var VLIST = [
    { t: 'a' }, { t: 'e' }, { t: 'i' }, { t: 'o' }, { t: 'u' },
    { t: 'ar' }, { t: 'er' }, { t: 'ir' }, { t: 'or' }, { t: 'ur' },
    { t: 'ai', name: true }, { t: 'ee', name: true }, { t: 'oa', name: true },
    { t: 'oo', key: 'oo_long', mark: '長' }, { t: 'oo', key: 'oo_short', mark: '短' },
    { t: 'ou' }
  ];
  var SOFT = ['e', 'i', 'ee', 'er', 'ir'];

  /* ── 發音 碼 ── */
  function initCode(I, vt) {
    if (I === 'g') return SOFT.indexOf(vt) >= 0 ? 'j' : 'g';
    if (I === 'c') return SOFT.indexOf(vt) >= 0 ? 's' : 'k';
    return { qu: 'kw', 'th(無聲)': 'th', 'th(有聲)': 'dh', ph: 'f', wh: 'w' }[I] || I;
  }
  function vowCode(V) { return { a: 'ae', e: 'eh', i: 'ih', o: 'aa', u: 'uh', ar: 'ar', er: 'er', ir: 'er', ur: 'er', or: 'or', ai: 'ai', ee: 'ee', oa: 'oa', ou: 'ou' }[V.t] || (V.key === 'oo_long' ? 'uu' : 'oo'); }
  function endCode(E) { if (E === '無') return ''; return { g: 'g', ck: 'k', x: 'ks', ph: 'f', mb: 'm', tch: 'ch', ss: 's', zz: 'z', tion: 'shn', ssion: 'shn', sion: 'zhn' }[E] || E; }
  /* 母音 是 ar／er／ir／or／ur 時 字尾 r 不 顯示、不 發音（原本 的 規則：barr ➜ bar）*/
  function effEnd(V, E) { return (E === 'r' && RVOW[V.t]) ? '無' : E; }
  function code(I, V, E) { E = effEnd(V, E); var e = endCode(E); return initCode(I, V.t) + '-' + vowCode(V) + (e ? '-' + e : ''); }

  if(color)s.style.color=color;
  if(bg){s.className='nm';s.style.background=bg;}
  return s;
}
function phon(e,isVowel,bg,dark){
  if(mode==='none')return[];
  const val = mode==='zh' ? e.zh : (mode==='kk'?e.kk:e.ipa);
  if(val===undefined||val===null||val==='')return[];
  const col = isVowel ? bg : CC;
  const sup = (mode==='zh') ? e.sup : null;
  if(mode==='zh'&&e.stack)return[tile(val,col,{stack:true,dark:dark})];
  if(Array.isArray(val))
    return val.map((t,i)=>tile(t,col,{sup:Array.isArray(sup)?(sup[i]||null):(i===0?sup:null),dark:dark}));
  return[tile(val,col,{sup:sup,dark:dark})];
}
let EXNOW=null;
function pushUnit(g,glyphNodes,phonNodes,hide){
  const c1=el('cell');const L=el('letter');glyphNodes.forEach(n=>L.appendChild(n));c1.appendChild(L);
  const c2=el('cell');if(!EXNOW)(phonNodes||[]).forEach(n=>c2.appendChild(n));
  if(hide){c1.style.visibility='hidden';c2.style.visibility='hidden';}
  g.appendChild(c1);g.appendChild(c2);
}
function build(){
  const g=document.getElementById('grid');g.innerHTML='';
  const card=document.getElementById('card');card.querySelectorAll('.xb,.real,.hear').forEach(x=>x.remove());
  const V=curVow(), I=curInit(), vbg=vowLetterBg(V);
  EXNOW=(part==='iv'||part==='ve')?null:curEx();
  /* 部位：藏起來（位置 留著）、拿掉（不畫）*/
  const hI=['vowel','ending','none','noI'].includes(part);
  const hV=['initial','ending','none','noV'].includes(part);
  const hE=['initial','vowel','none','noE'].includes(part);
  const rI=part==='ve', rE=part==='iv';
  if(!rI){
    let key=I;
    if(I==='c'||I==='g')key=I+'_'+(DK?(PH2.initCode2(I,V)==='s'||PH2.initCode2(I,V)==='j'?'soft':'hard'):(SOFT.includes(V.t)?'soft':'hard'));
    const e=PH2.BLEND[I]?null:(CONS[key]||CONS2[I]||CONS[I]);
    if(PH2.BLEND[I]){
      let nodes=[];PH2.BLEND[I].forEach(c=>{nodes=nodes.concat(phon(CONS[c],false));});
      pushUnit(g,I.split('').map(c=>txtSpan(c,'#fff')),nodes,hI);
    } else if(e){
      if(I==='wh'){
        pushUnit(g,[txtSpan('w','#fff')],phon(e,false),hI);
        pushUnit(g,[txtSpan('h','var(--silent)')],[],hI);
      } else {
        let glyphs;
        if(I==='th(無聲)'||I==='th(有聲)')glyphs=[txtSpan('t','#fff'),txtSpan('h','#fff')];
        else if(['qu','ch','sh','ph'].includes(I))glyphs=I.split('').map(c=>txtSpan(c,'#fff'));
        else glyphs=[txtSpan(I,'#fff')];
        pushUnit(g,glyphs,phon(e,false),hI);
      }
    }
  }
  const t=V.key||V.t, v2=VOW2[t];
  {
    if(v2&&v2.magic){
      const e=(t==='u_e'&&PH2.uIsU(I))?Object.assign({},v2,v2.uu):v2;
      pushUnit(g,[txtSpan(t.charAt(0),'#000',v2.bg)],phon(e,true,v2.bg),hV);
    } else if(v2&&v2.team){
      pushUnit(g,[txtSpan(t[0],'#000',v2.bg)],phon(v2,true,v2.bg),hV);
      pushUnit(g,[txtSpan(t[1],'var(--silent)')],[],hV);
    } else if(RVOW[V.t]){
      const r=RVOW[V.t], base=V.t.slice(0,-1);
      let vNodes=[];
      if(mode==='zh')      vNodes=[tile(r.zh,r.bg,{sup:r.sup,dark:r.dark})];
      else if(mode!=='none'){const v=(mode==='kk')?r.vkk:r.vipa;if(v)vNodes=[tile(v,r.bg,{dark:r.dark})];}
      pushUnit(g,[txtSpan(base,'#000',r.bg)],vNodes,hV);
      let rNodes=[];
      if(mode==='zh')      rNodes=[tile('ㄦ',CC)];
      else if(mode!=='none'){const rv=(mode==='kk')?r.rkk:r.ripa;if(rv)rNodes=[tile(rv,CC)];}
      pushUnit(g,[txtSpan('r','#fff')],rNodes,hV);
    } else if(V.name){
      const e=VOW[V.t];
      pushUnit(g,[txtSpan(V.t[0],'#000',vbg)],phon(e,true,e.bg),hV);
      pushUnit(g,[txtSpan(V.t[1],'var(--silent)')],[],hV);
    } else {
      const e=VOW[V.key||V.t];
      pushUnit(g,[txtSpan(V.t,'#000',vbg)],phon(e,true,e.bg,e.dark),hV);
    }
  }
  const E=effEnd();
  if(E!=='無'&&!rE){
    if(E==='ck'){
      pushUnit(g,[txtSpan('c','var(--silent)')],[],hE);
      pushUnit(g,[txtSpan('k','#fff')],phon(CONS['ck'],false),hE);
    } else if(E==='mb'){
      pushUnit(g,[txtSpan('m','#fff')],phon(CONS['mb'],false),hE);
      pushUnit(g,[txtSpan('b','var(--silent)')],[],hE);
    } else if(E==='tch'){
      pushUnit(g,[txtSpan('t','var(--silent)')],[],hE);
      pushUnit(g,[txtSpan('c','#fff'),txtSpan('h','#fff')],phon(CONS['tch'],false),hE);
    } else if(['tion','sion','ssion'].includes(E)){
      const glyphs=E.split('').map(ch=>ch==='i'?txtSpan(ch,'var(--silent)'):ch==='o'?txtSpan(ch,'var(--amber)'):txtSpan(ch,'#fff'));
      let nodes=[];
      if(E==='sion')nodes=phon(CONS['sion'],false);
      else if(mode!=='none'){
        const parts=(mode==='zh')?TRIPLE.zh:(mode==='kk'?TRIPLE.kk:TRIPLE.ipa);
        nodes=parts.map(b=>tile(b.t, b.v?VC:CC, {sup:b.sup}));
      }
      pushUnit(g,glyphs,nodes,hE);
    } else {
      const key = E==='l'?'l_end' : E==='d'?'d_end' : E==='m'?'m_end' : E==='n'?'n_end' : E==='r'?'r_end'
                : E==='g'?'g_end' : E==='p'?'p_end' : E==='f'?'f_end' : E==='t'?'t_end' : E==='th'?'th(無聲)' : E;
      const e=(DK&&E==='k')?CONS2.k_end:(CONS[key]||CONS2[key]);
      if(e)pushUnit(g,E.split('').map(c=>txtSpan(c,'#fff')),phon(e,false),hE);
    }
    if(v2&&v2.magic)pushUnit(g,[txtSpan('e','var(--silent)')],[],hE);   /* magic e 最後 的 e 不 唸（灰色）*/
  }
  /* 例外 字：⚠＋真的 雙語 注音／KK／IPA（一排，放在 字母 下面）*/
  if(EXNOW){
    const b=el('xb','⚠ 例外：不照 規則');card.appendChild(b);
    if(mode!=='none'){const rt=PH2.realTiles(EXNOW[0],mode)||[];const r=el('real');r.appendChild(el('rl','真的 唸法'));
      rt.forEach(x=>r.appendChild(tile(x.t,x.bg,{sup:x.sup,stack:x.stack,dark:x.dark})));card.appendChild(r);}
  }
  if(part==='none')card.appendChild(el('hear','🎧 聽 聲音，猜 猜 看'));
  document.getElementById('counter').textContent=(idx+1)+' / '+deck.length;
  document.getElementById('prev').disabled=idx<=0;
  document.getElementById('next').disabled=idx>=deck.length-1;
  drawChips();drawVowels();
}
function go(n,sound){idx=Math.max(0,Math.min(deck.length-1,n));build();if(sound!==false)playCur();}
function pauseAuto(){
  if(timer){clearInterval(timer);timer=null;}
  stopSound();
  const b=document.getElementById('play');
  b.classList.remove('on');b.textContent='▶ 自動播放';b.title='自動慢速播放';
}
function startAuto(){
  const b=document.getElementById('play');
  b.classList.add('on');b.textContent='⏸ 暫停';b.title='暫停（保留目前頁數）';
  playCur();
  timer=setInterval(()=>{if(idx>=deck.length-1){pauseAuto();return;}go(idx+1);},speed);
}
const isPlaying=()=>timer!==null;
document.getElementById('play').onclick=()=>{isPlaying()?pauseAuto():startAuto();};
document.getElementById('prev').onclick=()=>{pauseAuto();go(idx-1);};
document.getElementById('next').onclick=()=>{pauseAuto();go(idx+1);};
document.getElementById('card').onclick=()=>{isPlaying()?pauseAuto():playCur();};
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();pauseAuto();go(idx-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();pauseAuto();go(idx+1);}
  else if(e.code==='Space'){e.preventDefault();isPlaying()?pauseAuto():playCur();}
});
function mkBtn(label,on,en,fn){const b=document.createElement('button');b.className='btn'+(en?' en':'')+(on?' on':'');b.textContent=label;b.onclick=fn;return b;}
const iLab=x=>x.replace('(無聲)','(無聲)');
function drawChips(){
  const I=curInit();
  const ic=document.getElementById('initChips');ic.innerHTML='';
  INITIALS[initGrp].forEach(x=>ic.appendChild(mkBtn(iLab(x),x===I,true,()=>{
    pauseAuto();
    const at=deck.findIndex(c=>c.v===deck[idx].v&&c.i===x);
    go(at>=0?at:idx);
  })));
  const ec=document.getElementById('endChips');ec.innerHTML='';
  ENDINGS[endGrp].forEach(x=>ec.appendChild(mkBtn(x,x===curEnd,true,()=>{pauseAuto();curEnd=x;buildDeck(true);build();playCur();})));
}
function drawVowels(){
  const V=curVow();
  const c=document.getElementById('vowels');c.innerHTML='';
  VLIST.forEach((v,vi)=>{
    const label=v.mark?v.t+' '+v.mark:v.t;
    const has=deck.some(c2=>c2.v===vi);
    const b=mkBtn(label,v===V,true,()=>{pauseAuto();const at=deck.findIndex(c2=>c2.v===vi);go(at>=0?at:idx);});
    if(!has)b.style.opacity='.35';
    c.appendChild(b);
  });
}
function seg(id,init,fn){
  const box=document.getElementById(id);
  [...box.children].forEach(b=>{if(b.dataset.v===init)b.classList.add('on');});
  box.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;[...box.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v);});
}
/* 基礎版、進階版：字首、字尾 的 分組 按鈕 換成 這一副 的 */
if(DK){
  document.getElementById('segInit').innerHTML=DK.IG.map(x=>'<button class="btn" data-v="'+x[0]+'">'+x[1]+'</button>').join('');
  document.getElementById('segEnd').innerHTML=DK.EG.map(x=>'<button class="btn" data-v="'+x[0]+'">'+x[1]+'</button>').join('');
  document.title='Phonics Master '+DK.title;
}
document.querySelectorAll('#nav a.dk').forEach(a=>{if(a.dataset.dk===(DK?DK.id:''))a.classList.add('cur');});
seg('segMode','zh',v=>{mode=v;build();});
seg('segPart','all',v=>{part=v;build();playCur();});
seg('segInit',initGrp,v=>{pauseAuto();initGrp=v;buildDeck(true);build();});
seg('segEnd','g1',v=>{pauseAuto();endGrp=v;if(!ENDINGS[v].includes(curEnd))curEnd=ENDINGS[v][0];buildDeck(true);build();});
seg('segSpeed','2600',v=>{speed=+v;if(isPlaying()){pauseAuto();startAuto();}});
seg('segRate','0.95',v=>{rate=+v;});
buildDeck(false);
build();
</script>
</body></html>
