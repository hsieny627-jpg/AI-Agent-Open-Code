<style>
:root{--vowel:#F4A69E;--cons:#90C2E7;--red:#EF4444;--amber:#F59E0B;--yellow:#FACC15;--gold:#FFD54A;--ok:#22C55E;--bad:#EF4444;--bg:#0B1026;--pn:#141B3D;--ln:#2A3570;
  --andika:'Andika','Century Gothic','Trebuchet MS',sans-serif;--han:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#24306B 0,#0B1026 55%,#05070F 100%);color:#fff;font-family:var(--han);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:var(--han);cursor:pointer}
.en{font-family:var(--andika)}
#top{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));background:rgba(5,8,20,.85);border-bottom:2px solid var(--ln);z-index:20}
#top a,#top button.tb{font-size:20px;font-weight:900;color:#FFE07A;background:#2A2410;border:2px solid #8a7420;border-radius:12px;padding:6px 14px;text-decoration:none;white-space:nowrap}
#top .ttl{flex:1;text-align:center;font-size:26px;font-weight:900;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .st{display:flex;gap:8px;font-size:22px;font-weight:900;white-space:nowrap}
#top .st span{background:#0E1430;border:2px solid var(--ln);border-radius:12px;padding:4px 12px}
#top .st .cn b{color:var(--gold)}
#top .st .fi{color:#FF9A3C}
main{position:absolute;left:0;right:0;top:64px;bottom:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
.scr[hidden]{display:none!important}
/* ── 大廳 ── */
.lobby h1{text-align:center;font-size:clamp(30px,4.6vh,48px);margin:6px 0 2px}
.lobby .sub{text-align:center;font-size:clamp(20px,2.6vh,26px);color:#BFD0FF;margin:0 0 12px}
.lvrow{display:flex;justify-content:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.lvrow button{font-size:22px;font-weight:900;padding:10px 20px;border-radius:14px;border:3px solid var(--ln);background:#0E1430;color:#CFE0FF}
.lvrow button.on{background:#FFE07A;color:#2A1B00;border-color:#FFE07A}
.gg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1200px;margin:0 auto}
.gc{position:relative;text-align:left;border:3px solid var(--ln);border-radius:22px;padding:18px 20px;background:linear-gradient(135deg,#1B2560,#0E1430);color:#fff;min-height:150px;overflow:hidden}
.gc:active{transform:scale(.98)}
.gc .ic{font-size:60px;float:left;margin:0 16px 0 0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.gc b{display:block;font-size:clamp(26px,3.4vh,34px)}
.gc small{display:block;font-size:clamp(18px,2.3vh,22px);color:#BFD0FF;margin-top:6px;line-height:1.35}
.gc .best{position:absolute;right:14px;top:12px;font-size:18px;color:var(--gold);font-weight:900}
.gc.g1{border-color:#E8B10A;background:linear-gradient(135deg,#5A3A00,#1A1030)}
.gc.g2{border-color:#22D3EE;background:linear-gradient(135deg,#053B4A,#0E1430)}
.gc.g3{border-color:#A78BFA;background:linear-gradient(135deg,#3B1F7A,#0E1430)}
.gc.g4{border-color:#F472B6;background:linear-gradient(135deg,#5B1238,#0E1430)}
.book{max-width:1200px;margin:16px auto 0;border:3px dashed #3B4A90;border-radius:18px;padding:12px 16px}
.book h2{margin:0 0 6px;font-size:24px}
.book .bw{display:flex;flex-wrap:wrap;gap:8px}
.book .bw span{font-family:var(--andika);font-size:24px;background:#0E1430;border:2px solid #2A3570;border-radius:12px;padding:4px 10px}
.book .bw span.no{color:#3B4A90;border-style:dashed}
/* ── 字母 注音 方塊（跟 字卡 一樣 的 顏色）── */
.tl{display:inline-flex;align-items:center;justify-content:center;position:relative;min-width:1.9em;height:1.78em;padding:0 .3em;border-radius:.28em;font-weight:900;color:#fff;font-size:clamp(26px,4.6vh,44px);-webkit-text-stroke:.03em currentColor;white-space:nowrap}
.tl .sup{position:absolute;top:.28em;right:.28em;font-size:.44em;line-height:1;-webkit-text-stroke:0}
.tl.stk{flex-direction:column;line-height:.92}.tl.stk span{font-size:.62em}
.tls{display:inline-flex;gap:6px}
.wd{font-family:var(--andika);font-weight:700;letter-spacing:.02em}
.wd .v{color:#000;background:var(--vowel);border-radius:.14em;padding:0 .06em}
/* ── 共用：題目 進度、提示 ── */
.qbar{display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:900;color:#BFD0FF;margin:0 0 8px;flex-wrap:wrap}
.tmr{height:14px;border-radius:999px;background:#0E1430;border:2px solid var(--ln);overflow:hidden;max-width:900px;margin:0 auto 10px}
.tmr i{display:block;height:100%;background:linear-gradient(90deg,#22C55E,#FACC15,#EF4444);transform-origin:left;transition:transform .25s linear}
.say{font-size:24px;font-weight:900;border-radius:16px;border:3px solid #22D3EE;background:#062A35;color:#9EF0FF;padding:10px 18px}
.say:active{transform:scale(.96)}
.msg{text-align:center;font-size:clamp(24px,3.4vh,34px);font-weight:900;min-height:1.4em;margin:8px 0}
.msg.ok{color:#7CFFB0}.msg.bad{color:#FF9A9A}
.big{font-size:28px;font-weight:900;border-radius:18px;border:none;padding:14px 30px;background:linear-gradient(180deg,#FFE07A,#E8A800);color:#2A1B00;box-shadow:0 6px 0 #8a6200}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6200}
.big[disabled]{opacity:.35}
.shake{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pp{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
/* ── 🎰 拉霸機 ── */
.slotw{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px auto 0}
.mach{position:relative;padding:22px 26px 18px;border-radius:30px;background:linear-gradient(180deg,#C2185B,#7B1040);border:6px solid #FFD54A;box-shadow:0 0 0 6px #6b1230,0 18px 50px rgba(0,0,0,.7),inset 0 0 30px rgba(0,0,0,.4)}
.mach .lights{position:absolute;inset:6px;border-radius:24px;pointer-events:none;background:radial-gradient(circle,#FFF59D 0 3px,transparent 4px) 0 0/26px 26px;opacity:.5;animation:lt 1s steps(2) infinite}
@keyframes lt{50%{background-position:13px 0;opacity:.9}}
.mach .mt{text-align:center;font-family:var(--andika);font-size:30px;font-weight:700;color:#FFE07A;letter-spacing:.2em;margin:-6px 0 10px;text-shadow:0 0 12px #FFB300}
.reels{display:flex;gap:12px}
.reel{width:clamp(120px,15vh,170px);height:clamp(150px,20vh,215px);border-radius:16px;background:linear-gradient(180deg,#ddd,#fff 20%,#fff 80%,#ccc);border:4px solid #3a0a1f;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:inset 0 10px 20px rgba(0,0,0,.35),inset 0 -10px 20px rgba(0,0,0,.35)}
.reel b{font-family:var(--andika);font-size:clamp(84px,12vh,130px);color:#14183A;line-height:1}
.reel.v b{color:#B4233A}
.reel.spin b{animation:rs .09s linear infinite;filter:blur(2px)}@keyframes rs{0%{transform:translateY(-55%)}100%{transform:translateY(55%)}}
.reel.stop{animation:rb .35s cubic-bezier(.2,1.8,.4,1)}@keyframes rb{0%{transform:translateY(-14px)}100%{transform:none}}
.reel.lit{box-shadow:0 0 0 5px #FFE07A,0 0 30px #FFE07A,inset 0 10px 20px rgba(0,0,0,.2)}
.reel.okc{box-shadow:0 0 0 5px #22C55E,0 0 30px #22C55E}
.zrow{display:flex;gap:12px;margin-top:12px}
.zrow>div{width:clamp(120px,15vh,170px);display:flex;justify-content:center;min-height:1.9em}
.lever{position:relative;width:70px;height:300px;cursor:pointer}
.lever .rod{position:absolute;left:28px;top:40px;width:14px;height:200px;border-radius:7px;background:linear-gradient(90deg,#999,#eee,#999);transform-origin:50% 100%;transition:transform .35s}
.lever .knob{position:absolute;left:5px;top:0;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A8A,#C62828);box-shadow:0 6px 14px rgba(0,0,0,.6);transition:transform .35s}
.lever .base{position:absolute;left:10px;bottom:20px;width:50px;height:50px;border-radius:12px;background:#555;border:3px solid #222}
.lever.pull .rod{transform:scaleY(-.4)}.lever.pull .knob{transform:translateY(220px)}
.spinb{margin:14px auto 0;display:block}
.choose{display:flex;justify-content:center;gap:16px;margin:10px 0 0;flex-wrap:wrap}
.choose .ch{display:flex;flex-direction:column;align-items:center;gap:8px;border:4px solid #2A3570;border-radius:20px;padding:12px 18px;background:#0E1430;min-width:170px}
.choose .ch .sp{font-size:44px;background:none;border:none;color:#9EF0FF}
.choose .ch.playing{border-color:#22D3EE;box-shadow:0 0 22px #22D3EE}
.choose .ch .pk{font-size:22px;font-weight:900;border-radius:14px;border:3px solid #FFE07A;background:#2A2410;color:#FFE07A;padding:8px 16px}
.choose .ch.good{border-color:#22C55E;box-shadow:0 0 26px #22C55E}.choose .ch.wrong{border-color:#EF4444}
.cd{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;border:5px solid #FFE07A;font-size:34px;font-weight:900;color:#FFE07A;margin-left:10px}
.jack{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,213,74,.35),rgba(5,7,15,.9) 70%);pointer-events:none}
.jack .jt{font-family:var(--andika);font-size:clamp(60px,10vh,120px);font-weight:700;color:#FFE07A;text-shadow:0 0 30px #FFB300,0 6px 0 #8a5a00;animation:pp .6s cubic-bezier(.2,1.6,.4,1)}
.jack .je{font-size:clamp(90px,16vh,170px);animation:pp .7s .15s both cubic-bezier(.2,1.6,.4,1)}
.jack .jw{font-size:clamp(50px,8vh,90px)}
.jack .jz{font-size:clamp(30px,4.6vh,48px);font-weight:900}
.coin{position:fixed;top:-60px;font-size:44px;z-index:41;pointer-events:none;animation:cf linear forwards}@keyframes cf{to{transform:translateY(115vh) rotate(720deg)}}
.alien{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(34,197,94,.25),rgba(5,7,15,.85) 70%)}
.alien .ae{font-size:clamp(100px,18vh,180px);animation:ufo 1.6s ease-in-out}@keyframes ufo{0%{transform:translateX(-60vw) rotate(-20deg)}60%{transform:translateX(4vw) rotate(8deg)}100%{transform:none}}
.alien .at{font-size:clamp(34px,5vh,54px);font-weight:900;color:#7CFFB0}
/* ── 👂 打飛碟 ── */
.sky{position:relative;height:min(58vh,520px);max-width:1200px;margin:0 auto;border-radius:22px;border:3px solid #22D3EE;background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 60%,#9EF0FF 0 1px,transparent 2px) 0 0/130px 130px,linear-gradient(180deg,#020617,#0B2A4A);overflow:hidden}
.ufo{position:absolute;display:flex;flex-direction:column;align-items:center;border:none;background:none;color:#fff;padding:0;animation:fl 3.4s ease-in-out infinite alternate}
.ufo .u{font-size:clamp(60px,9vh,96px);line-height:1;filter:drop-shadow(0 0 14px #22D3EE)}
.ufo .w{font-family:var(--andika);font-weight:700;font-size:clamp(40px,6.4vh,64px);background:rgba(2,6,23,.75);border:3px solid #22D3EE;border-radius:16px;padding:2px 16px;margin-top:-6px}
@keyframes fl{0%{transform:translate(0,0)}100%{transform:translate(18px,-22px)}}
.ufo.boom .u{animation:bm .6s forwards}@keyframes bm{50%{transform:scale(1.8);filter:drop-shadow(0 0 40px #FFE07A) brightness(2)}100%{transform:scale(0);opacity:0}}
.ufo.good .w{border-color:#22C55E;box-shadow:0 0 26px #22C55E}
.ufo.wrong .w{border-color:#EF4444;color:#FF9A9A}
.laser{position:absolute;left:50%;bottom:0;width:8px;background:linear-gradient(0deg,#FF3D00,#FFE07A);transform-origin:50% 100%;border-radius:4px;box-shadow:0 0 18px #FF8A00;z-index:3;pointer-events:none}
.ship{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:60px;z-index:4}
/* ── 🔐 保險箱 ── */
.vault{max-width:980px;margin:0 auto;border-radius:30px;border:8px solid #7C83A8;background:radial-gradient(circle at 50% 40%,#3A4170,#141936);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.6);position:relative;overflow:hidden}
.dials{display:flex;justify-content:center;gap:clamp(12px,2vw,28px)}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial button.ar{width:clamp(90px,12vh,130px);height:62px;font-size:34px;border-radius:16px;border:3px solid #A78BFA;background:#241A4A;color:#E9DDFF}
.dial .face{width:clamp(110px,15vh,160px);height:clamp(130px,18vh,190px);border-radius:20px;background:linear-gradient(180deg,#0B0F24,#1C2350);border:5px solid #A78BFA;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 22px rgba(0,0,0,.8)}
.dial .face b{font-family:var(--andika);font-size:clamp(78px,11vh,120px);line-height:1;color:#fff}
.dial.v .face b{color:#FF9AA8}
.dial.okd .face{border-color:#22C55E;box-shadow:0 0 26px #22C55E}.dial.badd .face{border-color:#EF4444}
.dial .face.flip b{animation:fp .22s}@keyframes fp{0%{transform:translateY(-40%);opacity:0}100%{transform:none;opacity:1}}
.vrow{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.door{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#8E95BC 0 14px,#7C83A8 14px 28px);transform-origin:left;transition:transform 1s cubic-bezier(.5,0,.3,1);display:flex;align-items:center;justify-content:center;font-size:120px;z-index:5;pointer-events:none;transform:perspective(900px) rotateY(-100deg);opacity:0}
.door.open{opacity:1;animation:dr 1.6s forwards}@keyframes dr{0%{transform:perspective(900px) rotateY(0)}40%{transform:perspective(900px) rotateY(0)}100%{transform:perspective(900px) rotateY(-100deg)}}
.treasure{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;background:radial-gradient(circle,rgba(255,213,74,.5),rgba(20,25,54,.95) 70%)}
.treasure .te{font-size:clamp(90px,14vh,150px)}.treasure .tw{font-family:var(--andika);font-size:clamp(56px,8vh,90px);font-weight:700}.treasure .tz{font-size:34px;font-weight:900;color:#FFE07A}
/* ── 🀄 看字 選 注音 ── */
.word0{text-align:center;font-size:clamp(100px,16vh,170px);line-height:1.05;margin:4px 0 10px}
.opts{display:flex;flex-direction:column;align-items:center;gap:14px}
.opt{border:4px solid #F472B6;border-radius:22px;background:#2A0E22;padding:12px 26px;animation:fi .5s both cubic-bezier(.2,1.4,.4,1)}
.opt:nth-child(2){animation-delay:.12s}.opt:nth-child(3){animation-delay:.24s}
@keyframes fi{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.opt.good{border-color:#22C55E;box-shadow:0 0 30px #22C55E}.opt.wrong{border-color:#EF4444;opacity:.6}
/* ── 結束 ── */
.end{max-width:1000px;margin:0 auto;text-align:center}
.end h1{font-size:clamp(36px,6vh,60px);margin:6px 0}
.stars{font-size:clamp(60px,10vh,100px);letter-spacing:.1em}
.stars i{font-style:normal;display:inline-block;animation:pp .6s both cubic-bezier(.2,1.6,.4,1)}
.stars i:nth-child(2){animation-delay:.3s}.stars i:nth-child(3){animation-delay:.6s}
.end .sc{font-size:34px;font-weight:900;color:var(--gold)}
.end .nb{font-size:28px;font-weight:900;color:#7CFFB0}
.rv{display:flex;flex-direction:column;gap:10px;margin:14px auto;max-width:900px;text-align:left}
.rv .r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:3px solid #7a2a2a;border-radius:16px;background:#2A0E0E;padding:8px 14px}
.rv .r .wd{font-size:46px}
.rv .r .zh{font-size:24px;font-weight:900}
.rv .r button{font-size:26px;border-radius:12px;border:3px solid #22D3EE;background:#062A35;color:#9EF0FF;padding:6px 14px}
.erow{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0}
@media (max-width:900px){.gg{grid-template-columns:1fr}.lever{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

<main>
 <section id="lobby" class="scr lobby">
  <h1>🎮 CVC 單字 遊戲</h1>
  <p class="sub">子音＋母音＋子音（像 c-a-t）：聽、說、讀、拼，一次 學會！</p>
  <div class="lvrow"><button data-lv="1">🟢 簡單：a i o</button><button data-lv="2">🔥 全部：a e i o u</button></div>
  <div class="gg">
   <button class="gc g1" data-go="slot"><span class="ic">🎰</span><b>CVC 拉霸機</b><small>拉下 拉桿 ➜ 一格 一格 唸 出 聲音 ➜ 先 自己 唸 ➜ 選 對 的 聲音 ➜ 拼出 真的 單字 中 大獎！</small><span class="best" data-best="slot"></span></button>
   <button class="gc g2" data-go="ufo"><span class="ic">🛸</span><b>聽音 打 飛碟</b><small>🔊 聽 一個 字 ➜ 打下 寫著 那個 字 的 飛碟（愈 快 分數 愈 高）</small><span class="best" data-best="ufo"></span></button>
   <button class="gc g3" data-go="vault"><span class="ic">🔐</span><b>聽音 拼字 保險箱（進階）</b><small>🔊 聽 一個 字 ➜ 轉 三個 密碼 輪 拼 出來 ➜ 打開 寶藏！聽不清楚 按 🐢 一個 音 一個 音 聽</small><span class="best" data-best="vault"></span></button>
   <button class="gc g4" data-go="zhu"><span class="ic">🀄</span><b>看字 選 注音</b><small>看 一個 字 ➜ 三排 雙語 注音 選 對 的 那一排（真的 字＋外星 字）</small><span class="best" data-best="zhu"></span></button>
  </div>
  <div class="book"><h2>📖 我 的 單字 圖鑑 <span id="bkn"></span></h2><div class="bw" id="bk"></div></div>
 </section>
 <section id="game" class="scr" hidden></section>

<script>
"use strict";
/* 2026-11-12 第四十七次 第 2-(4)(5)(6) 點：CVC 四種 遊戲（參考 老師 給 的 wordhero_cvc_game.tsx，改成 網站 一樣 的 寫法）。

    [0,1,2].forEach(k=>{cur[k]=opt[k].indexOf(want[k]);$('#d'+k+' .face b').textContent=want[k];$('#d'+k).classList.remove('badd');$('#d'+k).classList.add('okd')});
    for(const x of ['i','v','e']){await say(sCode[x](p));await wait(200)}await say(codeOf(w));await wait(1200);nextQ(g)}}
/* 🀄 ═══════ 看字 選 注音：看 字 ➜ 三排 注音 選 一排（錯 的 只 差 一格）═══════ */
function zhuQ(){const g=G,w=Math.random()<.5?R(realOf()):rndWord();g.w=w;const T=tiles(w);
  const opts=[T];const sw=(k,tl)=>{const c=T.map(x=>Object.assign({},x));c[k]=tl;return c};
  const vi=T.findIndex(x=>x.v),VO=['a','e','i','o','u'].filter(v=>v!==parts(w).v);
  SH(VO).slice(0,2).forEach(v=>{const e=PH.VOW[v];opts.push(sw(vi,{t:e.zh,sup:e.sup,bg:e.bg,v:1}))});
  if(Math.random()<.5){const CZ={'ㄅ':'ㄆ','ㄆ':'ㄅ','ㄉ':'ㄊ','ㄊ':'ㄉ','ㄍ':'ㄎ','ㄎ':'ㄍ','ㄇ':'ㄋ','ㄋ':'ㄇ','ㄙ':'z','z':'ㄙ','ㄈ':'ㄏ','ㄏ':'ㄈ','ㄌ':'ㄖ','ㄓ':'ㄗ','ㄨ':'ㄖ'};const z=T[0].t,alt=typeof z==='string'&&CZ[z];if(alt)opts[2]=sw(0,Object.assign({},T[0],{t:alt}))}
  const o=SH(opts.map((x,k)=>({T:x,ok:k===0})));
  const s=$('#game');s.innerHTML=qbar(g)+'<div id="tm"></div><div class="word0">'+wordHTML(w)+'</div><div class="opts" id="ops">'+o.map((x,k)=>'<button class="opt" data-k="'+k+'">'+tileHTML(x.T)+'</button>').join('')+'</div><div class="msg" id="msg"></div>';
  let done=false;const t=timer(15,()=>{if(!done)pick(null)});g.t=t;$('#tm').appendChild(t.el);
  $('#ops').onclick=e=>{const b=e.target.closest('.opt');if(b&&!done)pick(b)};
  async function pick(b){done=true;t.stop();const m=$('#msg'),gi=o.findIndex(x=>x.ok),gb=$('#ops').children[gi];gb.classList.add('good');
    if(b&&o[+b.dataset.k].ok){g.ok++;fire(true);const sp=Math.round(t.left()*10);coins(10+sp+Math.min(g.fire,5)*2);m.className='msg ok';m.textContent='✅ 答對 了！'+(REAL[w]?REAL[w].em+' '+REAL[w].zh:'👽 外星 字');if(REAL[w])book(w)}
    else{fire(false);if(b)b.classList.add('wrong','shake');g.wrong.push(w);m.className='msg bad';m.textContent=(b?'看 綠色 那一排：母音 '+parts(w).v+' 唸 '+PH.VOW[parts(w).v].zh+(PH.VOW[parts(w).v].sup||''):'⏰ 時間 到，看 綠色 那一排')}
    await say(codeOf(w));if(!(b&&o[+b.dataset.k].ok)){await wait(250);await say(codeOf(w))}await wait(1000);nextQ(g)}}
/* ── 結束：星星、金幣、最佳、答錯 的 字（點 🔊 再 聽）── */
function end(g){if(g.t)g.t.stop();const r=g.ok/N,st=r>=.9?3:r>=.7?2:r>=.4?1:0,best=LS.g('best_'+g.k,0),nb=g.coin>best;if(nb)LS.s('best_'+g.k,g.coin);LS.s('coin',LS.g('coin',0)+g.coin);
  const s=$('#game');s.innerHTML='<div class="end"><h1>'+NAME[g.k]+' 完成！</h1><div class="stars">'+[0,1,2].map(k=>'<i>'+(k<st?'⭐':'☆')+'</i>').join('')+'</div>'+
   '<div class="sc">✅ 答對 '+g.ok+' ／ '+N+' 題　🪙 '+g.coin+'</div>'+(nb?'<div class="nb">🏆 新 紀錄！</div>':'<div class="nb" style="color:#BFD0FF">最佳 紀錄 🪙 '+best+'</div>')+
   (g.wrong.length?'<h2>📒 再 聽 一次 這 幾個 字</h2><div class="rv">'+[...new Set(g.wrong)].map(w=>'<div class="r">'+wordHTML(w)+tileHTML(tiles(w))+'<span class="zh">'+(REAL[w]?REAL[w].em+' '+REAL[w].zh:'👽 外星 字')+'</span><button data-rw="'+w+'">🔊</button></div>').join('')+'</div>':'<h2>💯 全部 答對！太 厲害 了！</h2>')+
   '<div class="erow"><button class="big" data-go="'+g.k+'">🔁 再 玩 一次</button><button class="big" id="back" style="background:linear-gradient(180deg,#9EF0FF,#22A6C8);box-shadow:0 6px 0 #0e5566">🎮 換 遊戲</button></div></div>';
  s.onclick=e=>{const rw=e.target.closest('[data-rw]');if(rw)say(codeOf(rw.dataset.rw));if(e.target.closest('#back'))lobby()};if(st===3)rain(30)}
lobby();
</script>
