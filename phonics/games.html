<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自然發音 遊戲場</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<!-- phonics/games.html 是 node phonics/_build.js 從 _games.html 做 出來 的；要 改 改 _games.html／_ph.js／_ph2.js／_words.js／_book.js -->
<style>
:root{--vowel:#F4A69E;--cons:#90C2E7;--red:#EF4444;--amber:#F59E0B;--yellow:#FACC15;--gold:#FFD54A;--gold2:#FFB300;--ok:#2EE59D;--bad:#FF5C7A;--cy:#3BE8FF;--mg:#FF4FA3;--vi:#9B7BFF;
  --bg0:#050816;--bg1:#0B1236;--pn:linear-gradient(160deg,rgba(46,60,130,.62),rgba(12,16,42,.92));--ln:rgba(160,180,255,.22);
  --andika:'Andika','Century Gothic','Trebuchet MS',sans-serif;--han:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 15% -10%,#2B1B6B 0,transparent 60%),radial-gradient(1000px 700px at 100% 0%,#0E3B6B 0,transparent 55%),linear-gradient(180deg,#0A0F2E,#04060F);
  color:#fff;font-family:var(--han);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.5px) 0 0/140px 140px,radial-gradient(circle,rgba(160,220,255,.4) 0 1px,transparent 1.5px) 70px 40px/190px 190px;opacity:.35}
button{font-family:var(--han);cursor:pointer;color:inherit}
.en{font-family:var(--andika)}
/* ── 上面 一條 ── */
#top{position:fixed;left:0;right:0;top:0;height:66px;display:flex;align-items:center;gap:10px;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(6,10,30,.96),rgba(6,10,30,.82));border-bottom:1px solid var(--ln);box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:20}
#top a,#top .tb{font-size:19px;font-weight:900;color:#FFE9A8;background:linear-gradient(180deg,#3A2E0B,#1E1806);border:1px solid #8a7420;border-radius:12px;padding:7px 13px;text-decoration:none;white-space:nowrap}
#top .ttl{flex:1;text-align:center;font-size:clamp(20px,2.6vw,28px);font-weight:900;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#FFE9A8,#FFFFFF,#9EEBFF);-webkit-background-clip:text;background-clip:text;color:transparent}
#mdSw{display:flex;gap:3px;background:rgba(0,0,0,.35);border:1px solid var(--ln);border-radius:12px;padding:3px}
#mdSw button{font-size:16px;font-weight:900;border:0;border-radius:9px;padding:6px 10px;background:transparent;color:#B8C6FF}
#mdSw button.on{background:linear-gradient(180deg,#FFFFFF,#D9E2FF);color:#0B1236}
main{position:absolute;left:0;right:0;top:66px;bottom:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.scr[hidden]{display:none!important}
.pnl{background:var(--pn);border:1px solid var(--ln);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
/* ── 大廳 ── */
.lobby{max-width:1240px;margin:0 auto}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 14px}
.hero h1{margin:0;font-size:clamp(32px,4.4vw,52px);font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#FFE9A8,#FFD54A 40%,#FF9F43);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,180,0,.25))}
.hero p{margin:4px 0 0;font-size:clamp(18px,2vw,22px);color:#C9D4FF}
.lv{display:flex;gap:8px}
.lv button{font-size:20px;font-weight:900;padding:10px 16px;border-radius:14px;border:1px solid var(--ln);background:rgba(10,14,40,.7);color:#CFE0FF}
.lv button.on{background:linear-gradient(180deg,#FFE9A8,#FFC21A);color:#2A1B00;border-color:#FFE07A;box-shadow:0 0 18px rgba(255,200,40,.35)}
.sec{margin:20px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2{margin:0;font-size:clamp(24px,2.8vw,32px);font-weight:900}
.sec span{font-size:18px;color:#AEBBEA}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gc{position:relative;text-align:left;border-radius:20px;padding:16px 16px 14px;color:#fff;min-height:132px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s}
.gc::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.gc:active{transform:scale(.97)}
.gc .ic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px;float:left;margin:0 12px 6px 0;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.gc b{display:block;font-size:clamp(22px,2.2vw,26px);line-height:1.2}
.gc small{display:block;font-size:17px;color:rgba(255,255,255,.86);margin-top:4px;line-height:1.35}
.gc .best{position:absolute;right:12px;bottom:10px;font-size:16px;color:var(--gold);font-weight:900}
.gc .tg{display:inline-block;font-size:14px;font-weight:900;border-radius:999px;padding:2px 9px;margin-top:6px;background:rgba(0,0,0,.3);color:#FFE9A8}
/* 圖鑑 */
.book{padding:14px 16px}
.book .bw{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.book .bc{border-radius:14px;padding:8px 6px;text-align:center;background:linear-gradient(160deg,#1B2A66,#0D1333);border:1px solid rgba(255,255,255,.14)}
.book .bc .e{font-size:38px;line-height:1.1}.book .bc .w{font-family:var(--andika);font-size:24px;font-weight:700}.book .bc .z{font-size:15px;color:#C9D4FF}
.book .bc.no{background:rgba(255,255,255,.03);border-style:dashed;color:#55618F}.book .bc.no .e{filter:grayscale(1) brightness(.25)}
.book .bar{height:12px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:8px}.book .bar i{display:block;height:100%;background:linear-gradient(90deg,#2EE59D,#FFD54A)}
/* ── 方塊（跟 字卡 一樣 的 顏色）── */
.tl{display:inline-flex;align-items:center;justify-content:center;position:relative;min-width:1.7em;height:1.6em;padding:0 .26em;border-radius:.26em;font-weight:900;color:#fff;font-size:clamp(22px,3.6vh,36px);-webkit-text-stroke:.03em currentColor;white-space:nowrap}
.tl.ph{font-family:var(--andika);-webkit-text-stroke:0}.tl.dk{color:#111}
.tl .sup{position:absolute;top:.24em;right:.24em;font-size:.44em;line-height:1;-webkit-text-stroke:0}
.tl.stk{flex-direction:column;line-height:.92}.tl.stk span{font-size:.62em}
.tls{display:inline-flex;gap:5px;flex-wrap:nowrap}
.wd{font-family:var(--andika);font-weight:700;letter-spacing:.02em}
.wd .v{color:#000;background:var(--vowel);border-radius:.14em;padding:0 .06em}
/* ── 遊戲 共用 ── */
.hud{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 auto 10px;max-width:1100px}
.gems{display:flex;gap:8px}
.gems i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
.gems i.now{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}.gems i.ok{background:var(--ok);border-color:var(--ok)}.gems i.no{background:var(--bad);border-color:var(--bad)}.gems i.boss{border-style:dashed;border-color:#FF9F43}
.chip{font-size:20px;font-weight:900;border-radius:14px;padding:6px 12px;background:rgba(0,0,0,.35);border:1px solid var(--ln);white-space:nowrap}
.chip.sc b{color:var(--gold);font-family:var(--andika);font-size:24px}
.chip.fv{color:#FFB25B}.chip.fv.on{background:linear-gradient(90deg,#FF5E00,#FFB300);color:#fff;border-color:#FFD54A;box-shadow:0 0 20px rgba(255,140,0,.6)}
.tmr{position:relative;height:16px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--ln);overflow:hidden;max-width:1000px;margin:0 auto 12px}
.tmr i{display:block;height:100%;background:linear-gradient(90deg,#2EE59D,#FFD54A 60%,#FF5C7A);transform-origin:left;transition:transform .2s linear}
.tmr b{position:absolute;right:10px;top:-3px;font-size:15px;font-family:var(--andika)}
.tmr.low i{animation:tlow .5s ease-in-out infinite alternate}@keyframes tlow{to{filter:brightness(1.6)}}
.ask{text-align:center;font-size:clamp(22px,2.8vw,30px);font-weight:900;margin:2px 0 10px;color:#EAF0FF}
.ask .k{color:var(--gold)}
.say{font-size:22px;font-weight:900;border-radius:16px;border:1px solid #2BC6E6;background:linear-gradient(180deg,#0E4A5C,#062A35);color:#B8F4FF;padding:10px 16px;box-shadow:0 6px 0 #03161C}
.say:active{transform:translateY(3px);box-shadow:0 3px 0 #03161C}
.big{font-size:26px;font-weight:900;border-radius:18px;border:none;padding:14px 28px;background:linear-gradient(180deg,#FFE9A8,#FFC21A 55%,#E89B00);color:#2A1B00;box-shadow:0 7px 0 #8a5a00,0 12px 30px rgba(255,170,0,.3)}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 #8a5a00}
.big[disabled]{opacity:.35}
.big.cy{background:linear-gradient(180deg,#C8F7FF,#3BE8FF 55%,#11A6C8);box-shadow:0 7px 0 #0A5566;color:#00242C}
.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.shake{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes pp{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.hl{transform:scale(1.12);filter:brightness(1.25);box-shadow:0 0 0 4px #FFE07A,0 0 30px rgba(255,224,122,.85)!important;transition:transform .2s,filter .2s,box-shadow .2s}
/* 開場 */
.intro{max-width:880px;margin:20px auto;text-align:center;padding:26px}
.intro .ie{font-size:90px;line-height:1}
.intro h2{font-size:clamp(32px,4vw,46px);margin:8px 0}
.intro .how{font-size:clamp(20px,2.4vw,26px);line-height:1.6;color:#DCE4FF}
.intro .rules{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.intro .rules span{font-size:19px;font-weight:900;border-radius:14px;padding:8px 12px;background:rgba(0,0,0,.35);border:1px solid var(--ln)}
.cnt{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(3,5,15,.55)}
.cnt b{font-family:var(--andika);font-size:min(34vh,260px);color:#FFE9A8;text-shadow:0 0 50px #FFB300;animation:cz .8s ease-out both}@keyframes cz{0%{transform:scale(2.4);opacity:0}30%{opacity:1}100%{transform:scale(.8);opacity:0}}
/* 加分 */
.gain{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:55;text-align:center;pointer-events:none;animation:gn 1.5s ease-out both}
.gain .n{font-family:var(--andika);font-size:clamp(70px,13vh,120px);font-weight:700;color:#FFE07A;text-shadow:0 0 30px #FFB300,0 6px 0 #8a5a00}
.gain .f{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:22px;font-weight:900}
.gain .f span{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 10px}
@keyframes gn{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
body.fever main{box-shadow:inset 0 0 60px rgba(255,120,0,.45)}
/* 答對／答錯 頁 */
.fb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,4,14,.82)}
.fb .box{max-width:900px;width:100%;text-align:center;padding:22px 20px;border-radius:26px;border:2px solid var(--ok);background:linear-gradient(160deg,#0E3B2C,#071B16);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.fb.no .box{border-color:var(--bad);background:linear-gradient(160deg,#0E3B2C,#06170F)}
.fb h3{margin:0 0 6px;font-size:clamp(28px,4vh,40px)}
.fb .yw{font-size:24px;color:#FFB0BE;margin:4px 0}.fb .yw s{font-family:var(--andika);font-size:34px}
.fb .cw{font-family:var(--andika);font-size:clamp(70px,13vh,120px);font-weight:700;line-height:1.05}
.fb .em{font-size:clamp(56px,9vh,90px)}
.fb .zh{font-size:28px;font-weight:900;color:#FFE9A8}
.fb .tip{font-size:22px;color:#DCF7E8;margin-top:8px;line-height:1.5}
.fb .tip b{color:#FFE07A}
/* 字母＋方塊 對齊 */
.lt{display:inline-flex;gap:10px;align-items:flex-start;justify-content:center}
.lt .u{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:14px;padding:2px 6px;cursor:pointer}
.lt .u .L{font-family:var(--andika);font-weight:700;line-height:1}
/* 結果 */
.end{max-width:1000px;margin:0 auto;text-align:center}
.end .rk{font-family:var(--andika);font-size:clamp(110px,20vh,180px);font-weight:700;line-height:1;background:linear-gradient(180deg,#FFF6CC,#FFC21A 60%,#C77800);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,190,0,.5));animation:pp .8s cubic-bezier(.2,1.6,.4,1) both}
.end .stars{font-size:clamp(50px,8vh,80px);letter-spacing:.12em}
.end .stars i{font-style:normal;display:inline-block;animation:pp .6s both cubic-bezier(.2,1.6,.4,1)}.end .stars i:nth-child(2){animation-delay:.25s}.end .stars i:nth-child(3){animation-delay:.5s}
.end .sc{font-size:32px;font-weight:900}.end .sc b{color:var(--gold);font-family:var(--andika);font-size:44px}
.end .nb{font-size:26px;font-weight:900;color:var(--ok)}
.rv{display:flex;flex-direction:column;gap:10px;margin:14px auto;max-width:920px;text-align:left}
.rv .r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid rgba(255,92,122,.5);border-radius:16px;background:linear-gradient(160deg,#2A0E18,#14070C);padding:10px 14px}
.rv .r.on{border-color:#FFE07A;box-shadow:0 0 20px rgba(255,224,122,.4)}
.rv .r .wd{font-size:46px}.rv .r .zh{font-size:24px;font-weight:900}
.rv .r button{font-size:24px;border-radius:12px;border:1px solid #2BC6E6;background:#062A35;color:#9EF0FF;padding:6px 14px}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;animation:cf linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
/* 控制（暫停、放慢、再一次）*/
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ctl button{font-size:21px;font-weight:900;border-radius:14px;border:1px solid var(--ln);background:rgba(0,0,0,.4);padding:10px 16px;min-height:52px}
.ctl button.on{background:#FFE07A;color:#2A1B00}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
/* phonics/_games.css — 🎮 遊戲 的 樣子（node phonics/_build.js 放進 games.html）。2026-11-12 第四十八次：老師「粗糙、幼稚、廉價」➜ 全部 重做：深色 舞台＋金屬 邊框＋柔和 光（不 閃）*/
.word0{text-align:center;font-size:clamp(90px,15vh,150px);line-height:1.05;margin:4px 0 12px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.word0.sm{font-size:clamp(70px,11vh,110px)}
.gap{display:inline-block;min-width:.7em;border-bottom:.08em solid #FFE07A;color:#FFE07A;text-align:center}
.gap.okv,.gap.okd{color:#2EE59D;border-color:#2EE59D}.gap.nov{color:#FF5C7A;border-color:#FF5C7A}
.cd{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;border:4px solid #FFE07A;font-size:32px;font-weight:900;color:#FFE07A;margin-left:10px;font-family:var(--andika)}
/* ── 🎰 拉霸機：金屬 機台 ── */
.slot{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 auto;flex-wrap:wrap}
.side{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:270px}.side .ask{font-size:22px;margin:0;text-align:left}
.side .choose{flex-direction:column;margin:0}.side .choose .ch{flex-direction:row;justify-content:space-between;min-width:0;padding:8px 12px}
.cab{position:relative;padding:16px 20px 14px;border-radius:30px;background:linear-gradient(180deg,#F3F5FA,#9AA3B5 18%,#EEF1F7 42%,#7D8699 78%,#C9CFDB);box-shadow:0 24px 60px rgba(0,0,0,.65),inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.25)}
.cab::before{content:'';position:absolute;inset:10px;border-radius:22px;background:linear-gradient(180deg,#5C0A26,#2A0412);box-shadow:inset 0 0 0 2px rgba(255,213,74,.55),inset 0 10px 30px rgba(0,0,0,.6)}
.marq{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--andika);font-size:30px;font-weight:700;letter-spacing:.24em;color:#FFE9A8;text-shadow:0 0 14px #FFB300;margin:4px 0 10px}
.marq i{display:block;width:60px;height:8px;border-radius:4px;background:radial-gradient(circle,#FFF2B0 0 3px,transparent 3.5px) 0 0/12px 8px;filter:drop-shadow(0 0 6px #FFB300)}
.win{position:relative;display:flex;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#1A0610,#0A0206);box-shadow:inset 0 0 0 3px #B88A1C,inset 0 0 0 5px #3A0A1A}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.reel{position:relative;width:clamp(118px,15vh,160px);height:clamp(140px,19vh,200px);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(180deg,#9AA0AA 0,#F6F7FA 16%,#FFFFFF 50%,#F6F7FA 84%,#9AA0AA 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.reel::after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(200,30,60,.25)}
.reel b{font-family:var(--andika);font-size:clamp(84px,12vh,124px);color:#101633;line-height:1}
.reel.v b{color:#000;background:var(--vowel);border-radius:.12em;padding:0 .08em}
.reel.spin b{animation:rs .08s linear infinite;filter:blur(2.5px)}@keyframes rs{0%{transform:translateY(-55%)}100%{transform:translateY(55%)}}
.reel.stop{animation:rb .35s cubic-bezier(.2,1.8,.4,1)}@keyframes rb{0%{transform:translateY(-12px)}100%{transform:none}}
.zt{min-height:1.7em;display:flex;justify-content:center}
.plate{position:relative;text-align:center;margin-top:10px;font-size:18px;font-weight:900;color:#FFE9A8;letter-spacing:.06em}
.lever{position:relative;width:64px;height:280px;border:0;background:none;padding:0}
.lever .rod{position:absolute;left:25px;top:40px;width:14px;height:190px;border-radius:7px;background:linear-gradient(90deg,#8a8f9c,#f4f6fb,#8a8f9c);transform-origin:50% 100%;transition:transform .35s}
.lever .knob{position:absolute;left:4px;top:0;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB3B3,#E53935 45%,#7A0F12);box-shadow:0 8px 18px rgba(0,0,0,.6);transition:transform .35s}
.lever::after{content:'';position:absolute;left:10px;bottom:16px;width:44px;height:48px;border-radius:12px;background:linear-gradient(180deg,#C9CFDB,#6B7385);box-shadow:inset 0 2px 0 #fff}

/* score/_honor.css — 榮譽動畫（2026-10-12 D 第 4 件）：學生平板做完的榮譽動畫、老師投影的榮譽榜共用。12 種風格 .hs1～.hs12 */
.hon{position:relative;width:100%;height:var(--hh,clamp(420px,66vh,800px));border-radius:22px;overflow:hidden;background:#000;color:#fff;text-align:center;isolation:isolate;
  display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:clamp(6px,1.4vh,16px);padding:2vh 2vw;box-sizing:border-box}
