*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Andika,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#000;color:#F2F2F2;line-height:1.6;touch-action:pan-y}
#wrap{max-width:640px;margin:0 auto;padding:0 20px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid #262626;padding:12px 16px}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.05em}
#bar{height:3px;background:#262626;margin-top:10px}
#bar i{display:block;height:100%;background:#9FB4C8;transform-origin:left center;transform:scaleX(0)}
#dots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
#dots button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3C;background:#0D0D0D;color:#B5B5B5;font-size:13px;font-weight:700;font-family:inherit}
#dots button.on{background:#2E3D4F;border-color:#7E93A8;color:#fff}
#card{background:#0D0D0D;border:1px solid #262626;border-radius:22px;padding:20px 18px;margin-top:12px}
#st{font-size:13px;color:#9FB4C8;letter-spacing:.2em;font-weight:700}
#hero{font-size:84px;line-height:1.15;text-align:center;margin:6px 0 2px}
#word{text-align:center;font-size:54px;font-weight:700;margin:0;letter-spacing:.01em}
#zh{text-align:center;color:#B5B5B5;font-size:17px;margin:2px 0 0}
.box{border:1px solid #262626;border-radius:16px;padding:14px;margin:14px 0}
.box h3{font-size:12px;color:#9FB4C8;letter-spacing:.25em;margin:0 0 8px;font-weight:700}
.today .en{font-size:22px;font-weight:700}
.today .tw{color:#B5B5B5;font-size:16px;margin-top:2px}
#speak{background:#1E1E1E;border:1px solid #4A4A4A;color:#F2F2F2;border-radius:10px;font-size:15px;padding:8px 14px;margin-top:8px;min-height:44px}
#evoStage{font-size:40px;text-align:center;min-height:56px;letter-spacing:.02em;margin:2px 0 8px}
#evoStage .chg{color:#9FB4C8;display:inline-block;animation:chgpop .5s ease-out}
@keyframes chgpop{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
#evoReplay{background:#1E1E1E;border:1px solid #4A4A4A;color:#9FB4C8;border-radius:10px;font-size:15px;padding:8px 16px;min-height:44px}
#oldnote{color:#D8D3C5;font-size:16px;margin-top:8px}
.hookline{font-size:16px;color:#D8D3C5}
.qbtn{width:100%;background:none;border:0;color:#F2F2F2;font-size:16px;text-align:left;min-height:48px;padding:0}
.qbtn .q{font-weight:700}
.qbtn .t{font-size:12px;color:#9FB4C8;letter-spacing:.25em;display:block;margin-bottom:6px}
.ans{display:none;margin-top:8px;color:#7FC79A;font-size:16px}
.ans.show{display:block}
.src{color:#555;font-size:11px;margin-top:14px;letter-spacing:.02em}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.96);border-top:1px solid #262626;padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;gap:10px;align-items:center;z-index:30}
nav button{flex:1;font-size:19px;font-weight:700;border:0;border-radius:14px;min-height:60px;background:#2E3D4F;color:#fff;font-family:inherit}
nav button:disabled{opacity:.25}
#count{flex:.5;text-align:center;font-size:16px;color:#B5B5B5}
#tabs{display:flex;gap:8px;margin:10px 16px 0}
#tabs button{flex:1;border:1px solid #3A3A3C;background:#0D0D0D;color:#B5B5B5;border-radius:12px;min-height:48px;font-size:17px;font-weight:700;font-family:inherit}
#tabs button.on{background:#2E3D4F;border-color:#7E93A8;color:#fff}
.panel{background:#0D0D0D;border:1px solid #262626;border-radius:18px;padding:16px;margin-top:12px}
.panel h2{margin:0 0 6px;font-size:19px}
.gdesc{color:#777;font-size:13px;margin-bottom:8px}
.bigbtn{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;min-height:52px;font-family:inherit}
#reviewBtn{width:100%;margin-bottom:8px;background:#3A3757;color:#fff}
#gmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#gmenu button{border-radius:14px;border:1px solid #3A3A3C;background:#141414;color:#F2F2F2;min-height:76px;font-size:15px;font-weight:800;padding:8px;font-family:inherit}
#gmenu button .ge{font-size:26px;display:block}
#gmenu button .gb{font-size:12px;color:#777;font-weight:400;display:block}
.ghead{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:900;margin:4px 0 10px;gap:8px}
.gbback{background:none;border:0;color:#9FB4C8;font-size:24px;min-width:44px;min-height:44px;font-weight:900;padding:0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:19px;font-weight:800;border:1px solid #3A3A3C;background:#141414;color:#F2F2F2;border-radius:14px;padding:14px;min-height:60px;font-family:inherit}
.opt:active{transform:scale(.97)}
.opt.ok{background:#14231B;border-color:#4E9A6F;color:#7FC79A}
.opt.no{background:#2A1518;border-color:#A86A6A;color:#D89A9A}
.opt:disabled{opacity:.9}
.starpop{display:inline-block;animation:starpop .45s backwards}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.hole{position:relative;height:118px;border:1px solid #3A3A3C;border-radius:16px;background:#141414;overflow:hidden}
.hole .mole{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:46px;line-height:1;animation:rise .4s backwards}
@keyframes rise{0%{transform:translate(-50%,70px) scale(.3);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.hole .mole.hit{animation:whackit .45s forwards}
@keyframes whackit{0%{transform:translate(-50%,0)}40%{transform:translate(-50%,0) scale(1.5)}100%{transform:translate(-50%,-50px) rotate(540deg) scale(0)}}
.hole.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hole.gold{border-color:#8A7444;background:#221D10}
.hole .mtag{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:15px;font-weight:800;color:#F2F2F2}
.hole.gold .mtag{color:#D8C48F}
.slots{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap;min-height:56px}
.slot{width:42px;height:54px;border:1px solid #4A4A4A;border-radius:10px;font-size:26px;display:flex;align-items:center;justify-content:center;background:#000;color:#F2F2F2}
.slot.fill{border-color:#4E9A6F}
.ltrs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ltrs button{width:50px;height:56px;font-size:24px;font-weight:800;border-radius:12px;border:1px solid #4A6A8A;background:#141C26;color:#F2F2F2;font-family:inherit}
.ltrs button:disabled{opacity:.25}
.ltrs button:active{transform:scale(.93)}
