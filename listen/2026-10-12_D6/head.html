<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>榮譽榜怎麼給</title><style>
@font-face{font-family:Andika;src:url(../../words/fonts/andika-700.woff2) format('woff2');font-weight:700}
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#05070A;color:#fff;font-family:Andika,"PingFang TC","Microsoft JhengHei",sans-serif;padding:0 16px 120px;font-size:26px;line-height:1.55;font-weight:700}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:40px;color:#FFD54A;margin:22px 0 6px}
h2{font-size:34px;color:#FFD54A;margin:46px 0 10px;border-top:4px solid #24303C;padding-top:20px}
.lead{font-size:26px;color:#DDE6EE}
.howto{background:#102016;border:3px solid #3BD16F;border-radius:20px;padding:14px 20px;margin:16px 0}
.q{background:#0B0F14;border:3px solid #24303C;border-radius:20px;padding:16px 20px;margin:18px 0}
.q>.t{font-size:30px;color:#7FD4FF;margin-bottom:8px}
.op{display:block;border:3px solid #2A3540;border-radius:16px;padding:10px 16px;margin:10px 0;background:#0E141A}
.op.rec{border-color:#3BD16F;background:#0D1B12}
.op b.k{display:inline-block;min-width:1.6em;color:#FFD54A;font-size:32px}
.rec .tag{display:inline-block;background:#3BD16F;color:#05210F;border-radius:999px;padding:0 14px;font-size:22px;margin-left:8px;vertical-align:middle}
.why{color:#CFE3F5;font-size:24px;margin-top:6px}
.small{font-size:22px;color:#B9C4CE}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:12px 0}
.cmp .ar{font-size:54px;color:#FFD54A}
.cmp.v{grid-template-columns:1fr}.cmp.v .ar{transform:rotate(90deg);text-align:center;line-height:1}
.cmp .lab{font-size:24px;color:#B9C4CE;margin-bottom:4px}
@media (max-width:760px){.cmp{grid-template-columns:1fr}.cmp .ar{transform:rotate(90deg);text-align:center}}
.shot{width:100%;border:3px solid #3A4650;border-radius:14px;display:block}
table{border-collapse:collapse;width:100%;margin:10px 0}
td,th{border:2px solid #2A3540;padding:8px 12px;text-align:left;vertical-align:middle}
th{background:#14202B;color:#CFE6FF}
.big{font-size:44px}
.mock{background:#000;border:3px solid #3A4650;border-radius:16px;padding:14px;overflow:hidden}
<style>
.opt{background:#0F151C;border:4px solid #2A3540;border-radius:22px;padding:16px 18px;margin:20px 0}
.opt.rec{border-color:#3BD16F;background:#0D1B12}
.opt .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:32px}
.opt .k{color:#FFD54A;font-size:44px}
.three{display:grid;grid-template-columns:200px 1fr 1fr;gap:14px;align-items:stretch;margin-top:12px}
@media (max-width:900px){.three{grid-template-columns:1fr}}
.box{background:#05070A;border:2px solid #2A3540;border-radius:16px;padding:10px;text-align:center}
.box .lab{font-size:22px;color:#B9C4CE}
.bigic{height:150px;display:flex;align-items:center;justify-content:center}
.bigic .eA,.bigic .eB{font-size:120px;line-height:1}
.bigic .MS{height:150px}
.eA{display:inline-block;animation:shine 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #FFD54A)}
@keyframes shine{50%{transform:scale(1.15) rotate(12deg);filter:drop-shadow(0 0 26px #FFE07A)}}
.eB{display:inline-block;transform-origin:50% 0;animation:swing 1.8s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.MS{transform-origin:50% 0;animation:swing 1.8s ease-in-out infinite;vertical-align:middle}
.MS .st{transform-origin:60px 93px;animation:shine2 1.6s ease-in-out infinite}
@keyframes shine2{50%{transform:scale(1.18);filter:drop-shadow(0 0 6px #fff)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:center;font-size:28px;background:#0B1118;border-radius:12px;padding:8px}
.row .eA,.row .eB{font-size:48px;animation:none}.row .MS{height:58px;animation:none}.row .MS .st{animation:none}
.tab{background:radial-gradient(circle at 50% 35%,#2A2000,#000 75%);border-radius:14px;padding:16px 8px}
.tab .t1{font-size:34px;color:#FFE07A;margin-top:6px}.tab .t2{font-size:24px;color:#fff}
.tab .eA,.tab .eB{font-size:96px}.tab .MS{height:130px}
.pro{color:#9FF0B8;font-size:24px}.con{color:#FFB38A;font-size:24px}
.why{font-size:24px}
</style>
