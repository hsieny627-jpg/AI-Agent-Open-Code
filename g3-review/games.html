<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>三年級複習｜遊戲</title>
<script src="../G3%20-%20L1%20%2B%20L2/audio/aud.js" onerror="window.AUD=null"></script><script>window.AUDDIR="../G3%20-%20L1%20%2B%20L2/audio/";</script>

<!-- 本檔由 G3 - L1 + L2/_build.js 產生，不要手改。改內容請改 G3 - L1 + L2/_data.js ／ _quiz_data.js ／ _game_data.js -->
<style>
@font-face{font-family:Andika;font-style:normal;font-weight:400;font-display:swap;
 src:url(../words/fonts/andika-400.woff2) format("woff2")}
@font-face{font-family:Andika;font-style:normal;font-weight:700;font-display:swap;
 src:url(../words/fonts/andika-700.woff2) format("woff2")}

:root{
 --bg:#000; --fg:#F2F2F2; --body:#D8D3C5; --dim:#9E9E9E; --acc:#9FB4C8;
 --btn:#1E1E1E; --line:#4A4A4A;
 --he:#2563EB; --she:#E8467C; --be:#F5B301; --ap:#FF4A4A;
 --ok:#39D98A; --no:#FF5E5E; --gold:#FFD24A;
 --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
 --safeL:env(safe-area-inset-left,0px); --safeR:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);
 font-family:Andika,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
 font-weight:400;overflow:hidden;user-select:none;-webkit-user-select:none;
 touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;
 cursor:pointer;touch-action:manipulation}

/* 底部按鈕列：每一頁都一樣 */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;
 display:flex;flex-wrap:wrap;gap:clamp(5px,.9vh,9px);justify-content:center;align-items:center;
 padding:clamp(6px,1vh,10px) calc(var(--safeR) + 10px) calc(clamp(6px,1vh,10px) + var(--safeB)) calc(var(--safeL) + 10px);
 background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 46%)}
#bar button,#bar a{display:inline-flex;align-items:center;gap:5px;
 background:var(--btn);border:1px solid #333;border-radius:999px;color:var(--body);
 text-decoration:none;font-size:clamp(12.5px,1.85vh,16px);line-height:1;
 padding:clamp(7px,1.15vh,11px) clamp(10px,1.5vw,16px);white-space:nowrap;
 transition:border-color .15s,color .15s,background .15s}
#bar button.on{background:#2C3A48;border-color:var(--acc);color:#fff}
#bar button:active,#bar a:active{transform:scale(.96)}
#bar .grp{display:inline-flex;gap:3px;background:#101010;border:1px solid #2A2A2A;
 border-radius:999px;padding:3px}
#bar .grp button{border:0;background:none;padding:clamp(6px,1vh,9px) clamp(8px,1.2vw,13px);
 font-size:clamp(12px,1.75vh,15px)}
#bar .grp button.on{background:var(--acc);color:#000;font-weight:700}
#bar .grp .glbl{display:inline-flex;align-items:center;padding:0 4px 0 9px;
 font-size:clamp(11px,1.6vh,14px);color:#6E6E6E;letter-spacing:.06em;white-space:nowrap}

/* 左右翻頁：整條邊都可以按，最小 68px（使用者指定） */
.nav{position:fixed;top:0;bottom:0;width:clamp(68px,9vw,104px);z-index:30;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(30px,5vh,46px);color:#3A3A3A;background:transparent;
 transition:color .15s,background .15s}
.nav.l{left:0;padding-left:var(--safeL)}
.nav.r{right:0;padding-right:var(--safeR)}
.nav:active{color:var(--acc);background:rgba(159,180,200,.08)}
.nav[disabled]{color:#1A1A1A;background:none}
.nav b{display:block;font-size:clamp(9.5px,1.35vh,12px);font-weight:400;
 letter-spacing:.1em;color:inherit;margin-top:4px;opacity:.75}
.nav i{font-style:normal;display:block;line-height:1}

/* 進度點 */
#dots{position:fixed;left:50%;transform:translateX(-50%);z-index:35;
 top:calc(var(--safeT) + clamp(8px,1.4vh,14px));
 display:flex;gap:clamp(4px,.7vw,8px);max-width:78vw;flex-wrap:wrap;justify-content:center}
#dots i{width:clamp(6px,.9vh,9px);height:clamp(6px,.9vh,9px);border-radius:50%;
 background:#2C2C2C;display:block}
#dots i.on{background:var(--acc);transform:scale(1.35)}

.ap{color:var(--ap);font-weight:700}

#miss,#missAll,#look{position:fixed;inset:0;z-index:95;background:#000;display:none;flex-direction:column;
 align-items:center;padding:calc(var(--safeT) + clamp(8px,1.6vh,20px)) clamp(14px,3vw,40px)
 calc(var(--safeB) + clamp(8px,1.6vh,20px));overflow-y:auto}
#miss.on,#missAll.on,#look.on{display:flex}
#look{z-index:96}
#miss .mbox,#missAll .mbox,#look .mbox{width:100%;max-width:1060px;margin:auto 0;display:flex;flex-direction:column;
 align-items:center;gap:clamp(6px,1.4vh,16px)}
.mhd{font-size:clamp(30px,6vh,60px);font-weight:700;color:var(--no);text-align:center;line-height:1.1;
 animation:mShake .5s cubic-bezier(.3,.8,.3,1)}
.mhd.ok{color:var(--ok);animation:mPop .6s cubic-bezier(.2,1.5,.4,1)}
.mhd.bn{color:var(--gold);animation:mPop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes mShake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}
 60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes mPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes mIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.mq{font-size:clamp(17px,3vh,30px);color:var(--dim);text-align:center;line-height:1.35;max-width:36ch}
.mq b{color:var(--fg)}
.mcmp{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.6vh,8px);width:100%}
.mcmp .mp,.mcmp .ma{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,18px);
 border-radius:20px;padding:clamp(6px,1.2vh,14px) clamp(14px,2.2vw,30px);max-width:100%;
 opacity:0;animation:mIn .45s cubic-bezier(.2,.9,.3,1.2) forwards;overflow-wrap:anywhere;text-align:center}
.mcmp .mp{background:#1A0808;border:2px solid #5A1F1F;font-size:clamp(22px,4.4vh,44px);color:#FF9C9C;animation-delay:.15s}
.mcmp .ma{background:#06190E;border:3px solid var(--ok);font-size:clamp(32px,7.6vh,76px);font-weight:700;
 color:var(--ok);animation-delay:.55s;box-shadow:0 0 40px rgba(57,217,138,.22)}
.mcmp .mi{flex:0 0 auto;font-size:.8em}
.mcmp .mar{font-size:clamp(20px,3.4vh,34px);color:#4A4A4A;line-height:1;opacity:0;animation:mIn .4s ease .4s forwards}
.mcmp .x{border-radius:8px;padding:0 .12em;background:rgba(255,94,94,.28);color:#fff;
 text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:.1em}
.mcmp .f{border-radius:8px;padding:0 .12em;background:var(--gold);color:#000;
 display:inline-block;animation:mFix 1.1s ease-in-out 1s 2}
@keyframes mFix{0%,100%{transform:none}50%{transform:scale(1.18)}}
.mw{font-size:clamp(19px,3.4vh,34px);color:var(--fg);text-align:center;line-height:1.4;max-width:32ch;
 opacity:0;animation:mIn .45s ease 1s forwards}
.mw b{color:var(--gold)}
/* 加分的秒懂說明：一格一格亮起來 */
.mbn{display:flex;align-items:center;justify-content:center;gap:clamp(4px,.9vw,12px);flex-wrap:wrap;
 background:#141005;border:1px dashed #6B5714;border-radius:999px;padding:clamp(4px,.8vh,9px) clamp(10px,1.6vw,20px);
 opacity:0;animation:mIn .45s ease 1.4s forwards}
.mbn span{font-size:clamp(15px,2.6vh,26px);font-weight:700;color:#BFA75A;white-space:nowrap;
 animation:mStep 4s ease-in-out infinite}
.mbn span:nth-of-type(2){animation-delay:1s}.mbn span:nth-of-type(3){animation-delay:2s}.mbn span:nth-of-type(4){animation-delay:3s}
.mbn i{font-style:normal;color:#5E5230;font-size:clamp(13px,2vh,20px)}
.mbn.cur span{animation:none}
.mbn span.now{color:var(--gold);text-shadow:0 0 14px rgba(255,210,74,.8)}
@keyframes mStep{0%,20%{color:var(--gold);text-shadow:0 0 14px rgba(255,210,74,.8);transform:scale(1.12)}30%,100%{color:#BFA75A;text-shadow:none;transform:none}}
/* 最下面一排：倒數 ➜ 倒數完才出現「⭐ 加分」「▶ 繼續」 */
.mft{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,18px);flex-wrap:wrap;
 min-height:clamp(60px,9vh,86px)}
.mcd{display:inline-flex;align-items:center;justify-content:center;width:clamp(52px,8.4vh,84px);
 height:clamp(52px,8.4vh,84px);border-radius:50%;border:5px solid var(--gold);color:var(--gold);
 font-size:clamp(26px,4.8vh,46px);font-weight:700}
.mcd.tick{animation:mTick .9s ease}
@keyframes mTick{0%{transform:scale(1.35)}100%{transform:none}}
.mft button,.mbtns button{border-radius:999px;color:#fff;font-weight:700;border:2px solid var(--line);background:var(--btn);
 font-size:clamp(18px,3.2vh,30px);padding:clamp(9px,1.6vh,16px) clamp(18px,2.8vw,34px)}
.mft .say{background:#10301F;border-color:var(--ok)}
.mft .bon{background:#2A2208;border-color:var(--gold);color:var(--gold);animation:mGlow 1.3s ease-in-out infinite}
@keyframes mGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,0)}50%{box-shadow:0 0 0 7px rgba(255,210,74,.25)}}
.mft .nxt{background:#0F3323;border-color:var(--ok)}
.mft button:active,.mbtns button:active{transform:scale(.96)}
/* 加分題：字放大 */
.mbq{font-size:clamp(26px,5.6vh,56px);font-weight:700;text-align:center;line-height:1.3;max-width:26ch;
 animation:mPop .5s cubic-bezier(.2,1.5,.4,1)}
.mbo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vh,16px);width:100%}
.mbo.one{grid-template-columns:1fr}
.mbo button{background:#0C0C0C;border:2px solid #2E2E2E;border-radius:18px;color:var(--fg);
 font-size:clamp(22px,4.4vh,44px);font-weight:700;line-height:1.25;min-height:clamp(64px,11vh,110px);
 padding:clamp(8px,1.4vh,16px) clamp(10px,1.6vw,20px);opacity:0;animation:mIn .4s ease forwards}
.mbo button:active{transform:scale(.97)}
.mbo button.ok{background:#0F3323;border-color:var(--ok)}
.mbo button.bad{background:#3A1111;border-color:var(--no)}
.mgain{font-size:clamp(60px,15vh,150px);font-weight:700;color:var(--gold);line-height:1;
 text-shadow:0 0 40px rgba(255,210,74,.6);animation:mPop .7s cubic-bezier(.2,1.6,.4,1)}
.mx2{display:flex;align-items:center;gap:.4em;font-size:clamp(24px,4.6vh,46px);font-weight:700;color:var(--fg)}
.mx2 b{color:var(--gold)}
#missAll h2{margin:0;text-align:center;font-size:clamp(28px,5.4vh,52px)}
#missAll .lead{margin:0;text-align:center;font-size:clamp(17px,2.8vh,26px);color:var(--dim)}
.mcard{display:flex;flex-direction:column;gap:clamp(4px,.8vh,10px);border:1px solid #262626;border-radius:20px;width:100%;
 padding:clamp(10px,1.8vh,18px) clamp(12px,2vw,24px);background:#050505;opacity:0;animation:mIn .45s cubic-bezier(.2,.9,.3,1.2) forwards}
.mcard .mn{font-size:clamp(15px,2.3vh,21px);color:var(--acc);font-weight:700;letter-spacing:.1em}
.mcard .cq{font-size:clamp(18px,3vh,30px);color:var(--body);line-height:1.35}
.mcard .cp{font-size:clamp(18px,3vh,30px);color:#FF9C9C;line-height:1.35}
.mcard .ca{font-size:clamp(26px,5vh,50px);font-weight:700;color:var(--ok);line-height:1.25}
.mcard .ca b{color:var(--ok)}
.mcard .cw{font-size:clamp(17px,2.8vh,28px);color:var(--fg);line-height:1.4}
.mcard .cw b{color:var(--gold)}
.mcard .x{border-radius:8px;padding:0 .12em;background:rgba(255,94,94,.28);color:#fff;text-decoration:line-through}
.mcard .f{border-radius:8px;padding:0 .12em;background:var(--gold);color:#000}
.mcard .say{align-self:flex-start;background:#10301F;border:1px solid var(--ok);border-radius:999px;color:#fff;
 font-size:clamp(15px,2.4vh,22px);padding:6px 16px}
.mbtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:clamp(4px,1vh,10px)}
/* 2026-09-26 使用者指定：正確答案每一個英文字正下方 ＝ 它的中文；下面一行整句翻譯 */
.mv.glw,.ma.gl .mv{display:inline-flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:0 .32em}
.gw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.gw b{font-weight:700}
.gw i{font-style:normal;font-size:.46em;color:#FFE9A8;font-weight:700;margin-top:.12em;white-space:nowrap;letter-spacing:.02em}
.gw b,.gw i{transition:transform .16s ease,filter .16s ease,text-shadow .16s ease}
.gw.spk b{transform:scale(1.14);filter:brightness(1.4);text-shadow:0 0 .35em rgba(255,236,160,.75)}
.gw.spk i{transform:scale(1.1);filter:brightness(1.3)}
.gw.gc{margin-left:-.3em}.gw.gp{margin-left:-.3em}.gw.gp i{visibility:hidden}
.mtr{font-size:clamp(22px,4.2vh,42px);color:var(--fg);text-align:center;line-height:1.3;opacity:0;animation:mIn .45s ease .8s forwards}
.mtr b{color:#FFE9A8}
#look .lk{font-size:clamp(15px,2.4vh,22px);color:var(--dim)}
.mvar{font-size:clamp(15px,2.4vh,22px);color:var(--acc);letter-spacing:.06em}
.mbtns button{background:#0F3323;border-color:var(--ok)}

.reduce *{animation:none!important;transition:none!important}

#stage{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:calc(var(--safeT) + clamp(14px,2.6vh,26px)) clamp(14px,3vw,36px)
         calc(var(--barH,60px) + var(--safeB) + clamp(6px,1vh,12px)) clamp(14px,3vw,36px)}
#stage.lock{overflow:hidden}

/* ── 遊戲大廳 ── */
#hub{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,20px);min-height:100%}
#hub h1{margin:0;font-size:clamp(24px,4.6vh,44px);font-weight:700;text-align:center}
#hub .lead{margin:0;font-size:clamp(13px,2.1vh,19px);color:var(--dim);text-align:center;max-width:44ch;line-height:1.6}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,252px),1fr));
 gap:clamp(8px,1.4vh,14px);width:100%;max-width:1120px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
 text-align:left;background:linear-gradient(180deg,#0E0E0E,#050505);
 border:1px solid #272727;border-radius:18px;color:var(--fg);
 padding:clamp(11px,1.9vh,18px) clamp(12px,1.7vw,20px);min-height:clamp(104px,15vh,140px)}
.gcard:active{transform:scale(.985);border-color:var(--acc)}
.gcard .gn{position:absolute;top:clamp(8px,1.3vh,13px);right:clamp(11px,1.5vw,17px);
 font-size:clamp(18px,3vh,28px);font-weight:700;color:#232323;line-height:1}
.gcard .gi{font-size:clamp(25px,4.2vh,38px);line-height:1.1}
.gcard .gt{font-size:clamp(17px,2.7vh,24px);font-weight:700}
.gcard .gr{font-size:clamp(12px,1.85vh,16px);color:var(--dim);line-height:1.45}
.gcard .gb{margin-top:auto;font-size:clamp(11px,1.6vh,14px);color:#5C5C5C;letter-spacing:.06em}
.gcard .gb b{color:var(--gold);font-weight:700}

/* ── 遊戲 HUD ── */
#ghud{display:none;position:relative;align-items:center;justify-content:space-between;
 gap:clamp(8px,1.6vw,20px);width:100%;max-width:1120px;margin:0 auto clamp(8px,1.5vh,16px)}
#ghud.on{display:flex}
#gring{position:relative;width:clamp(58px,9vh,88px);height:clamp(58px,9vh,88px);flex:0 0 auto}
#gring svg{width:100%;height:100%;transform:rotate(-90deg)}
#gring circle{fill:none;stroke-width:8;stroke-linecap:round}
#gbg{stroke:#1C1C1C}#gfg{stroke:var(--ok);transition:stroke-dashoffset .25s linear,stroke .3s}
#gnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:clamp(17px,2.9vh,28px);font-weight:700}
#gring.warn #gfg{stroke:var(--be)}#gring.warn #gnum{color:var(--be)}
#gring.dang #gfg{stroke:var(--no)}#gring.dang #gnum{color:var(--no);animation:thump .5s infinite}
@keyframes thump{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.gcell{display:flex;flex-direction:column;gap:1px}
.gcell .k{font-size:clamp(10px,1.45vh,13px);color:#5C5C5C;letter-spacing:.12em}
.gcell .v{font-size:clamp(16px,2.7vh,26px);font-weight:700}
.gcell.r{align-items:flex-end;text-align:right}
#gstreak{color:var(--gold)}
/* 2026-09-26 使用者：右上角分數和文字放大，一眼看懂總分和拿到的獎勵 */
.gsb{display:flex;align-items:flex-end;gap:clamp(8px,1.4vw,18px)}
.gsb>span{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.gsb b{font-weight:700;font-variant-numeric:tabular-nums}
.gsb em{font-style:normal;font-size:clamp(13px,2vh,19px);color:#BFA75A;font-weight:700;letter-spacing:.06em;margin-top:2px}
.gsb .gb1 b{font-size:clamp(34px,6.4vh,64px);color:var(--gold);text-shadow:0 0 18px rgba(255,210,74,.45)}
.gsb .gb2 b{font-size:clamp(22px,4vh,40px)}
#gpop{font-size:clamp(24px,4.4vh,44px)!important;top:-10px!important}
#gname{font-size:clamp(13px,2.1vh,19px);font-weight:700;color:var(--acc)}

/* ── 驚喜卡（2026-09-21 改版；2026-09-25 使用者指定：字、圖示、動畫放大，文字簡潔，質感升級）──
   一張真的卡：卡背先抖（等一下會翻開 ＝ 期待），翻開以後
   大大的圖示 ➜ 最大的那一行 ＝ 你拿到什麼 ➜ 一行短短的白話 ➜ 卡片名字。
   四種顏色（p0～p3）✕ 八種炸法 ＝ 每一張卡翻開的樣子都不一樣。 */
#evt,#pick,#gain{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
 background:rgba(0,0,0,.84);perspective:1400px}
#evt.on,#pick.on,#gain.on{display:flex}
.c3{position:relative;width:clamp(250px,40vw,420px);height:clamp(300px,52vh,460px);transform-style:preserve-3d;
 transition:transform .75s cubic-bezier(.3,.8,.3,1.1)}
.c3.flip{transform:rotateY(180deg)}
#evt.on .c3.shake{animation:cShake .9s ease-in-out}
@keyframes cShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.04)}40%{transform:rotate(6deg) scale(1.04)}
 60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.fc{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1vh,12px);
 padding:clamp(12px,2.4vh,26px);text-align:center;overflow:hidden}
.fc.bk{background:radial-gradient(circle at 30% 20%,var(--pc2),var(--pc3) 70%);border:3px solid var(--pc);
 box-shadow:0 0 50px var(--pcg),inset 0 0 30px rgba(255,255,255,.08)}
.fc.bk::before{content:'';position:absolute;inset:10px;border-radius:20px;border:2px dashed rgba(255,255,255,.22)}
.fc.bk .bi{font-size:clamp(80px,15vh,150px);line-height:1;animation:bBob 1.4s ease-in-out infinite}
.fc.bk .bl{font-size:clamp(20px,3.4vh,32px);color:#fff;font-weight:700;letter-spacing:.2em}
@keyframes bBob{0%,100%{transform:none}50%{transform:translateY(-10px) scale(1.06)}}
.fc.ft{transform:rotateY(180deg);background:linear-gradient(160deg,var(--pc3),#050505 80%);border:3px solid var(--pc);
 box-shadow:0 0 70px var(--pcg)}
.fc.ft::after{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--pcg),transparent 30%);
 animation:shine 3.2s linear infinite;opacity:.55;z-index:-1}
@keyframes shine{to{transform:rotate(360deg)}}
.fc .eic{font-size:clamp(64px,12vh,124px);line-height:1;filter:drop-shadow(0 0 18px var(--pcg))}
.fc .ebig{font-size:clamp(34px,6.6vh,66px);font-weight:700;color:var(--pc);line-height:1.08;text-shadow:0 0 22px var(--pcg)}
.fc .ewhy{font-size:clamp(18px,3.1vh,30px);color:#fff;line-height:1.3;max-width:15em}
.fc .ename{font-size:clamp(14px,2.2vh,20px);color:rgba(255,255,255,.6);letter-spacing:.08em}
.p0{--pc:#FFD24A;--pc2:#6B5210;--pc3:#1D1606;--pcg:rgba(255,210,74,.5)}
.p1{--pc:#5AD1FF;--pc2:#12506B;--pc3:#061621;--pcg:rgba(90,209,255,.5)}
.p2{--pc:#FF7EB6;--pc2:#6B1640;--pc3:#1F0612;--pcg:rgba(255,126,182,.5)}
.p3{--pc:#8CF08A;--pc2:#1F6B2A;--pc3:#07190A;--pcg:rgba(140,240,138,.5)}
/* 自己選一張：二選一～五選一 */
#pick .pbox{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,22px);width:min(96vw,1100px)}
#pick h2{margin:0;font-size:clamp(28px,5.4vh,54px);color:var(--gold);text-shadow:0 0 24px rgba(255,210,74,.5);
 animation:pkT 1s ease-in-out infinite}
@keyframes pkT{0%,100%{transform:none}50%{transform:scale(1.06)}}
.prow{display:flex;gap:clamp(8px,1.6vw,20px);justify-content:center;flex-wrap:nowrap}
.prow .c3{width:clamp(120px,17vw,210px);height:clamp(170px,30vh,290px);cursor:pointer;
 animation:pkIn .5s cubic-bezier(.2,1.4,.4,1) both}
.prow .c3:not(.flip):hover{transform:translateY(-8px)}
.prow .fc .bi{font-size:clamp(46px,8vh,84px)}
.prow .fc .bl{font-size:clamp(14px,2.2vh,22px)}
.prow .fc .eic{font-size:clamp(36px,6.4vh,66px)}
.prow .fc .ebig{font-size:clamp(18px,3.4vh,34px)}
.prow .fc .ewhy{font-size:clamp(12px,2vh,19px)}
.prow .fc .ename{font-size:clamp(11px,1.6vh,15px)}
.prow .c3.dim{opacity:.4;filter:grayscale(.6)}
/* 2026-09-26 使用者：選了一張卻看不到任何回饋 ➜ 原因：進場動畫 pkIn（fill both）把翻面的 rotateY 蓋掉了。
   翻開以後把動畫拿掉，卡片才真的翻過來；另外下面再用最大的字寫「你拿到：…」 */
.prow .c3.flip{animation:none;transform:rotateY(180deg)}
.pres{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:1em;text-align:center}
.pres .pb{font-size:clamp(40px,8.4vh,84px);font-weight:700;color:var(--gold);line-height:1.05;
 text-shadow:0 0 30px rgba(255,210,74,.6);animation:gIn .55s cubic-bezier(.2,1.6,.4,1)}
.pres .pw{font-size:clamp(22px,4vh,40px);color:#fff;font-weight:700;animation:gIn .55s ease .15s both}
.prow .c3.mine .fc.ft{box-shadow:0 0 0 5px #fff,0 0 80px var(--pcg)}
@keyframes pkIn{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
/* 答對的加分視窗：✅ ＋880 一眼看完，下面一排圖示算式 */
#gain{background:rgba(0,0,0,.6)}
.gbox{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,14px);
 background:radial-gradient(circle at 50% 0%,#12361F,#040C07 75%);border:3px solid var(--ok);border-radius:30px;
 padding:clamp(14px,2.6vh,30px) clamp(24px,4vw,56px);box-shadow:0 0 70px rgba(57,217,138,.35);
 animation:gIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes gIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.gbox .gok{font-size:clamp(48px,9vh,90px);line-height:1}
.gbox .gnum{font-size:clamp(64px,14vh,140px);font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 36px rgba(255,210,74,.55)}
.geq{display:flex;align-items:center;gap:clamp(6px,1vw,14px);flex-wrap:wrap;justify-content:center}
.geq span{display:flex;flex-direction:column;align-items:center;gap:0;font-size:clamp(22px,4.2vh,42px);font-weight:700;color:#fff;
 background:#0A1A10;border:1px solid #1F4A2E;border-radius:14px;padding:.12em .4em;opacity:0;animation:gPart .4s ease forwards}
.geq span.m{color:var(--gold);border-color:#6B5714;background:#1A1506}
.geq span b{font-weight:700;white-space:nowrap}
/* 2026-09-27 使用者：圖示下面的說明字放大，一眼看懂「為什麼加分」 */
.geq span em{font-style:normal;font-size:.68em;color:#E6FFF0;font-weight:700;letter-spacing:.03em;white-space:nowrap;margin-top:.08em}
.gbox .gtot{font-size:clamp(20px,3.6vh,36px);color:#fff;font-weight:700}
.gbox .gtot b{color:var(--gold);font-size:1.3em}
.geq i{font-style:normal;color:#5E7A68;font-size:clamp(18px,3.2vh,32px)}
@keyframes gPart{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gbar{width:min(70vw,440px);height:clamp(12px,2vh,20px);background:#10281A;border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#F5B301,#39D98A);border-radius:99px;
 transform-origin:left;animation:gBar .8s ease-out both}
@keyframes gBar{from{transform:scaleX(0)}to{transform:none}}
/* 驚喜卡翻開：卡片上的圖示炸滿整個畫面（八種炸法 ✕ 四種顏色，只動 transform／opacity）*/
#burst{position:fixed;inset:0;z-index:61;pointer-events:none;overflow:hidden}
#burst i{position:absolute;left:50%;top:45%;font-style:normal;line-height:1;will-change:transform,opacity;
 font-size:var(--z,44px);animation:var(--a) var(--d,1.9s) cubic-bezier(.2,.8,.3,1) var(--w,0s) both}
#burst b{position:absolute;left:50%;top:45%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
 border:4px solid var(--pc,#FFD24A);animation:bRing 1s ease-out both}
@keyframes bRing{from{transform:scale(.2);opacity:.9}to{transform:scale(16);opacity:0}}
@keyframes bBoom{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}12%{opacity:1}
 100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(var(--r));opacity:0}}
@keyframes bRain{0%{transform:translate(calc(-50% + var(--x)),-60vh) rotate(0);opacity:0}10%{opacity:1}
 100%{transform:translate(calc(-50% + var(--x)),75vh) rotate(var(--r));opacity:.2}}
@keyframes bRise{0%{transform:translate(calc(-50% + var(--x)),70vh) scale(.6);opacity:0}15%{opacity:1}
 100%{transform:translate(calc(-50% + var(--x)),-55vh) scale(1.3);opacity:0}}
@keyframes bSpin{0%{transform:translate(-50%,-50%) rotate(0) translateX(0) scale(.3);opacity:0}15%{opacity:1}
 100%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(var(--x)) scale(1.1);opacity:0}}
@keyframes bSpiral{0%{transform:translate(-50%,-50%) rotate(0) translateX(0) scale(.2);opacity:0}20%{opacity:1}
 100%{transform:translate(-50%,-50%) rotate(calc(var(--r) * 2)) translateX(var(--x)) scale(1.4);opacity:0}}
@keyframes bFount{0%{transform:translate(-50%,40vh) scale(.4);opacity:0}15%{opacity:1}
 55%{transform:translate(calc(-50% + var(--x) * .6),calc(-30vh + var(--y) * .2)) scale(1.1)}
 100%{transform:translate(calc(-50% + var(--x)),50vh) rotate(var(--r));opacity:0}}
@keyframes bZoom{0%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(0);opacity:0}
 40%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(2.4);opacity:1}
 100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2);opacity:0}}
@keyframes bWave{0%{transform:translate(-60vw,calc(-50% + var(--y))) rotate(0);opacity:0}15%{opacity:1}
 50%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) - 8vh)) rotate(var(--r))}
 100%{transform:translate(60vw,calc(-50% + var(--y))) rotate(0);opacity:0}}
#stage.quake{animation:quake .5s}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}
 60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* 魔王技能：壞事用紅色橫幅，不要跟金色的驚喜卡混在一起
   （驚喜卡只給好事，學生才分得出來哪一個是獎勵）*/
#bad{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.7);z-index:59;
 opacity:0;pointer-events:none;text-align:center;
 background:#1A0A0A;border:2px solid var(--no);border-radius:20px;
 padding:clamp(10px,1.9vh,20px) clamp(16px,2.8vw,36px);box-shadow:0 0 50px rgba(255,94,94,.25)}
#bad.on{animation:badIn 1.9s cubic-bezier(.2,.9,.3,1.2)}
#bad .bt{font-size:clamp(18px,3.2vh,32px);font-weight:700;color:var(--no)}
#bad .bd{font-size:clamp(12.5px,2vh,18px);color:var(--body);margin-top:4px}
@keyframes badIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
 14%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}
 22%{transform:translate(-50%,-50%) scale(1)}
 78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-80%) scale(.92)}}

/* 分數跳動 ＋ 飄上去的「＋850」：學生看得到分數是「現在」加上去的 */
#gsc.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.45);color:var(--gold)}
 100%{transform:scale(1)}}
#gpop{position:absolute;right:0;top:-2px;font-size:clamp(15px,2.5vh,24px);font-weight:700;
 color:var(--gold);opacity:0;pointer-events:none}
#gpop.on{animation:gpop 1.15s cubic-bezier(.2,.9,.3,1.2)}
@keyframes gpop{0%{opacity:0;transform:translateY(6px) scale(.8)}
 25%{opacity:1;transform:translateY(-10px) scale(1.15)}
 70%{opacity:1;transform:translateY(-22px) scale(1)}
 100%{opacity:0;transform:translateY(-38px) scale(1)}}

/* 得分算式：為什麼是這個分數，一眼看完（使用者 2026-09-21 指定） */
.calc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
 gap:clamp(4px,.8vw,9px);margin-top:3px}
.calc .ci{display:flex;flex-direction:column;align-items:center;line-height:1.15;
 background:#0C0C0C;border:1px solid #242424;border-radius:12px;
 padding:clamp(3px,.6vh,7px) clamp(7px,1vw,13px)}
.calc .ci em{font-style:normal;font-size:clamp(10px,1.5vh,13px);color:#7E8A94;letter-spacing:.04em}
.calc .ci b{font-size:clamp(15px,2.5vh,24px);color:var(--fg)}
.calc .ci.sp b{color:var(--be)}
.calc .ci.tot{background:#0F3323;border-color:var(--ok)}
.calc .ci.tot b{color:var(--ok);font-size:clamp(19px,3.2vh,32px)}
.calc .cp{font-size:clamp(14px,2.2vh,21px);color:#6E6E6E;font-weight:700}
.spbar{width:min(100%,420px);height:clamp(9px,1.5vh,14px);background:#141414;
 border:1px solid #262626;border-radius:999px;overflow:hidden;margin-top:5px}
.spbar i{display:block;height:100%;background:linear-gradient(90deg,#F5B301,#39D98A);
 border-radius:999px}
.sphint{font-size:clamp(10.5px,1.6vh,14px);color:#7E8A94;letter-spacing:.04em;margin-top:2px}

/* ── 遊戲場 ── */
#arena{display:none;flex-direction:column;align-items:center;gap:clamp(8px,1.5vh,16px);
 width:100%;max-width:1080px;margin:0 auto}
#arena.on{display:flex}
.qh{font-size:clamp(28px,6.2vh,62px);font-weight:700;text-align:center;line-height:1.3;max-width:26ch}
.qs{font-size:clamp(17px,2.8vh,28px);color:var(--acc);text-align:center}
.qbig{font-size:clamp(34px,8vh,80px);font-weight:700;text-align:center;line-height:1.2}
.qzh{font-size:clamp(22px,4.2vh,42px);color:var(--acc);text-align:center}
.tagline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tg{font-size:clamp(11px,1.65vh,14px);letter-spacing:.08em;color:var(--acc);
 border:1px solid #2C3A48;border-radius:999px;padding:3px 11px}
.tg.hot{color:var(--gold);border-color:#5A4A18;background:#1A1508;font-weight:700}
/* 「再答對 N 題就開驚喜卡」：學生一直看得到下一張卡離自己多遠 ＝ 期待感 */
.tg.go{color:#FFE9A8;border-color:#6B5714;background:#14100A;font-weight:700}
.tg.go.near{animation:tgn 1.1s infinite}
@keyframes tgn{0%,100%{box-shadow:0 0 0 0 rgba(255,210,74,0)}
 50%{box-shadow:0 0 0 4px rgba(255,210,74,.22)}}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,1.2vh,13px);width:100%}
.opts.one{grid-template-columns:1fr}
.o{display:flex;align-items:center;gap:clamp(7px,1.2vw,14px);text-align:left;
 background:#0C0C0C;border:1px solid #262626;border-radius:15px;color:var(--fg);
 font-size:clamp(24px,4.8vh,48px);font-weight:700;line-height:1.25;white-space:nowrap;
 padding:clamp(8px,1.5vh,16px) clamp(11px,1.7vw,22px);min-height:clamp(56px,9vh,92px)}
.o .sh{flex:0 0 auto;width:1.25em;text-align:center;font-size:.82em}
.o.s0 .sh{color:#FF5E5E}.o.s1 .sh{color:#F5B301}.o.s2 .sh{color:#39D98A}.o.s3 .sh{color:#5AA9FF}
.o:active{transform:scale(.985)}
.o.ok{background:#0F3323;border-color:var(--ok)}
.o.bad{background:#3A1111;border-color:var(--no)}
.o.dim{opacity:.3}

/* 兩顆大按鈕（他／她、問句／直述句） */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.5vw,18px);width:100%}
.dbtn{border-radius:20px;border:2px solid #2A2A2A;background:#0A0A0A;color:var(--fg);
 min-height:clamp(84px,15vh,150px);display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:5px;font-size:clamp(28px,5.4vh,54px);font-weight:700;white-space:nowrap}
.dbtn .ds{font-size:clamp(12px,1.9vh,17px);color:var(--dim);font-weight:400}
.dbtn.he{border-color:var(--he)}.dbtn.he.fill{background:var(--he)}
.dbtn.she{border-color:var(--she)}.dbtn.she.fill{background:var(--she)}
.dbtn.st{border-color:#3A6E52}.dbtn.nt{border-color:#3A5A7E}.dbtn.qu{border-color:#3A5A7E}
.dbtn:active{transform:scale(.97)}
.dbtn.ok{background:#0F3323;border-color:var(--ok)}
.dbtn.bad{background:#3A1111;border-color:var(--no)}

/* 語序／火眼金睛的字塊 */
.chips{display:flex;flex-wrap:wrap;gap:clamp(6px,1vw,11px);justify-content:center;width:100%}
.cw{background:#111;border:1px solid #2C2C2C;border-radius:13px;color:var(--fg);
 font-size:clamp(26px,5.2vh,52px);font-weight:700;white-space:nowrap;
 padding:clamp(7px,1.3vh,14px) clamp(11px,1.6vw,22px)}
.cw:active{transform:scale(.95)}
.cw.used{opacity:.18;pointer-events:none}
.cw.ok{background:#0F3323;border-color:var(--ok)}
.cw.bad{background:#3A1111;border-color:var(--no);animation:shake .4s}
.slotline{display:flex;flex-wrap:wrap;gap:clamp(5px,.9vw,10px);justify-content:center;
 min-height:clamp(46px,7vh,72px);align-items:center;width:100%;
 border-bottom:2px dashed #272727;padding-bottom:clamp(6px,1.1vh,12px)}
.slotline .cw{background:#1A2430;border-color:#39536E}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}
 50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* 記憶配對 */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.1vw,12px);width:100%}
.mc{min-height:clamp(62px,11vh,116px);border-radius:15px;border:1px solid #2A2A2A;background:#0C0C0C;
 color:var(--fg);font-size:clamp(16px,2.8vh,27px);font-weight:700;line-height:1.25;
 display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;
 transition:transform .22s,background .2s,opacity .3s}
.mc.back{background:#151B22;color:#3E4C5A;font-size:clamp(20px,3.4vh,32px)}
.mc.ok{background:#0F3323;border-color:var(--ok)}
.mc.bad{background:#3A1111;border-color:var(--no)}
.mc.gone{opacity:0;pointer-events:none;transform:scale(.6)}
.mc:active{transform:scale(.96)}

/* 魔王血條 */
#boss{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:640px}
#bossface{font-size:clamp(34px,6.4vh,64px);line-height:1}
#bossface.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:none}30%{transform:translateX(-10px) rotate(-7deg)}
 60%{transform:translateX(8px) rotate(6deg)}}
#hpbar{width:100%;height:clamp(13px,2.1vh,20px);background:#1A1A1A;border-radius:999px;overflow:hidden;
 border:1px solid #2A2A2A}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#FF5E5E,#FF9A4A);
 transition:width .45s cubic-bezier(.2,.8,.3,1)}

/* 回饋 */
#gfb{min-height:clamp(40px,6.6vh,64px);display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:3px;text-align:center;width:100%}
#gfb .fh{font-size:clamp(16px,2.7vh,26px);font-weight:700}
#gfb .fh.ok{color:var(--ok)}#gfb .fh.no{color:var(--no)}
#gfb .fw{font-size:clamp(13px,2.05vh,19px);color:var(--body);line-height:1.45;max-width:40ch}
#gfb .fw b{color:var(--gold)}

/* 結算 */
#gend{display:none;flex-direction:column;align-items:center;gap:clamp(7px,1.4vh,14px);
 text-align:center;width:100%;max-width:760px;margin:0 auto}
#gend.on{display:flex}
#gend h2{margin:0;font-size:clamp(23px,4.4vh,42px)}
#gend .sc{font-size:clamp(38px,7.4vh,76px);font-weight:700;color:var(--gold);line-height:1}
#gend .ln{font-size:clamp(13px,2.15vh,20px);color:var(--dim)}
#gend .rev{width:100%;text-align:left;background:#0A0A0A;border:1px solid #232323;border-radius:14px;
 padding:clamp(9px,1.6vh,16px);max-height:34vh;overflow-y:auto}
#gend .rev div{font-size:clamp(16px,2.6vh,24px);color:var(--body);line-height:1.55;
 padding:4px 0;border-bottom:1px solid #161616}
#gend .rev b{color:var(--gold)}
.big{background:var(--btn);border:1px solid var(--line);border-radius:15px;color:var(--fg);
 font-size:clamp(15px,2.5vh,24px);font-weight:700;padding:clamp(9px,1.7vh,17px) clamp(16px,2.6vw,32px)}
.big.go{background:#123A26;border-color:var(--ok);color:#EAFFF3}
.big:active{transform:scale(.97)}
.rowbtn{display:flex;gap:clamp(7px,1.3vw,14px);flex-wrap:wrap;justify-content:center}
/* ⏳ 每一個遊戲 5 分鐘（使用者 2026-09-25 指定） */
#gclock{font-size:clamp(22px,4vh,40px);font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
#gclock.warn{color:var(--be)}#gclock.dang{color:var(--no);animation:thump .6s infinite}
#gring.frz #gfg{stroke:#8FD8FF}#gring.frz #gnum{color:#8FD8FF}
.tg{font-size:clamp(13px,2.1vh,19px)}
.hintl{font-size:clamp(17px,2.9vh,28px);color:var(--gold);background:#1A1508;border:1px solid #5A4A18;

/* rpg/_wear.css — 🏪 商城寶物穿在英雄身上（rpg/_wear_rt.js）。放在英雄卡（.rw-host）裡面；後面的用 z-index:-1（英雄卡要 isolation:isolate） */
.rw-host{isolation:isolate}
.rw-au,.rw-wg,.rw-cp,.rw-mt,.rw-po,.rw-nf{position:absolute;pointer-events:none;max-width:none}
.rw-au{left:50%;top:46%;width:150%;transform:translate(-50%,-50%);z-index:-1;animation:rwSpin 16s linear infinite}
.rw-wg{left:50%;top:40%;width:200%;transform:translate(-50%,-50%);z-index:-2;animation:rwFlap 3s ease-in-out infinite}
.rw-cp{left:50%;top:62%;width:125%;transform:translate(-50%,-50%);z-index:-1;animation:rwCape 3.4s ease-in-out infinite}
.rw-mt{left:50%;bottom:-22%;width:120%;transform:translateX(-50%);z-index:-1;animation:rwRide 2.6s ease-in-out infinite}
.rw-po{right:-14%;top:-16%;width:58%;z-index:4;filter:drop-shadow(0 0 6px #000)}
.rw-nf{left:50%;top:50%;width:150%;transform:translate(-50%,-50%);z-index:-1}
@keyframes rwSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes rwFlap{50%{transform:translate(-50%,-50%) scale(1.06,.96)}}
@keyframes rwCape{50%{transform:translate(-50%,-50%) skewX(-3deg)}}
@keyframes rwRide{50%{transform:translate(-50%,-8px)}}
.rw-fx{position:fixed;inset:0;z-index:99999;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:rwFlash 1.4s ease-out forwards}
.rw-fx img{width:min(76vw,76vh);animation:rwBoom 1.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes rwBoom{0%{transform:scale(.1) rotate(-120deg);opacity:0}30%{transform:scale(1.15) rotate(0);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes rwFlash{0%{background:rgba(255,255,255,0)}20%{background:rgba(255,240,200,.35)}100%{background:rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.rw-au,.rw-wg,.rw-cp,.rw-mt{animation:none}.rw-fx{animation-duration:.6s}.rw-fx img{animation-duration:.6s}}
/* score/_honor.css — 榮譽動畫（2026-10-12 D 第 4 件）：學生平板做完的榮譽動畫、老師投影的榮譽榜共用。12 種風格 .hs1～.hs12 */
.hon{position:relative;width:100%;height:var(--hh,clamp(420px,66vh,800px));border-radius:22px;overflow:hidden;background:#000;color:#fff;text-align:center;isolation:isolate;
  display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:clamp(6px,1.4vh,16px);padding:2vh 2vw;box-sizing:border-box}
.hon *{box-sizing:border-box}
.hon .hbg,.hon .hfx{position:absolute;inset:0;pointer-events:none}
.hon .hbg{z-index:-2}.hon .hfx{z-index:-1;overflow:hidden}
.hon .hhero{font-size:clamp(70px,13vh,150px);line-height:1;position:relative;filter:drop-shadow(0 0 24px rgba(255,214,74,.55))}
.hon .hkick{font-size:clamp(20px,3.2vh,34px);font-weight:700;color:#FFE9A8;letter-spacing:.06em;animation:hfade .7s backwards}
.hon .htit{font-size:clamp(30px,5.6vh,60px);font-weight:700;line-height:1.2;text-shadow:0 3px 14px #000;animation:hzoom .8s .2s backwards}
.hon .hsub{font-size:clamp(20px,3.2vh,34px);font-weight:700;color:#E8F0F8;text-shadow:0 2px 10px #000;animation:hfade .8s .5s backwards}
.hon .hcards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(8px,1.6vh,18px);width:100%;max-width:calc(var(--n,3)*440px)}

  min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 26px rgba(255,214,74,.35);animation-fill-mode:backwards}
.hon .hcard .hi{font-size:clamp(46px,8vh,90px);line-height:1.05;display:flex;align-items:center;justify-content:center;height:1.1em}
.hon .hcard .hi svg{height:1.15em;width:auto}

.hon .hcard .hn{font-size:clamp(26px,4.4vh,46px);font-weight:700;color:#FFE07A}
.hon .hcard .hl{font-size:clamp(20px,3.2vh,32px);font-weight:700;line-height:1.3}
.hon .hcard .hw{font-size:clamp(24px,4vh,42px);font-weight:700;color:#fff}
.hon .hcard.me{border-color:#5BE39A;box-shadow:0 0 30px rgba(91,227,154,.6)}
.hon .hrow{display:flex;flex-direction:column;gap:clamp(4px,.9vh,10px);width:min(1100px,100%)}
.hon .hr{display:grid;grid-template-columns:3.2em 1fr auto;gap:12px;align-items:center;background:rgba(10,12,16,.8);border:2px solid rgba(255,214,74,.6);border-radius:16px;
  padding:4px 16px;font-size:clamp(22px,3.6vh,40px);font-weight:700;text-align:left;animation:hslide .6s backwards}
.hon .hr b{color:#FFE07A;text-align:center}.hon .hr em{font-style:normal;color:#CFE3F5}
.hon .hpod{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1.4vw,22px);width:100%}

.hon .hpod .blk{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(40px,8vh,90px);font-weight:700;padding-top:6px;
  animation:hrise 1s cubic-bezier(.2,1.4,.5,1) backwards;color:#2A1A00}
.hon .hpod .p1 .blk{height:clamp(110px,22vh,260px);background:linear-gradient(#FFE07A,#E8A900)}
.hon .hpod .p2 .blk{height:clamp(80px,15vh,180px);background:linear-gradient(#F2F2F2,#A9B4BE)}
.hon .hpod .p3 .blk{height:clamp(60px,11vh,130px);background:linear-gradient(#F0B080,#B4642C)}
.hon .hpod .nm{font-size:clamp(24px,4.2vh,46px);font-weight:700;line-height:1.15;animation:hzoom .7s backwards}

@keyframes hfade{from{opacity:0;transform:translateY(16px)}}
@keyframes hzoom{from{opacity:0;transform:scale(.4)}}
@keyframes hslide{from{opacity:0;transform:translateX(-60px)}}
@keyframes hrise{from{transform:scaleY(0);transform-origin:bottom}}
@keyframes hdrop{0%{opacity:0;transform:translateY(-60vh) scale(.5)}100%{opacity:1}}
@keyframes hspin{to{transform:rotate(360deg)}}
@keyframes htw{50%{opacity:.15;transform:scale(.4)}}
@keyframes hfall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(110vh) rotate(var(--r,540deg))}}

/* 1 🏆 金色獎盃從天而降＋光芒 */
.hs1 .hbg{background:radial-gradient(circle at 50% 30%,#4A3400,#120C00 55%,#000 80%)}
.hs1 .hbg::after{content:"";position:absolute;left:50%;top:28%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,214,74,.16) 0 8deg,transparent 8deg 22deg);animation:hspin 14s linear infinite}
.hs1 .hhero{animation:hdrop 1.1s cubic-bezier(.3,1.6,.5,1) backwards}
.hs1 .hcard{animation:hdrop .9s cubic-bezier(.3,1.5,.5,1) backwards}
/* 2 👑 皇冠加冕＋星光 */

.hs2 .hhero{animation:hcrown 1.3s ease-out backwards}

.hs3 .hcard{animation:hrise .9s cubic-bezier(.2,1.3,.5,1) backwards;border-radius:22px 22px 6px 6px}

.care{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;padding:clamp(10px,2vh,22px) clamp(8px,2vw,22px) clamp(12px,2vh,22px);color:#fff;text-align:center;background:#0B1830}

/* 〔📖 說明〕 */
.care .chb{display:inline-block;margin-top:10px;background:#1E3A5A;color:#fff;border:3px solid #7FD4FF;border-radius:16px;font:inherit;font-size:clamp(22px,3vh,28px);font-weight:700;padding:6px 22px;min-height:52px;cursor:pointer}

.care.cs2 .chw::after{content:'';position:absolute;left:50%;top:92%;width:2px;height:26px;background:#fff;opacity:.7}

/* 成績卡（2026-10-16 C3／C4 第 3 題 甲、C5「1 乙」）：🎯 正確、📅 練習 兩大格＋💡 下一步（老師看板、學生平板同一張） */

/* score/_report.css — 📅 練習報告＋10 種新愛心＋切換按鈕（2026-10-17 第八次；配 _report_rt.js） */
.rpbox{width:100%;max-width:980px;margin:0 auto;text-align:center}

/* ── 打勾清單（共同） ── */
.rpw{position:relative;border-radius:22px;padding:clamp(10px,1.8vh,20px) clamp(10px,2vw,22px);background:linear-gradient(#0E1A2C,#05080F);border:3px solid #2A3A50;color:#fff;text-align:left;overflow:hidden}
.rph{text-align:center;font-size:clamp(28px,4vh,42px);color:#FFE07A;line-height:1.2;margin-bottom:8px}
.rpl{display:flex;flex-direction:column;gap:clamp(6px,1vh,10px)}
.rpr{display:grid;grid-template-columns:clamp(46px,6vw,62px) minmax(0,1fr) auto;align-items:center;gap:12px;background:#0F1824;border:3px solid #263446;border-radius:18px;padding:6px 12px;
  font-size:clamp(22px,3.2vh,32px);line-height:1.25;opacity:0;transform:translateX(-30px);transition:opacity .45s,transform .45s}
.rpr.on{opacity:1;transform:none}

.rpic{display:flex;align-items:center;justify-content:center;width:100%}.rpem{font-size:1.5em;line-height:1}

  if(it.hl)hl(-1);

 var began=false;

/* 真正送出一句 */
function pump(){
 if(SBUSY)return;

 if(!t){if(it.done)try{it.done()}catch(e){};setTimeout(pump,0);return}

 if(it.l!=='zh'&&window.AUD){var au=(it.v&&AUD[it.v+':'+akey(t)])||AUD[akey(t)];if(au&&aPlay(it,t,au))return}
 var u;try{u=new SpeechSynthesisUtterance(t)}catch(e){if(it.done)try{it.done()}catch(e2){};return}
 if(it.l==='zh'){u.lang='zh-TW';if(VOXZH)u.voice=VOXZH;u.rate=RATE}
 else{u.lang='en-US';if(VOX)u.voice=VOX;u.rate=RATE}

 var mine=++SID;SBUSY=true;SLAST=Date.now();
 /* 念到哪個字，那個字就亮（使用者 2026-09-24 指定）：
    有 onboundary 的瀏覽器照真正的時間亮；沒有的（部分 Chrome 線上語音、iPad 舊版）

 var ws=[],wm,wre=/\S+/g;while((wm=wre.exec(t)))ws.push({s:wm.index,n:wm[0].replace(/[^A-Za-z]/g,'').length});

  if(k<ws.length){mark(k);ft=setTimeout(step,est(k))}};
 var begin=function(){if(began)return;began=true;
  if(it.start)try{it.start()}catch(e){}
  if(it.hl){mark(0);ft=setTimeout(step,est(0))}};
 u.onstart=begin;
 u.onboundary=function(e){if(!it.hl||mine!==SID)return;
  if(e&&e.name&&e.name!=='word')return;

  var c=e&&typeof e.charIndex==='number'?e.charIndex:0,k=0;

/* say(句子)            ＝ 馬上講，砍掉還沒講完的

/* 2026-10-04 修：這裡是樣板字串，\b 要寫兩條斜線；原本寫一條變成「倒退鍵」，女生名字的答句從來沒有換成男聲問句 */
function qaV(ans){return /\b(Emma|Wendy|Amy|Mia)\b/.test(String(ans))?['m','']:['','m']}
function say(txt,lang,opt){
 opt=opt||{};
 if(!txt||!sayText(txt)){if(opt.done)opt.done();return}
 var item={t:txt,l:lang,done:opt.done,hl:opt.hl,start:opt.start,v:opt.v};
 if(opt.keep){if(SQ.length>4)SQ.length=4;SQ.push(item);pump();return}
 SQ.length=0;SID++;SBUSY=false;APLAY=false;
 if(window.HLCLR)try{HLCLR()}catch(e){}
 try{if(AEL)AEL.pause()}catch(e){}
 try{speechSynthesis.cancel()}catch(e){}
 SQ.push(item);
 /* Chrome／Edge：cancel() 之後馬上 speak() 會被吃掉，等 90ms 再講 */
 setTimeout(pump,90);
}

function sayStop(){SQ.length=0;SID++;SBUSY=false;APLAY=false;if(window.HLCLR)try{HLCLR()}catch(e){}
 try{if(AEL)AEL.pause()}catch(e){}

/* 看門狗：瀏覽器有時候不發 onend（或講到一半自己停住），卡住就救回來 */
setInterval(function(){
 try{
  if(speechSynthesis.speaking&&!speechSynthesis.paused)speechSynthesis.resume();
  if(!SBUSY){if(SQ.length)pump();return}
  if(APLAY)return;                    /* 播音檔的時候不歸看門狗管（音檔自己有逾時） */
  var idle=Date.now()-SLAST;
  if(!speechSynthesis.speaking&&!speechSynthesis.pending&&idle>900){SID++;SBUSY=false;pump()}
  else if(idle>15000){SID++;SBUSY=false;try{speechSynthesis.cancel()}catch(e){}pump()}
 }catch(e){}
},400);

/* 找出「哪裡錯」：兩句逐字比對，錯的字框紅色、改對的字框金色 */
function mTok(s){var r=[],re=/[A-Za-z’']+|[\uD800-\uDBFF][\uDC00-\uDFFF]\uFE0F?|[^\sA-Za-z’']\uFE0F?/g,m;s=String(s);
 while((m=re.exec(s)))r.push({t:m[0],s:m.index,e:m.index+m[0].length});return r}
function mKey(t){return t.replace(/’/g,"'").toLowerCase()}
function mDiff(a,b){ /* 回傳：a 裡面哪些字不在共同的部分、b 裡面哪些字不在共同的部分 */
 var A=mTok(a),B=mTok(b),n=A.length,m=B.length,L=[],i,j;
 for(i=0;i<=n;i++){L.push([]);for(j=0;j<=m;j++)L[i].push(0)}
 for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)
  L[i][j]=mKey(A[i].t)===mKey(B[j].t)?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 var ia={},ib={};i=0;j=0;
 while(i<n&&j<m){if(mKey(A[i].t)===mKey(B[j].t)){ia[i]=1;ib[j]=1;i++;j++}
  else if(L[i+1][j]>=L[i][j+1])i++;else j++}
 return {A:A,B:B,ia:ia,ib:ib};
}
function mPaint(s,T,keep,cls){ /* 把沒對上的字包起來，其他字照原樣 */
 s=String(s);var out='',p=0;
 T.forEach(function(t,k){out+=mEsc(s.slice(p,t.s));
  out+=keep[k]?mEsc(t.t):'<span class="'+cls+'">'+mEsc(t.t)+'</span>';p=t.e});

}
function mEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function mStrip(h){var d=document.createElement('div');d.innerHTML=String(h||'');return d.textContent||''}
function mPair(o){ /* 你選的（紅框）／正確答案（金框）＋ 逐字中文、整句翻譯（2026-09-26） */
 var pick=o.pick==null?null:mStrip(o.pick), ans=mStrip(o.ans), dp='', da='', bad=[];

  if(g===null){g='';o._gq=mGloss(src.en,null)}}

 return {p:(pick==null?'⏰ 時間到，沒有作答':(pick===''?'（沒有選）':dp)),a:da,g:g,tr:tr,gq:o._gq||'',en:/[A-Za-z]/.test(ans),ans:ans,st:st};
}
var MISSLOG=[], missT=null, missCB=null, MS=null, MISSN=8;

/* 正確答案的英文自動唸 3 次（使用者 2026-09-25 指定），頁面關掉就停 */
function mSay3(t){
 if(!/[A-Za-z]/.test(t))return;
 var k=0,my=MS;
 var go=function(){if(MS!==my||!missOn()||k>=3)return;k++;
  say(t,null,{keep:k>1?1:0,hl:gHL(t),done:function(){setTimeout(go,650)}})};
 setTimeout(go,700);
}
function mCount(n,fn){

  n--;var c=document.getElementById('mcdn');
  if(n>0&&c){c.textContent=n;c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick');return}
  clearInterval(missT);missT=null;fn();
 },1000);

}

  (p.tr?'<div class="mtr">整句：<b>'+mEsc(p.tr)+'</b></div>':'')+

   '<span class="mcd" id="mcdn">'+MISSN+'</span></div></div>';

 mSay3(o.sp!=null?o.sp:(/[A-Za-z]{2}/.test(p.ans)?p.ans:((gSrc(o)||{}).en||'')));

function joinS(a){return a.join(' ').replace(/ ([?.,!])/g,'$1').replace(/ ([’']s)/g,'$1')}
function itxt(c){
  if(g==='g1'||g==='g10')return c.q+' '+c.o[0];
  if(g==='g2')return c.txt+' '+c.a;
  if(g==='g3')return c.s.join(' ');
  if(g==='g4')return c.f+' '+c.o[0];
  if(g==='g5')return c.s+' '+c.o[0];
  if(g==='g7')return c.w.join(' ');
  if(g==='g8')return f8(c,c.o[0]);
  if(g==='g9')return c[0];
  return '';
}
function simsOf(c){return g==='g6'?[]:simRank(c,BANK[g],itxt,function(x){return x.h||x[2]||''})}
function toMcq(c){
  if(g==='g1'||g==='g10')return {q:c.q,o:c.o,h:c.h};
  if(g==='g4')return {q:c.f+'<br>'+c.d,o:c.o,h:c.h};
  if(g==='g5')return {q:'🔊 聽到的是哪一句？',say:c.s,o:c.o,h:c.h};
  if(g==='g8')return {q:(c.b==='___'?'':ap(c.b)+' ')+'<span style="color:var(--be)">＿＿</span> '+ap(c.a)+'<br>'+c.zh,o:c.o,h:c.h};
  if(g==='g2'){var ot=DUOV.filter(function(v){return v!==c.a})[0];
    /* 題目沒有 ___（my father ➜ he／she）：改成整句 ___’s my father. 四選一（2026-09-26） */
    if(!/___/.test(c.txt)){var A=cap1(c.a),O=cap1(ot);
      return {q:c.zh+'（'+c.txt+'）<br>哪一句對？',o:[A+'’s '+c.txt+'.',O+'’s '+c.txt+'.',(c.a==='he'?'His ':'Her ')+c.txt+'.',A+' '+c.txt+'.'],h:c.h}}
    return {q:c.zh+'<br>哪一句對？',o:[fillBl(c.txt,c.a),fillBl(c.txt,ot)],h:c.h}}
  if(g==='g3'){var ok=joinS(c.s),o=[ok],t=0;
    while(o.length<4&&t++<40){var w=c.s.slice(0,-1),p=c.s[c.s.length-1];var x=joinS(shuf(w).concat([/^[?.!]$/.test(p)?p:p]));
      if(o.indexOf(x)<0)o.push(x)}
    return {q:c.zh+'<br>哪一句的順序對？',o:o,h:c.h}}
  if(g==='g7'){var bad=joinS(c.w);
    if(c.b<0){var o7=[bad];BANK.g7.forEach(function(y){if(y!==c&&y.zh===c.zh&&y.b>=0&&o7.length<3)o7.push(joinS(y.w))});
      if(o7.length<2){var w7=c.w.slice(0,-1);o7.push(joinS(shuf(w7).concat(c.w.slice(-1))))}
      return {q:c.zh+'<br>哪一句完全正確？',o:o7,h:c.h}}
    var fix=c.w.slice();fix[c.b]=c.fix;return {q:c.zh+'<br>哪一句完全正確？',o:[joinS(fix),bad],h:c.h}}
  if(g==='g9'&&!1){ /* 問句／直述句：四句裡找一句跟它同一種（一句對、三句是另一種） */
    var same=BANK.g9.filter(function(y){return y!==c&&y[1]===c[1]}),diff=shuf(BANK.g9.filter(function(y){return y[1]!==c[1]}));
    if(same.length&&diff.length>=3)return {q:'「'+c[0]+'」是'+(c[1]==='q'?'❓ 問句':'🙋 直述句')+'。<br>哪一句跟它<b>同一種</b>？',
      o:[pick(same)[0]].concat(diff.slice(0,3).map(function(y){return y[0]})),h:c[2]||'',nm:1}}
  if(g==='g9'&&1){ /* 在回答哪一題：四個問句選一個 */
    var qs=["What’s your name?","How old are you?"],ks9=["n","a"];
    var qq=qs[ks9.indexOf(c[1])];
    if(qq)return {q:'「'+c[0]+'」<br>在回答哪一題？',say:c[0],o:[qq].concat(qs.filter(function(x){return x!==qq})),h:c[2]||''}}
  if(g==='g9'){var lab=LAB9,ks=Object.keys(lab);
    return {q:'「'+c[0]+'」<br>'+('在回答哪一題？'),say:c[0],
      o:[lab[c[1]]].concat(ks.filter(function(k){return k!==c[1]}).map(function(k){return lab[k]})),h:c[2]||''}}
  return null;
}

/* ── 判定 ──
   愈快答對，分數愈高：答對 100 ＋ 速度分（剩下的秒數 ／ 總秒數 ✕ 900）＋ 連對 ✕ 20，再乘驚喜卡的倍率。
   答對：加分視窗（✅ ＋880 ＋ 圖示算式）➜ 連對到 3 的倍數就翻驚喜卡 ➜ 下一題。
   答錯：錯題分析的獨立頁（倒數 8 秒、唸 3 次、⭐ 加分 ➜ 類似題 ✕2），按「▶ 繼續」才出下一題。 */
function award(sp,short){
  right++;streak++;if(streak>best)best=streak;
  speedSum+=sp;
  var st=streak*20, sub=100+sp+st, mul=1, extra=0, extraIc='';
  if(multLeft>0){mul*=mult;multLeft--;if(!multLeft)mult=1}
  if(combo){combo.n++;if(combo.n>combo.need){mul*=combo.mul;combo=null}}
  if(goldNext){extra+=goldNext;extraIc='🏅';goldNext=0}
  if(fastV){if(qt-left<=5){extra+=fastV;extraIc=extraIc||'🎯'}fastV=0}
  if(rainN>0){extra+=rainV;extraIc=extraIc||'🌧';rainN--}
  var p=sub*mul+extra;
  score+=p;lastGain=p;sOk();popScore(p);paint();
  return {sp:sp,st:streak>1?st:0,mul:mul,extra:extra,extraIc:extraIc,p:p,pct:left/qt,short:short};
}
function judge(ok,hint,after,timeout){
  if(busy||ended)return;busy=true;
  window.LASTOK=ok;   /* 量測用：這一題是答對還是答錯（火眼金睛答對以後要先看 6 秒，busy 會一直是 true） */
  tstop();
  asked++;gScRec(ok,timeout);
  if(ok){
    var sp0=Math.round(900*(left/qt));
    var fin=function(){
      var d=award(sp0,false);
      var go=function(){if(!ended&&$('#arena').classList.contains('on'))(after||next)()};
      showGain(d,function(){
        if(ended)return;
        if(streak>0&&streak%3===0)surprise(go);else go();
      });
    };
    /* 🔍 火眼金睛：答對也要看 6 秒（正確句子＋逐字中文＋整句翻譯＋自動唸）才得分（使用者 2026-09-26 指定）*/
    if(g==='g7'&&cur){var ok7=cur.w.slice();if(cur.b>=0)ok7[cur.b]=cur.fix;gPause++;
      setTimeout(function(){if(ended){gPause=Math.max(0,gPause-1);return}
        lookShow(joinS(ok7),function(){gPause=Math.max(0,gPause-1);if(!ended)fin()})},450);return}
    fin();
    return;
  }
  var saved=false;
  if(shield){shield--;saved=true}      /* 🛡 免死金牌：這一次答錯不算錯、連對不斷 */
  else{wrong++;streak=0;combo=null}
  sNo();
  var sims=simsOf(cur);
  /* 過兩三題再出一題類似題（選項每次都重洗），練到會為止 */
  var simQ=sims[1]||sims[0]||cur;GSIM.push(simQ);
  queue.splice(Math.min(queue.length,2+Math.floor(Math.random()*2)),0,simQ);
  if(hint&&wrongList.indexOf(hint)<0)wrongList.push(hint);
  paint();
  var mi=mInfo();mi.why=(saved?'🛡 免死金牌：這一次不算錯！　':'')+(hint||'');
  if(timeout)mi.pick=null;
  mi.sims=sims.slice(0,3).map(toMcq).filter(function(x){return x});
  mi.self=cur?toMcq(cur):null;   /* 加分題 ＝ 這一題換個樣子（_miss_rt.js 的 mVar） */
  if(!mi.sims.length&&cur)mi.sim0=toMcq(cur);
  mi.pts=500;
  mi.gain=function(n){gFix++;score+=n;popScore(n);paint()};
  /* 先讓學生看一眼紅綠（0.5 秒），再蓋上錯題分析頁；這段時間時鐘暫停（使用者 2026-10-09） */
  gPause++;var mOn=1,mOff=function(){if(mOn){mOn=0;gPause=Math.max(0,gPause-1)}};
  setTimeout(function(){
    if(ended||!$('#arena').classList.contains('on')){mOff();return}
    missShow(mi,function(){
      mOff();
      if(ended||!$('#arena').classList.contains('on'))return;
      (after||next)();
    });
  },500);
}

  if(left<=0){scOut();scFull('scbye2','<div class="sfic">👋</div><div class="sf1">已經登出了</div><div class="sf3">3 分鐘沒有動作</div><div class="sfbt"><button class="scK" id="scByeIn">🔑 登入</button></div>');return}
  if(left<=SCWARN){var o=document.getElementById('scidle');if(!o||!o.classList.contains('on'))scFull('scidle','<div class="sfic">⏳</div><div class="sf2"><b id="scIdleN">30</b> 秒後自動登出</div><div class="sfbt"><button class="scY" id="scStay">👆 我還在</button></div>');
    var n=document.getElementById('scIdleN');if(n)n.textContent=Math.max(1,Math.ceil(left/1000))}
  else scIdleHide()}
/* ══ 👀 看字卡、按 🔊 聽，也算練習時間（2026-10-15 D 第 8 件，老師 D12 ②：句型卡、Review 1 頁、在家複習的每一頁）══
   登入才記；兩次點（點、打字、捲動）之間最多算 2 分鐘（一張卡停超過 2 分鐘只算 2 分鐘）；超過 3 分鐘沒點 ＝ 那一段不算（也會被登出）；
   換到別的分頁不算；作答中（📝 複習題、📝 複習蓋在上面）不算（作答的秒數另外記）。存成一筆 m:'v'（代號 g年級v_區域），跟成績一起送 */
var SCVW=null,SCVMAX=120000;
function scViewOn(a,nm){if(!SCON||SCVW)return;SCVW={a:a,nm:nm||'👀 看字卡',last:0,acc:0,id:null,busy:false};
  ['pointerdown','keydown','wheel','touchstart'].forEach(function(e){document.addEventListener(e,scVwAct,{passive:true,capture:true})});
  window.addEventListener('scroll',scVwAct,{passive:true});
  document.addEventListener('visibilitychange',function(){scVwAct();if(document.hidden)scVwSave()});
  window.addEventListener('pagehide',function(){scVwAct();scVwSave()});
  setInterval(function(){if(SCVW.acc>=300000)scVwSave()},30000)}   /* 5 分鐘存一筆 */
function scVwAct(){var V=SCVW,n=Date.now();if(!V)return;
  var live=scLive()&&!document.hidden,busy=scOn()||!!document.querySelector('.scfull.on');
  if(V.id&&V.id!==SCID)scVwSave();
  if(live&&V.last&&!V.busy&&!busy&&V.id===SCID){var g=n-V.last;if(g<=SCIDLE)V.acc+=Math.min(g,SCVMAX)}
  V.last=live?n:0;V.busy=busy;if(live)V.id=SCID}
function scVwSave(){var V=SCVW;if(!V||!V.id)return;var sec=Math.round(V.acc/1000),id=V.id;V.acc=0;if(V.id!==SCID)V.id=null;if(sec<1)return;
  var QQ=scGet('q')||[];QQ.push({id:id,set:'g'+String(id).charAt(0)+'v_'+V.a,name:V.nm,m:'v',qs:[],sec:Math.min(3600,sec),src:SCSRC,dev:SCDEV,
    u:id+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now()});scPut('q',QQ.slice(-200));scFlush()}
/* ══ 🎧 聽完字卡（2026-10-16 老師 C4 第 6 題 A、6-2 A、C5「1 乙」：算進 📅 練習）══
   只有在家複習（SCSRC home）、登入（不是 👀 先練習）才記。頁面在「一張卡的單字和句子從頭到尾唸完」時呼叫 scHeard(站, 第幾張, 這一站幾張, 名字)；
   一站每一張都聽完 ＝ 送一筆 m:'l'（代號 g年級l_站）＝ 練習次數 ＋1、那一天算練了 1 天（同一站一天最多 3 次由 _calc.js 的 CAP 管）。
   聽完哪幾張記在這台平板（score_hd：哪一天、誰、每一站），換一天、換一個人就重來；送出以後那一站重來（再聽完一輪才再 ＋1） */
function scHeard(st,k,n,nm){if(!SCON||!SCID||SCGUEST||SCSRC!=='home'||!(n>0)||!/^[\w-]{1,16}$/.test(st))return;
  var d=Math.floor((Date.now()+288e5)/864e5),H=scGet('hd');if(!H||H.d!==d||H.id!==SCID||!H.s)H={d:d,id:SCID,s:{}};
  var a=H.s[st]=H.s[st]||[];if(a.indexOf(k)<0)a.push(k);
  if(a.length>=n){H.s[st]=[];var QQ=scGet('q')||[];QQ.push({id:SCID,set:'g'+String(SCID).charAt(0)+'l_'+st,name:nm||'🎧 聽完字卡',m:'l',qs:[],sec:0,src:SCSRC,dev:SCDEV,
    u:SCID+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now()});scPut('q',QQ.slice(-200));scFlush()}
  scPut('hd',H)}
/* 首頁的橫幅（只有首頁有 #scbar） */
function scBar(){var b=document.getElementById('scbar');if(!b)return;document.body.classList.toggle('scq',!!(SCON&&SCID&&!scAsked()));
  if(!SCON){b.innerHTML='';b.hidden=true;return}b.hidden=false;
  /* 在家複習首頁：大大的兩個好習慣（2026-10-17 C8 另 6） */
  var hab=SCSRC==='home'&&!b.classList.contains('inl');b.classList.toggle('hab',hab);b.classList.toggle('in',hab&&!!SCID);
  if(hab){b.innerHTML=!SCID?'<span class="hh">👋 開始練習 以前</span><span class="hgo"><button class="scK" id="scBarIn">🔑 先 登入</button><span class="hf">👆</span></span>'+
    '<div class="hs"><div class="hst"><span class="hn">①</span><span>先 <b>🔑 登入</b> ➜ 你的 練習 和 努力 <span class="hfl"><i>📝</i><em>➜</em><i>📊</i></span> 都會 記在 老師 的 成績 裡</span></div>'+
    '<div class="hst"><span class="hn">②</span><span>練完 ➜ 一定 按 <b>👋 登出</b> ➜ <span class="hfl"><i>🛡</i></span> 保護 自己 和 同學 的 成績</span></div></div>':
    scAsked()?'<span class="hok">✅ <b>'+SCID+'</b> 已經登入：練習 都會 記下來 📊<small>練完 一定 按 👋 登出</small></span>'+scHeroA()+'<button class="scN" id="scBarOut">👋 登出</button>':
    '<span>請問 這是您嗎？<b>'+SCID+'</b></span><button class="scY" id="scBarY">✅ 是</button><button class="scN" id="scBarOut">👋 不是，登出</button>';return}
  b.innerHTML=!SCID?'<span>👤 還沒登入</span><button class="scK" id="scBarIn">🔑 登入</button>':
    scAsked()?'<span>👤 <b>'+SCID+'</b></span>'+scHeroA()+'<button class="scN" id="scBarOut">👋 登出</button>':
    '<span>請問 這是您嗎？<b>'+SCID+'</b></span><button class="scY" id="scBarY">✅ 是</button><button class="scN" id="scBarOut">👋 不是，登出</button>'}
/* 登入以後橫幅上〔🦸 我的英雄〕（2026-10-17 第八次）；在〔🦸 我的英雄〕那一頁、總首頁（一行的小橫幅，量過放了會多出捲軸）不放 */
function scHeroA(){var b=document.getElementById('scbar');return location.pathname.indexOf('/rpg/')>=0||(b&&b.classList.contains('inl'))?'':'<a class="scH" role="button" tabindex="0" data-rpg="1">🦸 我的英雄</a>'}
/* 連結用點的（不寫 href：在家複習 r1/ 的複製程式會把 href 換路徑） */
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-rpg]');if(a){e.preventDefault();location.href=SCRPB+'rpg/index.html'}});
function scHomeLogin(){if(!SCH)return;scFullOff('scbye2');scLogin(SCH.reopen)}
if(SCON){
  (function(){var a=scGet('act');if(SCID&&a&&Date.now()-a>=SCIDLE)scOut()})();   /* 上一次動作已經超過 3 分鐘 ＝ 已經登出了 */
  ['pointerdown','keydown','touchstart','wheel'].forEach(function(k){document.addEventListener(k,function(e){
    if(SCID&&!SCGUEST&&!(e.target&&e.target.closest&&e.target.closest('#scbye2')))scAct()},true)});
  SCIT=setInterval(scIdleTick,1000);
  window.addEventListener('storage',function(e){if(e.key==='score_last'&&!e.newValue&&SCID){SCID=null;scBar()}});
  document.addEventListener('DOMContentLoaded',function(){scBar();scAskWho()});
  if(document.readyState!=='loading')setTimeout(function(){scBar();scAskWho()},0);
}
document.addEventListener('click',function(e){
  var t=e.target,c=function(s){return t.closest?t.closest(s):null};
  if(c('#scWhoY')){scOk();scAct();scFullOff('scwho');scBar();return}
  if(c('#scWhoN')){scOut();scFullOff('scwho');if(SCHOMEP)scHomeLogin();return}
  if(c('#scStay')){scAct();scIdleHide();return}
  if(c('#scByeIn')){scFullOff('scbye2');if(SCHOMEP)scHomeLogin();return}
  if(c('#scBarIn')){scHomeLogin();return}
  if(c('#scBarY')){scOk();scAct();scBar();return}
  if(c('#scBarOut')){scOut();return}
});
document.addEventListener('keydown',function(e){if(!$('#scBox'))return;
  if(/^\d$/.test(e.key))scKeyPress(e.key);else if(e.key==='Backspace')scKeyPress('b');else if(e.key==='Enter')scKeyPress('ok')});

/* 遊戲的成績畫面：蓋在遊戲上面的 #scov（score/_client.js 的 SCH） */
var SCTAG="gm";
function gOv(){var o=document.getElementById('scov');if(!o){o=document.createElement('div');o.id='scov';o.innerHTML='<div id="scovb"></div>';document.body.appendChild(o)}return o}
SCH={on:function(){return gOv().classList.contains('on')},open:function(){gOv().classList.add('on')},
 close:function(){clearTimeout(SCAUTO);gOv().classList.remove('on')},box:function(){return $('#scovb')},
 back:'<div class="scnav"><button data-sca="close">⬅ 回遊戲大廳</button></div>',
 key:function(){return 'g'+scGr()+SCTAG+'_'+(window.gid||g)},
 keyOf:function(id){return 'g'+scGr()+SCTAG+'_'+id},
 tk:function(){if($('#hub').style.display==='none')return;scTkPaint($$('#grid .gcard'),SCH.keyOf,$('#sctaskb'))},
 name:function(){var id=window.gid||g,m=META.filter(function(x){return x.id===id})[0]||{};
   return (window.SEC&&m.sec&&SEC[m.sec]?String(SEC[m.sec]).replace(/<[^>]*>/g,'').split('　')[0]+'・':'')+(m.ic||'')+' '+(m.name||id)},
 reopen:function(){SCH.close();var m=$('#scme');if(m)m.innerHTML=scMeHTML()},
 miss:function(){return '這一場　答錯整理'},
 act:function(a){SCH.close();if(a==='again')begin(window.gid||g);else if(a==='hub')hub()},
 btns:function(){return '<div class="scnav"><button class="go" data-sca="again">🔁 再玩一次</button><button data-sca="hub">🎮 換一個遊戲</button><button data-sca="close">📋 回到結算</button></div>'}};
gInit();

(function(){
  var g=$('#rateGrp');if(!g)return;
  var saved=store('rate');if(saved)setRate(saved);
  function mark(){$$('#rateGrp button').forEach(function(b){
    b.classList.toggle('on',Math.abs(parseFloat(b.getAttribute('data-r'))-RATE)<0.001)})}
  mark();
  g.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;if(!b)return;
    setRate(parseFloat(b.getAttribute('data-r')));store('rate',RATE);mark();sayStop();
  });
})();

</script>
