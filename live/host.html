<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>現場任務 大螢幕</title>
<style>
@font-face{font-family:Andika;src:url(../words/fonts/andika-700.woff2) format('woff2');font-weight:700}
/* live/_live.css — ⚡ 現場任務（大螢幕、學生平板共用；配 live/_build.js） */
:root{color-scheme:dark;--gold:#FFD54A;--ok:#3BD16F;--line:#34475C}
*{box-sizing:border-box}
html,body{margin:0;background:#05070D;color:#fff;font-family:Andika,"PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;touch-action:manipulation}
button,input{font:inherit;font-weight:700}
button{color:#fff;cursor:pointer;touch-action:manipulation}
a{color:#7FD4FF}
.scr .in{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.center{text-align:center}
h1{font-size:clamp(34px,5vh,56px);color:var(--gold);margin:10px 0}
h2{font-size:clamp(24px,3.2vh,32px);color:#7FD4FF;margin:18px 0 8px}
.note{color:#BFD3E6;font-size:clamp(20px,2.6vh,26px);margin:6px 0}
.big2{font-size:clamp(26px,3.8vh,40px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row button,.ggrid button{min-height:60px;padding:6px 18px;border-radius:16px;background:#16212D;border:3px solid var(--line);font-size:clamp(20px,2.6vh,26px)}
.row button.on,.ggrid button.on{border-color:var(--gold);color:#FFE07A;background:#2A2208}
button.big,a.big{min-height:76px;padding:8px 40px;border-radius:22px;background:#0F3323;border:4px solid var(--ok);font-size:clamp(28px,4vh,40px);margin:14px auto;color:#fff;align-items:center;justify-content:center}
button.ghost,a.ghost{display:inline-flex;align-items:center;min-height:56px;padding:6px 22px;border-radius:16px;background:#1B2633;border:3px solid #4A5A6C;font-size:22px;margin:10px;text-decoration:none;color:#fff}
input[type=password]{display:block;margin:12px auto;font-size:32px;padding:10px 18px;border-radius:16px;border:3px solid #4A5A6C;background:#0B1118;color:#fff;min-height:64px;width:min(420px,90vw);text-align:center}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.gcd{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}.gcd .gi{font-size:40px;line-height:1}.gcd b{font-size:26px}.gcd small{font-size:clamp(19px,2.3vh,26px);color:#BFD3E6;line-height:1.3}
/* 房間號碼 */
.code{font-size:clamp(110px,22vh,240px);letter-spacing:.12em;color:var(--gold);line-height:1;text-shadow:0 0 40px rgba(255,213,74,.5)}
.pls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.pl{width:96px;text-align:center;font-size:20px}.pl img{width:84px;border-radius:12px;border:3px solid #FFD54A;display:block;margin:0 auto}.noh{display:inline-flex;width:84px;height:110px;align-items:center;justify-content:center;font-size:44px;border:3px dashed #4A5A6C;border-radius:12px}
/* 題目（大螢幕） */
.qwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:12px 16px;min-height:100vh;align-items:start}
@media (max-aspect-ratio:5/4){.qwrap{grid-template-columns:1fr}}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:clamp(24px,3.4vh,36px);gap:12px;flex-wrap:wrap}.qtm b{font-size:1.5em;color:var(--gold)}
.qbar{height:16px;border-radius:999px;background:#1B2633;overflow:hidden;margin:6px 0 12px}.qbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3BD16F,#FFD54A);transition:width .2s linear}
.qq{font-size:clamp(34px,7vh,90px);line-height:1.25;text-align:center;margin:10px 0 18px;min-height:1.3em}.qq small{font-size:.55em;color:#BFD3E6}
.qos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qo{display:flex;align-items:center;gap:14px;border-radius:20px;padding:12px 18px;font-size:clamp(28px,5.4vh,66px);min-height:clamp(90px,19vh,230px);border:5px solid transparent}
.qo b{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border-radius:50%;background:rgba(0,0,0,.35);flex:0 0 auto}
.c0{background:#C62828}.c1{background:#1565C0}.c2{background:#B8860B}.c3{background:#2E7D32}
.qo.ok{border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.7);transform:scale(1.03)}.qo.no{opacity:.35}
.qctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.qctl button{min-height:56px;padding:6px 18px;border-radius:16px;background:#16212D;border:3px solid var(--line);font-size:clamp(22px,2.4vh,30px)}
/* 遊戲畫面 */
.qside{background:linear-gradient(#0E1A2C,#060A12);border:3px solid #2A3A50;border-radius:24px;padding:12px;min-height:min(88vh,980px);position:relative;overflow:hidden}
.gvt{font-size:clamp(26px,3.6vh,38px);color:var(--gold);text-align:center;margin-bottom:8px}
.rk5{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;font-size:clamp(20px,2.6vh,30px)}.rk5 span{background:#111;border-radius:12px;padding:2px 10px}.rk5 b{color:var(--gold)}
.fxb{font-style:normal;font-size:.8em;margin-left:2px;animation:fxbob .5s ease-in-out infinite alternate}@keyframes fxbob{to{transform:translateY(-6px)}}
.boss{text-align:center}.bm{font-size:clamp(130px,34vh,380px);line-height:1.1;animation:bob 1.6s ease-in-out infinite}.boss.dead .bm{animation:none}@keyframes bob{50%{transform:translateY(-10px)}}
.hpb{position:relative;height:60px;border-radius:999px;background:#2A0E0E;border:4px solid #FF6B6B;overflow:hidden}.hpb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FF3B3B,#FF9F43);transition:width .8s ease-out}.hpb span{position:relative;font-size:clamp(24px,3vh,34px);line-height:52px}
.lanes{display:grid;gap:3px}.ln{display:grid;grid-template-columns:2.4em 1fr 1.6em;align-items:center;font-size:clamp(18px,2.2vh,26px)}.ln .tr{position:relative;height:clamp(26px,3.6vh,40px);border-bottom:2px dashed #34475C}.ln .car{position:absolute;bottom:0;font-size:clamp(24px,3.4vh,38px);transition:left 1s ease-out;transform:scaleX(-1)}
.sp{position:relative;height:66vh;display:flex;justify-content:space-around;align-items:flex-end}.sp .moon{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:70px}
.sp .rk{position:relative;width:40%;height:80%;border-left:3px dashed #34475C;text-align:center}.sp .rkr{position:absolute;left:50%;transform:translateX(-50%);font-size:70px;transition:bottom 1s ease-out}.sp .rk b{position:absolute;bottom:-34px;left:0;right:0;font-size:22px}
.mp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.mp i{aspect-ratio:1;border-radius:10px;background:#1B2633;transition:background .6s}.mp i.t0{background:#1E88E5}.mp i.t1{background:#E53935}
.mps{display:flex;justify-content:space-around;margin-top:8px;font-size:26px}
.tw{display:flex;align-items:flex-end;gap:4px;height:64vh}.tc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:16px}
.tcl{width:100%;background:linear-gradient(#5AB0FF,#1E3A5F);border-radius:8px 8px 0 0;position:relative;transition:height 1s ease-out;min-height:4px}.tci{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:30px;border-radius:6px}.tcl .noh{width:30px;height:34px;font-size:20px}
.pe{text-align:center}.pei{font-size:clamp(140px,26vh,260px);line-height:1.1;transition:transform .6s}.pei.st4{animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 0 20px #FFD54A)}
.pes{font-size:34px}.pes span{opacity:.3}.pes span.on{opacity:1}
.sh{position:relative;width:min(100%,64vh);aspect-ratio:1;margin:0 auto}.tgt{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#E53935 0 8%,#fff 8% 16%)}
.dt{position:absolute;transform:translate(-50%,-50%);font-style:normal;background:#111;color:#FFE07A;border:2px solid #FFE07A;border-radius:999px;padding:0 6px;font-size:16px}
.trs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:52px;margin-top:20%}.trs em{font-style:normal;font-size:26px;color:#4A5A6C}.trs .now{animation:bob 1s ease-in-out infinite}
.sf{position:relative;height:64vh}.sf svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:40%}.sfr{position:absolute;font-size:34px;transition:bottom 1s ease-out;text-align:center;line-height:1}.sfr b{display:block;font-size:14px}
.kg{text-align:center}.kpod{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:10px}
.kp{display:flex;flex-direction:column;align-items:center;width:30%;font-size:22px}.kp em{font-style:normal;color:var(--gold)}.kpi{width:min(100%,130px);border-radius:12px;border:3px solid var(--gold)}.kp .noh{width:90px;height:120px}
.kb{width:100%;background:linear-gradient(#FFD54A,#B8860B);color:#000;font-size:40px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
.kp.p1 .kb{height:120px}.kp.p2 .kb{height:80px}.kp.p3 .kb{height:50px}.kc{font-size:30px;margin-top:14px}
.eres{font-size:clamp(34px,5vh,56px);margin:10px 0}.epod .kpi{width:min(100%,170px)}
.efw{position:relative;min-height:10px}.fwt{font-size:26px}.fwi{width:110px;border-radius:12px;margin:6px;border:3px solid var(--gold)}
.fwx{position:absolute;inset:0;pointer-events:none}.fwx i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);animation:fwb 1.4s ease-out infinite}
@keyframes fwb{0%{transform:none;opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
/* 學生 */
.cbox{display:flex;justify-content:center;gap:14px;margin:16px 0}.cbox i{width:clamp(70px,12vw,110px);height:clamp(90px,14vh,130px);border-radius:18px;border:4px solid #4A5A6C;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:clamp(50px,8vh,80px)}
.cbox i.f{border-color:var(--gold);color:var(--gold)}.cbox i.cur{border-color:#7FD4FF;animation:blink 1s infinite}@keyframes blink{50%{border-color:#16212D}}
.kpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px;margin:0 auto}.kpad button{min-height:clamp(64px,9vh,90px);border-radius:18px;background:#16212D;border:3px solid var(--line);font-size:clamp(32px,5vh,46px)}
.kpad button:last-child{grid-column:2}
.wimg{width:min(50vw,240px);border-radius:16px;border:4px solid var(--gold);display:block;margin:14px auto}
.sqw{max-width:1100px;margin:0 auto;padding:10px 14px 30px;position:relative}
.sqq{font-size:clamp(26px,4vh,44px);text-align:center;margin:8px 0;line-height:1.3}.sqq small{font-size:.6em;color:#BFD3E6}.sqq.zoom{font-size:clamp(36px,6vh,64px)}
.sqh[hidden]{display:none}.sqh{background:#0F2A1C;border:3px solid var(--ok);border-radius:16px;padding:6px 14px;font-size:24px;display:flex;align-items:center;gap:10px}.hpet{width:48px;border-radius:8px}
.sqm{text-align:center;min-height:1.3em}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.so{display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 16px;font-size:clamp(24px,3.8vh,40px);min-height:clamp(90px,16vh,170px);border:5px solid transparent;text-align:left}
.so b{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:rgba(0,0,0,.35);flex:0 0 auto}
.so:disabled{cursor:default}.so.cut{opacity:.15}.so.pk{border-color:#fff;box-shadow:0 0 24px rgba(255,255,255,.6)}.so.ok{border-color:#fff;box-shadow:0 0 30px #fff}.so.no{opacity:.35}
.sr{text-align:center;font-size:clamp(30px,4.6vh,48px);margin-top:12px}.sr.ok{color:#7BF0A8}.sr.no{color:#FFB38A}.sr.wait{color:#BFD3E6}.ss{text-align:center;font-size:28px}
.kch{position:fixed;right:16px;bottom:16px;min-height:80px;padding:8px 26px;border-radius:999px;background:#3A2E08;border:4px solid var(--gold);font-size:34px}.kch.pop{animation:kpop .3s}@keyframes kpop{50%{transform:scale(1.2)}}
.et{font-size:clamp(34px,5vh,52px);color:var(--gold)}
/* 🐾 禮物盒 */
#gift{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}#gift.on{display:flex}
.gb{background:#0B1118;border:4px solid var(--gold);border-radius:26px;padding:18px;max-width:640px;width:100%;text-align:center}
.gt{font-size:clamp(26px,3.8vh,38px);color:#FFE07A}.gt2{font-size:clamp(24px,3.2vh,32px);margin:10px 0}
.gpet{position:relative;display:inline-block;margin:10px auto}.gpi{width:150px;border-radius:14px;border:3px solid #7FD4FF}.gpet .gbox{position:absolute;right:-30px;bottom:-10px;font-size:64px;animation:hop .5s ease-in-out 3}
.gpet.walk{animation:walk 1s ease-out}@keyframes walk{from{transform:translateX(-60vw)}}@keyframes hop{50%{transform:translateY(-26px)}}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grow button{min-height:110px;border-radius:20px;border:4px solid #7FD4FF;background:#0E2240;font-size:clamp(26px,3.6vh,34px)}.grow button small{display:block;font-size:20px;color:#BFD3E6}
.grow button:last-child{border-color:var(--gold);background:#2A2208}
.gbx{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:10px 0}.bx{font-size:clamp(64px,10vh,96px);background:none;border:0;min-width:96px;min-height:96px;animation:hop .45s ease-in-out 3 both}
.gopen{position:relative;height:clamp(240px,36vh,330px)}.lid{position:absolute;left:50%;top:40%;font-size:90px;transform:translate(-50%,-50%);animation:lid .7s ease-out forwards}@keyframes lid{to{transform:translate(-50%,-160%) rotate(-25deg);opacity:0}}
.ghero{position:absolute;left:50%;top:0;transform:translateX(-50%);animation:fly .8s cubic-bezier(.2,1.5,.4,1) .4s both}@keyframes fly{from{transform:translate(-50%,60%) scale(.2);opacity:0}}
.ghi{width:clamp(150px,22vh,210px);border-radius:16px;border:4px solid var(--gold);box-shadow:0 0 30px rgba(255,213,74,.6)}.say{position:absolute;left:78%;top:4%;white-space:nowrap;background:#fff;color:#000;border-radius:18px;padding:4px 14px;font-size:26px}
.gget{font-size:clamp(26px,3.6vh,36px);margin-top:8px}.gget span{font-size:.8em;color:#BFD3E6}.goth{font-size:20px;color:#9FB3C8;margin-top:6px}
.gok{min-height:64px;padding:6px 40px;border-radius:18px;background:#0F3323;border:3px solid var(--ok);font-size:30px;margin-top:12px}
/* 干擾（好笑、不扣分、≦ 3 秒） */
#fxo{position:fixed;inset:0;pointer-events:none;z-index:30;display:none}#fxo.on{display:block}
.fxt{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#3A2E08;border:3px solid var(--gold);border-radius:18px;padding:6px 18px;font-size:clamp(22px,3vh,30px);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.bub{position:absolute;bottom:-60px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(160,220,255,.5) 40%,rgba(160,220,255,.15));animation:bub 2s ease-in forwards}@keyframes bub{to{transform:translateY(-115vh)}}
#fxo .met,#fxo .slp{pointer-events:auto;position:absolute;font-size:64px;background:none;border:0;min-width:80px;min-height:80px;animation:fall 3s linear}@keyframes fall{from{transform:translateY(-40vh)}}
#fxo .slp{left:50%;top:40%;transform:translate(-50%,-50%);animation:none;background:#0B1118;border:4px solid #7FD4FF;border-radius:20px;padding:10px 20px;font-size:28px}.spi{width:120px;border-radius:12px;display:block;margin:0 auto 6px;animation:zz 1s ease-in-out infinite}@keyframes zz{50%{transform:rotate(-6deg)}}
.spin .sos{animation:spin1 1.2s ease-in-out}@keyframes spin1{to{transform:rotate(360deg)}}
.fog .sos,.fog .sqq{filter:blur(6px);transition:filter .3s}
.wind .sqq{animation:sway .4s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.float .so{animation:flt 1.2s ease-in-out infinite alternate}.float .so:nth-child(2n){animation-delay:.4s}@keyframes flt{to{transform:translateY(-14px)}}
.shake{animation:shk .25s linear 8}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

</style></head><body class="host">
<script src="../score/url.js"></script><script src="fb.js"></script>
<div class="scr" id="hpw" hidden><div class="in center"><h1>⚡ 現場任務</h1><div class="note">老師 密碼（跟 老師看板 一樣）</div>
 <input type="password" id="pw" autocomplete="current-password"><button id="pwgo" class="big">🔑 進去</button><div id="pwm" class="note"></div>
 <div class="note">還沒 設定 Firebase？➜ <a href="setup.html">大字版 設定頁</a></div></div></div>
<div class="scr" id="hset" hidden><div class="in"></div></div>
<div class="scr" id="hlob" hidden><div class="in center"><div class="note big2">學生 打開 <b>⚡ 現場任務</b>（首頁 的 大按鈕）➜ 輸入：</div><div id="code" class="code"></div><div id="lgame" class="note big2"></div>
 <div class="note big2">👥 已經 加入 <b id="lcnt">0</b> 人</div><div id="lpl" class="pls"></div><button id="go" class="big">▶ 開始</button><div id="lmsg" class="note"></div><button id="close" class="ghost">✕ 關掉 房間</button></div></div>
<div class="scr" id="hq" hidden><div class="qwrap"><div class="qmain"><div class="qtop"><span id="qn"></span><span class="qtm">⏱ <b id="qt">15</b></span><span id="qa"></span></div><div class="qbar"><i id="qbar"></i></div>
 <div id="qq" class="qq"></div><div id="qo" class="qos"></div>
 <div class="qctl"><button id="hn">⏭ 下一步</button><button id="hp">⏸ 停在 這一題</button><button id="hint">😆 干擾：開</button></div></div><div class="qside" id="gv"></div></div></div>

   量測（live/_verify.js）：LIVE_DB 指到量測自己開的假伺服器（同樣的 REST＋串流），**絕對不連真的 Firebase**。
   資料只有：房間號碼（4 碼）、5 碼、答了第幾個、分數、英雄圖的代號。**沒有姓名**。 */
var LDB=(function(){
  var URL=String(window.LIVE_DB||'').replace(/\/+$/,''),L={};
  function on(){return !!URL}
  function seg(p){return String(p).replace(/^\/+|\/+$/g,'').split('/').filter(function(x){return x!==''})}
  function getIn(t,p){var a=seg(p);for(var i=0;i<a.length;i++){if(t==null||typeof t!=='object')return null;t=t[a[i]]}return t==null?null:t}
  function setIn(t,p,v){var a=seg(p);if(!a.length)return v;var r=t&&typeof t==='object'?t:{},o=r;
    for(var i=0;i<a.length-1;i++){if(!o[a[i]]||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]]}
    if(v==null)delete o[a[a.length-1]];else o[a[a.length-1]]=v;return r}
  function clone(v){return v==null?null:JSON.parse(JSON.stringify(v))}
  /* ── 真的（Firebase REST）── */
  var ES={};
  function listen(p,cb){p=seg(p).join('/');(L[p]=L[p]||[]).push(cb);
    if(!URL)return function(){};
    if(!ES[p]){var M={v:null},src=new EventSource(URL+'/'+p+'.json');ES[p]={src:src,M:M};
      var up=function(e,patch){var d;try{d=JSON.parse(e.data)}catch(x){return}if(!d)return;
        if(patch){for(var k in d.data||{})M.v=setIn(M.v,d.path+'/'+k,d.data[k])}else M.v=setIn(M.v,d.path,d.data);
        (L[p]||[]).forEach(function(f){f(clone(M.v))})};
      src.addEventListener('put',function(e){up(e,false)});src.addEventListener('patch',function(e){up(e,true)})}
    else setTimeout(function(){cb(clone(ES[p].M.v))},0);
    return function(){off(p,cb)}}
  function off(p,cb){L[p]=(L[p]||[]).filter(function(f){return f!==cb});if(!L[p].length&&ES[p]){ES[p].src.close();delete ES[p]}}
  function req(m,p,v){if(!URL)return Promise.resolve(false);
    return fetch(URL+'/'+seg(p).join('/')+'.json',{method:m,body:m==='DELETE'?undefined:JSON.stringify(v)}).then(function(r){return r.ok},function(){return false})}
  function get(p){if(!URL)return Promise.resolve(null);
    return fetch(URL+'/'+seg(p).join('/')+'.json').then(function(r){return r.json()},function(){return null})}
  return {on:on,listen:listen,set:function(p,v){return req('PUT',p,v)},patch:function(p,v){return req('PATCH',p,v)},del:function(p){return req('DELETE',p)},get:get}
})();

  who.forEach(function(id){H.fxc[id]=(H.fxc[id]||0)+1;H.fxNow[id]=F.k;LDB.set('rooms/'+H.code+'/fx/'+id,{k:F.k,qi:H.qi,at:now})});
  H.log.push({qi:H.qi,k:F.k,n:who.length});drawGame()}
function drawQ(){var q=H.Q[H.qi];if(!q)return;$('#qn').textContent=(H.qi+1)+' ／ '+H.n;$('#qq').innerHTML=q.t;
  $('#qo').innerHTML=q.o.map(function(t,i){return '<div class="qo c'+i+(H.phase==='rev'&&i===q.a?' ok':'')+(H.phase==='rev'&&i!==q.a?' no':'')+'"><b>'+'ABCD'.charAt(i)+'</b><span>'+t+'</span></div>'}).join('');
  $('#qa').textContent='✋ 已經 答了 '+Object.keys(H.A).length+' ／ '+ids().length+' 人'}
/* ── 公布 ── */
function reveal(){if(H.phase!=='q')return;H.phase='rev';clearTimeout(H.tm);clearTimeout(H.tm2);var q=H.Q[H.qi],sc={},ok1={},cheer=0,dmg=0;
  ids().forEach(function(id){var a=H.A[id],f=(a&&a.f)||{},ok=!!a&&(Object.prototype.toString.call(a.k)==='[object Array]'?a.k.indexOf(q.a)>=0:a.k===q.a),s=LV.score(ok,a?a.ms:H.dur,H.dur,f);
    if(f.met)s+=30*Math.min(3,+f.met||0);
    if(ok&&(H.fxNow[id]==='lock'||H.fxNow[id]==='wave'))s+=50;
    if(ok){H.st[id]++;H.okc[id]++;dmg+=10+Math.min(20,Math.floor((+(H.P[id]||{}).pw||0)/100))}else if(!f.sh)H.st[id]=0;
    if(f.ch)cheer++;sc[id]=s;ok1[id]=ok?1:0;H.tot[id]+=s});
  gsUp(ok1,dmg,cheer);
  LDB.patch('rooms/'+H.code+'/m',{phase:'rev',rev:{qi:H.qi,a:q.a,h:q.h},r:{qi:H.qi,sc:sc,tot:H.tot,ok:ok1,st:H.st,okc:H.okc},gs:H.gs});
  H.sc=sc;drawQ();drawGame();
  if(!H.pause)H.tm=setTimeout(next,4500)}
/* ── 遊戲畫面（大螢幕右邊）── */
function gs0(){var n=Math.max(1,ids().length);return {hp:n*Math.max(3,Math.round(H.n*.6))*15,hp0:n*Math.max(3,Math.round(H.n*.6))*15,fuel:[0,0],cells:[],pet:0,tr:0,cheer:0}}
function team(id){return seatOf(id)%2?0:1}
function gsUp(ok1,dmg,cheer){var G=H.gs;G.hp=Math.max(0,G.hp-dmg-cheer*50);G.cheer+=cheer;
  ids().forEach(function(id){if(ok1[id]){G.fuel[team(id)]++;if(G.cells.length<30)G.cells.push(team(id))}});
  var tot=0,max=ids().length*H.n;ids().forEach(function(id){tot+=H.okc[id]});G.pet=Math.min(4,Math.floor((tot+G.cheer)/Math.max(1,max)*5));G.tr=Math.min(6,Math.floor((tot+G.cheer)/Math.max(1,max)*7))}
function rank(){return ids().map(function(id){return {id:id,v:H.tot[id]||0}}).sort(function(a,b){return b.v-a.v||(a.id<b.id?-1:1)})}
function heroI(id,cls){var p=H.P[id]||{};return p.h?'<img class="'+(cls||'')+'" src="'+LV.img(BASE,p.h)+'" alt="">':'<span class="noh '+(cls||'')+'">🦸</span>'}
function drawGame(){var el=$('#gv');if(!el)return;var G=H.gs,k=H.game,L=ids(),R=rank(),mx=Math.max(1,R.length?R[0].v:1),h='<div class="gvt">'+LV.game(k).ic+' '+LV.game(k).nm+'</div>';
  var fxi=function(id){return H.fxNow&&H.fxNow[id]?'<i class="fxb">'+LV.game(k).fx.ic+'</i>':''};
  if(k==='boss'){var p=G.hp/G.hp0*100;h+='<div class="boss'+(G.hp<=0?' dead':'')+'"><div class="bm">'+(G.hp<=0?'💥':'🐲')+'</div><div class="hpb"><i style="width:'+p+'%"></i><span>'+(G.hp<=0?'🎉 全班 打倒 魔王！':'❤ '+G.hp+' ／ '+G.hp0)+'</span></div></div>'}
  else if(k==='race')h+='<div class="lanes">'+L.map(function(id){return '<div class="ln"><b>'+seatOf(id)+'</b><span class="tr"><span class="car" style="left:calc('+((H.tot[id]||0)/Math.max(mx,H.n*600)*88)+'%)">🏎'+fxi(id)+'</span></span><span class="fl">🏁</span></div>'}).join('')+'</div>';
  else if(k==='space'){var f=G.fuel,top=Math.max(4,Math.ceil(L.length*H.n/2*.7));h+='<div class="sp"><div class="moon">🌕</div>'+[0,1].map(function(t){return '<div class="rk"><div class="rkr" style="bottom:'+Math.min(100,f[t]/top*100)+'%">🚀</div><b>'+(t?'雙號隊':'單號隊')+' '+f[t]+'</b></div>'}).join('')+'</div>'}
  else if(k==='map'){var c=G.cells,cnt=[0,0];c.forEach(function(t){cnt[t]++});h+='<div class="mp">'+Array.apply(null,{length:30}).map(function(_,i){return '<i class="'+(i<c.length?'t'+c[i]:'')+'"></i>'}).join('')+'</div><div class="mps"><b class="t0">🔵 單號隊 '+cnt[0]+'</b><b class="t1">🔴 雙號隊 '+cnt[1]+'</b></div>'}
  else if(k==='tower')h+='<div class="tw">'+L.map(function(id){var n=H.okc[id]||0;return '<div class="tc"><div class="tcl" style="height:'+(n/Math.max(1,H.n)*100)+'%">'+heroI(id,'tci')+fxi(id)+'</div><b>'+seatOf(id)+'</b></div>'}).join('')+'</div>';
  else if(k==='pet')h+='<div class="pe"><div class="pei st'+G.pet+'">'+['🥚','🐣','🐥','🦅','🐉'][G.pet]+'</div><div class="pes">'+['🥚','🐣','🐥','🦅','🐉'].map(function(x,i){return '<span class="'+(i<=G.pet?'on':'')+'">'+x+'</span>'}).join('➜')+'</div></div>';
  else if(k==='shoot')h+='<div class="sh"><div class="tgt"></div>'+L.map(function(id,i){var s=(H.sc&&H.sc[id])||0,r=s?Math.max(4,46-s/1000*42):0,a=i*137.5*Math.PI/180;return s?'<i class="dt" style="left:calc(50% + '+(Math.cos(a)*r)+'%);top:calc(50% + '+(Math.sin(a)*r)+'%)">'+seatOf(id)+'</i>':''}).join('')+'</div>';
  else if(k==='treasure')h+='<div class="trs">'+Array.apply(null,{length:7}).map(function(_,i){return '<span class="'+(i<G.tr?'op':i===G.tr?'now':'')+'">'+(i<G.tr?'💰':i===G.tr?'🚶':'🎁')+'</span>'}).join('<em>➜</em>')+'</div>';
  else if(k==='surf')h+='<div class="sf"><svg viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M0 90Q50 40 100 80T200 70T300 60T400 70V120H0Z" fill="#1E88E5"/><path d="M0 100Q60 70 120 95T240 90T400 95V120H0Z" fill="#64B5F6"/></svg>'+
    L.map(function(id,i){var s=Math.min(8,H.st[id]||0);return '<div class="sfr" style="left:'+(4+i*(92/Math.max(1,L.length)))+'%;bottom:'+(20+s*9)+'%">🏄<b>'+seatOf(id)+'</b>'+fxi(id)+'</div>'}).join('')+'</div>';
  else{var t3=R.slice(0,3),cc=0;for(var c2 in (H.ch||{}))cc+=+H.ch[c2]||0;h+='<div class="kg"><div class="kpod">'+[1,0,2].map(function(n){var x=t3[n];return '<div class="kp p'+(n+1)+'">'+(x?heroI(x.id,'kpi')+'<b>'+seatOf(x.id)+' 號</b><em>'+x.v+'</em>':'')+'<div class="kb">'+(n+1)+'</div></div>'}).join('')+'</div><div class="kc">📣 台下 加油 '+cc+' 次</div></div>'}
  h+='<div class="rk5">'+R.slice(0,5).map(function(x,i){return '<span><b>'+(i+1)+'</b> '+seatOf(x.id)+' 號 '+x.v+'</span>'}).join('')+'</div>';
  el.innerHTML=h}
/* ── 結束＋發獎勵 ── */
function end(){H.phase='end';clearTimeout(H.tm);LDB.patch('rooms/'+H.code+'/m',{phase:'end',r:{qi:H.qi,tot:H.tot,okc:H.okc,st:H.st},gs:H.gs});scr('hend');
  var R=rank(),G=H.gs,k=H.game,res=k==='boss'?(G.hp<=0?'🎉 全班 打倒 魔王！':'🐲 魔王 還剩 '+G.hp+' 血，下次 再來！'):k==='space'||k==='map'?(function(){var a=k==='space'?G.fuel:[G.cells.filter(function(t){return !t}).length,G.cells.filter(function(t){return t}).length];return a[0]===a[1]?'🤝 兩隊 平手！':(a[0]>a[1]?'🔵 單號隊':'🔴 雙號隊')+' 贏了！'})():
    k==='pet'?'全班的 寵物 進化到 '+['🥚','🐣','🐥','🦅','🐉'][G.pet]:k==='treasure'?'全班 打開 '+G.tr+' 個 寶箱 💰':'';
  $('#eres').textContent=res;
  $('#epod').innerHTML=[1,0,2].map(function(n){var x=R[n];return '<div class="kp p'+(n+1)+'">'+(x?heroI(x.id,'kpi')+'<b>'+seatOf(x.id)+' 號</b><em>'+x.v+' 分</em>':'')+'<div class="kb">'+['🥇','🥈','🥉'][n]+'</div></div>'}).join('');
  LDB.get('rooms/'+H.code+'/rw').then(function(rw){H.rw=rw||{};var fw=Object.keys(H.rw).filter(function(id){return (H.rw[id]||[]).indexOf('fw')>=0});
    if(fw.length)$('#efw').innerHTML='<div class="fwt">🎇 煙火 送給：</div>'+fw.map(function(id){return heroI(id,'fwi')}).join('')+fwHTML();
    $('#erw').textContent='🎁 這一場 抽到 的 獎勵：'+Object.keys(H.rw).reduce(function(s,id){return s+(H.rw[id]||[]).length},0)+' 個（按 下面 的 按鈕 發 到 每一個人 的 英雄）'})}
function fwHTML(){var h='<div class="fwx">',C=['#FFD54A','#FF6B6B','#7FD4FF','#7BF0A8','#D9A8FF'];for(var n=0;n<5;n++){var x=10+n*20,y=20+(n%2)*25;for(var i=0;i<14;i++){var a=i/14*Math.PI*2;h+='<i style="left:'+x+'%;top:'+y+'%;--c:'+C[n]+';--x:'+Math.round(Math.cos(a)*90)+'px;--y:'+Math.round(Math.sin(a)*90)+'px;animation-delay:'+(n*.3)+'s"></i>'}}return h+'</div>'}
/* 每一個人：參加 ＋10 經驗值、答對 1 題 ＋1 金幣；抽到的獎勵照 LV.RW */
function bonusList(){return ids().map(function(id){var rw=H.rw[id]||[],c=H.okc[id]||0,x=10,o={id:id,c:c,x:x,tre:[],title:'',snack:0,medal:0};
  rw.forEach(function(k){if(k==='c2')o.c+=c;else if(k==='x2')o.x+=x;else if(k==='frag')o.c+=20;else if(k==='title')o.title='⚡ 現場任務 勇者';else if(k==='emo')o.tre.push('t06');else if(k==='fx')o.tre.push('t04');else if(k==='snack')o.snack++;else if(k==='medal')o.medal++;else if(k==='box')o.c+=30});return o})}
function give(){var b=$('#give'),m=$('#gm');if(H.done){m.textContent='✅ 已經 發過了';return}b.disabled=true;m.textContent='⏳ 發獎勵中…';
  post({a:'rpgb',pw:H.pw,room:H.code,t0:H.start,list:bonusList()}).then(function(j){if(j&&j.ok){H.done=true;b.textContent='✅ 獎勵 發好了';m.textContent='✅ 發好了（'+j.n+' 人）：〔🦸 我的英雄〕拿到 獎勵、老師看板 練習次數 ＋1';LDB.patch('rooms/'+H.code+'/m',{given:1})}else{b.disabled=false;m.textContent='❌ 沒有 發成（'+((j&&j.err)||'')+'）'}},
    function(){b.disabled=false;m.textContent='📶 連不到 成績系統'})}
function closeRoom(){if(H.code)LDB.del('rooms/'+H.code);location.reload()}
document.addEventListener('click',function(e){var t=e.target,c=function(s){return t.closest?t.closest(s):null},b;
  if(c('#pwgo')){pwGo();return}
  if((b=c('[data-sg]'))){H.g=+b.getAttribute('data-sg');H.cls='';setDraw();return}
  if((b=c('[data-sc]'))){H.cls=b.getAttribute('data-sc');setDraw();return}
  if((b=c('[data-sk]'))){H.game=b.getAttribute('data-sk');setDraw();return}
  if((b=c('[data-sb]'))){var k=H.g+'_'+b.getAttribute('data-sb');H.sets[k]=!H.sets[k];setDraw();return}
  if((b=c('[data-sn]'))){H.n=+b.getAttribute('data-sn');setDraw();return}
  if((b=c('[data-si]'))){H.int=+b.getAttribute('data-si');setDraw();if(H.code)LDB.patch('rooms/'+H.code+'/m',{int:H.int});return}
  if(c('#mk')){mkRoom();return}
  if(c('#go')){start();return}
  if(c('#hp')){H.pause=!H.pause;$('#hp').textContent=H.pause?'▶ 繼續':'⏸ 停在 這一題';if(H.pause&&H.phase==='rev')clearTimeout(H.tm);if(!H.pause&&H.phase==='rev')next();return}
  if(c('#hn')){if(H.phase==='q')reveal();else next();return}
  if(c('#hint')){H.int=H.int?0:1;$('#hint').textContent=H.int?'😆 干擾：開':'✖ 干擾：關';LDB.patch('rooms/'+H.code+'/m',{int:H.int});return}
  if(c('#give')){give();return}
  if(c('#close')){if(confirm('關掉 這個 房間？（學生 會 回到 輸入 號碼）'))closeRoom();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='pw')pwGo()});
(function(){try{var p=sessionStorage.getItem('lvpw');if(p&&LDB.on()){H.pw=p;setDraw();scr('hset');return}}catch(e){}scr('hpw')})();

</script></body></html>
