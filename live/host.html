<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>現場任務 大螢幕</title>
<style>
@font-face{font-family:Andika;src:url(../words/fonts/andika-700.woff2) format('woff2');font-weight:700}
/* live/_live.css — ⚡ 現場任務（大螢幕、學生平板共用；配 live/_build.js）。2026-10-18 第十一次 重做：精緻、有質感（漸層 徽章、形狀 按鈕、圓環 倒數、排行榜 會 動、場景 用 學生 自己 的 英雄） */
:root{color-scheme:dark;--gold:#FFD54A;--ok:#2BD46A;--line:#34475C;--k0:#E21B3C;--k1:#1368CE;--k2:#D89E00;--k3:#26890C}
*{box-sizing:border-box}
html,body{margin:0;color:#fff;font-family:Andika,"PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;touch-action:manipulation;background-color:#060912;background-image:radial-gradient(1200px 700px at 15% -10%,#1C1446 0,transparent 60%),radial-gradient(1000px 700px at 110% 110%,#0B2A3E 0,transparent 60%);background-repeat:no-repeat;background-attachment:fixed}
button,input{font:inherit;font-weight:700}
button{color:#fff;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
a{color:#7FD4FF}
.scr .in{max-width:1320px;margin:0 auto;padding:14px 16px 40px}
.center{text-align:center}.cen{justify-content:center}.c{text-align:center}
h1{font-size:clamp(34px,5vh,58px);color:var(--gold);margin:10px 0;letter-spacing:.04em}
h2{font-size:clamp(24px,3.2vh,32px);color:#9FD8FF;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
h3{font-size:clamp(22px,2.8vh,28px);color:#9FD8FF;margin:14px 0 6px}
.note{color:#BFD3E6;font-size:clamp(20px,2.6vh,26px);margin:6px 0}
.big2{font-size:clamp(26px,3.8vh,40px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row button{min-height:60px;padding:6px 18px;border-radius:16px;background:linear-gradient(#1B2836,#121B26);border:3px solid var(--line);font-size:clamp(20px,2.6vh,26px)}
.row button.on{border-color:var(--gold);color:#FFE07A;background:linear-gradient(#3A2E08,#221A04);box-shadow:0 0 18px rgba(255,213,74,.25)}
button.big,a.big{min-height:76px;padding:8px 44px;border-radius:22px;background:linear-gradient(#22C766,#128A43);border:0;box-shadow:0 6px 0 #0B5A2B,0 10px 24px rgba(0,0,0,.5);font-size:clamp(28px,4vh,40px);margin:14px auto;color:#fff;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #0B5A2B}
button.ghost,a.ghost{display:inline-flex;align-items:center;min-height:56px;padding:6px 22px;border-radius:16px;background:#1B2633;border:3px solid #4A5A6C;font-size:22px;margin:10px;text-decoration:none;color:#fff}
input[type=password]{display:block;margin:12px auto;font-size:32px;padding:10px 18px;border-radius:16px;border:3px solid #4A5A6C;background:#0B1118;color:#fff;min-height:64px;width:min(420px,90vw);text-align:center}
/* ── 遊戲 徽章（漸層 圓角 方塊 ＋ 亮面）── */
.badge{position:relative;display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;flex:0 0 auto;border-radius:20px;background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.45);overflow:hidden}
.badge::after{content:'';position:absolute;left:-20%;top:-60%;width:140%;height:90%;background:radial-gradient(ellipse at center,rgba(255,255,255,.45),transparent 70%)}
.badge span{position:relative;z-index:1;font-size:36px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.badge.sm{width:44px;height:44px;border-radius:14px}.badge.sm span{font-size:24px}
.badge.lg{width:92px;height:92px;border-radius:26px}.badge.lg span{font-size:52px}
.badge.xl{width:150px;height:150px;border-radius:40px;animation:bdg 2.4s ease-in-out infinite}.badge.xl span{font-size:88px}
@keyframes bdg{50%{transform:translateY(-8px) rotate(-3deg)}}
/* ── 怎麼玩：3 步，一步一步 亮（一直 重播）── */
.how{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:14px auto;max-width:1200px}
.how .hw{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px;border-radius:22px;background:linear-gradient(#17233A,#0E1626);border:3px solid #2A3D5C;
  animation:hwOn 7.5s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s)}
.how .hn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#000;font-size:24px}
.how .hi{font-size:clamp(46px,7vh,76px);line-height:1.1;animation:hwPop 7.5s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s)}
.how .ht{font-size:clamp(20px,2.6vh,28px);text-align:center;line-height:1.35}
.how .ha{align-self:center;font-style:normal;font-size:36px;color:var(--gold);opacity:.35;animation:haOn 7.5s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s + .8s)}
@keyframes hwOn{0%{opacity:.35;transform:scale(.96);border-color:#2A3D5C}8%,70%{opacity:1;transform:scale(1);border-color:var(--gold);box-shadow:0 0 26px rgba(255,213,74,.3)}100%{opacity:.35;transform:scale(.96)}}
@keyframes hwPop{0%,4%{transform:scale(.6)}10%{transform:scale(1.18)}16%,100%{transform:scale(1)}}
@keyframes haOn{0%{opacity:.35}10%,70%{opacity:1;transform:translateX(4px)}100%{opacity:.35}}
.how.v{flex-direction:column;max-width:720px}.how.v .hw{flex-direction:row;text-align:left;gap:14px}.how.v .hw .ht{text-align:left}.how.v .ha{transform:rotate(90deg);font-size:28px}
.how.v.sm{gap:4px;margin:8px auto}.how.v.sm .hw{padding:6px 10px;gap:10px}.how.v.sm .hi{font-size:clamp(30px,4.4vh,46px)}.how.v.sm .ht{font-size:clamp(19px,2.3vh,25px)}.how.v.sm .hn{width:34px;height:34px;font-size:20px}.how.v.sm .ha{font-size:20px;margin:-4px 0}.how.big .ht{font-size:clamp(26px,3.6vh,40px)}.how.big .hi{font-size:clamp(70px,11vh,120px)}
/* ── 設定（一頁）── */
.sett{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.sn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#000;font-size:24px}
.gsep{width:18px}.clsb{min-width:110px;font-size:clamp(24px,3vh,32px)!important}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.gcd{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:20px;background:linear-gradient(#18243A,#101827);border:3px solid var(--line);min-height:96px}
.gcd.on{border-color:var(--gold);background:linear-gradient(#3A2E08,#1E1704);box-shadow:0 0 22px rgba(255,213,74,.3)}
.gcd.first{grid-column:1/-1}.gcd.first .badge{width:84px;height:84px}.gcd.first .badge span{font-size:46px}
.gtx{display:flex;flex-direction:column;gap:4px;min-width:0}.gtx b{font-size:clamp(22px,2.8vh,30px)}.gtx b em{font-style:normal;font-size:clamp(20px,2.4vh,26px);background:#E0389A;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.gtx small{font-size:clamp(19px,2.4vh,26px);color:#BFD3E6;line-height:1.3}
.mkrow{margin-top:16px}
/* ── 等人（大螢幕）：左 QR、右 遊戲＋怎麼玩＋加入 的 英雄 ── */
.lob{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:20px;padding:16px;min-height:100vh;align-items:start}
@media (max-aspect-ratio:5/4){.lob{grid-template-columns:1fr}}
.lobl{background:linear-gradient(#18243A,#0C1320);border:3px solid #2A3D5C;border-radius:28px;padding:16px;text-align:center}
.lqrt{font-size:clamp(28px,4vh,44px);color:var(--gold)}
.lqr{background:#fff;border-radius:22px;padding:10px;margin:8px auto;width:min(100%,38vh,420px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}.lqr svg{width:100%;height:100%;display:block}
.lurl{font-size:clamp(18px,2.2vh,24px);color:#9FB3C8;word-break:break-all;margin-bottom:6px}
.lgame{display:flex;align-items:center;gap:16px;font-size:clamp(28px,4vh,44px)}.lgame span{display:block;font-size:.62em;color:#BFD3E6}
.lcnt{font-size:clamp(28px,4vh,44px);margin-top:10px}.lcnt b{color:var(--gold);font-size:1.3em}
.pls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.pl{width:96px;text-align:center;font-size:20px;animation:plIn .5s cubic-bezier(.2,1.6,.4,1) both}.pl img{width:84px;height:110px;object-fit:cover;border-radius:14px;border:3px solid var(--gold);display:block;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,.5)}
@keyframes plIn{from{transform:scale(.2) translateY(30px);opacity:0}}
.noh{display:inline-flex;width:84px;height:110px;align-items:center;justify-content:center;font-size:44px;border:3px dashed #4A5A6C;border-radius:14px;background:#0B1118}
/* ── 怎麼玩 ＋ 3、2、1 ── */
#hhw .badge{margin-top:3vh}.cnt3{font-size:clamp(120px,24vh,260px);color:var(--gold);height:1.1em;line-height:1.1;text-shadow:0 0 50px rgba(255,213,74,.6)}.cnt3.on{animation:c3 1s ease-out}@keyframes c3{from{transform:scale(2.2);opacity:0}}
/* ── 題目（大螢幕）── */
.qwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:12px 16px;min-height:100vh;align-items:start}
#hq.classic .qwrap{grid-template-columns:1fr}#hq.classic .qside{display:none}
@media (max-aspect-ratio:5/4){.qwrap{grid-template-columns:1fr}}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:clamp(24px,3.4vh,36px);gap:12px;flex-wrap:wrap}.qtop b{color:var(--gold)}
.ring{--p:100;position:relative;display:inline-flex;align-items:center;justify-content:center;width:clamp(84px,12vh,130px);height:clamp(84px,12vh,130px);border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),#1B2633 0);box-shadow:0 0 20px rgba(0,0,0,.6)}
.ring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:#0B1220}.ring b{position:relative;font-size:clamp(40px,6vh,64px);color:#fff!important}
.ring.sm{width:76px;height:76px}.ring.sm b{font-size:36px}
.qtm.hurry .ring{background:conic-gradient(#FF4D4D calc(var(--p)*1%),#1B2633 0);animation:hur .5s ease-in-out infinite alternate}@keyframes hur{to{transform:scale(1.08)}}
.qq{font-size:clamp(34px,6.6vh,86px);line-height:1.25;text-align:center;margin:10px 0 16px;padding:18px 20px;min-height:1.3em;background:#fff;color:#111;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.5)}.qq small{font-size:.55em;color:#555}
.chal{display:inline-block;background:linear-gradient(90deg,#FF6A00,#E0389A);color:#fff;border-radius:999px;padding:2px 18px;font-size:.5em;animation:chP 1s ease-in-out infinite alternate}@keyframes chP{to{box-shadow:0 0 22px rgba(255,106,0,.8)}}
.cht{font-size:.6em;color:#333;margin-top:4px}.chz{font-size:1em}.chi{margin-right:.3em}
.qos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qo{position:relative;display:flex;align-items:center;gap:16px;border-radius:18px;padding:12px 20px;font-size:clamp(28px,5.2vh,64px);min-height:clamp(90px,18vh,220px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.4);overflow:hidden;transition:opacity .4s,transform .4s}
.shp{flex:0 0 auto;width:1.15em;height:1.15em;display:inline-flex}.shp svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.qo .qt{flex:1;min-width:0;line-height:1.2}
.c0{background:var(--k0)}.c1{background:var(--k1)}.c2{background:var(--k2)}.c3{background:var(--k3)}
.qo.ok{transform:scale(1.03);box-shadow:0 0 0 6px #fff,0 0 40px rgba(255,255,255,.6)}.qo.no{opacity:.32}
.qck{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.4em;background:#fff;color:var(--ok);width:1.4em;height:1.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:ckIn .5s cubic-bezier(.2,1.8,.4,1)}@keyframes ckIn{from{transform:translateY(-50%) scale(0)}}
.qd{position:absolute;left:0;right:0;bottom:0;height:100%;pointer-events:none}.qd i{position:absolute;left:0;bottom:0;width:100%;height:var(--h);background:rgba(0,0,0,.28);animation:qdUp .9s ease-out}@keyframes qdUp{from{height:0}}
.qd b{position:absolute;left:18px;bottom:8px;font-size:.6em;background:rgba(0,0,0,.45);border-radius:12px;padding:0 12px}
.qh{margin-top:12px;font-size:clamp(24px,3.4vh,40px);background:#0F2A1C;border:3px solid var(--ok);border-radius:18px;padding:8px 18px}.qh[hidden]{display:none}
.chbox{grid-column:1/-1;text-align:center;background:linear-gradient(#1B2235,#0E1422);border:3px solid #FF8A3D;border-radius:22px;padding:20px}
.chtiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.chtiles span{min-width:1.6em;padding:8px 18px;border-radius:16px;background:#2A3550;font-size:clamp(34px,6vh,72px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.3)}
.chans{font-size:clamp(46px,9vh,110px);color:#7BF0A8;animation:ckIn2 .6s cubic-bezier(.2,1.6,.4,1)}@keyframes ckIn2{from{transform:scale(.3);opacity:0}}.chok{font-size:clamp(26px,4vh,44px)}
.qctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.qctl button{min-height:56px;padding:6px 18px;border-radius:16px;background:#16212D;border:3px solid var(--line);font-size:clamp(22px,2.4vh,30px)}
#hq.classic #hint{display:none}
/* ── 前 5 名（經典搶答：公布 3 秒 以後 蓋上來；每一列 從 上一題 的 名次 滑上來）── */
.lb{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,8,18,.94);padding:3vh 4vw}.lb.on{display:flex;animation:lbIn .4s ease-out}@keyframes lbIn{from{opacity:0}}
.lbt{font-size:clamp(40px,7vh,80px);color:var(--gold)}
.lbr{--dy:0;display:flex;align-items:center;gap:18px;width:min(100%,1100px);padding:10px 24px;border-radius:20px;background:linear-gradient(90deg,#24325A,#141C33);border:3px solid #34477A;font-size:clamp(28px,4.6vh,52px);animation:lbUp .9s cubic-bezier(.2,1.2,.4,1) both}
.lbr:nth-child(2){animation-delay:.1s}.lbr:nth-child(3){animation-delay:.2s}.lbr:nth-child(4){animation-delay:.3s}.lbr:nth-child(5){animation-delay:.4s}.lbr:nth-child(6){animation-delay:.5s}
@keyframes lbUp{from{transform:translateY(calc(var(--dy)*100%));opacity:.3}}
.lbr.top{background:linear-gradient(90deg,#6B4B00,#2A1E00);border-color:var(--gold)}
.lbn{width:1.4em;height:1.4em;border-radius:50%;background:var(--gold);color:#000;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.lbi{width:clamp(56px,8vh,90px);height:clamp(70px,10vh,112px);object-fit:cover;border-radius:12px;border:3px solid #fff}.lbr .noh{width:clamp(56px,8vh,90px);height:clamp(70px,10vh,112px);font-size:32px}
.lbs{flex:1}.lbr em{font-style:normal;color:var(--gold)}.lbr i{font-style:normal;font-size:.6em;border-radius:999px;padding:2px 12px}.lbr .up{background:#14532D;color:#7BF0A8}.lbr .fire{background:#5A1A00;color:#FFB38A}
/* ── 場景（大螢幕 右邊）── */
.qside{background:linear-gradient(#101C33,#070B14);border:3px solid #2A3A50;border-radius:26px;padding:12px;min-height:min(86vh,980px);position:relative;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.gvt{font-size:clamp(26px,3.6vh,38px);color:var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.rk5{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;font-size:clamp(20px,2.6vh,30px)}.rk5 span{background:#0B1118;border:2px solid #2A3A50;border-radius:12px;padding:2px 10px}.rk5 b{color:var(--gold)}
.fxb{font-style:normal;font-size:.8em;margin-left:2px;animation:fxbob .5s ease-in-out infinite alternate}@keyframes fxbob{to{transform:translateY(-6px)}}
/* 魔王 */
.bs{position:relative;width:min(100%,46vh);aspect-ratio:1;margin:0 auto}.bsi{position:relative;width:100%;height:100%;object-fit:cover;border-radius:26px;border:4px solid #FF5252;animation:bob 2s ease-in-out infinite}
.bsau{position:absolute;inset:-14px;border-radius:34px;background:conic-gradient(#FF1744,#FF9100,#D500F9,#FF1744);filter:blur(16px);opacity:.75;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-8px)}}
.bs.hit .bsi{animation:bhit .12s linear 8}@keyframes bhit{25%{transform:translate(-10px,4px);filter:brightness(2) saturate(2)}75%{transform:translate(10px,-4px)}}
.bs.dead .bsi{filter:grayscale(1) brightness(.6);animation:none}.ko{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(70px,12vh,140px);color:#FFD54A;text-shadow:0 0 30px #F00,0 6px 0 #000;animation:ckIn2 .6s}
.hpb{position:relative;height:56px;margin-top:14px;border-radius:999px;background:#2A0E0E;border:4px solid #FF6B6B;overflow:hidden;text-align:center}
.hpb i{position:absolute;inset:0 auto 0 0;width:var(--b);background:linear-gradient(90deg,#FF1744,#FF9100);animation:mvw 1s ease-out}@keyframes mvw{from{width:var(--a)}to{width:var(--b)}}
.hpb span{position:relative;font-size:clamp(22px,2.8vh,32px);line-height:48px;text-shadow:0 2px 4px #000}
.hits{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.hit1{position:relative;animation:hitF .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*.12s)}@keyframes hitF{from{transform:translateY(80px) scale(.3);opacity:0}}
.hti{width:58px;height:74px;object-fit:cover;border-radius:10px;border:3px solid var(--gold);display:block}.hit1 .noh{width:58px;height:74px;font-size:28px}
.hit1 b{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:24px;color:#FFE07A;text-shadow:0 0 8px #F00,0 2px 0 #000;animation:dmgUp 1.2s ease-out both;animation-delay:calc(var(--i)*.12s + .4s)}@keyframes dmgUp{from{opacity:0;transform:translate(-50%,10px) scale(.4)}40%{opacity:1;transform:translate(-50%,-14px) scale(1.4)}}
.more{align-self:center;font-size:22px;color:#BFD3E6}
.combo{text-align:center;margin-top:10px;font-size:clamp(26px,3.6vh,40px);color:#FFE07A;background:linear-gradient(90deg,transparent,#5A1A00,transparent);animation:chP .5s ease-in-out infinite alternate}
/* 賽車 */
.rc{display:grid;gap:6px}.rl{display:grid;grid-template-columns:1.6em 1fr 14px;align-items:center;gap:6px}.rp{color:var(--gold);font-size:26px;text-align:center}
.rtk{position:relative;height:clamp(52px,7.4vh,80px);background:repeating-linear-gradient(90deg,#2B2F36 0 38px,#24272D 38px 76px);border-radius:10px;border-top:3px solid #555;border-bottom:3px solid #555}
.car{position:absolute;top:50%;left:var(--b);transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;animation:mvl 1.4s cubic-bezier(.3,1.1,.5,1)}@keyframes mvl{from{left:var(--a)}to{left:var(--b)}}
.cri{width:clamp(40px,5.6vh,60px);height:clamp(40px,5.6vh,60px);object-fit:cover;object-position:top;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px #1368CE}.car .noh{width:44px;height:44px;font-size:22px;border-radius:50%}
.car i{font-style:normal;font-size:22px;background:#000a;border-radius:8px;padding:0 6px}

  else if(k==='tower'){var P=[],N=H.n;for(var i=0;i<=N;i++){var y=92-i/N*80,x=i%2?62:38;x+=(i/N)*(i%2?-8:8);P.push([x,y])}

      R.slice(0,12).map(function(x){var n=Math.min(N,H.okc[x.id]||0),o=(at[n]=(at[n]||0)+1)-1,pp=P[n];return '<span class="clb" style="'+mv('cx'+x.id,(pp[0]+(o%4)*4-6).toFixed(1)+'%').replace(/--a/,'--ax').replace(/--b/,'--bx')+';'+mv('cy'+x.id,(pp[1]-Math.floor(o/4)*6).toFixed(1)+'%').replace(/--a/,'--ay').replace(/--b/,'--by')+'">'+heroI(x.id,'cli')+'<i>'+seatOf(x.id)+'</i>'+fxi(x.id)+'</span>'}).join('')+'</div>'}
  else if(k==='pet'){var e=G.en||0,st=G.pet,hat=st>=2;
    h+='<div class="pt"><div class="ptv st'+st+'">'+(hat?'<img class="pti" src="'+LV.img(BASE,G.boss)+'" alt="傳說寵物"><div class="ptl">'+['','','Lv 1 孵出來 了！','Lv 2 長大 了！','Lv 3 傳說 進化！'][st]+'</div>':
      '<svg class="egg" viewBox="0 0 100 120"><defs><radialGradient id="eg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF8E1"/><stop offset=".6" stop-color="#FFB74D"/><stop offset="1" stop-color="#6D3A00"/></radialGradient></defs><ellipse cx="50" cy="64" rx="38" ry="50" fill="url(#eg)"/>'+
      '<path d="M22 40L30 52L38 44L46 58" stroke="#5D2E00" stroke-width="3" fill="none" opacity="'+(st>=1?1:0)+'"/><path d="M54 30L60 44L70 38L76 54" stroke="#5D2E00" stroke-width="3" fill="none" opacity="'+(e>=.4?1:0)+'"/></svg>')+'</div>'+
      '<div class="enb"><i style="'+mv('en',(e*100).toFixed(1)+'%')+'"></i><span>⚡ 全班 能量 '+Math.round(e*100)+'%</span></div><div class="pts">'+['🥚 龍蛋','💥 裂開','🐣 Lv 1','🐲 Lv 2','🐉 Lv 3'].map(function(x,i){return '<span class="'+(i<=st?'on':'')+'">'+x+'</span>'}).join('')+'</div></div>'}
  else if(k==='shoot'){var b=Object.keys(G.bull).sort(function(a,c){return G.bull[c]-G.bull[a]}).slice(0,3);
    h+='<div class="sh"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#FAFAFA"/><circle cx="50" cy="50" r="38.4" fill="#212121"/><circle cx="50" cy="50" r="28.8" fill="#1E88E5"/><circle cx="50" cy="50" r="19.2" fill="#E53935"/><circle cx="50" cy="50" r="9.6" fill="#FFD600"/></svg>'+
      (rv?G.arr.map(function(x,i){var a=(i*137.5)*Math.PI/180,r=Math.min(38,x.r*9.6+4.8);return '<i class="ar" style="left:'+(50+Math.cos(a)*r).toFixed(1)+'%;top:'+(50+Math.sin(a)*r).toFixed(1)+'%;--i:'+i+'"><b>'+seatOf(x.id)+'</b></i>'}).join(''):'')+'</div>'+
      '<div class="note c">'+(b.length?'🎯 正中 紅心：'+b.map(function(id){return seatOf(id)+' 號 ✕'+G.bull[id]}).join('　'):'⚡ 答得 愈快 ＝ 愈 靠近 紅心')+'</div>'}
  else if(k==='treasure'){h+='<div class="ts"><svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M4 50C20 50 18 12 34 14S46 50 60 46S76 10 96 12" fill="none" stroke="#FFCC80" stroke-width="1.6" stroke-dasharray="2 1.6"/></svg>'+
      [[10,46],[26,16],[40,34],[56,46],[72,20],[92,12]].map(function(p,i){var op=i<G.tr;return '<span class="chest'+(op?' op':'')+(rv&&op&&i===G.tr-1?' new':'')+'" style="left:'+p[0]+'%;top:'+(p[1]/60*100).toFixed(0)+'%">'+(op?'<img src="'+BASE+'rpg/shop/'+G.tre[i]+'.jpg" alt="">':'<b>🔒</b>')+'</span>'}).join('')+
      '<span class="exp" style="'+mv('ex',(G.tr===0?2:[10,26,40,56,72,92][G.tr-1]-4)+'%')+'">🧭</span></div><div class="note c">🗝 全班 打開 '+G.tr+' ／ 6 個 寶箱（裡面 是 商城 的 寶物）</div>'}
  else if(k==='surf'){var tp=L.map(function(id){return {id:id,s:H.st[id]||0}}).sort(function(a,c){return c.s-a.s}).slice(0,8),bb=0,bi='';L.forEach(function(id){if((H.best[id]||0)>bb){bb=H.best[id];bi=id}});
    h+='<div class="sf"><svg class="w1" viewBox="0 0 200 40" preserveAspectRatio="none"><path d="M0 20Q25 0 50 20T100 20T150 20T200 20V40H0Z" fill="#0277BD"/></svg><svg class="w2" viewBox="0 0 200 40" preserveAspectRatio="none"><path d="M0 22Q25 8 50 22T100 22T150 22T200 22V40H0Z" fill="#4FC3F7"/></svg>'+
      tp.map(function(x,i){return '<span class="sfr" style="left:'+(4+i*11.5)+'%;'+mv('sf'+x.id,(12+Math.min(9,x.s)*6)+'%').replace(/--a/,'--ay').replace(/--b/,'--by')+'">'+heroI(x.id,'sfi')+'<b>'+(x.s?'🔥'+x.s:seatOf(x.id)+' 號')+'</b>'+fxi(x.id)+'</span>'}).join('')+'</div>'+
      '<div class="note c">'+(bb?'🏆 最長 連勝：'+seatOf(bi)+' 號 '+bb+' 題':'🔥 連對 愈多 ＝ 浪 愈高')+'</div>'}
  else{var t3=R.slice(0,3),cc=0,chg='';for(var c2 in (H.ch2||{}))cc+=+H.ch2[c2]||0;if(rv&&H.hits)for(var j=0;j<H.hits.length;j++){if(!t3.some(function(x){return x.id===H.hits[j].id})){chg=H.hits[j].id;break}}
    h+='<div class="kg"><div class="kpod">'+[1,0,2].map(function(n){var x=t3[n];return '<div class="kp p'+(n+1)+'">'+(x?(n===0?'<span class="crown">👑</span>':'')+heroI(x.id,'kpi')+'<b>'+seatOf(x.id)+' 號</b><em>'+x.v.toLocaleString()+'</em>':'')+'<div class="kb">'+(n+1)+'</div></div>'}).join('')+'</div>'+
      (chg?'<div class="chg">👊 挑戰者：'+heroI(chg,'chgi')+seatOf(chg)+' 號（台下 答對 最快）</div>':'')+'<div class="kc">📣 台下 加油 <b>'+cc+'</b> 次</div></div>'}
  h+='<div class="rk5">'+R.slice(0,5).map(function(x,i){return '<span><b>'+(i+1)+'</b> '+seatOf(x.id)+' 號 '+(x.v||0).toLocaleString()+'</span>'}).join('')+'</div>';
  el.innerHTML=h}
/* ── 結束：頒獎台 3 ➜ 2 ➜ 1 ＋ 發獎勵 ── */
function end(){H.phase='end';clearTimeout(H.tm);clearTimeout(H.tm3);LDB.patch(R('m'),{phase:'end',r:{qi:H.qi,tot:H.tot,okc:H.okc,st:H.st},gs:H.gs});scr('hend');SND.drum();
  var Rk=rank(),G=H.gs,k=H.game,cnt=[0,0];G.cells.forEach(function(t){if(t!=null)cnt[t]++});
  var res=k==='boss'?(G.hp<=0?'🎉 全班 打倒 魔王！':'魔王 還剩 '+G.hp+' 血 —— 下次 一定 打得倒！'):k==='tug'?(G.tug===0?'🤝 兩隊 平手！':(G.tug>0?'🔵 單號隊':'🔴 雙號隊')+' 贏了 拔河！'):
    k==='map'?(cnt[0]===cnt[1]?'🤝 兩隊 平手！':(cnt[0]>cnt[1]?'🔵 單號隊':'🔴 雙號隊')+' 搶到 比較 多 地！'):k==='pet'?['🥚 龍蛋 快 孵出來 了！','💥 龍蛋 裂開 了！','🐣 孵出 傳說 寵物！','🐲 寵物 長大 了！','🐉 傳說 進化！'][G.pet]:
    k==='treasure'?'🗝 全班 打開 '+G.tr+' 個 寶箱':k==='tower'?'🚩 '+seatOf((Rk[0]||{}).id||'00000')+' 號 爬 最高！':'';
  var bb=0,bi='';ids().forEach(function(id){if((H.best[id]||0)>bb){bb=H.best[id];bi=id}});
  $('#eres').innerHTML=(res?'<div>'+res+'</div>':'')+(bb>=2?'<div class="note big2">🔥 這一場 最長 連勝：'+seatOf(bi)+' 號 '+bb+' 題</div>':'');
  $('#epod').innerHTML=[1,0,2].map(function(n){var x=Rk[n];return '<div class="kp p'+(n+1)+'" style="--d:'+[2.6,1.3,0][n]+'s">'+(x?heroI(x.id,'kpi')+'<b>'+seatOf(x.id)+' 號</b><em>'+x.v.toLocaleString()+' 分</em>':'')+'<div class="kb">'+['🥇','🥈','🥉'][n]+'</div></div>'}).join('');
  setTimeout(SND.win,2800);
  LDB.get(R('rw')).then(function(rw){H.rw=rw||{};var fw=Object.keys(H.rw).filter(function(id){return (H.rw[id]||[]).indexOf('fw')>=0});
    if(fw.length)$('#efw').innerHTML='<div class="fwt">🎇 煙火 送給：</div>'+fw.map(function(id){return heroI(id,'fwi')}).join('')+fwHTML();
    $('#erw').textContent='🎁 這一場 抽到 的 獎勵：'+Object.keys(H.rw).reduce(function(s,id){return s+(H.rw[id]||[]).length},0)+' 個（按 下面 的 按鈕 發 到 每一個人 的 戰神之路）'})}
function fwHTML(){var h='<div class="fwx">',C=['#FFD54A','#FF6B6B','#7FD4FF','#7BF0A8','#D9A8FF'];for(var n=0;n<5;n++){var x=10+n*20,y=20+(n%2)*25;for(var i=0;i<14;i++){var a=i/14*Math.PI*2;h+='<i style="left:'+x+'%;top:'+y+'%;--c:'+C[n]+';--x:'+Math.round(Math.cos(a)*90)+'px;--y:'+Math.round(Math.sin(a)*90)+'px;animation-delay:'+(n*.3)+'s"></i>'}}return h+'</div>'}
/* 每一個人：參加 ＋10 經驗值、答對 1 題 ＋1 金幣；抽到的獎勵照 LV.RW */
function bonusList(){return ids().map(function(id){var rw=H.rw[id]||[],c=H.okc[id]||0,x=10,o={id:id,c:c,x:x,tre:[],title:'',snack:0,medal:0};
  rw.forEach(function(k){if(k==='c2')o.c+=c;else if(k==='x2')o.x+=x;else if(k==='frag')o.c+=20;else if(k==='title')o.title='⚡ 現場任務 勇者';else if(k==='emo')o.tre.push('t06');else if(k==='fx')o.tre.push('t04');else if(k==='snack')o.snack++;else if(k==='medal')o.medal++;else if(k==='box')o.c+=30});return o})}
function give(){var b=$('#give'),m=$('#gm');if(H.done){m.textContent='✅ 已經 發過了';return}b.disabled=true;m.textContent='⏳ 發獎勵中…';
  post({a:'rpgb',pw:H.pw,room:H.code,t0:H.start,list:bonusList()}).then(function(j){if(j&&j.ok){H.done=true;b.textContent='✅ 獎勵 發好了';m.textContent='✅ 發好了（'+j.n+' 人）：〔戰神之路〕拿到 獎勵、老師看板 練習次數 ＋1';LDB.patch(R('m'),{given:1})}else{b.disabled=false;m.textContent='❌ 沒有 發成（'+((j&&j.err)||'')+'）'}},
    function(){b.disabled=false;m.textContent='📶 連不到 成績系統'})}
function closeGame(){if(H.code)LDB.del(R()).then(function(){location.reload()});else location.reload()}
document.addEventListener('click',function(e){var t=e.target,c=function(s){return t.closest?t.closest(s):null},b;ac();
  if(c('#pwgo')){pwGo();return}
  if((b=c('[data-sc]'))){H.cls=b.getAttribute('data-sc');var g=H.cls.charAt(0)==='3'?3:4;H.g=g;setDraw();return}
  if((b=c('[data-sk]'))){H.game=b.getAttribute('data-sk');setDraw();return}
  if((b=c('[data-sb]'))){var k=H.g+'_'+b.getAttribute('data-sb');H.sets[k]=!H.sets[k];setDraw();return}
  if((b=c('[data-sn]'))){H.n=+b.getAttribute('data-sn');setDraw();return}
  if((b=c('[data-ch]'))){H.ch=+b.getAttribute('data-ch');setDraw();return}
  if((b=c('[data-si]'))){H.int=+b.getAttribute('data-si');setDraw();return}
  if(c('#mk')){mkRoom();return}
  if(c('#go')){start();return}
  if(c('#hp')){H.pause=!H.pause;$('#hp').textContent=H.pause?'▶ 繼續':'⏸ 停在 這一題';if(H.pause&&H.phase==='rev')clearTimeout(H.tm);if(!H.pause&&H.phase==='rev')next();return}
  if(c('#hn')){if(H.phase==='q')reveal();else next();return}
  if(c('#hint')){H.int=H.int?0:1;$('#hint').textContent=H.int?'😆 干擾：開':'✖ 干擾：關';LDB.patch(R('m'),{int:H.int});return}
  if(c('#hsnd')){H.snd=H.snd?0:1;$('#hsnd').textContent=H.snd?'🔊 聲音：開':'🔇 聲音：關';return}
  if(c('#give')){give();return}
  if(c('#close')||c('#close2')){if(confirm('結束 這一場？（學生 會 回到 等待 畫面）'))closeGame();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='pw')pwGo()});
(function(){try{var p=sessionStorage.getItem('lvpw');if(p&&LDB.on()){H.pw=p;setDraw();scr('hset');return}}catch(e){}scr('hpw')})();
