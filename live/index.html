<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>現場任務</title>
<style>
@font-face{font-family:Andika;src:url(../words/fonts/andika-700.woff2) format('woff2');font-weight:700}
/* live/_live.css — ⚡ 現場任務（大螢幕、學生平板共用；配 live/_build.js）。2026-10-18 第十一次 重做：精緻、有質感（漸層 徽章、形狀 按鈕、圓環 倒數、排行榜 會 動、場景 用 學生 自己 的 英雄） */
:root{color-scheme:dark;--gold:#FFD54A;--ok:#2BD46A;--line:#34475C;--k0:#E21B3C;--k1:#1368CE;--k2:#D89E00;--k3:#26890C}
*{box-sizing:border-box}
html,body{margin:0;color:#fff;font-family:Andika,"PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;touch-action:manipulation;background-color:#060912;background-image:radial-gradient(1200px 700px at 15% -10%,#1C1446 0,transparent 60%),radial-gradient(1000px 700px at 110% 110%,#0B2A3E 0,transparent 60%);background-repeat:no-repeat;background-attachment:fixed}
button,input{font:inherit;font-weight:700}
button{color:#fff;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
a{color:#7FD4FF}
.scr .in{max-width:1320px;margin:0 auto;padding:14px 16px 40px}
.center{text-align:center}.cen{justify-content:center}.c{text-align:center}
h1{font-size:clamp(34px,5vh,58px);color:var(--gold);margin:10px 0;letter-spacing:.04em}
h2{font-size:clamp(24px,3.2vh,32px);color:#9FD8FF;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
h3{font-size:clamp(22px,2.8vh,28px);color:#9FD8FF;margin:14px 0 6px}
.note{color:#BFD3E6;font-size:clamp(20px,2.6vh,26px);margin:6px 0}
.big2{font-size:clamp(26px,3.8vh,40px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row button{min-height:60px;padding:6px 18px;border-radius:16px;background:linear-gradient(#1B2836,#121B26);border:3px solid var(--line);font-size:clamp(20px,2.6vh,26px)}
.row button.on{border-color:var(--gold);color:#FFE07A;background:linear-gradient(#3A2E08,#221A04);box-shadow:0 0 18px rgba(255,213,74,.25)}
button.big,a.big{min-height:76px;padding:8px 44px;border-radius:22px;background:linear-gradient(#22C766,#128A43);border:0;box-shadow:0 6px 0 #0B5A2B,0 10px 24px rgba(0,0,0,.5);font-size:clamp(28px,4vh,40px);margin:14px auto;color:#fff;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #0B5A2B}
button.ghost,a.ghost{display:inline-flex;align-items:center;min-height:56px;padding:6px 22px;border-radius:16px;background:#1B2633;border:3px solid #4A5A6C;font-size:22px;margin:10px;text-decoration:none;color:#fff}
input[type=password]{display:block;margin:12px auto;font-size:32px;padding:10px 18px;border-radius:16px;border:3px solid #4A5A6C;background:#0B1118;color:#fff;min-height:64px;width:min(420px,90vw);text-align:center}
/* ── 遊戲 徽章（漸層 圓角 方塊 ＋ 亮面）── */
.badge{position:relative;display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;flex:0 0 auto;border-radius:20px;background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.45);overflow:hidden}
.badge::after{content:'';position:absolute;left:-20%;top:-60%;width:140%;height:90%;background:radial-gradient(ellipse at center,rgba(255,255,255,.45),transparent 70%)}
.badge span{position:relative;z-index:1;font-size:36px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.badge.sm{width:44px;height:44px;border-radius:14px}.badge.sm span{font-size:24px}
.badge.lg{width:92px;height:92px;border-radius:26px}.badge.lg span{font-size:52px}
.badge.xl{width:150px;height:150px;border-radius:40px;animation:bdg 2.4s ease-in-out infinite}.badge.xl span{font-size:88px}
@keyframes bdg{50%{transform:translateY(-8px) rotate(-3deg)}}
/* ── 怎麼玩：3 步，一步一步 亮（一直 重播）── */
.how{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:14px auto;max-width:1200px}
.how .hw{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px;border-radius:22px;background:linear-gradient(#17233A,#0E1626);border:3px solid #2A3D5C;
  animation:hwOn 7.5s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s)}
.how .hn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#000;font-size:24px}
.how .hi{font-size:clamp(46px,7vh,76px);line-height:1.1;animation:hwPop 7.5s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s)}
.how .ht{font-size:clamp(20px,2.6vh,28px);text-align:center;line-height:1.35}
.how .ha{align-self:center;font-style:normal;font-size:36px;color:var(--gold);opacity:.35;animation:haOn 7.5s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s + .8s)}
@keyframes hwOn{0%{opacity:.35;transform:scale(.96);border-color:#2A3D5C}8%,70%{opacity:1;transform:scale(1);border-color:var(--gold);box-shadow:0 0 26px rgba(255,213,74,.3)}100%{opacity:.35;transform:scale(.96)}}
@keyframes hwPop{0%,4%{transform:scale(.6)}10%{transform:scale(1.18)}16%,100%{transform:scale(1)}}
@keyframes haOn{0%{opacity:.35}10%,70%{opacity:1;transform:translateX(4px)}100%{opacity:.35}}
.how.v{flex-direction:column;max-width:720px}.how.v .hw{flex-direction:row;text-align:left;gap:14px}.how.v .hw .ht{text-align:left}.how.v .ha{transform:rotate(90deg);font-size:28px}
.how.v.sm{gap:4px;margin:8px auto}.how.v.sm .hw{padding:6px 10px;gap:10px}.how.v.sm .hi{font-size:clamp(30px,4.4vh,46px)}.how.v.sm .ht{font-size:clamp(19px,2.3vh,25px)}.how.v.sm .hn{width:34px;height:34px;font-size:20px}.how.v.sm .ha{font-size:20px;margin:-4px 0}.how.big .ht{font-size:clamp(26px,3.6vh,40px)}.how.big .hi{font-size:clamp(70px,11vh,120px)}
/* ── 設定（一頁）── */
.sett{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.sn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#000;font-size:24px}
.gsep{width:18px}.clsb{min-width:110px;font-size:clamp(24px,3vh,32px)!important}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.gcd{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:20px;background:linear-gradient(#18243A,#101827);border:3px solid var(--line);min-height:96px}
.gcd.on{border-color:var(--gold);background:linear-gradient(#3A2E08,#1E1704);box-shadow:0 0 22px rgba(255,213,74,.3)}
.gcd.first{grid-column:1/-1}.gcd.first .badge{width:84px;height:84px}.gcd.first .badge span{font-size:46px}
.gtx{display:flex;flex-direction:column;gap:4px;min-width:0}.gtx b{font-size:clamp(22px,2.8vh,30px)}.gtx b em{font-style:normal;font-size:clamp(20px,2.4vh,26px);background:#E0389A;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.gtx small{font-size:clamp(19px,2.4vh,26px);color:#BFD3E6;line-height:1.3}
.mkrow{margin-top:16px}
/* ── 等人（大螢幕）：左 QR、右 遊戲＋怎麼玩＋加入 的 英雄 ── */
.lob{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:20px;padding:16px;min-height:100vh;align-items:start}
@media (max-aspect-ratio:5/4){.lob{grid-template-columns:1fr}}
.lobl{background:linear-gradient(#18243A,#0C1320);border:3px solid #2A3D5C;border-radius:28px;padding:16px;text-align:center}
.lqrt{font-size:clamp(28px,4vh,44px);color:var(--gold)}
.lqr{background:#fff;border-radius:22px;padding:10px;margin:8px auto;width:min(100%,38vh,420px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}.lqr svg{width:100%;height:100%;display:block}
.lurl{font-size:clamp(18px,2.2vh,24px);color:#9FB3C8;word-break:break-all;margin-bottom:6px}
.lgame{display:flex;align-items:center;gap:16px;font-size:clamp(28px,4vh,44px)}.lgame span{display:block;font-size:.62em;color:#BFD3E6}
.lcnt{font-size:clamp(28px,4vh,44px);margin-top:10px}.lcnt b{color:var(--gold);font-size:1.3em}
.pls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.pl{width:96px;text-align:center;font-size:20px;animation:plIn .5s cubic-bezier(.2,1.6,.4,1) both}.pl img{width:84px;height:110px;object-fit:cover;border-radius:14px;border:3px solid var(--gold);display:block;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,.5)}
@keyframes plIn{from{transform:scale(.2) translateY(30px);opacity:0}}
.noh{display:inline-flex;width:84px;height:110px;align-items:center;justify-content:center;font-size:44px;border:3px dashed #4A5A6C;border-radius:14px;background:#0B1118}
/* ── 怎麼玩 ＋ 3、2、1 ── */
#hhw .badge{margin-top:3vh}.cnt3{font-size:clamp(120px,24vh,260px);color:var(--gold);height:1.1em;line-height:1.1;text-shadow:0 0 50px rgba(255,213,74,.6)}.cnt3.on{animation:c3 1s ease-out}@keyframes c3{from{transform:scale(2.2);opacity:0}}
/* ── 題目（大螢幕）── */
.qwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:12px 16px;min-height:100vh;align-items:start}
#hq.classic .qwrap{grid-template-columns:1fr}#hq.classic .qside{display:none}
@media (max-aspect-ratio:5/4){.qwrap{grid-template-columns:1fr}}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:clamp(24px,3.4vh,36px);gap:12px;flex-wrap:wrap}.qtop b{color:var(--gold)}
.ring{--p:100;position:relative;display:inline-flex;align-items:center;justify-content:center;width:clamp(84px,12vh,130px);height:clamp(84px,12vh,130px);border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),#1B2633 0);box-shadow:0 0 20px rgba(0,0,0,.6)}
.ring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:#0B1220}.ring b{position:relative;font-size:clamp(40px,6vh,64px);color:#fff!important}
.ring.sm{width:76px;height:76px}.ring.sm b{font-size:36px}
.qtm.hurry .ring{background:conic-gradient(#FF4D4D calc(var(--p)*1%),#1B2633 0);animation:hur .5s ease-in-out infinite alternate}@keyframes hur{to{transform:scale(1.08)}}
.qq{font-size:clamp(34px,6.6vh,86px);line-height:1.25;text-align:center;margin:10px 0 16px;padding:18px 20px;min-height:1.3em;background:#fff;color:#111;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.5)}.qq small{font-size:.55em;color:#555}
.chal{display:inline-block;background:linear-gradient(90deg,#FF6A00,#E0389A);color:#fff;border-radius:999px;padding:2px 18px;font-size:.5em;animation:chP 1s ease-in-out infinite alternate}@keyframes chP{to{box-shadow:0 0 22px rgba(255,106,0,.8)}}
.cht{font-size:.6em;color:#333;margin-top:4px}.chz{font-size:1em}.chi{margin-right:.3em}
.qos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qo{position:relative;display:flex;align-items:center;gap:16px;border-radius:18px;padding:12px 20px;font-size:clamp(28px,5.2vh,64px);min-height:clamp(90px,18vh,220px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.4);overflow:hidden;transition:opacity .4s,transform .4s}
.shp{flex:0 0 auto;width:1.15em;height:1.15em;display:inline-flex}.shp svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.qo .qt{flex:1;min-width:0;line-height:1.2}
.c0{background:var(--k0)}.c1{background:var(--k1)}.c2{background:var(--k2)}.c3{background:var(--k3)}
.qo.ok{transform:scale(1.03);box-shadow:0 0 0 6px #fff,0 0 40px rgba(255,255,255,.6)}.qo.no{opacity:.32}
.qck{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.4em;background:#fff;color:var(--ok);width:1.4em;height:1.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:ckIn .5s cubic-bezier(.2,1.8,.4,1)}@keyframes ckIn{from{transform:translateY(-50%) scale(0)}}
.qd{position:absolute;left:0;right:0;bottom:0;height:100%;pointer-events:none}.qd i{position:absolute;left:0;bottom:0;width:100%;height:var(--h);background:rgba(0,0,0,.28);animation:qdUp .9s ease-out}@keyframes qdUp{from{height:0}}
.qd b{position:absolute;left:18px;bottom:8px;font-size:.6em;background:rgba(0,0,0,.45);border-radius:12px;padding:0 12px}
.qh{margin-top:12px;font-size:clamp(24px,3.4vh,40px);background:#0F2A1C;border:3px solid var(--ok);border-radius:18px;padding:8px 18px}.qh[hidden]{display:none}
.chbox{grid-column:1/-1;text-align:center;background:linear-gradient(#1B2235,#0E1422);border:3px solid #FF8A3D;border-radius:22px;padding:20px}
.chtiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.chtiles span{min-width:1.6em;padding:8px 18px;border-radius:16px;background:#2A3550;font-size:clamp(34px,6vh,72px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.3)}
.chans{font-size:clamp(46px,9vh,110px);color:#7BF0A8;animation:ckIn2 .6s cubic-bezier(.2,1.6,.4,1)}@keyframes ckIn2{from{transform:scale(.3);opacity:0}}.chok{font-size:clamp(26px,4vh,44px)}
.qctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.qctl button{min-height:56px;padding:6px 18px;border-radius:16px;background:#16212D;border:3px solid var(--line);font-size:clamp(22px,2.4vh,30px)}
#hq.classic #hint{display:none}
/* ── 前 5 名（經典搶答：公布 3 秒 以後 蓋上來；每一列 從 上一題 的 名次 滑上來）── */
.lb{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,8,18,.94);padding:3vh 4vw}.lb.on{display:flex;animation:lbIn .4s ease-out}@keyframes lbIn{from{opacity:0}}
.lbt{font-size:clamp(40px,7vh,80px);color:var(--gold)}
.lbr{--dy:0;display:flex;align-items:center;gap:18px;width:min(100%,1100px);padding:10px 24px;border-radius:20px;background:linear-gradient(90deg,#24325A,#141C33);border:3px solid #34477A;font-size:clamp(28px,4.6vh,52px);animation:lbUp .9s cubic-bezier(.2,1.2,.4,1) both}
.lbr:nth-child(2){animation-delay:.1s}.lbr:nth-child(3){animation-delay:.2s}.lbr:nth-child(4){animation-delay:.3s}.lbr:nth-child(5){animation-delay:.4s}.lbr:nth-child(6){animation-delay:.5s}
@keyframes lbUp{from{transform:translateY(calc(var(--dy)*100%));opacity:.3}}
.lbr.top{background:linear-gradient(90deg,#6B4B00,#2A1E00);border-color:var(--gold)}
.lbn{width:1.4em;height:1.4em;border-radius:50%;background:var(--gold);color:#000;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.lbi{width:clamp(56px,8vh,90px);height:clamp(70px,10vh,112px);object-fit:cover;border-radius:12px;border:3px solid #fff}.lbr .noh{width:clamp(56px,8vh,90px);height:clamp(70px,10vh,112px);font-size:32px}
.lbs{flex:1}.lbr em{font-style:normal;color:var(--gold)}.lbr i{font-style:normal;font-size:.6em;border-radius:999px;padding:2px 12px}.lbr .up{background:#14532D;color:#7BF0A8}.lbr .fire{background:#5A1A00;color:#FFB38A}
/* ── 場景（大螢幕 右邊）── */
.qside{background:linear-gradient(#101C33,#070B14);border:3px solid #2A3A50;border-radius:26px;padding:12px;min-height:min(86vh,980px);position:relative;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.gvt{font-size:clamp(26px,3.6vh,38px);color:var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.rk5{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;font-size:clamp(20px,2.6vh,30px)}.rk5 span{background:#0B1118;border:2px solid #2A3A50;border-radius:12px;padding:2px 10px}.rk5 b{color:var(--gold)}
.fxb{font-style:normal;font-size:.8em;margin-left:2px;animation:fxbob .5s ease-in-out infinite alternate}@keyframes fxbob{to{transform:translateY(-6px)}}
/* 魔王 */
.bs{position:relative;width:min(100%,46vh);aspect-ratio:1;margin:0 auto}.bsi{position:relative;width:100%;height:100%;object-fit:cover;border-radius:26px;border:4px solid #FF5252;animation:bob 2s ease-in-out infinite}
.bsau{position:absolute;inset:-14px;border-radius:34px;background:conic-gradient(#FF1744,#FF9100,#D500F9,#FF1744);filter:blur(16px);opacity:.75;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-8px)}}
.bs.hit .bsi{animation:bhit .12s linear 8}@keyframes bhit{25%{transform:translate(-10px,4px);filter:brightness(2) saturate(2)}75%{transform:translate(10px,-4px)}}
.bs.dead .bsi{filter:grayscale(1) brightness(.6);animation:none}.ko{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(70px,12vh,140px);color:#FFD54A;text-shadow:0 0 30px #F00,0 6px 0 #000;animation:ckIn2 .6s}
.hpb{position:relative;height:56px;margin-top:14px;border-radius:999px;background:#2A0E0E;border:4px solid #FF6B6B;overflow:hidden;text-align:center}
.hpb i{position:absolute;inset:0 auto 0 0;width:var(--b);background:linear-gradient(90deg,#FF1744,#FF9100);animation:mvw 1s ease-out}@keyframes mvw{from{width:var(--a)}to{width:var(--b)}}
.hpb span{position:relative;font-size:clamp(22px,2.8vh,32px);line-height:48px;text-shadow:0 2px 4px #000}
.hits{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.hit1{position:relative;animation:hitF .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*.12s)}@keyframes hitF{from{transform:translateY(80px) scale(.3);opacity:0}}
.hti{width:58px;height:74px;object-fit:cover;border-radius:10px;border:3px solid var(--gold);display:block}.hit1 .noh{width:58px;height:74px;font-size:28px}
.hit1 b{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:24px;color:#FFE07A;text-shadow:0 0 8px #F00,0 2px 0 #000;animation:dmgUp 1.2s ease-out both;animation-delay:calc(var(--i)*.12s + .4s)}@keyframes dmgUp{from{opacity:0;transform:translate(-50%,10px) scale(.4)}40%{opacity:1;transform:translate(-50%,-14px) scale(1.4)}}
.more{align-self:center;font-size:22px;color:#BFD3E6}
.combo{text-align:center;margin-top:10px;font-size:clamp(26px,3.6vh,40px);color:#FFE07A;background:linear-gradient(90deg,transparent,#5A1A00,transparent);animation:chP .5s ease-in-out infinite alternate}
/* 賽車 */
.rc{display:grid;gap:6px}.rl{display:grid;grid-template-columns:1.6em 1fr 14px;align-items:center;gap:6px}.rp{color:var(--gold);font-size:26px;text-align:center}
.rtk{position:relative;height:clamp(52px,7.4vh,80px);background:repeating-linear-gradient(90deg,#2B2F36 0 38px,#24272D 38px 76px);border-radius:10px;border-top:3px solid #555;border-bottom:3px solid #555}
.car{position:absolute;top:50%;left:var(--b);transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;animation:mvl 1.4s cubic-bezier(.3,1.1,.5,1)}@keyframes mvl{from{left:var(--a)}to{left:var(--b)}}

 .scpod .p1 .st{height:clamp(60px,9vh,80px)}.scpod .p2 .st{height:clamp(44px,6.6vh,60px)}.scpod .p3 .st{height:clamp(32px,4.8vh,44px)}

/* rpg/_wear.css — 🏪 商城寶物穿在英雄身上（rpg/_wear_rt.js）。放在英雄卡（.rw-host）裡面；後面的用 z-index:-1（英雄卡要 isolation:isolate） */
.rw-host{isolation:isolate}
/* 前面加 .rw-host img：英雄卡自己的「img 寬 100%、框、陰影、跳進來動畫」不可以蓋過來 */
.rw-host img.rw-au,.rw-host img.rw-au2,.rw-host img.rw-wg,.rw-host img.rw-cp,.rw-host img.rw-mt,.rw-host img.rw-po,.rw-host img.rw-nf{position:absolute;display:block;pointer-events:none;max-width:none;border:0;border-radius:0;box-shadow:none;height:auto;animation-delay:0s}
.rw-host img.rw-au{left:50%;top:48%;width:175%;transform:translate(-50%,-50%);z-index:-1;animation:rwSpin 16s linear infinite}
.rw-host img.rw-au2{left:50%;top:48%;width:118%;transform:translate(-50%,-50%);z-index:3;opacity:.6;mix-blend-mode:screen;animation:rwSpin 9s linear infinite reverse}
.rw-host img.rw-wg{left:50%;top:40%;width:200%;transform:translate(-50%,-50%);z-index:-2;animation:rwFlap 3s ease-in-out infinite}
.rw-host img.rw-cp{left:50%;top:62%;width:125%;transform:translate(-50%,-50%);z-index:-1;animation:rwCape 3.4s ease-in-out infinite}
.rw-host img.rw-mt{left:50%;bottom:-22%;width:120%;transform:translateX(-50%);z-index:-1;animation:rwRide 2.6s ease-in-out infinite}
.rw-host img.rw-po{right:-14%;top:-16%;width:58%;z-index:4;filter:drop-shadow(0 0 6px #000);border-radius:16%;outline:2px solid rgba(255,213,74,.7)}   /* 2026-10-18 第十二次：寵物服裝 ＝ 不透明小方塊 */
.rw-host img.rw-nf{left:50%;top:50%;width:150%;transform:translate(-50%,-50%);z-index:-1}
@keyframes rwSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes rwFlap{50%{transform:translate(-50%,-50%) scale(1.06,.96)}}
@keyframes rwCape{50%{transform:translate(-50%,-50%) skewX(-3deg)}}
@keyframes rwRide{50%{transform:translate(-50%,-8px)}}
.rw-fx{position:fixed;inset:0;z-index:99999;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:rwFlash 1.4s ease-out forwards}
.rw-fx img{width:min(76vw,76vh);animation:rwBoom 1.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes rwBoom{0%{transform:scale(.1) rotate(-120deg);opacity:0}30%{transform:scale(1.15) rotate(0);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes rwFlash{0%{background:rgba(255,255,255,0)}20%{background:rgba(255,240,200,.35)}100%{background:rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.rw-host img.rw-au,.rw-host img.rw-au2,.rw-host img.rw-wg,.rw-host img.rw-cp,.rw-host img.rw-mt{animation:none}.rw-fx{animation-duration:.6s}.rw-fx img{animation-duration:.6s}}
/* score/_honor.css — 榮譽動畫（2026-10-12 D 第 4 件）：學生平板做完的榮譽動畫、老師投影的榮譽榜共用。12 種風格 .hs1～.hs12 */
.hon{position:relative;width:100%;height:var(--hh,clamp(420px,66vh,800px));border-radius:22px;overflow:hidden;background:#000;color:#fff;text-align:center;isolation:isolate;
  display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:clamp(6px,1.4vh,16px);padding:2vh 2vw;box-sizing:border-box}
.hon *{box-sizing:border-box}
.hon .hbg,.hon .hfx{position:absolute;inset:0;pointer-events:none}
.hon .hbg{z-index:-2}.hon .hfx{z-index:-1;overflow:hidden}
.hon .hhero{font-size:clamp(70px,13vh,150px);line-height:1;position:relative;filter:drop-shadow(0 0 24px rgba(255,214,74,.55))}
.hon .hkick{font-size:clamp(20px,3.2vh,34px);font-weight:700;color:#FFE9A8;letter-spacing:.06em;animation:hfade .7s backwards}
.hon .htit{font-size:clamp(30px,5.6vh,60px);font-weight:700;line-height:1.2;text-shadow:0 3px 14px #000;animation:hzoom .8s .2s backwards}
.hon .hsub{font-size:clamp(20px,3.2vh,34px);font-weight:700;color:#E8F0F8;text-shadow:0 2px 10px #000;animation:hfade .8s .5s backwards}
.hon .hcards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(8px,1.6vh,18px);width:100%;max-width:calc(var(--n,3)*440px)}
.hon .hcards.many{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.hon .hcard{background:rgba(10,12,16,.78);border:3px solid rgba(255,214,74,.85);border-radius:22px;padding:clamp(8px,1.4vh,16px) clamp(12px,1.6vw,24px);
  min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 26px rgba(255,214,74,.35);animation-fill-mode:backwards}
.hon .hcard .hi{font-size:clamp(46px,8vh,90px);line-height:1.05;display:flex;align-items:center;justify-content:center;height:1.1em}
.hon .hcard .hi svg{height:1.15em;width:auto}
.hon .nw{white-space:nowrap}
.hon .hcard .hn{font-size:clamp(26px,4.4vh,46px);font-weight:700;color:#FFE07A}
/* 2026-10-18 第十一次 老師：最後一行（例「這學期 練習 30 分鐘」）放在卡片最下面、置中、一行。
   ⚠ 老師看板自己有一個 .hl（兩欄的 grid），會把這一行切成兩半、靠左折行 ➜ 這裡一定要寫 display:block */
.hon .hcard .hl{display:block;width:100%;margin-top:auto;padding-top:4px;text-align:center;white-space:nowrap;font-size:clamp(20px,3.2vh,32px);font-weight:700;line-height:1.3}
.hon .hcard .hw{font-size:clamp(24px,4vh,42px);font-weight:700;color:#fff}
.hon .hcard.me{border-color:#5BE39A;box-shadow:0 0 30px rgba(91,227,154,.6)}
.hon .hrow{display:flex;flex-direction:column;gap:clamp(4px,.9vh,10px);width:min(1100px,100%)}
.hon .hr{display:grid;grid-template-columns:3.2em 1fr auto;gap:12px;align-items:center;background:rgba(10,12,16,.8);border:2px solid rgba(255,214,74,.6);border-radius:16px;
  padding:4px 16px;font-size:clamp(22px,3.6vh,40px);font-weight:700;text-align:left;animation:hslide .6s backwards}
.hon .hr b{color:#FFE07A;text-align:center}.hon .hr em{font-style:normal;color:#CFE3F5}
.hon .hpod{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1.4vw,22px);width:100%}
.hon .hpod>div{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(30%,360px)}
.hon .hpod .blk{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(40px,8vh,90px);font-weight:700;padding-top:6px;
  animation:hrise 1s cubic-bezier(.2,1.4,.5,1) backwards;color:#2A1A00}
.hon .hpod .p1 .blk{height:clamp(110px,22vh,260px);background:linear-gradient(#FFE07A,#E8A900)}
.hon .hpod .p2 .blk{height:clamp(80px,15vh,180px);background:linear-gradient(#F2F2F2,#A9B4BE)}
.hon .hpod .p3 .blk{height:clamp(60px,11vh,130px);background:linear-gradient(#F0B080,#B4642C)}
.hon .hpod .nm{font-size:clamp(24px,4.2vh,46px);font-weight:700;line-height:1.15;animation:hzoom .7s backwards}
.hon .hpod .vv{font-size:clamp(20px,3.2vh,34px);color:#FFE9A8;font-weight:700;animation:hzoom .7s backwards}
.hon .hpod .md{font-size:clamp(46px,9vh,110px);line-height:1;animation:hdrop .9s cubic-bezier(.3,1.6,.5,1) backwards}
.hon .hpod .hide{visibility:hidden}
@keyframes hfade{from{opacity:0;transform:translateY(16px)}}
@keyframes hzoom{from{opacity:0;transform:scale(.4)}}
@keyframes hslide{from{opacity:0;transform:translateX(-60px)}}
@keyframes hrise{from{transform:scaleY(0);transform-origin:bottom}}
@keyframes hdrop{0%{opacity:0;transform:translateY(-60vh) scale(.5)}100%{opacity:1}}
@keyframes hspin{to{transform:rotate(360deg)}}
@keyframes htw{50%{opacity:.15;transform:scale(.4)}}
@keyframes hfall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(110vh) rotate(var(--r,540deg))}}
@keyframes hpulse{50%{transform:scale(1.12)}}
/* 1 🏆 金色獎盃從天而降＋光芒 */
.hs1 .hbg{background:radial-gradient(circle at 50% 30%,#4A3400,#120C00 55%,#000 80%)}
.hs1 .hbg::after{content:"";position:absolute;left:50%;top:28%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,214,74,.16) 0 8deg,transparent 8deg 22deg);animation:hspin 14s linear infinite}
.hs1 .hhero{animation:hdrop 1.1s cubic-bezier(.3,1.6,.5,1) backwards}
.hs1 .hcard{animation:hdrop .9s cubic-bezier(.3,1.5,.5,1) backwards}
/* 2 👑 皇冠加冕＋星光 */
.hs2 .hbg{background:radial-gradient(circle at 50% 35%,#3A0F5C,#12031F 60%,#000)}
.hs2 .hhero{animation:hcrown 1.3s ease-out backwards}
@keyframes hcrown{0%{opacity:0;transform:translateY(-40vh) rotate(-20deg)}70%{transform:translateY(8px) rotate(6deg)}}
.hs2 .hcard{border-color:#D9A8FF;box-shadow:0 0 28px rgba(200,140,255,.55);animation:hzoom .8s backwards}
.hs2 .hcard .hn{color:#F0D4FF}
/* 3 🥇 奧運頒獎台升起 */
.hs3 .hbg{background:linear-gradient(#00264D,#000 75%)}
.hs3 .hbg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,rgba(255,214,74,.18))}
.hs3 .hhero{animation:hrise 1s ease-out backwards}
.hs3 .hcard{animation:hrise .9s cubic-bezier(.2,1.3,.5,1) backwards;border-radius:22px 22px 6px 6px}
/* 4 🎆 煙火大會 */
.hs4 .hbg{background:linear-gradient(#020414,#0A0F2E 70%,#140A20)}
.hs4 .hcard{background:rgba(5,8,25,.8);border-color:#7FD4FF;box-shadow:0 0 30px rgba(127,212,255,.5);animation:hfade 1s backwards}
.hs4 .hcard .hn{color:#9FE6FF}
.hfx .fw{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:hburst 1.6s ease-out infinite;opacity:0}
@keyframes hburst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
/* 5 🌟 紅毯＋聚光燈＋閃光燈 */
.hs5 .hbg{background:linear-gradient(#14000A,#000 55%,#5A0012 56%,#8A0A20)}
.hs5 .hbg::before,.hs5 .hbg::after{content:"";position:absolute;top:-10%;width:40%;height:120%;background:linear-gradient(rgba(255,250,220,.32),transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:hsweep 3.2s ease-in-out infinite alternate}
.hs5 .hbg::before{left:5%}.hs5 .hbg::after{right:5%;animation-delay:-1.6s}
@keyframes hsweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.hfx .fl{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 40px 20px #fff;opacity:0;animation:hflash 2.2s infinite}
@keyframes hflash{0%,8%,100%{opacity:0}4%{opacity:.95}}
.hs5 .hcard{animation:hside .8s backwards}.hs5 .hcard:nth-child(even){animation-name:hside2}
@keyframes hside{from{opacity:0;transform:translateX(-50vw)}}@keyframes hside2{from{opacity:0;transform:translateX(50vw)}}
/* 6 🏅 金牌鑄造（熔金倒進模子） */
.hs6 .hbg{background:radial-gradient(circle at 50% 100%,#5A2400,#120600 60%,#000)}
.hs6 .hhero{animation:hmelt 1.6s ease-out backwards}
@keyframes hmelt{0%{filter:brightness(3) saturate(0) blur(6px);transform:scale(1.4)}60%{filter:brightness(2) blur(1px)}}
.hs6 .hcard{position:relative;overflow:hidden;animation:hzoom .8s backwards}
.hs6 .hcard::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,180,.55),transparent);animation:hshine 2.4s 1s infinite}
@keyframes hshine{to{left:130%}}
/* 7 📜 皇家獎狀（展開卷軸＋蓋大印） */
.hs7 .hbg{background:radial-gradient(circle,#3A2A12,#120C04 70%)}
.hs7 .hcard{background:linear-gradient(#FFF6DE,#F1DDB0);color:#3A2400;border-color:#8A5A1A;animation:hunroll 1s backwards;position:relative}
.hs7 .hcard .hn{color:#8A1A1A}.hs7 .hcard .hw{color:#3A2400}
.hs7 .hcard::after{content:"印";position:absolute;right:8px;top:8px;width:1.8em;height:1.8em;border:3px solid #C0261F;border-radius:8px;color:#C0261F;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.4vh,24px);transform:rotate(-12deg);animation:hstamp .5s 1.4s backwards}
@keyframes hunroll{from{transform:scaleY(.04);opacity:.3}}
@keyframes hstamp{from{opacity:0;transform:rotate(-12deg) scale(3)}}
/* 8 🚀 火箭升空（名字寫在星空） */
.hs8 .hbg{background:linear-gradient(#000,#0A1240 80%,#1A2A70)}
.hs8 .hhero{animation:hrocket 1.4s ease-out backwards}
@keyframes hrocket{0%{transform:translateY(60vh) scale(.6)}80%{transform:translateY(-6px)}}
.hs8 .hcard{border-color:#9FB8FF;box-shadow:0 0 26px rgba(159,184,255,.6);animation:hzoom 1s backwards}
.hfx .sr{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:htw 1.8s infinite}
/* 9 💎 寶箱打開（寶石噴出來） */
.hs9 .hbg{background:radial-gradient(circle at 50% 70%,#003A3A,#001414 60%,#000)}
.hs9 .hhero{animation:hpop 1s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes hpop{from{transform:scale(0) rotate(-30deg)}}
.hs9 .hcard{border-color:#5BE3D8;box-shadow:0 0 28px rgba(91,227,216,.55);animation:hpop .8s backwards}
.hs9 .hcard .hn{color:#A8FFF6}
.hfx .gm{position:absolute;left:50%;bottom:30%;font-size:clamp(26px,4vh,44px);animation:hgem 2.2s ease-out infinite;opacity:0}
@keyframes hgem{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}
/* 10 🌠 流星雨 */
.hs10 .hbg{background:linear-gradient(#000014,#0B0B33)}
.hfx .mt{position:absolute;width:3px;height:120px;background:linear-gradient(#fff,transparent);transform:rotate(35deg);animation:hmeteor 1.6s linear infinite;opacity:0}
@keyframes hmeteor{0%{opacity:1;transform:translate(0,0) rotate(35deg)}100%{opacity:0;transform:translate(-50vw,70vh) rotate(35deg)}}
.hs10 .hcard{animation:hstar 1s backwards;border-color:#FFF2A8}
@keyframes hstar{from{opacity:0;transform:translate(30vw,-40vh) scale(.3)}}
/* 11 🐉 神龍守護（金龍繞著獎盃） */
.hs11 .hbg{background:radial-gradient(circle at 50% 40%,#3A0A00,#140200 60%,#000)}
.hs11 .hhero::after{content:"🐉";position:absolute;left:50%;top:50%;font-size:.55em;margin:-.6em 0 0 -.5em;animation:horbit 3s linear infinite}

.hs11 .hcard{border-color:#FF9A3C;box-shadow:0 0 30px rgba(255,120,40,.55);animation:hzoom .9s backwards}
.hs11 .hcard .hn{color:#FFC27A}
.hfx .em{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#FF9A3C;box-shadow:0 0 8px #FF6A00;animation:hember 3s linear infinite}
@keyframes hember{to{transform:translateY(-110vh);opacity:0}}

.hs12 .hbg{background:repeating-linear-gradient(115deg,#2A2D33 0 40px,#33373E 40px 44px,#26292E 44px 90px),linear-gradient(#3A3E46,#1A1C20)}

/* 直的螢幕（iPad 直放）：一張獎一列，圖示在左邊 */

 .hon .hcard{display:grid;grid-template-columns:auto 1fr;column-gap:16px;text-align:left;align-items:center;justify-items:start}

.hctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* live/_db.js — ⚡ 現場任務的「即時資料庫」：Firebase Realtime Database（老師 C8 第 16 題：Firebase）。只寫 ES5（iPad iOS 14）。
   網址在 live/fb.js 的 window.LIVE_DB（空白 ＝ 現場任務關著）。量測（live/_verify.js）：LIVE_DB 指到量測自己開的假伺服器，**絕對不連真的 Firebase**。
   資料只有：班級的遊戲（0＋班級）、5 碼、答了第幾個、分數、英雄圖的代號。**沒有姓名**。

   2026-10-18 第十二次（老師：學生 等不到 第一題、老師 收不到 答案、兩邊 不同步）：
   原本 用「一直 連著 的 線」（EventSource）聽。一台 電腦 連 同一個 網站 最多 同時 6 條 線；大螢幕 自己 就 佔 4 條，
   老師 再 多 開 一個 分頁（老師看板、自己 試 學生頁）就 滿了 ➜「送 題目」那一條 排不進去。
   ➜ 改成「每 0.7 秒 問 一次」（輪詢）：每一次 問 完 就 放掉 線，永遠 不會 塞住；量測 跟 真的 Firebase 一模一樣（只用 GET／PUT／PATCH）。
   大螢幕 每 寫 一次 遊戲 狀態（m）就 把 版本號（v）＋1；平板 只 問 很小 的 v，變了 才 拿 m（省 流量）。
   寫 失敗（網路 一下 斷掉）＝ 自己 重試；連續 失敗 ➜ LDB.bad ＝ true（畫面 上 寫「📶 重新 連線 中…」） */
var LDB=(function(){
  var URL=String(window.LIVE_DB||'').replace(/\/+$/,''),FAIL=0,ST=[];
  function on(){return !!URL}
  function seg(p){return String(p).replace(/^\/+|\/+$/g,'').split('/').filter(function(x){return x!==''})}
  function u(p){return URL+'/'+seg(p).join('/')+'.json'}
  function mark(ok){FAIL=ok?0:FAIL+1;var b=FAIL>=3;if(b!==LDB.bad){LDB.bad=b;ST.forEach(function(f){f(b)})}}
  function req(m,p,v){if(!URL)return Promise.resolve(false);
    return fetch(u(p),{method:m,cache:'no-store',body:m==='DELETE'?undefined:JSON.stringify(v)}).then(function(r){mark(r.ok);return r.ok},function(){mark(false);return false})}
  function get(p){if(!URL)return Promise.resolve(null);
    return fetch(u(p),{cache:'no-store'}).then(function(r){mark(r.ok);if(!r.ok)throw 0;return r.json()}).catch(function(){mark(false);throw 0})}
  /* 一定 要 寫進去：失敗 就 每 0.8 秒 再 試（最多 n 次）*/
  function must(m,p,v,n){n=n==null?12:n;return req(m,p,v).then(function(ok){if(ok||n<=0)return ok;return new Promise(function(r){setTimeout(r,800)}).then(function(){return must(m,p,v,n-1)})})}
  /* 輪詢：每 ms 毫秒 問 一次（上一次 回來 才 問 下一次，不會 疊起來）；內容 變了 才 叫 cb */
  function poll(p,ms,cb){var stop=false,last='\u0000',t=null;
    function go(){if(stop)return;get(p).then(function(v){if(stop)return;var s=JSON.stringify(v);if(s!==last){last=s;cb(v)}},function(){}).then(function(){if(!stop)t=setTimeout(go,ms)})}
    go();return function(){stop=true;clearTimeout(t)}}
  /* 遊戲 狀態：問 rooms/班/v（很小），變了 才 拿 m */
  function watch(room,ms,cb){var stop=false,lv='\u0000',t=null;
    function go(){if(stop)return;get('rooms/'+room+'/v').then(function(v){if(stop)return;var s=JSON.stringify(v);if(s===lv)return;
        return get('rooms/'+room+'/m').then(function(m){if(stop)return;lv=s;cb(m)})},function(){}).then(function(){if(!stop)t=setTimeout(go,ms)},function(){if(!stop)t=setTimeout(go,ms)})}
    go();return function(){stop=true;clearTimeout(t)}}
  return {on:on,get:get,set:function(p,v){return req('PUT',p,v)},patch:function(p,v){return req('PATCH',p,v)},del:function(p){return req('DELETE',p)},
    must:must,poll:poll,watch:watch,bad:false,onBad:function(f){ST.push(f)}}
})();

  var KIND={g1:{c:'#FFB300',sec:8,t:'選 對 的 答案；連對 愈多 🔥 愈 大'},g10:{c:'#E53935',sec:10,t:'答對 ＝ 打 魔王 一下；8 下 打倒 牠！'},g2:{c:'#1E88E5',sec:6,t:'左邊 還是 右邊？愈快 愈好'},g3:{c:'#8E24AA',sec:25,t:'照 順序 點 方塊，排出 整句'},
    g4:{c:'#00897B',sec:12,t:'選 變身 以後 正確 的 句子'},g7:{c:'#6D4C41',sec:12,t:'找出 錯 的 那一個 字（也 可能 全對）'},g8:{c:'#3949AB',sec:10,t:'選 一個 字 填進 空格'},g9:{c:'#F4511E',sec:8,t:'包裹 要 送到 哪一邊？'}};
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function clr(){T.forEach(clearTimeout);T=[]}
  function later(f,ms){T.push(setTimeout(f,ms))}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function next(){var k=0,L=ORD.filter(function(x){return B[x]&&B[x].qs.length>=8});if(!L.length)return '';
    try{k=(+localStorage.getItem('lv_mini2')||0)+1;localStorage.setItem('lv_mini2',k)}catch(e){k=Math.floor(Math.random()*L.length)}return L[k%L.length]}
  /* 一回合 */
  function round(id){clr();if(!id)return;var D=B[id];R={id:id,qs:shuf(D.qs).slice(0,8),k:0,Q:[],sc:0,cb:0,best:0,hp:8,t0:Date.now()};show()}
  function frame(body){var D=B[R.id],k=KIND[R.id];
    EL.innerHTML='<div class="mg" style="--mc:'+k.c+'"><div class="mgh"><b>'+D.nm+'</b><small>'+k.t+'</small><span class="mgs">⭐ '+R.sc+'</span></div>'+
      '<div class="mgp">'+R.qs.map(function(_,i){var x=R.Q[i];return '<i class="'+(x?(x[0]?'ok':'no'):i===R.k?'cur':'')+'"></i>'}).join('')+(R.cb>=2?'<span class="mgf" style="--f:'+Math.min(5,R.cb)+'">🔥 '+R.cb+' 連擊</span>':'')+'</div>'+
      '<div class="mgtm"><i id="mgbar"></i></div><div class="mgb mk-'+R.id+'">'+body+'</div><div class="mgf2"><button class="mgx" data-mg="swap">🔄 換 一種 小遊戲</button></div></div>'}
  function show(){var q=R.qs[R.k],id=R.id;R.q=q;R.ts=Date.now();R.lock=false;
    if(q.ty==='or'){R.pk=[];R.sh=null;drawOr();timer();return}
    R.ord=shuf(q.o.map(function(_,i){return i}));
    var opt=function(cls){return R.ord.map(function(i,j){return '<button class="mo '+(cls||'')+' c'+j+'" data-mo="'+i+'"><span class="shp">'+LV.SHAPE[j]+'</span><span>'+q.o[i]+'</span></button>'}).join('')};
    var top='';
    if(id==='g10')top='<div class="mboss"><span class="mbi">🐲</span><span class="mhp"><i style="width:'+(R.hp/8*100)+'%"></i></span><b>❤ '+R.hp+' ／ 8</b></div>';
    if(id==='g7')top='<div class="mmag">🔍</div>';
    if(id==='g9')top='<div class="mpk">📦</div>';
    frame(top+'<div class="mq'+(id==='g4'?' flip':'')+'" id="mq">'+q.t+'</div><div class="mos n'+q.o.length+(id==='g2'||id==='g9'?' duo':'')+'">'+opt(id==='g9'?'bin':'')+'</div><div id="mfb" class="mfb"></div>');
    timer()}
  function tl(){return R.sh||(R.sh=shuf(R.q.tiles.map(function(_,i){return i})))}
  function drawOr(){var q=R.q,need=q.tiles.length;
    frame('<div class="mq">'+(q.zh||'')+'</div><div class="mor"><div class="mslot">'+q.tiles.map(function(_,i){var k=R.pk[i];return '<span class="'+(k!=null?'f':'')+'">'+(k!=null?esc(q.tiles[k]):'')+'</span>'}).join('')+(q.p?'<span class="pun">'+esc(q.p)+'</span>':'')+'</div>'+
      '<div class="mtl">'+tl().map(function(i){return '<button class="mtile" data-mt="'+i+'"'+(R.pk.indexOf(i)>=0||R.lock?' disabled':'')+'>'+esc(q.tiles[i])+'</button>'}).join('')+'</div>'+
      '<div class="mchc"><button data-mb="back"'+(!R.pk.length||R.lock?' disabled':'')+'>⌫ 退 一個</button></div></div><div id="mfb" class="mfb"></div>');
    void need}
  function timer(){var dur=KIND[R.id].sec*1000,b=document.getElementById('mgbar');if(!b)return;
    b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='width '+(dur/1000)+'s linear';b.style.width='0%';
    var k=R.k;later(function(){if(R&&R.k===k&&!R.lock)pick(-1)},dur)}
  /* 答 了 一題：pick ＝ 選了 原本 的 第幾個（0 ＝ 正解，-1 ＝ 時間 到） */
  function pick(i){if(R.lock)return;R.lock=true;var q=R.q,dur=KIND[R.id].sec*1000,ms=Date.now()-R.ts,ok=i===0,left=Math.max(0,1-ms/dur);
    R.Q.push([ok?1:0,i,Math.round(ms/100)/10,i>=0&&ms<1000?1:0,ok?Math.round(left*1000)/1000:0,q.i]);
    if(ok){R.cb++;if(R.cb>R.best)R.best=R.cb;var s=100+Math.round(400*left)+Math.min(100,(R.cb-1)*20);R.sc+=s;if(R.id==='g10')R.hp=Math.max(0,R.hp-1)}else R.cb=0;
    var b=EL.querySelector('[data-mo="'+i+'"]');if(b)b.classList.add(ok?'ok':'no');var c=EL.querySelector('[data-mo="0"]');if(c&&!ok)c.classList.add('ok');
    var fb=document.getElementById('mfb');
    if(ok){if(fb)fb.innerHTML='<div class="mok">⭐ 答對！＋'+(100+Math.round(400*left))+(R.cb>=2?'　🔥 '+R.cb+' 連擊':'')+'</div>';
      var mq=document.getElementById('mq');if(mq&&R.id==='g4')mq.classList.add('go');if(R.id==='g8'&&mq)mq.innerHTML=String(mq.innerHTML).replace('＿＿','<b class="mfill">'+(q.ot?esc(q.ot[0]):'')+'</b>');
      if(R.id==='g10'){var bo=EL.querySelector('.mboss');if(bo){bo.classList.add('hit');bo.querySelector('i').style.width=(R.hp/8*100)+'%';bo.querySelector('b').textContent='❤ '+R.hp+' ／ 8'}}
      later(go,ok&&R.id==='g4'?1000:750)}
    else{if(fb)fb.innerHTML='<div class="mno">'+(i<0?'⏰ 時間 到':'再 看 一次 正確 答案')+'</div>'+LV.glHTML({ag:q.ag,az:q.az,ae:q.ae,ans:q.ot?q.ot[0]:q.a,h:q.h});later(go,2600)}
    var bar=document.getElementById('mgbar');if(bar){bar.style.transition='none';bar.style.width=bar.getBoundingClientRect().width+'px'}}
  function go(){R.k++;if(R.k>=R.qs.length||(R.id==='g10'&&R.hp<=0)){fin();return}show()}
  /* 一回合 結束：星星、答對 幾題、最高 連擊、記進 成績 */
  function fin(){clr();var n=R.Q.length,ok=0,fast=0;R.Q.forEach(function(x){ok+=x[0];fast+=x[3]});var st=ok>=n-1?3:ok>=n*.6?2:1,rec=n>=6&&fast*2<=n&&rec1();
    EL.innerHTML='<div class="mg mgend" style="--mc:'+KIND[R.id].c+'"><div class="mgst">'+Array(st+1).join('⭐')+'<span class="dim">'+Array(4-st).join('⭐')+'</span></div>'+
      (R.id==='g10'&&R.hp<=0?'<div class="mgbig">🐲 魔王 被 打倒 了！</div>':'')+
      '<div class="mgbig">答對 '+ok+' ／ '+n+' 題</div><div class="note big2">最高 🔥 '+R.best+' 連擊　⭐ '+R.sc+' 分</div>'+
      '<div class="note">'+(rec?'📝 記進 成績 了（練習 次數 ＋1）':fast*2>n?'⚠ 太快 亂按 超過 一半 ➜ 這一回 不 算 成績；慢慢 看、用心 答':'（沒有 登入 或 沒有 網路：這一回 沒有 記 成績）')+'</div>'+
      '<div class="mgf2"><button class="mgx go" data-mg="again">▶ 再 玩 一回</button><button class="mgx" data-mg="swap">🔄 換 一種</button></div></div>';
    later(function(){round(next())},9000)}
  /* 記 成績：跟 平常 的 遊戲 一樣 送到 成績系統（score/_client.js 的 佇列；沒有 網路 先 存 平板，等一下 補送） */
  function rec1(){try{if(typeof scLive!=='function'||!scLive())return false;
    var u=SCID+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var Rr={id:SCID,set:'g'+G+'gm_lm-'+R.id,name:'⚡ 等人小遊戲｜'+B[R.id].nm,m:'g',qs:R.Q,raw:R.sc,fix:0,mp:0,mw:0,sec:Math.round((Date.now()-R.t0)/1000),src:'school',dev:SCDEV,u:u,t:Date.now()};
    var QQ=scGet('q')||[];QQ.push(Rr);scPut('q',QQ.slice(-200));scFlush();return true}catch(e){return false}}
  function click(e){var t=e.target,b=t.closest&&t.closest('[data-mo],[data-mt],[data-mb],[data-mg]');if(!b||!R)return;
    if(b.hasAttribute('data-mg')){var a=b.getAttribute('data-mg');round(a==='again'?R.id:next());return}
    if(b.hasAttribute('data-mo')){pick(+b.getAttribute('data-mo'));return}
    if(R.lock)return;var q=R.q;
    if(b.hasAttribute('data-mb')){R.pk.pop();drawOr();return}
    var i=+b.getAttribute('data-mt');if(R.pk.indexOf(i)>=0)return;R.pk.push(i);
    if(R.pk.length>=q.tiles.length){var s=R.pk.map(function(k){return q.tiles[k]}).join('|');var ok=LV.norm(s)===LV.norm(q.a);drawOr();pick(ok?0:1)}else drawOr()}
  return {
    on:function(){return ON},
    start:function(el,bank,g){EL=el;B=bank||{};G=g||4;ON=true;el.onclick=click;
      /* 排句子：方塊 打亂 一次（同一題 一直 同樣 的 順序） */
      R=null;round(next())},
    stop:function(){clr();ON=false;if(EL){EL.onclick=null}}
  };
})();

/* live/_stu_rt.js — ⚡ 現場任務 學生平板（live/index.html）。只寫 ES5。要先載入成績系統的登入（score/_client.js home()）、live/_db.js、live/_common.js、live/_mini.js；網頁裡有 BASE、MINIB。

   ● 結束 ➜ 個人 錯題 總分析：答對 率 圓圈、每一題 ✅❌ 一個一個 亮、我的 錯題（逐字 中文＋🔊）、全班 最多人 錯 的 前 3 題
   ● 等人：⚡ 等人小遊戲（這個 年級 的 句型 重點，答對 記進 平時成績；_mini.js）；換裝 的 頁面 拿掉了（老師 6） */
var S={code:'',id:'',m:null,qi:-1,ans:null,t0:0,dur:20000,pend:{},cnt:{},draws:0,rw:[],me:null,fxAt:0,met:0,unW:null,pick2:[],chN:0,chT:0,okc:0,made:0,pk:[],hist:{},hb:null};
function $(s){return document.querySelector(s)}function $$(s){return [].slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scr(id){$$('.scr').forEach(function(x){x.hidden=x.id!==id});if(id!=='swait')MINI.stop()}
function R(p){return 'rooms/'+S.code+(p?'/'+p:'')}
function grade(){return String(S.id).charAt(0)==='3'?3:4}

function say1(o){LV.say(audio(o.au),o.ae||o.ans,1)}
/* 一行 大字：現在 要 做 什麼 */

function ready(){if(!LDB.on()){scr('soff');return}if(!SCID||!scAsked()){scr('sout');now('🔑 先 登入：打 你的 5 碼');return}
  if(S.code&&S.id===SCID)return;S.id=SCID;S.code=LV.room(SCID);S.made=0;S.m=null;S.hist={};
  if(typeof scFetch==='function'&&SCON)scFetch('a=rpg&id='+SCID,null,6000).then(function(j){if(j&&j.ok){S.me=j.v;putMe()}},function(){});
  putMe();clearInterval(S.hb);S.hb=setInterval(putMe,20000);

/* 我 在 這裡（大螢幕、老師看板 的 座號 格子 會 亮）：每 20 秒 寫 一次 */
function putMe(){if(!S.id)return;var st=S.me&&S.me.st&&S.me.st.eq||{};LDB.set(R('p/'+S.id),{h:st.h||'',pt:st.p||'',pw:S.me?S.me.power||0:0,at:Date.now()})}
function heroImg(cls){var st=S.me&&S.me.st&&S.me.st.eq||{};return st.h?'<img class="'+(cls||'')+'" src="'+LV.img(BASE,st.h)+'" alt="我的戰士">':'<span class="noh '+(cls||'')+'">👤</span>'}
function petImg(cls){var st=S.me&&S.me.st&&S.me.st.eq||{};return st.p?'<img class="'+(cls||'')+'" src="'+LV.img(BASE,st.p)+'" alt="我的寵物">':'<span class="noh '+(cls||'')+'">🐾</span>'}
/* ── 等人：上面 一行 ＋ 小遊戲 ── */

  if(!m||!m.phase){if(S.qi>=0&&!$('#send').hidden)return;S.qi=-1;S.made=0;wait();return}   /* 老師 結束 這一場：看 結果 的 人 留著，其他 回到 等待 */
  if(m.made!==S.made){S.made=m.made;S.qi=-1;S.draws=0;S.rw=[];S.pend={};S.cnt={};S.hist={};S.revd=-1;S.lbd=-1;putMe()}

  kingBtn()}

    '<div class="cht2">'+q.tiles.map(function(t,i){return '<button class="tile" data-tile="'+i+'"'+(S.pk.indexOf(i)>=0||done?' disabled':'')+'>'+esc(t)+'</button>'}).join('')+'</div>'+
    '<div class="chc"><button class="chb" data-chb="back"'+(!S.pk.length||done?' disabled':'')+'>⌫ 退 一個</button><button class="chb go" data-chb="go"'+(S.pk.length<need||done?' disabled':'')+'>✅ 送出</button></div></div>'}
function stTick(){clearTimeout(S.tm);if(!S.m||S.m.phase!=='q')return;var left=Math.max(0,S.dur-(Date.now()-S.t0));$('#sqt').textContent=Math.ceil(left/1000);$('#sqring').style.setProperty('--p',(left/S.dur*100).toFixed(1));
  if(S.cur&&S.cur.hint&&$('#sqh').hidden&&$('#sqh').innerHTML)$('#sqh').hidden=false;
  if(left<=0){if(!S.ans){$('#sqr').innerHTML='<div class="sr no">⏰ 時間到</div>';now('⏰ 時間到 ➜ 👀 看 大螢幕 公布','')}$$('#sqo button').forEach(function(b){b.disabled=true});return}S.tm=setTimeout(stTick,200)}
function flags(){var f={},c=S.cnt;if(c.x2>0)f.x2=1;if(c.fire>0)f.fire=1;if(c.rocket>0)f.rocket=1;if(S.pend.shield)f.sh=1;if(S.pend.cheer)f.ch=1;if(S.cur&&S.cur.two)f.rt=1;if(S.met)f.met=S.met;return f}
/* 送 答案：一定 送到（失敗 每 0.8 秒 再 試）；送到 才 寫「✅ 送出了」 */
function send(a,show){var f=flags();a.f=f;S.ans=a;S.ansT=show;['x2','fire','rocket'].forEach(function(x){if(S.cnt[x]>0)S.cnt[x]--});delete S.pend.shield;delete S.pend.cheer;
  var qi=S.qi;$('#sqr').innerHTML='<div class="sr wait">⏳ 送出 中…</div>';
  LDB.must('PUT',R('a/'+qi+'/'+S.id),a,15).then(function(ok){if(S.qi!==qi)return;$('#sqr').innerHTML=ok?'<div class="sr wait">✅ 送出了！你選：'+show+'</div>':'<div class="sr no">📶 沒有 送到（網路 斷了）</div>';
    if(ok)now('✅ 送出了 ➜ 👀 看 大螢幕，等 老師 公布','ok')})}
function answer(k){if(S.ans||!S.m||S.m.phase!=='q')return;var ms=Date.now()-S.t0;if(ms>S.dur)return;var q=S.m.q;
  if(S.cur.two){if(S.pick2.indexOf(k)<0)S.pick2.push(k);$('#sqo [data-k="'+k+'"]').classList.add('pk');if(S.pick2.length<2){$('#sqm').textContent='🔁 再選 1 個';return}k=S.pick2.slice()}
  var show=(k.length?k:[k]).map(function(i){return '<span class="shp sm c'+i+'">'+LV.SHAPE[i]+'</span> '+esc((q.ot||[])[i]||'')}).join('、');
  send({k:k,ms:ms},show);$$('#sqo .so').forEach(function(b){b.disabled=true;var kk=+b.getAttribute('data-k');if(kk===k||(k.indexOf&&k.indexOf(kk)>=0))b.classList.add('pk')})}
function chTap(i){if(S.ans||!S.m||S.m.phase!=='q')return;var q=S.m.q,need=q.ty==='sp'?q.tiles.length-2:q.tiles.length;if(S.pk.length>=need||S.pk.indexOf(i)>=0)return;S.pk.push(i);chDraw()}
function chGo(){var q=S.m.q,ms=Date.now()-S.t0;if(S.ans||ms>S.dur)return;var s=S.pk.map(function(i){return q.tiles[i]});
  var show=q.ty==='sp'?s.join(''):s.join(' ').replace(/ (’|')/g,'$1')+(q.p||'');send({s:q.ty==='sp'?s.join(''):s.join('|'),ms:ms},esc(show));chDraw()}
/* ── 公布：整個 畫面 變色；答錯 ＝ 錯題 分析（比照 遊戲 答錯頁）；離 前一名 差 幾分（正向：只說「再 N 分 就 追上」）── */
function youTxt(q,a){if(!a)return '';if(q.ty==='mc'){var k=a.k;return (k&&k.length?k:[k]).map(function(i){return (q.ot||[])[i]||''}).join('、')}return q.ty==='sp'?a.s:String(a.s).split('|').join(' ').replace(/ (’|')/g,'$1')+(q.p||'')}
function rankOf(T,id){var L=Object.keys(T).sort(function(a,b){return T[b]-T[a]||(a<b?-1:1)}),rk=L.indexOf(id)+1;return {rk:rk,gap:rk>1?T[L[rk-2]]-(T[id]||0):0}}
function rev(m){clearTimeout(S.tm);var r=m.r||{},id=S.id,ok=!!(r.ok&&r.ok[id]),sc=(r.sc&&r.sc[id])||0,T=r.tot||{},tot=T[id]||0,st=(r.st&&r.st[id])||0,q=m.q||{},V=m.rev;
  if(q.ty==='mc')$$('#sqo .so').forEach(function(b){var k=+b.getAttribute('data-k');b.disabled=true;b.classList.toggle('ok',k===V.a);b.classList.toggle('no',k!==V.a)});
  var RK=rankOf(T,id),you=youTxt(q,S.ans),okTxt=V.ans||'';
  S.hist[m.qi]={ok:ok,you:you,ans:okTxt,ae:V.ae,ag:V.ag,az:V.az,au:V.au,h:V.h,t:q.ty==='mc'?(q.ls?'🎧 聽力題':q.t):q.t};
  if(ok&&typeof rwFx==='function'&&m.game!=='classic'){var eq5=S.me&&S.me.st&&S.me.st.eq||{};if(eq5.s&&eq5.s.fx)rwFx(BASE,eq5.s.fx)}   /* 💥 必殺武功特效（經典搶答 不演） */
  var o=$('#res');o.className='on '+(ok?'ok':S.ans?'no':'to');
  var ana=ok?'':'<div class="miss">'+(S.ans?'<div class="myou">❌ 你選的：<span>'+LV.diffHTML(you,V.ae&&q.ty!=='mc'?V.ae:okTxt)+'</span></div>':'')+
    '<div class="mok">✅ 正確 答案<button class="ghost say1" data-say1="1">🔊 聽</button></div>'+LV.glHTML({ag:V.ag,az:V.az,ae:V.ae,ans:okTxt,h:V.h},true)+'</div>';
  o.innerHTML='<div class="rbx"><div class="rtop"><span class="rbig">'+(ok?'✔':S.ans?'✖':'⏰')+'</span><span class="rt">'+(ok?'答對！':S.ans?'答錯了，看 一下 正確 答案':'這一題 沒有 答')+'</span>'+(ok?'<span class="rsc">＋'+sc.toLocaleString()+'</span>':'')+'</div>'+
    (ok&&st>1?'<div class="rst">🔥 連對 '+st+' 題（連對 加分）</div>':'')+
    (ok&&m.game==='boss'?'<div class="rst">⚔ 你的 戰士 出招 ➜ 魔王 <b>－'+(10+Math.min(20,Math.floor(((S.me&&S.me.power)||0)/100)))+'</b></div>':'')+ana+
    '<div class="rrk">🏆 總分 '+tot.toLocaleString()+'　｜　第 <b>'+RK.rk+'</b> 名'+(RK.rk>1?'<small>再 '+RK.gap.toLocaleString()+' 分 就 追上 第 '+(RK.rk-1)+' 名！</small>':'<small>你 是 第一名！保持 下去！</small>')+'</div></div>';
  $('#sqr').innerHTML='';
  now(ok?'✔ 答對！👀 看 大螢幕':'📌 看 正確 答案（可以 按〔🔊 聽〕）','ok');
  var okc=(r.okc&&r.okc[id])||0;S.okc=okc;if(m.game!=='classic'&&(Math.floor(okc/5)>S.draws))S.drawLater=1}
/* 排行榜：我 第幾名 */
function lbS(m){var r=m.r||{},T=r.tot||{},RK=rankOf(T,S.id),o=$('#res');if(S.qi<0)scr('sq');o.className='on lb';
  o.innerHTML='<div class="rbx"><div class="rtop"><span class="rbig">🏆</span><span class="rt">你 是 第 <b>'+RK.rk+'</b> 名</span></div><div class="rrk">總分 '+(T[S.id]||0).toLocaleString()+(RK.rk>1?'<small>再 '+RK.gap.toLocaleString()+' 分 就 追上 第 '+(RK.rk-1)+' 名！</small>':'<small>保持 下去！</small>')+'</div></div>';
  now('👀 看 大螢幕 的 排行榜；等 老師 出 下一題','');
  if(m.game!=='classic'&&S.drawLater){S.drawLater=0;S.draws=Math.floor(S.okc/5);setTimeout(draw,1200)}}
/* ── 結束：個人 錯題 總分析 ── */
function endS(m){if(S.ended===m.made)return;S.ended=m.made;clearTimeout(S.tm);$('#res').className='';giftAway();scr('send');var r=m.r||{},T=r.tot||{},RK=rankOf(T,S.id),q=(r.okq||{})[S.id]||'',sum=m.sum||{};
  var n=q.length,ok=(q.match(/1/g)||[]).length,acc=n?Math.round(ok/n*100):0,RD=46,L=2*Math.PI*RD;
  var mine=Object.keys(S.hist).map(Number).sort(function(a,b){return a-b}).filter(function(k){return !S.hist[k].ok});
  var h='<div class="eh">'+heroImg('wimg')+'<div><div class="et">'+(RK.rk>0&&RK.rk<=3?['🥇','🥈','🥉'][RK.rk-1]+' 第 '+RK.rk+' 名！':'🎉 任務 完成！第 '+RK.rk+' 名')+'</div><div class="ss">🏆 總分 '+(T[S.id]||0).toLocaleString()+'</div></div>'+
    '<svg class="ring2" viewBox="0 0 110 110"><circle cx="55" cy="55" r="'+RD+'" fill="none" stroke="#24313F" stroke-width="12"/><circle class="rg" cx="55" cy="55" r="'+RD+'" fill="none" stroke="#3BD16F" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+L.toFixed(1)+'" stroke-dashoffset="'+L.toFixed(1)+'" style="--to:'+(L*(1-acc/100)).toFixed(1)+'" transform="rotate(-90 55 55)"/><text x="55" y="52" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">'+ok+'／'+n+'</text><text x="55" y="74" text-anchor="middle" font-size="14" fill="#9FB3C8">答對</text></svg></div>'+
    '<div class="qch">'+q.split('').map(function(c,i){return '<span class="'+(c==='1'?'ok':c==='0'?'no':'na')+'" style="--i:'+i+'"><b>'+(i+1)+'</b>'+(c==='1'?'✅':c==='0'?'❌':'⏰')+'</span>'}).join('')+'</div>'+
    (mine.length?'<h2>📌 我的 錯題（看 正確 答案，按〔🔊〕聽）</h2>'+mine.map(function(k){var x=S.hist[k];return '<div class="wr go"><div class="wrh"><b>第 '+(k+1)+' 題</b><button class="ghost" data-say2="'+k+'">🔊 聽</button></div><div class="wrq">'+x.t+'</div>'+
      (x.you?'<div class="myou">❌ 你選的：<span>'+LV.diffHTML(x.you,x.ans)+'</span></div>':'')+LV.glHTML({ag:x.ag,az:x.az,ae:x.ae,ans:x.ans,h:x.h})+'</div>'}).join(''):'<h2>🎉 這一場 全部 答對！</h2>')+
    ((sum.wq||[]).length?'<h2>❌ 全班 最多人 錯 的 題目</h2>'+sum.wq.map(function(x,j){return '<div class="wr go"><div class="wrh"><b>'+['🥇','🥈','🥉'][j]+' 第 '+(x.qi+1)+' 題</b><span class="note">全班 答對 '+x.r+'%</span><button class="ghost" data-say3="'+j+'">🔊 聽</button></div>'+LV.glHTML({ag:x.ag,az:x.az,ae:x.ae,ans:x.ans,h:x.h})+'</div>'}).join(''):'')+
    (S.rw.length?'<div class="note">🎁 你 抽到：'+S.rw.map(function(k){var x=LV.RW.filter(function(y){return y.k===k})[0];return x?x.ic+' '+x.nm:k}).join('、')+'</div>':'')+
    '<div class="note big2">'+(m.given?'✅ 老師 發好 獎勵了 ➜ 打開〔戰神之路〕看看':'老師 發 獎勵 以後，打開〔戰神之路〕就 看得到（⭐ 經驗值、🪙 金幣）')+'</div>';
  $('#ew').innerHTML=h;now('🏁 任務 完成！看 你的 錯題 分析','ok');
  setTimeout(function(){var g=$('#ew .rg');if(g)g.classList.add('go');$$('#ew .qch span').forEach(function(x){x.classList.add('go')})},60)}
/* ── 🐾 寵物叼來禮物盒（每答對 5 題；經典搶答 沒有；排行榜 的 時候 才 出來）── */
function draw(){S.gp=null;var o=$('#gift');o.className='on';o.innerHTML='<div class="gb"><div class="gt">🎉 答對 '+(S.draws*5)+' 題！你的 寵物 叼來 禮物 了</div><div class="gpet">'+petImg('gpi')+'<span class="gbox">🎁</span></div>'+
  '<div class="gt2">要 抽 哪一種？</div><div class="grow"><button data-gk="f">🎮 遊戲 功能<small>這一場 馬上 用</small></button><button data-gk="r">🎁 獎勵<small>遊戲 結束 老師 發</small></button></div></div>'}
function boxes(kind){var n=LV.pickN(),pool=LV.shuf(kind==='f'?LV.FEAT:LV.RW).slice(0,n),o=$('#gift');S.gp={kind:kind,pool:pool};
  o.innerHTML='<div class="gb"><div class="gt">'+(kind==='f'?'🎮 遊戲 功能':'🎁 獎勵')+'：'+n+' 選 1</div><div class="gpet walk">'+petImg('gpi')+'</div>'+
    '<div class="gbx n'+n+'">'+pool.map(function(x,i){return '<button class="bx" data-gi="'+i+'" style="animation-delay:'+(i*.12)+'s">🎁</button>'}).join('')+'</div><div class="gt2">👆 選 一個 盒子</div></div>'}
function openBox(i){var G=S.gp,x=G.pool[i],o=$('#gift');if(!x||G.done)return;G.done=1;
  o.innerHTML='<div class="gb"><div class="gopen"><span class="lid">🎁</span><div class="ghero">'+heroImg('ghi')+'<div class="say">「'+(x.say||'太好了！')+'」</div></div></div>'+
    '<div class="gget">'+x.ic+' <b>'+x.nm+'</b><br><span>'+x.t+'</span></div>'+
    (G.pool.length>1?'<div class="goth">其他 盒子：'+G.pool.filter(function(y,j){return j!==i}).map(function(y){return y.ic+' '+y.nm}).join('、')+'</div>':'')+
    '<button class="gok" data-gok="1">👌 好</button></div>';
  if(G.kind==='f')useF(x);else{S.rw.push(x.k);LDB.must('PUT',R('rw/'+S.id),S.rw,6)}}
function useF(x){var k=x.k;if(k==='x2'||k==='fire'||k==='rocket'||k==='zoom')S.cnt[k]=(S.cnt[k]||0)+x.n;else S.pend[k]=1;
  if(k==='pause')LDB.must('PUT',R('xt/'+S.id),S.qi+1,6)}
/* ── 干擾（老師大螢幕自動送，寫在 m.fx；經典搶答 沒有）── */
function onFx(v){if(!v||!v.at||v.at<=S.fxAt||!S.m||!S.m.int||S.m.phase!=='q')return;S.fxAt=v.at;var g=LV.game(S.m.game),F=g.fx,q=$('#sq'),o=$('#fxo');if(!F)return;
  o.className='on '+F.k;o.innerHTML='<div class="fxt">'+F.ic+' '+F.t+'</div>';
  if(F.k==='roar'||F.k==='yank'||F.k==='wave')q.classList.add('shake');
  else if(F.k==='smoke'||F.k==='fog')q.classList.add('fog');
  else if(F.k==='snow'){var h='';for(var i=0;i<40;i++)h+='<i class="sno" style="left:'+(Math.random()*100).toFixed(0)+'%;animation-delay:'+(Math.random()*.8).toFixed(2)+'s"></i>';o.innerHTML+=h;q.classList.add('fog')}
  else if(F.k==='gust')q.classList.add('float');
  else if(F.k==='pat'){S.wake=0;o.innerHTML+='<button class="slp" data-wake="1"><span class="egg2">🥚</span><b>點 3 下 安撫 龍蛋</b></button>'}
  clearTimeout(S.ftm);S.ftm=setTimeout(fxOff,F.ms||2000)}
function fxOff(){var q=$('#sq');['fog','float','shake'].forEach(function(c){q.classList.remove(c)});var o=$('#fxo');o.className='';o.innerHTML='';
  S.pend.shield=1;var b=$('#sqm');if(b&&!S.ans)b.textContent='🛡 送你 護盾：下一次 答錯 不算 斷連對'}
/* 👑 王者擂台：台下（不是前 3 名）可以按 📣 加油（一秒一次、最多 30 次） */
function kingBtn(){var b=$('#kch');if(!b)return;var m=S.m,on=m&&m.game==='king'&&m.phase==='q';
  if(on){var T=(m.r&&m.r.tot)||{},L=Object.keys(T).sort(function(a,c){return T[c]-T[a]});on=L.slice(0,3).indexOf(S.id)<0}b.hidden=!on}
document.addEventListener('click',function(e){var t=e.target,c=function(s){return t.closest?t.closest(s):null},b;
  if(c('#sIn')){scLogin(function(){SCH.close();scBar();ready()});return}
  if(c('#howb')){var hw=$('#whow');hw.hidden=!hw.hidden;return}
  if((b=c('#sqo .so'))){answer(+b.getAttribute('data-k'));return}
  if((b=c('[data-tile]'))){chTap(+b.getAttribute('data-tile'));return}
  if((b=c('[data-chb]'))){if(b.getAttribute('data-chb')==='back'){if(!S.ans){S.pk.pop();chDraw()}}else chGo();return}
  if(c('[data-say1]')){var V=S.m&&S.m.rev;if(V)say1(V);return}
  if((b=c('[data-say2]'))){say1(S.hist[+b.getAttribute('data-say2')]);return}
  if((b=c('[data-say3]'))){say1(((S.m&&S.m.sum)||{}).wq[+b.getAttribute('data-say3')]);return}
  if((b=c('[data-gk]'))){boxes(b.getAttribute('data-gk'));return}
  if((b=c('[data-gi]'))){openBox(+b.getAttribute('data-gi'));return}
  if(c('[data-gok]')){$('#gift').className='';$('#gift').innerHTML='';return}
  if(c('[data-wake]')){S.wake++;if(S.wake>=3)fxOff();return}
  if(c('#kch')){var tn=Date.now();if(tn-S.chT<1000||S.chN>=30)return;S.chT=tn;S.chN++;LDB.set(R('ch/'+S.id),S.chN);b=$('#kch');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');return}
});
setInterval(function(){if(!S.code||S.id!==SCID)ready()},800);

</script></body></html>
